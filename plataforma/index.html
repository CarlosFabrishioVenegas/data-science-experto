/* ---------- lectura: la lección vive en la plataforma ---------- */
const LEC={"m01-t01":"# Informe Pedagógico: Vectores, Matrices y Combinaciones Lineales en la Industria Pesada\n\n## 1. Mapa del tema y objetivos de aprendizaje\n\nEl álgebra lineal no es simplemente una rama de las matemáticas; es el sistema operativo de la ciencia de datos moderna y el lenguaje estratégico para la optimización de activos industriales. En el contexto de la Industria 4.0, donde la digitalización genera flujos masivos de datos, el álgebra lineal permite transformar señales de sensores en estructuras lógicas procesables. Como afirma Gilbert Strang, los vectores y las matrices se han convertido en el lenguaje que debemos dominar para navegar el siglo de los datos, permitiéndonos transitar de lo analógico a lo digital con precisión quirúrgica.\n\n**Objetivos de aprendizaje:** Al finalizar este informe, el profesional habrá desarrollado las siguientes competencias:\n\n- **Dominio de operaciones en Rⁿ:** Comprender la aritmética de vectores en espacios multidimensionales, diferenciando entre componentes individuales y la entidad vectorial.\n- **Dominio de Combinaciones Lineales:** Adquirir la capacidad de construir nuevos vectores y entender cómo estos generan subespacios (planos o volúmenes) críticos para el control de procesos.\n- **Modelado de Activos Físicos:** Conectar la abstracción de la independencia lineal con el \"vector de estado\", permitiendo la creación de Gemelos Digitales (Digital Twins) de maquinaria pesada.\n\nPara construir modelos predictivos robustos, debemos asegurar que los cimientos aritméticos sean sólidos. La transición de la lógica escalar a la multidimensional es, de hecho, el cuello de botella más crítico en la transformación digital industrial.\n\n## 2. Repaso de prerrequisitos: Nivelación desde el álgebra básica\n\nEl paso de las variables escalares simples (donde una temperatura se representa como T=450°C) a estructuras multidimensionales representa el primer gran salto conceptual. El álgebra de secundaria nos enseña a manipular números aislados, pero la industria moderna exige tratar grupos de variables interdependientes como una sola entidad funcional.\n\nConceptos esenciales de nivelación:\n\n- **Manejo de variables y constantes:** Operaciones aritméticas básicas aplicadas a símbolos.\n- **Sistemas de ecuaciones:** Entender que una variable puede estar vinculada a otras mediante relaciones proporcionales.\n- **Representación en el plano:** Familiaridad con el plano cartesiano xy, el precursor natural del espacio Rⁿ.\n\nEsta base aritmética es el punto de partida necesario para definir el objeto fundamental que rige la inteligencia artificial industrial: el vector.\n\n## 3. Desarrollo conceptual desde cero: De la intuición a la idea formal\n\nMientras la mente humana visualiza datos en tres dimensiones, los algoritmos de Machine Learning operan en espacios de cientos de dimensiones. La brecha entre la intuición física y la capacidad de cómputo se cierra mediante la representación vectorial.\n\n### La analogía de las \"manzanas y naranjas\"\n\nBasándonos en la metodología de Strang, un vector es la solución al problema de \"sumar manzanas y naranjas\". En la industria, no podemos sumar directamente la vibración (mm/s) con la temperatura (°C). Un vector nos permite organizar estas categorías en una lista donde cada posición tiene un significado único, manteniéndolas separadas pero vinculadas en una entidad común.\n\n### La dualidad del vector\n\nUn vector posee una naturaleza dual esencial para el ingeniero:\n\n- **Punto de vista de datos (Lista):** Es una columna de números. Es la forma en que el PLC o el sistema SCADA almacena la información.\n- **Punto de vista geométrico (Flecha):** Es una flecha en el espacio que parte del origen. La dirección de esta flecha representa la \"firma\" o el estado actual de la máquina.\n\n### La Combinación Lineal: Construir el espacio\n\nLa Combinación Lineal es la operación reina. Es la capacidad de visualizar y construir nuevos vectores mediante el escalado (estirar/encoger) y la suma (unión punta-con-cola). Si combinamos todos los posibles escalamientos de dos vectores independientes, \"llenamos\" un plano. Si añadimos un tercer vector independiente, llenamos el espacio tridimensional.\n\n## 4. Formalización: Definiciones y fórmulas paso a paso\n\nLa formalización matemática permite una comunicación inequívoca entre el ingeniero y la máquina. Según las fuentes de Strang, estas son las reglas que rigen el universo vectorial:\n\n### 1. Suma de Vectores (v+w)\n\nSe realiza componente a componente. Si v=[v₁; v₂] y w=[w₁; w₂], entonces v+w=[v₁+w₁; v₂+w₂]. Geométricamente, esto produce la diagonal de un paralelogramo.\n\n### 2. Multiplicación por Escalar (cv)\n\nEl escalar c afecta la magnitud. Si c=2, el vector se duplica. Si c=−1, el vector invierte su dirección. Nota técnica: El vector resultante −v+v es el vector cero (0), el cual posee componentes [0;0]. Es vital distinguir este objeto matemático del número cero, especialmente al calibrar sensores (offset cero).\n\n### 3. Combinación Lineal (cv+dw)\n\nEs la estructura fundamental del álgebra lineal:\n\ncv+dw = c[v₁; v₂] + d[w₁; w₂]\n\nAquí, c y d son coeficientes que determinan la influencia de cada vector original en el resultado.\n\n### Nota sobre el formato de vectores\n\nEn este informe priorizamos el vector columna. En textos técnicos, para ahorrar espacio, se suelen escribir horizontalmente como (v₁, v₂), pero matemáticamente debemos entenderlos como la transpuesta vᵀ.\n\n## 5. Ejemplos numéricos resueltos\n\n### Ejemplo 1: Combinación en R²\n\nDados v=[1; 1] y w=[2; 3], calculemos 3v+5w: 3[1; 1] + 5[2; 3] = [3; 3] + [10; 15] = [13; 18].\n\n### Ejemplo 2: El límite del subespacio en R³\n\nConsidere los vectores v=[1;1;1] y w=[2;3;4]. ¿Podemos alcanzar el vector b=[1;0;0] mediante una combinación lineal cv+dw? Esto genera el sistema:\n\n1. c+2d=1\n2. c+3d=0\n3. c+4d=0\n\nDe (2) y (3) se deduce que d=0 y c=0, lo cual contradice la ecuación (1). Resultado: El vector b no está en el plano generado por v y w. En una planta de gas, esto significaría que el setpoint deseado es \"inalcanzable\" dadas las restricciones actuales de los actuadores.\n\n## 6. Puente hacia Machine Learning: Tensores y el \"Column Picture\"\n\nEl corazón del álgebra lineal, según Strang, reside en la conexión entre las filas y las columnas de una matriz.\n\n**La multiplicación Matriz-Vector (Ax=b):** Contrario a la enseñanza tradicional de \"fila por columna\", un experto en IA debe ver Ax=b como una combinación lineal de las columnas de A. Si A=[C₁ | C₂], entonces Ax = x₁C₁ + x₂C₂. Esta es la esencia de las redes neuronales: los pesos (x) determinan cuánto contribuye cada característica (columna) al resultado final (b).\n\n## 7. Capa aplicada a la industria: El vector de estado y matrices especiales\n\nEn la industria pesada, el estado de un activo se define como su posición en un subespacio vectorial.\n\n- **Minería (Molino de Bolas):** Case Study: El análisis de vibraciones utiliza matrices de covarianza para detectar fallas. Estas matrices son siempre Simétricas (A=Aᵀ), una propiedad que garantiza valores propios reales y facilita el diagnóstico predictivo.\n- **Cementera (Horno Rotatorio):** Las variables de temperatura y velocidad forman un vector de estado. Si el activo es \"saludable\", su vector reside en un subespacio de operación óptima. Si el vector se vuelve linealmente independiente respecto a la historia de salud, el Digital Twin detecta una anomalía.\n- **Eléctrica (Transformadores):** La descomposición de señales de carga utiliza matrices Ortogonales (donde las columnas son perpendiculares). Esto permite aislar ruidos de armónicos sin perder información de la frecuencia fundamental.\n- **Gas (Pipelines):** El balance de flujo se modela con matrices Triangulares durante la resolución de sistemas de presiones. Si el vector de salida se desvía del plano esperado, el sistema identifica una fuga residual.\n\n## 8. Errores comunes y malentendidos técnicos\n\nLa transición al pensamiento multidimensional presenta fricciones técnicas documentadas:\n\n- **Identidad vs. Transposición:** Confundir un vector fila con uno columna. En computación industrial, esto genera errores de dimensiones en las multiplicaciones de matrices.\n- **Componentes vs. Magnitud:** Olvidar que la magnitud de v+w no es ∣v∣+∣w∣, sino que depende del ángulo (correlación) entre las variables.\n- **La barrera 4D+:** Intentar visualizar espacios de alta dimensión. Debemos confiar en el formalismo: las leyes algebraicas de 3D se mantienen inmutables para n dimensiones.\n\n## 9. Mini-proyecto guiado: Biblioteca matemática desde cero\n\nEntender la lógica \"low-level\" es vital para el control de procesos.\n\n- **Paso 1:** Definir el vector como una lista inmutable de componentes.\n- **Paso 2:** Implementar funciones de suma componente a componente y escalado.\n- **Paso 3:** Desarrollar la lógica de combinación lineal cv+dw.\n- **Paso 4:** Implementar la multiplicación matriz-vector como una combinación lineal de las columnas de la matriz, aplicando los principios de Strang de eficiencia computacional.\n\n## 10. Glosario técnico\n\n- **Escalar:** Un número real que estira o encoge un vector.\n- **Vector:** Una flecha en el espacio Rⁿ o una lista ordenada de datos.\n- **Matriz:** Un conjunto de vectores columna que representan un sistema o transformación.\n- **Combinación Lineal:** La suma de vectores escalados (cv+dw).\n- **Espacio Vectorial:** El conjunto de todas las combinaciones posibles; el \"universo\" de datos disponible.\n- **Independencia Lineal:** Un conjunto de vectores es independiente si ninguno puede ser descartado sin reducir el \"span\" (el espacio que llenan).\n\n## 11. Resumen y Checklist de comprensión\n\nLos vectores y matrices no son abstracciones; son la infraestructura digital de la Industria 4.0. Dominar la combinación lineal es el primer paso para controlar la complejidad de cualquier activo pesado.\n\nChecklist de autoevaluación:\n\n- Si el vector de vibración de su motor es v y el de temperatura es w, ¿por qué la combinación v+w solo tiene sentido matemático si definimos un espacio de estado conjunto?\n- ¿Puede identificar si las variables de presión en su pipeline son linealmente independientes o si una depende de las otras?\n- ¿Cómo interpreta el \"vector cero\" en un sistema de balance de masas de una planta procesadora?\n- Si una matriz de sensores es simétrica, ¿qué información nos da sobre la correlación de las fallas?\n- ¿Por qué el Gemelo Digital falla cuando el vector de estado real sale del subespacio generado por los datos históricos?","m07-t03":"# Regresión logística\n\n## La idea en una frase\n\nLa regresión logística estima la probabilidad de que ocurra un evento binario (paga o no paga, falla o no falla) pasando una combinación lineal de las variables por una curva en forma de S.\n\n## Cómo funciona\n\nPrimero se calcula un puntaje lineal: z = β₀ + β₁x₁ + … + βₖxₖ. Ese puntaje puede valer cualquier número, así que se comprime al intervalo entre 0 y 1 con la función sigmoide:\n\np = 1 / (1 + e^(−z))\n\nSi se despeja z se obtiene la forma que da nombre al modelo: ln(p / (1 − p)) = z. El lado izquierdo es el logit, el logaritmo de las chances (odds). El modelo es lineal en el logit, no en la probabilidad.\n\nDe ahí sale la interpretación de los coeficientes: cuando x₁ sube una unidad, las chances se multiplican por e^β₁. Si β₁ = 0,7, las chances se duplican aproximadamente, porque e^0,7 ≈ 2. El efecto sobre la probabilidad no es constante: es grande cerca de p = 0,5 y casi nulo en los extremos.\n\n## Cómo se ajusta\n\nNo se minimizan errores al cuadrado. Se buscan los coeficientes que hacen más verosímiles los datos observados, maximizando la log-verosimilitud:\n\nLL = Σ [ y·ln(p) + (1 − y)·ln(1 − p) ]\n\nNo existe una fórmula cerrada como en mínimos cuadrados. Se resuelve de forma iterativa, con Newton-Raphson (también llamado IRLS) o con descenso de gradiente. El gradiente tiene una forma muy simple: Xᵀ(y − p), el error de probabilidad ponderado por cada variable. La función es convexa, así que si existe un óptimo finito, es único.\n\nEl negativo de la log-verosimilitud promedio es la log-loss o entropía cruzada, la misma función de pérdida que usan las redes neuronales para clasificar.\n\n## Supuestos\n\n1. **Respuesta binaria.** Hay extensiones para varias clases (multinomial) y para clases ordenadas.\n2. **Observaciones independientes.** Datos repetidos del mismo cliente o del mismo equipo rompen este supuesto.\n3. **Linealidad en el logit.** Cada variable continua debe relacionarse de forma lineal con el logaritmo de las chances. Es el supuesto que más se incumple y el que menos se revisa.\n4. **Sin multicolinealidad fuerte.** Variables muy correlacionadas inflan la varianza de los coeficientes y los vuelven inestables.\n5. **Sin separación perfecta.** Si una variable separa por completo las dos clases, la verosimilitud no tiene máximo finito y los coeficientes crecen sin límite.\n6. **Muestra suficiente.** Importa el número de eventos de la clase minoritaria, no el total de filas. La guía habitual de unos diez eventos por variable es una referencia, no una ley.\n\nLo que **no** supone: normalidad de las variables, homocedasticidad, ni una relación lineal entre x y la probabilidad.\n\n## Por qué no tiene R²\n\nEl R² clásico mide qué fracción de la varianza explica el modelo, y eso exige residuos continuos. Aquí la respuesta es 0 o 1. Por eso se usan sustitutos:\n\n- **Pseudo-R² de McFadden:** 1 − LL / LL₀, donde LL₀ es la log-verosimilitud de un modelo que solo predice la tasa promedio. Sus valores son mucho más bajos que los de un R² lineal: McFadden señaló que entre 0,2 y 0,4 ya indica un ajuste muy bueno.\n- **Log-loss:** cuanto más baja, mejor; castiga con dureza las predicciones seguras y equivocadas.\n- **AUC, KS y Gini:** miden capacidad de ordenar, no calibración.\n- **Curva de calibración:** compara la probabilidad predicha con la frecuencia observada.\n\n## Curiosidades\n\n- Se llama regresión, pero casi siempre se usa para clasificar. Lo que \"regresa\" es una probabilidad.\n- Una neurona con activación sigmoide es exactamente una regresión logística. Una red neuronal para clasificación binaria termina en una.\n- La curva logística nació en demografía: Pierre-François Verhulst la propuso en el siglo XIX para describir poblaciones que crecen hasta un tope.\n- La frontera de decisión es una recta (o un hiperplano), aunque la curva de probabilidad sea una S.\n- El umbral de 0,5 no es sagrado. Si un falso negativo cuesta diez veces más que un falso positivo, el umbral debe bajar.\n- Con clases perfectamente separables, el modelo \"más seguro de sí mismo\" es también el que no converge.\n\n## En minería y cemento\n\nProbabilidad de falla de un equipo en el próximo turno a partir de vibración y temperatura; probabilidad de que un lote salga fuera de especificación según variables del proceso. La ventaja frente a modelos más complejos es que el signo y el tamaño de cada coeficiente se pueden discutir con el ingeniero de planta.\n\n## En banca\n\nEs la base histórica del credit scoring: estima la probabilidad de incumplimiento y sus coeficientes se traducen en puntos de una scorecard. Su interpretabilidad y su estabilidad la mantienen vigente como modelo de referencia frente al cual se comparan los modelos de boosting.\n\n## Errores comunes\n\n- Leer β como \"cambio en la probabilidad\". Es cambio en el logit.\n- Evaluar con exactitud cuando las clases están desbalanceadas: un modelo que siempre dice \"no\" acierta el 95 % si el evento ocurre el 5 % de las veces.\n- Regularizar sin escalar las variables: la penalización castiga más a las de escala pequeña.\n- Confundir buena discriminación con buena calibración. Un modelo puede ordenar bien y dar probabilidades infladas.\n\n## Pruébalo\n\nEn el Laboratorio, mueve β₀ y β₁ y observa cómo cambian la curva, la log-loss, el pseudo-R² y la matriz de confusión. Luego pulsa el ajuste por máxima verosimilitud y compara con tu intento manual.","m03-t04":"# Regresión lineal y sus supuestos\n\n## La idea en una frase\n\nLa regresión lineal resume la relación entre una respuesta continua y una o más variables con la recta (o el plano) que deja los errores al cuadrado lo más pequeños posible.\n\n## El modelo\n\ny = β₀ + β₁x + ε. El término ε recoge todo lo que la recta no explica. Mínimos cuadrados ordinarios (OLS) elige β₀ y β₁ para minimizar la suma de residuos al cuadrado, SSE = Σ(yᵢ − ŷᵢ)². En el caso simple hay fórmula cerrada:\n\n- β₁ = cov(x, y) / var(x)\n- β₀ = ȳ − β₁·x̄\n\nLa recta siempre pasa por el punto de las medias (x̄, ȳ).\n\n## Qué mide el R²\n\nR² = 1 − SSE / SST, donde SST = Σ(yᵢ − ȳ)² es el error que cometería quien predijera siempre la media. R² es entonces la fracción de esa variabilidad que la recta logra explicar.\n\n- R² = 1: todos los puntos caen sobre la recta.\n- R² = 0: la recta no mejora a la media.\n- R² negativo: solo aparece cuando la recta no fue ajustada por OLS (o se evalúa en datos nuevos) y resulta peor que predecir la media. En el Laboratorio lo verás al mover la recta lejos de los puntos.\n\n## Supuestos\n\n1. **Linealidad.** La media de y cambia de forma lineal con x.\n2. **Independencia de los errores.** En series de tiempo suele fallar: los errores vecinos se parecen.\n3. **Homocedasticidad.** La dispersión de los errores es la misma en todo el rango de x.\n4. **Normalidad de los errores.** No hace falta para estimar los coeficientes; hace falta para que los intervalos y las pruebas sean exactos en muestras pequeñas.\n5. **Sin multicolinealidad perfecta** y variables explicativas no correlacionadas con el error.\n\nCon los supuestos 1 a 3 y 5, OLS es el estimador lineal insesgado de menor varianza (teorema de Gauss-Markov).\n\n## Curiosidades\n\n- \"Regresión\" viene de Francis Galton, que observó que los hijos de padres muy altos tendían a ser menos altos que ellos: regresaban hacia la media.\n- El cuarteto de Anscombe son cuatro conjuntos de datos con la misma recta y prácticamente el mismo R², y cuatro gráficos por completo distintos. Por eso se grafica antes de confiar en un número.\n- R² nunca baja al agregar una variable, aunque sea ruido. Para comparar modelos se usa el R² ajustado o un criterio de validación.\n- Un solo valor atípico con mucha palanca puede girar la recta entera. Actívalo en el Laboratorio.\n- Un R² alto no prueba causalidad ni que el modelo sea correcto; un R² bajo no impide que un coeficiente sea útil.\n\n## En minería y cemento\n\nRelacionar el consumo específico de energía de un molino con el tonelaje y la dureza del mineral, o la resistencia del cemento con la finura. Los residuos graficados contra el tiempo delatan derivas del proceso.\n\n## En banca\n\nModelos de pérdida dado el incumplimiento, proyección de saldos y, sobre todo, como línea base contra la que se justifica cualquier modelo más complejo.\n\n## Pruébalo\n\nEn el Laboratorio, mueve el intercepto y la pendiente para acercar la recta a los puntos y mira subir el R². Después sube el ruido, agrega el valor atípico y compara con el ajuste de mínimos cuadrados."};

function lecPrompt(t){
  const named=t.src.filter(s=>!/~\d|^\d+$/.test(s)).slice(0,40).join("; ");
  return REGLAS+"\n\n"+ctx(t)+"\nTÍTULOS DE LAS FUENTES DEL CUADERNO DE ESTE ÁMBITO (solo títulos, no conoces su contenido): "+named+"\n\nTAREA: escribe la lección completa del tema para leerla de corrido y entenderlo sin otro material. Extensión: entre 1 500 y 1 900 palabras. Formato Markdown.\nEstructura: # título; ## La idea en una frase; ## Intuición (con una analogía de planta o de banca); ## Definición formal; ## Desarrollo paso a paso (derivación con fórmulas en texto plano); ## Ejemplo resuelto con números; ## En Python (un bloque de código corto y ejecutable, con comentarios); ## En minería y cemento; ## En banca; ## Errores comunes; ## Dónde profundizar en tu cuaderno (2 a 4 títulos de la lista anterior que por su título parezcan pertinentes, sin afirmar qué dicen ni citar páginas); ## Comprueba que lo entendiste (3 preguntas sin respuesta).\nSi hay material de NotebookLM, básate en él. Devuelve solo la lección."}

async function runBatch(){
  if(busy||batch)return;
  const list=topicsOf(AMB[current().an-1]).filter(x=>!peek(x.id).leccion.trim()&&!LEC[x.id]);
  if(!list.length)return;
  batch={stop:false,done:0,n:list.length};busy=true;render();
  for(const t of list){
    if(batch.stop)break;
    note("Escribiendo la lección "+(batch.done+1)+" de "+batch.n+": "+t.name+". Puedes seguir leyendo.");
    try{const r=await ask(lecPrompt(t),{tier:"complex"});const p=T(t.id);p.leccion=r.text.trim();if(p.st===0)p.st=1;touch(t.id);batch.done++}
    catch(e){const d=batch.done;busy=false;batch=null;render();note(why(e)+" Se escribieron "+d+" lecciones antes de parar.",true);return}
  }
  const d=batch.done;busy=false;batch=null;render();note("Listo: "+d+" lecciones nuevas en este ámbito, escritas con "+lastModel+".");
}

function panePracticar(t,p){
  const gen='<div class="row"><button class="btn p" data-act="genprac">'+(p.cards.length?"Generar una práctica nueva":"Generar tarjetas y quiz con Claude")+'</button></div>';
  if(!p.cards.length||!p.quiz.length)return '<div><h2>Practica el tema</h2><p class="hint">Claude prepara 12 tarjetas de repaso y un quiz de 8 preguntas con corrección inmediata, a partir de '+(p.fuente.trim()?"tu informe de NotebookLM.":"conocimiento general, porque aún no pegaste el informe de NotebookLM.")+'</p></div>'+gen;
  const n=p.cards.length,i=Math.min(UI.ci,n-1),c=p.cards[i],known=p.known||[];
  const nq=p.quiz.length,done=Object.keys(UI.ans).length,good=p.quiz.filter((q,k)=>UI.ans[k]===q.c).length;
  return '<div class="grid2"><div class="box"><div class="row" style="justify-content:space-between"><h2>Tarjetas</h2><span class="pill">'+known.length+" de "+n+' dominadas</span></div>'+
    '<div class="pips">'+p.cards.map((_,k)=>'<button class="pip'+(known.includes(k)?" k":"")+(k===i?" c":"")+'" data-act="cardgo" data-i="'+k+'" aria-label="Ir a la tarjeta '+(k+1)+'"></button>').join("")+'</div>'+
    '<button class="flash'+(UI.flip?" f":"")+'" id="flash" data-act="flip" aria-label="Voltear tarjeta"><span class="face fr"><small>Tarjeta '+(i+1)+" de "+n+'</small>'+esc(c.p)+'<em>Toca para ver la respuesta</em></span><span class="face bk"><small>Respuesta</small>'+esc(c.r)+'</span></button>'+
    '<div class="row"><button class="btn" data-act="cardno">Aún no la sé</button><button class="btn p" data-act="cardyes">La sabía</button></div></div>'+
    '<div class="box"><div class="row" style="justify-content:space-between"><h2>Quiz</h2><span class="pill">'+(done===nq?good+" de "+nq+" correctas":done+" de "+nq+" respondidas")+(p.best!=null?" · mejor "+p.best+"/"+nq:"")+'</span></div>'+
    p.quiz.map((q,k)=>{const a=UI.ans[k];return '<fieldset class="q"><legend>'+(k+1)+". "+esc(q.p)+'</legend>'+q.o.map((o,j)=>'<button class="opt'+(a!==undefined?(j===q.c?" ok":j===a?" no":""):"")+'" data-act="ans" data-k="'+k+'" data-j="'+j+'"'+(a!==undefined?" disabled":"")+'>'+esc(o)+'</button>').join("")+(a!==undefined?'<p class="hint">'+esc(q.e)+'</p>':"")+'</fieldset>'}).join("")+
    '<div class="row"><button class="btn" data-act="quizreset">Reintentar quiz</button></div></div></div>'+gen;
}
async function genPrac(){
  const t=current(),p=T(t.id);
  await guarded(async()=>{
    const r=await ask(REGLAS+"\n\n"+ctx(t)+"\nTAREA: prepara material de práctica del tema. Devuelve SOLO un objeto JSON válido, sin texto adicional ni bloques de código, con esta forma exacta:\n{\"tarjetas\":[{\"p\":\"pregunta\",\"r\":\"respuesta\"}],\"quiz\":[{\"p\":\"pregunta\",\"o\":[\"opción\",\"opción\",\"opción\",\"opción\"],\"c\":0,\"e\":\"explicación\"}]}\nReglas: 12 tarjetas, una idea por tarjeta, pregunta de máximo 25 palabras y respuesta de máximo 45. 8 preguntas de quiz ordenadas de básica a experta, con 4 opciones plausibles; \"c\" es el índice (0 a 3) de la correcta y debe variar entre preguntas; \"e\" explica en máximo 40 palabras por qué es correcta. Incluye al menos una pregunta aplicada a minería o cemento y una a banca. Fórmulas en texto plano.",{});
    let d;try{d=JSON.parse(r.text.slice(r.text.indexOf("{"),r.text.lastIndexOf("}")+1))}catch(e){throw {message:"Claude devolvió la práctica con formato inválido. Intenta de nuevo"}}
    const cards=(d.tarjetas||[]).filter(x=>x&&x.p&&x.r).slice(0,20).map(x=>({p:String(x.p),r:String(x.r)}));
    const quiz=(d.quiz||[]).filter(x=>x&&x.p&&Array.isArray(x.o)&&x.o.length>=2&&Number.isInteger(x.c)&&x.c>=0&&x.c<x.o.length).slice(0,12).map(x=>({p:String(x.p),o:x.o.map(String),c:x.c,e:String(x.e||"")}));
    if(!cards.length||!quiz.length)throw {message:"la práctica llegó incompleta. Intenta de nuevo"};
    p.cards=cards;p.quiz=quiz;p.known=[];p.best=null;UI={ci:0,flip:false,ans:{}};
    if(p.st===0)p.st=1;touch(t.id);render();
  });
}
/* ---------- racha y celebración ---------- */
function mark(id){
  const d=iso(new Date()),m=S.cfg.days||(S.cfg.days={}),o=m[d]||(m[d]={});
  if(o[id])return;o[id]=1;
  const ks=Object.keys(m).sort();while(ks.length>150)delete m[ks.shift()];
  dirty.add("cfg");local("cfg");
}
function dayCount(d){const o=(S.cfg.days||{})[iso(d)];return o?Object.keys(o).length:0}
function streak(){const d=new Date();if(!dayCount(d))d.setDate(d.getDate()-1);let n=0;while(dayCount(d)){n++;d.setDate(d.getDate()-1)}return n}
function heat(){const out=[],d=new Date();d.setDate(d.getDate()-83);
  for(let i=0;i<84;i++){const n=dayCount(d);out.push('<i class="h'+Math.min(n,3)+'" title="'+fdate(d)+": "+n+(n===1?" tema":" temas")+'"></i>');d.setDate(d.getDate()+1)}
  return '<div class="heat" role="img" aria-label="Actividad de estudio de las últimas 12 semanas">'+out.join("")+'</div>'}
function confetti(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99";
  c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext("2d");
  const P=Array.from({length:110},()=>({x:c.width/2,y:c.height*.38,vx:(Math.random()-.5)*16,vy:-Math.random()*13-3,c:COL[Math.random()*COL.length|0],s:5+Math.random()*6,r:Math.random()*6}));
  let n=0;(function f(){x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.38;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(++n<100)requestAnimationFrame(f);else c.remove()})();
}

/* ---------- copiar y descargar ---------- */
async function copyText(text){
  try{await navigator.clipboard.writeText(text);note("Copiado.");return true}
  catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}
    ta.remove();note(ok?"Copiado.":"No se pudo copiar. Selecciona el texto y cópialo a mano.",!ok);return ok}
}
async function save(filename,data){
  if(!dl){note("La descarga no está disponible en esta vista. Usa el botón Copiar.",true);return}
  try{await dl.save({filename,data});note("Archivo guardado: "+filename)}
  catch(e){note(e&&e.code==="declined"?"Descarga cancelada.":"No se pudo descargar el archivo.",e&&e.code!=="declined")}
}
function printable(t,p){
  return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>'+esc(t.name)+'</title><style>@page{size:A4;margin:22mm 20mm}body{font:11.5pt/1.6 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;color:#1d1d1f;max-width:170mm;margin:auto;padding:12mm 0}header{font-weight:600;font-size:9.5pt;color:#6e6e73;border-bottom:1px solid #d2d2d7;padding-bottom:8px;margin-bottom:22px}h2{font-size:26pt;line-height:1.1;letter-spacing:-.03em}h3{font-size:15pt;letter-spacing:-.02em;margin-top:22px}h4,h5{font-size:12pt}pre{font:9.5pt Menlo,Consolas,monospace;background:#f5f5f7;padding:10px;border-radius:8px;white-space:pre-wrap}footer{margin-top:26px;font-size:9pt;color:#6e6e73;border-top:1px solid #d2d2d7;padding-top:8px}</style></head><body><header>Fabrishio · Ciencia de Datos · Ámbito '+pad(t.an)+" "+esc(t.aName)+'</header>'+md(p.resumen)+'<footer>'+esc(S.cfg.repo)+'</footer></body></html>';
}

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,t=current();
  if(act==="copyopen"){copyText(peek(t.id).post);return}
  e.preventDefault();
  if(act==="sel"||act==="go"){UI={ci:0,flip:false,ans:{}};S.cfg.sel=b.dataset.id;if(act==="go"){S.cfg.tab="linkedin";location.hash="estudio"}touch("cfg");render();window.scrollTo(0,0)}
  else if(act==="go2"){location.hash="estudio"}
  else if(act==="goamb"){const ts=topicsOf(AMB.find(a=>a.id===b.dataset.a)),n=ts.find(x=>stage(x.id)<2)||ts[0];UI={ci:0,flip:false,ans:{}};S.cfg.sel=n.id;S.cfg.tab="leer";S.cfg.open[b.dataset.a]=true;touch("cfg");location.hash="estudio";window.scrollTo(0,0)}
  else if(act==="tab"){S.cfg.tab=b.dataset.v;touch("cfg");render()}
  else if(act==="st"){T(t.id).st=+b.dataset.v;touch(t.id);render();if(b.dataset.v==="2")confetti()}
  else if(act==="copy"){const el=document.getElementById(b.dataset.from);copyText(el.value!==undefined?el.value:el.textContent)}
  else if(act==="chatq")sendChat(b.dataset.q);
  else if(act==="figq")makeFig(b.dataset.q+" para el tema "+t.name);
  else if(act==="chatclear"){T(t.id).chat=[];touch(t.id);render()}
  else if(act==="figdel"){T(t.id).charts.splice(+b.dataset.i,1);touch(t.id);render()}
  else if(act==="figpng"){
    try{const url=await Plotly.toImage($("#plot-"+b.dataset.i),{format:"png",width:1600,height:900});
      const bin=atob(url.split(",")[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      save(slug(peek(t.id).charts[+b.dataset.i].titulo||"grafico")+".png",new Blob([u]))}
    catch(_){note("No se pudo exportar el gráfico.",true)}
  }
  else if(act==="theme"){setTheme(themeNow()==="dark"?"light":"dark");render()}
  else if(act==="lab"){L.lab=b.dataset.v;render()}
  else if(act==="labgo"){L.lab=b.dataset.v;location.hash="laboratorio";window.scrollTo(0,0)}
  else if(act==="labbtn"){const id=LAB[L.lab]?L.lab:"log";LAB[id].b[+b.dataset.i][1](LSt(id),LC);drawLab()}
  else if(act==="labamb"){const ks=labsOf(+b.dataset.n);if(ks.length){L.lab=ks[0];location.hash="laboratorio";window.scrollTo(0,0)}}
  else if(act==="gencur")stream("curios",REGLAS+"\n\n"+ctx(t)+"\nTAREA: escribe 6 curiosidades del tema que ayuden a recordarlo: origen del nombre o historia, un caso límite sorprendente, una conexión con otro método, un error famoso, un uso en minería o cemento y uno en banca. Cada una en una viñeta de 2 o 3 frases, en Markdown. Solo hechos de los que estés seguro; si dudas de un dato, no lo incluyas. Devuelve solo la lista.","default");
  else if(act==="genlec")genLeccion();
  else if(act==="batch")runBatch();
  else if(act==="batchstop"){if(batch){batch.stop=true;note("Se detendrá al terminar la lección en curso.")}}
  else if(act==="copylec"){const p=peek(t.id);copyText(p.leccion.trim()||p.fuente)}
  else if(act==="genprac")genPrac();
  else if(act==="flip"){UI.flip=!UI.flip;$("#flash").classList.toggle("f",UI.flip)}
  else if(act==="cardgo"){UI.ci=+b.dataset.i;UI.flip=false;render()}
  else if(act==="cardyes"||act==="cardno"){const p=T(t.id),i=Math.min(UI.ci,p.cards.length-1);p.known=(p.known||[]).filter(k=>k!==i);if(act==="cardyes")p.known.push(i);
    UI.ci=(i+1)%p.cards.length;UI.flip=false;touch(t.id);render();if(p.known.length===p.cards.length&&act==="cardyes")confetti()}
  else if(act==="ans"){const p=T(t.id);UI.ans[+b.dataset.k]=+b.dataset.j;
    if(Object.keys(UI.ans).length===p.quiz.length){const g=p.quiz.filter((q,k)=>UI.ans[k]===q.c).length;p.best=Math.max(p.best??0,g);touch(t.id);if(g===p.quiz.length)confetti()}
    render()}
  else if(act==="quizreset"){UI.ans={};render()}
  else if(act==="genres")genResumen();
  else if(act==="genpost")genPost();
  else if(act==="genguion")genGuion();
  else if(act==="dlmd"){const p=peek(t.id);p.resumen.trim()?save("resumen-claude.md",p.resumen):note("Todavía no hay resumen. Genéralo en el paso Resumen.",true)}
  else if(act==="dlinf"){const p=peek(t.id);p.fuente.trim()?save("informe-notebooklm.md","# "+t.name+"\n\n"+p.fuente):note("Todavía no pegaste el informe de NotebookLM en el paso Estudiar.",true)}
