n":"Usar 'same' por defecto en la gran mayoría de diseños de redes profundas de visión artificial de la planta. Esto garantiza que los bordes de la imagen (donde a menudo se localizan sensores o anomalías físicas marginales) sean procesados con el mismo peso por los filtros y evita la contracción dimensional prematura.","err":"Mantener 'valid' por defecto en redes convolucionales profundas complejas, provocando que las capas intermedias colapsen a dimensiones de 1x1 antes de poder extraer patrones abstractos complejos del sistema de planta.","apl":"Inspección visual robótica del desgaste de dientes de palas cargadoras mineras pesadas. El uso de padding='same' en la red convolucional profunda asegura que el perímetro de desgaste metálico lateral marginal de los dientes no sea ignorado por el filtro convolucional de visión de planta.","pri":"IMPORTANTE","code":"padding"},{"name":"Tamaño de la Ventana de Agrupamiento","nivel":"Avanzado","que":"Define las dimensiones horizontales y verticales de la ventana de agrupamiento descendente que resume la información espacial de las capas convolucionales. Actúa como un reductor geométrico de dimensiones no entrenable de forma directa en el flujo de la red.","val":"Tuplas de enteros: [(2, 2), (3, 3)]. Default en keras = (2, 2).","alto":"(e.g. (4, 4) o superior). Contraerá la imagen de forma demasiado brusca y violenta, promediando de forma burda zonas de mapa de activación dispares y perdiendo la resolución fina necesaria para identificar pequeños bordes o texturas locales de planta.","bajo":"(e.g. (1, 1)). Se reduce a una identidad de mezcla inútil, no logrando comprimir las dimensiones ni inyectar la inmunidad ante pequeñas variaciones espaciales típica del pooling de visión.","inter":"Su sintonía de regularización es complementaria a la sintonía del paso del filtro (stride) de la red profunda convolucional.","tun":"Usar de forma estándar pool_size=(2, 2) con paso de filtro correspondiente de stride=(2, 2), reduciendo la dimensión espacial del mapa de activación a exactamente la mitad de forma limpia en el conexionismo de visión de planta.","err":"Apilar de forma continua múltiples capas de pooling complejas de gran tamaño, perdiendo la resolución espacial necesaria para identificar fallas pequeñas en soldaduras de acería.","apl":"Clasificación de tipos de fallas de soldadura en base a imágenes radiográficas digitalizadas de planta. El uso de pool_size=(2, 2) compacta los mapas de activación de forma óptima sin perder los bordes finos de las grietas estructurales del metal.","pri":"OPCIONAL","code":"pool_size para Max/Average Pooling"},{"name":"Número de Filtros","nivel":"Básico","que":"Cantidad de filtros convolucionales, es decir, la profundidad del mapa de características de salida. Cada filtro aprende a detectar un patrón distinto.","val":"[16, 32, 64, 128, 256], normalmente duplicándose por bloque. Default: no tiene, es obligatorio.","alto":"Sobreajuste y alto costo computacional por filtros redundantes.","bajo":"La red no captura la variedad de patrones del problema.","inter":"Con kernel_size y el número de capas; más filtros piden más regularización.","tun":"Empezar con 32 en la primera capa y duplicar por bloque (ver código).","err":"Usar 512 filtros desde la primera capa en un dataset pequeño.","apl":"Inspección visual automática de piezas o materiales en una cinta, donde las primeras capas detectan bordes y texturas básicas.","pri":"ESENCIAL","code":"filters"},{"name":"Convolución Dilatada","nivel":"Avanzado","que":"Inserta huecos entre los elementos del filtro, ampliando el campo receptivo sin añadir parámetros. dilation_rate=2 con kernel 3 equivale a un alcance de 5.","val":"[1, 2, 4, 8]. Default: 1 (sin dilatación).","alto":"Patrones muy dispersos; pierde detalle local.","bajo":"1 es la convolución estándar.","inter":"Incompatible con strides>1 en la mayoría de frameworks.","tun":"Usar dilataciones crecientes (1, 2, 4, 8) para capturar patrones a varias escalas.","err":"Combinar dilation_rate>1 con strides>1 (comportamiento indefinido).","apl":"Analizar señales de vibración a varias escalas temporales a la vez, captando patrones rápidos y lentos sin más parámetros.","pri":"IMPORTANTE","code":"dilation_rate"}]},{"n":"17","t":"Redes Recurrentes (RNN, LSTM, GRU)","hp":[{"name":"Tamaño de la Dimensión de Memoria Oculta","nivel":"Básico","que":"Define de forma directa la capacidad y la expresividad no lineal del conexionismo temporal recurrente, especificando cuántas dimensiones ocultas o unidades de memoria individuales calcularán de forma paralela en el espacio de representación latente secuencial.","val":"Enteros: [16, 32, 64, 128, 256]. Default en keras = 32 o 64.","alto":"(e.g. hidden_size >= 256 en datasets con pocas observaciones secuenciales). Dispara la capacidad y expresividad del conexionismo recurrente de forma excesiva, multiplicando los millones de pesos libres de entrenamiento del modelo de forma redundante y provocando sobreajuste severo en validación cruzada.","bajo":"(e.g. hidden_size <= 8). El modelo sufrirá de subajuste secuencial, siendo incapaz de aproximar dependencias temporales no lineales de variables físicas predictoras de planta.","inter":"Su sintonía de regularización es complementaria a la sintonía de Dropout recurrente y regularización L2 (alpha).","tun":"Búsqueda en cuadrícula en un rango acotado combinando la estructura y cantidad de neuronas. Un valor de 64 o 128 suele converger de forma óptima en series de tiempo de planta.","err":"Diseñar redes neuronales recurrentes gigantescas de múltiples capas ocultas sobre datasets con series de tiempo cortas de planta, sobreajustando el modelo secuencial de planta.","apl":"Predicción de fallas operacionales por fatiga en revestimiento interno de horno en base a telemetría de sensores continuos térmicos de planta. Un hidden_size=128 en una red LSTM recurrente captura de forma exacta las dependencias temporales complejas de la planta.","pri":"ESENCIAL","code":"hidden_size o units"},{"name":"Número de Capas Recurrentes Apiladas","nivel":"Básico","que":"Define cuántas capas recurrentes independientes de SimpleRNN, LSTM o GRU se construirán e interconectarán de forma jerárquica secuencial en el proceso del ensamble.","val":"Enteros: [1, 2, 3]. Default en keras = 1.","alto":"(e.g. num_layers >= 4). Provoca un sobreajuste secuencial extremo de la red recurrente profunda. El modelo intentará memorizar los patrones de ruido temporales de forma sinuosa, además de prolongar drásticamente el tiempo de entrenamiento de la CPU/GPU.","bajo":"(e.g. num_layers = 1, el default). El modelo sufrirá de subajuste secuencial en datasets con dependencias temporales jerárquicas complejas y dinámicas físicas en la planta.","inter":"Enlazado con hidden_size y dropout. Si se incrementa num_layers, se recomienda usarlo junto con el parámetro de regularización de Dropout para evitar el sobreajuste del modelo.","tun":"Mantener num_layers = 1 o 2 en la práctica industrial para garantizar la correcta reducción de varianza del ensamble.","err":"Apilar múltiples capas recurrentes sin configurar return_sequences=True en las capas intermedias, provocando errores silenciosos de dimensiones matemáticas de salida en el FastAPI de planta.","apl":"Pronóstico de la demanda de efectivo en cajeros automáticos (ATMs) del BCP en base a variables exógenas de la planta. Sintonizar un num_layers=2 en una red profunda recurrente LSTM con regularización de Dropout captura de forma exacta la ciclicidad compleja de retiros semanales de planta.","pri":"ESENCIAL","code":"num_layers"},{"name":"Probabilidad de Dropout Recurrente y de Capas","nivel":"Intermedio","que":"Define la fracción de neuronas ocultas de las capas de SimpleRNN, LSTM o GRU que se desactivarán de forma aleatoria en el proceso de entrenamiento secuencial para inyectar robustez y regularización estructural (stochastic regularization).","val":"Rango continuo de [0.1, 0.2, 0.3, 0.4]. Default en keras = 0.0 (sin desactivación).","alto":"(e.g. dropout >= 0.5). Desactiva una fracción de neuronas recurrentes excesiva, impidiendo que el modelo recurrente secuencial capte las dependencias temporales reales del sistema físico y conduciendo a subajuste del modelo.","bajo":"(e.g. dropout = 0.0, el default). El modelo recurrente carecerá de regularización estocástica, permitiendo al conexionismo recurrente sobreajustar en exceso el ruido local del dataset.","inter":"Su sintonía de regularización es complementaria a la sintonía del número de capas recurrentes (num_layers).","tun":"Configurar de forma estándar un valor de 0.2 o 0.3 para inyectar diversidad espacial y agilizar enormemente la generalización del conexionismo recurrente.","err":"No comprender la diferencia entre dropout clásico de capas y recurrent_dropout (que se aplica de forma secuencial en las conexiones internas de recurrencia), provocando que este último ralentice de forma extrema el entrenamiento en GPUs al no poder usar kernels optimizados de NVIDIA cuDNN3.","apl":"Predicción mensual del consumo de agua industrial en base a telemetría de sensores de planta. Un dropout=0.2 en una red LSTM recurrente inyecta robustez al modelo recurrente, filtrando comportamientos de ruido de fondo instrumentales de planta.","pri":"IMPORTANTE","code":"dropout"},{"name":"Recurrencia en Ambos Sentidos Temporales","nivel":"Avanzado","que":"Define si el procesamiento de la secuencia temporal se realizará en ambos sentidos temporales (hacia adelante y hacia atrás de forma paralela en dos capas recurrentes independientes) para consolidar un estado latente enriquecido por el contexto futuro y pasado, o si por el contrario la recurrencia se limitará estrictamente al sentido temporal secuencial clásico hacia adelante.","val":"Booleano: True o False. Default en keras = False.","alto":"N/A.","bajo":"Si se desactiva (bidirectional=False), el modelo recurrente carecerá de la capacidad de evaluar de forma prospectiva las series de tiempo del dataset, perdiendo precisión en problemas de procesamiento de texto (NLP) de informes de averías de la planta.","inter":"Duplica de forma exacta el número de parámetros libres de entrenamiento de la capa recurrente y la dimensión de salida concatenada resultante: 2 times hiddensize.","tun":"Usar de forma estándar bidirectional=True exclusivamente en problemas de procesamiento de lenguaje natural (NLP) o series de tiempo exógenas consolidadas donde el contexto futuro e histórico sea relevante.","err":"Configurar bidirectional=True en modelos en vivo de pronóstico predictivo en tiempo real (forecasting), provocando fuga de datos de validación cruzada y violando la causalidad del sistema al simular que se cuenta con el futuro en vivo.","apl":"Clasificación del modo de falla de motores gigantescos a partir del texto de bitácoras de informes mecánicos semanales históricos. El uso de bidirectional=True sobre la capa de embeddings permite al modelo capturar de forma exacta el contexto semántico de los informes, optimizando el despacho de repuestos.","pri":"OPCIONAL","code":"bidirectional"},{"name":"Retorno de Secuencia Completa","nivel":"Intermedio","que":"True devuelve la salida de cada paso temporal (necesario para apilar capas o predecir secuencias); False devuelve solo la del último paso.","val":"[True, False]. Default: False.","alto":"N/A (booleano).","bajo":"N/A.","inter":"Las capas recurrentes intermedias DEBEN usar True para pasar la secuencia a la siguiente.","tun":"True en capas intermedias; False en la última para clasificación, True para pronóstico multi-paso (ver código).","err":"Olvidar return_sequences=True en una capa intermedia y provocar un error de dimensiones.","apl":"Pronosticar los próximos N valores de una serie temporal encadenando capas recurrentes que propagan toda la secuencia.","pri":"ESENCIAL","code":"return_sequences"},{"name":"Dropout Recurrente y Estado Persistente","nivel":"Avanzado","que":"recurrent_dropout regulariza las conexiones internas de memoria; stateful=True conserva el estado oculto entre lotes para secuencias muy largas.","val":"recurrent_dropout en [0.0, 0.1, 0.2]; stateful en {True, False}. Default: 0.0 y False.","alto":"Un recurrent_dropout alto (>0.4) destruye la memoria temporal.","bajo":"0.0 no regulariza la parte recurrente.","inter":"ADVERTENCIA: recurrent_dropout>0 desactiva la aceleración cuDNN y ralentiza mucho el entrenamiento en GPU. stateful exige lotes ordenados y reset_states() manual.","tun":"Usar 0.1–0.2 solo si el dropout de capa no basta; preferir dropout normal en GPU.","err":"Activar recurrent_dropout=0.3 sin notar la caída drástica de velocidad.","apl":"Modelar un monitoreo continuo 24/7 donde el estado histórico completo importa para predecir el siguiente intervalo.","pri":"IMPORTANTE","code":"recurrent_dropout, stateful"}]},{"n":"18","t":"Transformers","hp":[{"name":"Dimensión de los Embeddings e Capas Ocultas","nivel":"Básico","que":"Define la dimensión matemática y espacial de los vectores de representación de embeddings e capas ocultas que se propagan a través de los bloques jerárquicos del Transformer. Controla el grado de granularidad y la capacidad de la red para codificar características espaciales complejas del sistema.","val":"Enteros: [64, 128, 256, 512, 768]. Default en BERT = 768, en arquitecturas pequeñas de planta = 128 o 256.","alto":"(e.g. d_model >= 1024). Multiplica de forma drástica la cantidad de pesos libres de entrenamiento del modelo de forma redundante y provoca sobreajuste severo en validación cruzada. Además, incrementa de forma exponencial el costo computacional de cálculo de las matrices de atención de la GPU.","bajo":"(e.g. d_model <= 32). El modelo sufrirá de subajuste, siendo incapaz de capturar la riqueza semántica y las relaciones no lineales complejas entre los sensores continuos de la planta.","inter":"Debe ser estrictamente un múltiplo exacto de la cantidad de cabezales de atención paralelizados (nhead) para permitir la división matemática equitativa de las subdimensiones espaciales: dk = dmodel / nhead.","tun":"Búsqueda en cuadrícula en un rango acotado combinando la estructura y cantidad de neuronas. Un valor de 256 o 512 suele converger de forma óptima en series de tiempo de planta.","err":"Diseñar transformadores gigantescos de gran tamaño sobre datasets tabulares pequeños de planta, sobreajustando el modelo secuencial.","apl":"Procesamiento inteligente de miles de informes de averías de motores a gran escala para predecir modos de falla mecánicas. Configurar una dimensión de d_model=256 permite al Transformer capturar de forma exacta la riqueza semántica de las descripciones, optimizando el despacho de repuestos.","pri":"ESENCIAL","code":"d_model"},{"name":"Cantidad de Cabezales de Auto-Atención Paralelos","nivel":"Básico","que":"Define cuántos subprocesos independientes y paralelos de auto-atención (cabezales de atención) calcularán de forma paralela en la capa de atención. Esto permite a la red proyectar los vectores de consulta (Query), clave (Key) y valor (Value) en diferentes subespacios de representación, capturando de forma simultánea múltiples tipos de relaciones y dependencias espaciales lejanas de la secuencia de entrada.","val":"Enteros: [4, 8, 12, 16]. Default en BERT = 12, en arquitecturas pequeñas de planta = 8.","alto":"(e.g. nhead >= 32). Fragmenta la dimensión de los embeddings (d_model) en subespacios de dimensiones excesivamente pequeñas y estériles, impidiendo que cada cabezal individual recopile suficiente señal de generalización de la red profunda.","bajo":"(e.g. nhead = 1, que equivale a atención simple). El modelo perderá la capacidad de capturar de forma simultánea múltiples relaciones lógicas complementarias en la secuencia, reduciendo la flexibilidad no lineal de la capa de atención de la red profunda.","inter":"Enlazado estrictamente con d_model.","tun":"Usar de forma estándar nhead = 8 o 12 en la práctica industrial para garantizar la correcta reducción de varianza del conexionismo profundo de planta.","err":"Intentar sintonizar valores de nhead que no dividan de forma exacta a d_model, provocando errores lógicos de dimensiones matemáticas en las capas internas del Transformer.","apl":"Pronóstico a gran escala de la demanda de mineral de múltiples plantas de chancado en paralelo mediante redes Temporal Fusion Transformer (TFT). Un nhead=8 en la capa de auto-atención secuencial del Transformer permite capturar la ciclicidad compleja de la demanda de cemento de forma estable.","pri":"ESENCIAL","code":"nhead"},{"name":"Dimensión de la Capa de Proyección de Alimentación hacia Adelante","nivel":"Intermedio","que":"Define la cantidad de neuronas artificiales del bloque densamente conectado de alimentación hacia adelante (Position-Wise Feed-Forward Network) que procesa de forma individual cada una de las posiciones de la secuencia de salida de la auto-atención. Actúa para proyectar los vectores intermedios de atención en un espacio de mayor dimensión antes de la compresión final.","val":"Enteros: [128, 256, 512, 1024, 2048]. Default en scikit-learn/keras = 2048, en arquitecturas pequeñas de planta = 512 o 1024.","alto":"(e.g. dim_feedforward >= 4096). Provoca un sobreajuste del Transformer al sobreparametrizar la capa de alimentación hacia adelante, además de prolongar drásticamente el tiempo de entrenamiento de la GPU.","bajo":"(e.g. dim_feedforward <= 128). El modelo sufrirá de subajuste, siendo incapaz de realizar proyecciones complejas no lineales entre los sensores de planta.","inter":"Sintonizar un dim_feedforward adecuado equilibra la capacidad de regularización del Dropout en las capas internas del Transformer.","tun":"Por regla general, configurar un valor de dimfeedforward = 2 times dmodel o 4 times dmodel.","err":"Configurar valores elevados de dim_feedforward en combinación con tasas de aprendizaje elevadas, provocando un desbordamiento de la memoria RAM del servidor de producción y deteniendo el proceso de reentrenamiento automático.","apl":"Predicción de fallas operacionales por fatiga en revestimiento interno de horno en base a telemetría de sensores continuos térmicos de planta mediante redes Temporal Fusion Transformer (TFT). Un dim_feedforward=512 regulariza de forma robusta las predicciones diarias.","pri":"IMPORTANTE","code":"dim_feedforward o d_ff"},{"name":"Tasa de Dropout en Bloque Transformer","nivel":"Intermedio","que":"Define la fracción de neuronas ocultas de las capas de auto-atención y de alimentación hacia adelante (Position-Wise Feed-Forward Network) que se desactivarán de forma aleatoria en el proceso de entrenamiento secuencial para inyectar robustez y regularización estructural (stochastic regularization).","val":"Rango continuo de [0.1, 0.2, 0.3]. Default en keras = 0.1.","alto":"(e.g. dropout >= 0.4). Desactiva una fracción de neuronas excesiva, impidiendo que el modelo recurrente secuencial capte las dependencias temporales reales del sistema físico y conduciendo a subajuste del modelo.","bajo":"(e.g. dropout = 0.0). El modelo Transformer carecerá de regularización estocástica, permitiendo al conexionismo profundo sobreajustar en exceso el ruido local del dataset de planta.","inter":"Su sintonía de regularización es complementaria a la sintonía del número de capas del Transformer.","tun":"Configurar de forma estándar un valor de 0.1 o 0.2 para inyectar diversidad espacial y agilizar enormemente la generalización del conexionismo profundo.","err":"Ignorar este parámetro en transformadores entrenados sobre datos ruidosos de sensores de planta, permitiendo sobreajuste masivo invisible para el científico de datos.","apl":"Predicción de fallas mecánicas por fatiga en base a telemetría de sensores continuos de planta mediante redes Temporal Fusion Transformer (TFT). Un dropout=0.1 regulariza de forma robusta las predicciones diarias.","pri":"IMPORTANTE","code":"dropout"},{"name":"Profundidad del Encoder","nivel":"Intermedio","que":"Número de bloques TransformerEncoderLayer apilados. Más capas dan mayor capacidad de abstracción a mayor costo.","val":"[2, 3, 4, 6, 8, 12]. Default en torch.nn.Transformer: 6.","alto":"En datasets pequeños, más de 8 capas provocan sobreajuste y entrenamiento lentísimo.","bajo":"Una sola capa no abstrae lo suficiente para secuencias complejas.","inter":"Con d_model y nhead; más capas exigen más regularización.","tun":"Empezar con 2–4 capas para series temporales; reservar 6+ para NLP o datos muy grandes.","err":"Copiar las 12 capas de BERT para un problema tabular de pocos miles de filas.","apl":"Pronóstico multi-horizonte de variables de proceso con un Transformer temporal ligero de 2 a 4 capas.","pri":"ESENCIAL","code":"num_encoder_layers"},{"name":"Normalización Pre-LN vs Post-LN","nivel":"Avanzado","que":"False (default) aplica LayerNorm después de atención/FFN (Post-LN, del paper original); True la aplica antes (Pre-LN4), lo que estabiliza redes profundas.","val":"[True, False]. Default: False.","alto":"N/A (booleano).","bajo":"N/A.","inter":"Pre-LN permite tasas de aprendizaje más altas y converge mejor al añadir capas.","tun":"Usar norm_first=True con más de 4 capas; Post-LN para 1–3.","err":"Desconocer Pre-LN y sufrir inestabilidad al entrenar redes profundas.","apl":"Estabilizar el entrenamiento de un Transformer profundo aplicado a texto técnico o a series largas.","pri":"IMPORTANTE","code":"norm_first"}]},{"n":"A","t":"Hiperparámetros Transversales","hp":[{"name":"Weight Decay Desacoplado en AdamW","nivel":"Intermedio","que":"Regularización L2 aplicada directamente sobre los pesos, desacoplada del momento adaptativo. A diferencia de Adam clásico, AdamW la implementa correctamente.","val":"[0, 0.001, 0.01, 0.05, 0.1]. Default: 0.01.","alto":"Pesos demasiado restringidos (subajuste).","bajo":"Sin regularización; sobreajuste en redes profundas.","inter":"Reemplaza la penalización L2 manual en las capas; interactúa con la tasa de aprendizaje.","tun":"Empezar en 0.01 y preferir siempre AdamW sobre Adam (ver código).","err":"Confundir Adam + weight_decay con AdamW: son matemáticamente distintos.","apl":"Regularizar por defecto cualquier red profunda entrenada sobre series temporales, reduciendo el sobreajuste sin complejidad extra.","pri":"ESENCIAL","code":"weight_decay"},{"name":"Scheduler ReduceLROnPlateau","nivel":"Intermedio","que":"Reduce la tasa de aprendizaje (nueva = lr × factor) cuando la métrica de validación deja de mejorar durante patience épocas.","val":"factor=0.5, patience=[5, 10], min_lr=1e-7. Default: factor=0.1, patience=10.","alto":"Un factor cercano a 1 reduce la tasa de forma insignificante.","bajo":"Un factor muy pequeño colapsa la tasa a casi cero.","inter":"Con learning_rate inicial, la parada temprana y el número de épocas.","tun":"factor=0.5, patience=5–10 como punto de partida robusto (ver código).","err":"Poner factor>1.0, que hace EXPLOTAR la tasa en vez de reducirla.","apl":"Afinar automáticamente un modelo de pronóstico: cuando deja de mejorar, el scheduler baja la tasa para pulir los pesos finales.","pri":"ESENCIAL","code":""}]}];
/* ---------- tanda 4: hiperparámetros interactivos según la guía de Venegas (2026) ---------- */
function cart2(D,o,r){const imp=(a,n)=>{if(!n)return 0;const p=a/n;return o.crit==="ent"?-(p>0?p*Math.log2(p):0)-(p<1?(1-p)*Math.log2(1-p):0):2*p*(1-p)};
  const best=d=>{const n=d.length,ones=d.reduce((t,p)=>t+p[2],0);if(n<o.mss||ones===0||ones===n)return null;let b=null;const fs=o.mtry===1?[r()<0.5?0:1]:[0,1];
    for(const f of fs){const so=[...d].sort((x,y)=>x[f]-y[f]);let l1=0;for(let i=1;i<n;i++){l1+=so[i-1][2];if(so[i][f]===so[i-1][f]||i<o.msl||n-i<o.msl)continue;const gn=n*imp(ones,n)-i*imp(l1,i)-(n-i)*imp(ones-l1,n-i);if(gn>1e-9&&(!b||gn>b.gn))b={gn,f,t:(so[i][f]+so[i-1][f])/2}}}return b};
  const mk=(d,dep)=>({d,dep,v:d.reduce((t,p)=>t+p[2],0)*2>=d.length?1:0}),root=mk(D,0);let open=[root],leaves=1,maxd=0;
  for(;;){let pick=null;for(const nd of open){if(nd.b===undefined)nd.b=nd.dep<o.dp?best(nd.d):null;if(nd.b&&(!pick||nd.b.gn>pick.b.gn))pick=nd}
    if(!pick||leaves>=o.mln)break;const b=pick.b;pick.f=b.f;pick.t=b.t;pick.l=mk(pick.d.filter(p=>p[b.f]<b.t),pick.dep+1);pick.r=mk(pick.d.filter(p=>p[b.f]>=b.t),pick.dep+1);maxd=Math.max(maxd,pick.dep+1);open=open.filter(x=>x!==pick).concat([pick.l,pick.r]);leaves++}
  return {T:root,leaves,maxd}}
LAB.tree={a:[7],t:"Árbol de decisión: todos sus frenos",s:{dp:3,mss:2,msl:1,mln:40,crit:"gini",mf:2,nz:1},
 q:"Dos clases separadas por una frontera curva con ruido. El fondo muestra las regiones del árbol: cada división es un corte horizontal o vertical. Cada control es un freno distinto al crecimiento del árbol.",
 c:[["dp","max_depth: profundidad máxima",0,12,1],["mss","min_samples_split: casos mínimos para dividir un nodo",2,80,1],["msl","min_samples_leaf: casos mínimos en cada hoja",1,40,1],["mln","max_leaf_nodes: máximo de hojas (40 = sin límite)",2,40,1],["crit","criterion: medida de impureza","sel",[["gini","gini"],["ent","entropy"]]],["mf","max_features: variables candidatas por corte",1,2,1],["nz","Ruido en los datos",0,1.2,0.1]],
 p:["Sube max_depth a 12 dejando lo demás libre. Aparecen cajitas alrededor de puntos sueltos, el entrenamiento llega a 100 % y la brecha con validación pasa de 20 puntos.","Sin tocar la profundidad, sube min_samples_leaf a 10. Las cajitas desaparecen y la brecha se reduce a la mitad sin perder validación: es otro modo de frenar el mismo sobreajuste.","Vuelve min_samples_leaf a 1 y baja max_leaf_nodes a 6. El árbol crece primero por los cortes que más ganan y se detiene: queda pequeño y valida mejor que el árbol completo.","Cambia criterion entre gini y entropy. Los cortes casi no cambian: es el hiperparámetro que menos importa."],
 k:"Profundidad, casos mínimos por hoja, casos mínimos para dividir y máximo de hojas atacan el mismo problema desde ángulos distintos. En la práctica se ajusta uno o dos, no todos. min_samples_leaf suele ser el más estable porque garantiza que cada regla se apoye en suficientes casos.",
 draw(s){const {X,Y,g:g0}=axes(-3,3,-3,3,{nx:6,ny:6});let g=g0;const tr=wavy(0,140,s.nz),va=wavy(150,140,s.nz),R=cart2(tr,{dp:s.dp,mss:s.mss,msl:s.msl,mln:s.mln>=40?1e9:s.mln,crit:s.crit,mtry:s.mf},rng(5)),pr=(x,y)=>cpred(R.T,x,y);
  g+=cells(X,Y,-3,3,-3,3,(x,y)=>PAL[pr(x,y)])+tr.map(p=>dot(X(p[0]),Y(p[1]),"c"+PAL[p[2]],4)).join("");const at=accOf(tr,pr),av=accOf(va,pr);
  return {g,m:big(pc(av),"Exactitud en validación",av>0.82?"ok":"")+tbl([["Exactitud en entrenamiento",pc(at)],["Brecha entre ambas",f2((at-av)*100)+" puntos",at-av>0.1?"bad":"ok"],["Hojas del árbol",R.leaves],["Profundidad alcanzada",R.maxd]])}}};
LAB.rf={a:[7],t:"Random Forest: muchos árboles votando",s:{nt:1,mf:1,bs:1,msl:1,dp:10,nz:1},
 q:"Dos clases en forma de medias lunas con ruido. El fondo es la predicción por mayoría de un bosque de árboles. Cada árbol ve una remuestra distinta de los datos y, en cada corte, solo algunas variables.",
 c:[["nt","n_estimators: número de árboles",1,80,1],["mf","max_features: variables candidatas por corte",1,2,1],["bs","bootstrap: remuestrear los datos para cada árbol","chk"],["msl","min_samples_leaf: casos mínimos por hoja",1,25,1],["dp","max_depth de cada árbol",1,12,1],["nz","Ruido en los datos",0,1.2,0.1]],
 p:["Con 1 árbol profundo la frontera tiene cajitas caprichosas. Sube n_estimators a 20 y luego a 80: la frontera se suaviza y la validación sube unos puntos y se estabiliza.","Con 80 árboles compara la exactitud fuera de bolsa (OOB) con la de validación: quedan a pocos puntos una de otra. El OOB es una validación gratis, sin apartar datos.","Desactiva bootstrap y pon max_features en 2. Todos los árboles ven lo mismo y eligen igual: el bosque se comporta como un solo árbol y la ganancia desaparece.","Sube min_samples_leaf a 15. Cada árbol se vuelve más simple y el bosque pierde detalle: demasiado freno también cuesta."],
 k:"El bosque funciona porque sus árboles se equivocan de forma distinta. Bootstrap y max_features son los que crean esa diversidad; n_estimators solo necesita ser suficiente. Más árboles nunca sobreajusta, solo cuesta tiempo.",
 draw(s){const {X,Y,g:g0}=axes(-3,3,-2.5,2.5,{nx:6,ny:5});let g=g0;const tr=moons(0,140,0.2+0.3*s.nz),va=moons(150,200,0.2+0.3*s.nz),F=[],inb=[];
  for(let t=0;t<s.nt;t++){const r=rng(50+t),ix=tr.map((_,i)=>s.bs?Math.floor(r()*tr.length):i),set=new Set(ix);inb.push(set);F.push(cart2(ix.map(i=>tr[i]),{dp:s.dp,mss:2,msl:s.msl,mln:1e9,crit:"gini",mtry:s.mf},r).T)}
  const fp=(x,y)=>{let v=0;F.forEach(T=>v+=cpred(T,x,y));return v*2>=F.length?1:0};let oo=0,on=0;
  if(s.bs)tr.forEach((p,i)=>{let v=0,c=0;F.forEach((T,t)=>{if(!inb[t].has(i)){v+=cpred(T,p[0],p[1]);c++}});if(c){on++;if((v*2>=c?1:0)===p[2])oo++}});
  g+=cells(X,Y,-3,3,-2.5,2.5,(x,y)=>PAL[fp(x,y)])+tr.map(p=>dot(X(p[0]),Y(p[1]),"c"+PAL[p[2]],4)).join("");const av=accOf(va,fp),a1=accOf(va,(x,y)=>cpred(F[0],x,y));
  return {g,m:big(pc(av),"Exactitud del bosque en validación",av>0.84?"ok":"")+tbl([["Exactitud fuera de bolsa (oob_score)",s.bs&&on?pc(oo/on):"no disponible sin bootstrap"],["Exactitud de un solo árbol",pc(a1)],["Ganancia por promediar",f2((av-a1)*100)+" puntos",av>=a1?"ok":"bad"],["Exactitud en entrenamiento",pc(accOf(tr,fp))]])}}};
LAB.knn={a:[7],t:"k vecinos más cercanos",s:{k:1,w:"uni",p:"2",sp:1},
 q:"Dos clases de puntos. El color de fondo es lo que el modelo predeciría en cada lugar del plano: cada zona toma la clase que gana la votación entre sus k vecinos más cercanos.",
 c:[["k","n_neighbors: número de vecinos",1,41,2],["w","weights: cómo vota cada vecino","sel",[["uni","uniform (todos votan igual)"],["dis","distance (los cercanos pesan más)"]]],["p","p: tipo de distancia","sel",[["2","p = 2, euclídea"],["1","p = 1, Manhattan"]]],["sp","Solapamiento entre clases",0.4,1.8,0.1]],
 p:["Con k = 1 la frontera rodea cada punto suelto y el entrenamiento da 100 %. En validación es bastante menor.","Sube k hasta 15. La frontera se suaviza, el entrenamiento baja y la validación sube.","Con k = 15 cambia weights a distance. El entrenamiento vuelve a 100 % porque cada punto se vota a sí mismo con peso infinito; mira la validación, no el entrenamiento.","Cambia p entre 2 y 1. La frontera cambia levemente: con Manhattan tiende a seguir los ejes. En pocas dimensiones la diferencia es pequeña."],
 k:"k regula la flexibilidad: pequeño es varianza alta, grande es sesgo alto. weights y la métrica cambian qué significa ser vecino. Como todo depende de distancias, escalar las variables es obligatorio, y con muchas dimensiones las distancias dejan de distinguir.",
 draw(s){const {X,Y,g:g0}=axes(-4,4,-3.5,3.5,{nx:4,ny:4});let g=g0;const tr=blobs(s.sp,0,80),va=blobs(s.sp,90,100),ds=s.p==="1"?(a,b)=>Math.abs(a)+Math.abs(b):(a,b)=>Math.hypot(a,b);
  const pred=(x,y)=>{const d=tr.map(p=>[ds(p[0]-x,p[1]-y),p[2]]).sort((a,b)=>a[0]-b[0]);let v1=0,v0=0;for(let i=0;i<s.k;i++){const w=s.w==="dis"?1/(d[i][0]+1e-9):1;if(d[i][1])v1+=w;else v0+=w}return v1>v0?1:0};
  g+=cells(X,Y,-4,4,-3.5,3.5,(x,y)=>PAL[pred(x,y)])+tr.map(p=>dot(X(p[0]),Y(p[1]),"c"+PAL[p[2]])).join("");const at=accOf(tr,pred),av=accOf(va,pred);
  return {g,m:big(pc(av),"Exactitud en validación",av>0.85?"ok":"")+tbl([["Exactitud en entrenamiento",pc(at)],["Brecha entre ambas",f2((at-av)*100)+" puntos",at-av>0.08?"bad":"ok"]])}}};
LAB.km={a:[7],t:"k-means paso a paso",s:{k:3,it:0,ini:"rand",ni:1,sd:1},
 q:"Puntos sin etiqueta. Las cruces son los centroides; cada punto toma el color del centroide más cercano. Cada iteración reasigna los puntos y mueve cada centroide al promedio de los suyos.",
 c:[["k","n_clusters: número de grupos",1,6,1],["it","max_iter: iteraciones",0,12,1],["ini","init: cómo se eligen los centroides iniciales","sel",[["rand","random"],["kpp","k-means++"]]],["ni","n_init: reinicios (se queda con el mejor)",1,10,1],["sd","Semilla aleatoria",1,8,1]],
 p:["Con k = 3 e init random, sube las iteraciones de 0 a 6 y mira cómo los centroides viajan al centro de cada nube. La inercia baja en cada paso.","Pon k = 4 con 12 iteraciones y cambia la semilla. La inercia final no siempre es la misma: algunos inicios terminan en un agrupamiento peor, un mínimo local.","Sube n_init a 10. Ahora el resultado ya no depende de la semilla: se queda con el mejor de diez intentos.","Vuelve n_init a 1 y cambia init a k-means++. Con un solo intento ya parte de centroides bien repartidos."],
 k:"k-means converge siempre, pero a un mínimo local que depende del inicio. k-means++ reparte mejor los centroides iniciales y n_init repite el proceso para quedarse con la menor inercia. La inercia siempre baja al subir k, así que por sí sola no elige el número de grupos.",
 draw(s){const {X,Y,g:g0}=axes(-5,5,-4,4,{nx:5,ny:4});let g=g0;const C0=[[-2.4,1.6],[2.4,1.4],[0,-2]],P=[];for(let i=0;i<120;i++){const c=C0[i%3];P.push([c[0]+0.85*PZ[i],c[1]+0.85*PZ[300+i]])}
  const d2=(p,c)=>(p[0]-c[0])**2+(p[1]-c[1])**2;let bestR=null;
  for(let rn=0;rn<s.ni;rn++){const r=rng(900+s.sd*31+rn*7);let cen=[];
    if(s.ini==="rand")for(let j=0;j<s.k;j++){const p=P[Math.floor(r()*120)];cen.push([p[0],p[1]])}
    else{cen.push([...P[Math.floor(r()*120)]]);while(cen.length<s.k){const w=P.map(p=>Math.min(...cen.map(c=>d2(p,c)))),tot=w.reduce((a,b)=>a+b,0);let u=r()*tot,i=0;while(i<119&&(u-=w[i])>0)i++;cen.push([...P[i]])}}
    let as=[];const assign=()=>{as=P.map(p=>{let b=0,bd=1e9;cen.forEach((c,j)=>{const d=d2(p,c);if(d<bd){bd=d;b=j}});return b})};assign();
    for(let t=0;t<s.it;t++){cen=cen.map((c,j)=>{const m=P.filter((_,i)=>as[i]===j);return m.length?[mean(m.map(p=>p[0])),mean(m.map(p=>p[1]))]:c});assign()}
    const ine=P.reduce((t,p,i)=>t+d2(p,cen[as[i]]),0);if(!bestR||ine<bestR.ine)bestR={ine,cen,as}}
  P.forEach((p,i)=>{g+=dot(X(p[0]),Y(p[1]),"c"+PAL[bestR.as[i]],4)});bestR.cen.forEach((c,j)=>{g+='<path class="cen c'+PAL[j]+'" d="M'+(X(c[0])-9)+" "+(Y(c[1])-9)+"l18 18m0 -18l-18 18"+'"/>'});
  return {g,m:big(f2(bestR.ine),"Inercia (suma de distancias al cuadrado)")+tbl([["Grupos",s.k],["Tamaño de cada grupo",bestR.cen.map((_,j)=>bestR.as.filter(a=>a===j).length).join(" · ")],["Intentos realizados",s.ni]])}}};
LAB.mlp={a:[8],t:"Red neuronal: arquitectura, activación y entrenamiento",s:{ds:"xor",h:4,ep:400,lr:0.5,act:"tanh",al:-5,opt:"sgd"},
 q:"Dos clases que ninguna recta separa. El fondo es lo que predice una red con una capa oculta, entrenada con retropropagación. La curva pequeña es la pérdida a lo largo del entrenamiento.",
 c:[["ds","Datos","sel",[["xor","XOR (cuatro esquinas)"],["cir","Círculo dentro de anillo"]]],["h","hidden_layer_sizes: neuronas en la capa oculta",1,12,1],["act","activation","sel",[["tanh","tanh"],["relu","relu"],["sig","logistic (sigmoide)"]]],["opt","solver","sel",[["sgd","sgd"],["adam","adam"]]],["lr","learning_rate_init",0.005,1.5,0.005],["al","alpha: penalización L2 (log₁₀)",-5,0,0.25],["ep","max_iter: pasos de entrenamiento",0,800,20]],
 p:["Con 4 neuronas y tanh, mueve max_iter de 0 a 800: la frontera se dobla hasta separar las clases mientras la pérdida baja.","Pon 1 neurona oculta. Solo puede trazar una recta y no resuelve XOR por más que entrenes. Con 2 ya puede.","Cambia la activación a logistic con solver sgd. Aprende algo más despacio (compara la pérdida): su derivada es pequeña. Cambia el solver a adam y baja learning_rate_init a 0,05: converge sin necesidad de afinar tanto el paso.","Sube alpha hasta −1. Los pesos se encogen, la frontera se alisa y, si te pasas, la red deja de aprender."],
 k:"La arquitectura fija qué fronteras puede representar la red; la tasa de aprendizaje y el optimizador, si logra encontrarlas; alpha, cuánto se le permite complicarse. La tasa de aprendizaje es el hiperparámetro más sensible: se busca en escala logarítmica.",
 draw(s){const {X,Y,g:g0}=axes(-2,2,-2,2,{nx:4,ny:4});let g=g0;const D=[];for(let i=0;i<120;i++){if(s.ds==="xor"){const a=i%2?1:-1,b=(i>>1)%2?1:-1;D.push([a+0.32*PZ[i],b+0.32*PZ[200+i],a*b>0?1:0])}else{const in_=i%2,r=in_?0.45*PU[i]:1.2+0.4*PU[i],t=6.2832*PU[300+i];D.push([r*Math.cos(t),r*Math.sin(t),in_])}}
  const H=s.h,nP=4*H+1,th=[];for(let j=0;j<H;j++){th[j]=1.2*PZ[800+j];th[H+j]=1.2*PZ[820+j];th[2*H+j]=0.3*PZ[840+j];th[3*H+j]=0.8*PZ[860+j]}th[4*H]=0;
  const af=z=>s.act==="tanh"?Math.tanh(z):s.act==="relu"?Math.max(0,z):1/(1+Math.exp(-z)),ad=h=>s.act==="tanh"?1-h*h:s.act==="relu"?(h>0?1:0):h*(1-h);
  const fw=(x,y)=>{const h=[];let o=th[4*H];for(let j=0;j<H;j++){h[j]=af(th[j]*x+th[H+j]*y+th[2*H+j]);o+=th[3*H+j]*h[j]}return [1/(1+Math.exp(-o)),h]},loss=()=>mean(D.map(p=>{const q=Math.min(1-1e-9,Math.max(1e-9,fw(p[0],p[1])[0]));return -(p[2]?Math.log(q):Math.log(1-q))})),hist=[loss()],al=Math.pow(10,s.al),m=Array(nP).fill(0),v=Array(nP).fill(0);
  for(let e=1;e<=s.ep;e++){const gr=Array(nP).fill(0);D.forEach(p=>{const [q,h]=fw(p[0],p[1]),d=(q-p[2])/D.length;gr[4*H]+=d;for(let j=0;j<H;j++){gr[3*H+j]+=d*h[j];const b=d*th[3*H+j]*ad(h[j]);gr[j]+=b*p[0];gr[H+j]+=b*p[1];gr[2*H+j]+=b}});
   for(let i=0;i<nP;i++){const gi=gr[i]+(i<2*H||(i>=3*H&&i<4*H)?al*th[i]:0);if(s.opt==="adam"){m[i]=0.9*m[i]+0.1*gi;v[i]=0.999*v[i]+0.001*gi*gi;th[i]-=s.lr*(m[i]/(1-Math.pow(0.9,e)))/(Math.sqrt(v[i]/(1-Math.pow(0.999,e)))+1e-8)}else th[i]-=s.lr*gi;if(!isFinite(th[i]))th[i]=0}if(e%20===0)hist.push(loss())}
  g+=cells(X,Y,-2,2,-2,2,(x,y)=>PAL[fw(x,y)[0]>0.5?1:0])+D.map(p=>dot(X(p[0]),Y(p[1]),"c"+PAL[p[2]],4)).join("");const top=Math.max(...hist.filter(isFinite),0.75);
  g+='<rect class="inset" x="388" y="38" width="134" height="66" rx="8"/>'+txt(396,54,"pérdida")+'<path class="ln kk" d="'+hist.map((u,i)=>(i?"L":"M")+(396+118*i/Math.max(1,hist.length-1)).toFixed(1)+" "+(98-36*Math.min(u,top)/top).toFixed(1)).join("")+'"/>';
  const ac=accOf(D,(x,y)=>fw(x,y)[0]>0.5?1:0),ls=loss();
  return {g,m:big(pc(ac),"Exactitud",ac>0.95?"ok":ac<0.7?"bad":"")+tbl([["Pérdida (entropía cruzada)",f2(ls)],["Pérdida antes de entrenar",f2(hist[0])],["Parámetros de la red",nP],["Tamaño medio de los pesos",f2(mean(th.map(Math.abs)))]])}}};
LAB.reg={a:[7,6],t:"Ridge, Lasso y Elastic Net",s:{pen:"lasso",lam:-1.5,l1:0.5,fi:1,mi:200},
 q:"Un modelo lineal con ocho variables estandarizadas. Solo dos influyen de verdad en la respuesta (x1 y x4, en naranja); x2 es casi una copia de x1 y las demás son ruido. Cada barra es el coeficiente que estima el modelo.",
 c:[["pen","Penalización","sel",[["ridge","Ridge (L2)"],["lasso","Lasso (L1)"],["en","Elastic Net (mezcla)"]]],["lam","alpha: fuerza de la penalización (log₁₀)",-3,1,0.05],["l1","l1_ratio: proporción L1 en Elastic Net",0.05,0.95,0.05],["fi","fit_intercept: ajustar el intercepto","chk"],["mi","max_iter: iteraciones del solver",1,200,1]],
 p:["Con Lasso, sube alpha poco a poco. Los coeficientes de las variables de ruido caen exactamente a cero uno tras otro: Lasso selecciona variables.","Cambia a Ridge con la misma fuerza. Todos los coeficientes se encogen, pero ninguno llega a cero. Mira x1 y x2: Ridge reparte el peso entre las dos; Lasso tiende a quedarse con una.","Desactiva fit_intercept. La respuesta no está centrada, así que el modelo obligado a pasar por el origen dispara su error de prueba.","Vuelve a activarlo y baja max_iter a 1 o 2. El solver se detiene antes de cumplir su tolerancia y aparece el aviso de convergencia: los coeficientes todavía se estaban moviendo."],
 k:"alpha decide cuánto peso se da a la simplicidad frente al ajuste. L2 encoge de forma pareja y estabiliza ante variables correlacionadas; L1 produce ceros exactos; l1_ratio mezcla ambas. Siempre se estandariza antes, y un aviso de convergencia nunca se ignora.",
 draw(s){const n=60,p=8,mk=(o,m)=>{const Xm=[],y=[];for(let i=0;i<m;i++){const r=[];for(let j=0;j<p;j++)r.push(PZ[(o+i*p+j)%900]);r[1]=0.92*r[0]+0.39*r[1];Xm.push(r);y.push(4+3*r[0]+1.5*r[3]+PZ[(o+777+i)%900])}return [Xm,y]},[Xm,y]=mk(0,n),[Xt,yt]=mk(480,50);
  const lam=Math.pow(10,s.lam),a=s.pen==="ridge"?0:s.pen==="lasso"?1:s.l1,b=Array(p).fill(0),nrm=Array(p).fill(0);let b0=0,mv=0;for(let j=0;j<p;j++)for(let i=0;i<n;i++)nrm[j]+=Xm[i][j]**2/n;
  for(let sw=0;sw<s.mi;sw++){mv=0;if(s.fi)b0=mean(Xm.map((r,i)=>y[i]-r.reduce((t,v,k)=>t+v*b[k],0)));for(let j=0;j<p;j++){let rho=0;for(let i=0;i<n;i++){let pr=b0;for(let k=0;k<p;k++)if(k!==j)pr+=Xm[i][k]*b[k];rho+=Xm[i][j]*(y[i]-pr)/n}const nb=Math.sign(rho)*Math.max(0,Math.abs(rho)-lam*a)/(nrm[j]+lam*(1-a));mv=Math.max(mv,Math.abs(nb-b[j]));b[j]=nb}}
  const {X,Y,g:g0}=axes(0,8,-1,4,{nx:8,ny:5,yl:"Coeficiente estimado"});let g=g0+seg(50,Y(0),530,Y(0),"ax");
  b.forEach((v,j)=>{const yv=Y(Math.max(-1,Math.min(4,v)));g+='<rect class="bar '+(j===0||j===3?"k2":"k1")+'" x="'+(X(j)+12)+'" y="'+Math.min(yv,Y(0))+'" width="36" height="'+Math.max(1.5,Math.abs(Y(0)-yv))+'"/>'+txt(X(j)+30,405,"x"+(j+1),"middle")+txt(X(j)+30,Math.min(yv,Y(0))-6,f2(v),"middle")});
  g+=seg(X(0)+8,Y(3),X(0)+52,Y(3),"mean")+seg(X(3)+8,Y(1.5),X(3)+52,Y(1.5),"mean");const rm=Math.sqrt(mean(Xt.map((r,i)=>(yt[i]-b0-r.reduce((t,v,j)=>t+v*b[j],0))**2))),z=b.filter(v=>v===0).length,cv=mv<1e-4;
  return {g,m:big(z+" de 8","Coeficientes exactamente en cero")+tbl([["Error en datos de prueba (RMSE)",f2(rm),rm<1.25?"ok":rm>2?"bad":""],["Intercepto estimado (real: 4,00)",f2(b0)],["Coeficiente de x1 (real: 3,00)",f2(b[0])],["Coeficiente de x2, la copia de x1 (real: 0,00)",f2(b[1])],["Convergencia del solver",cv?"Convergió":"No convergió (ConvergenceWarning)",cv?"ok":"bad"]])}}};
LAB.svmk={a:[7],t:"SVM con kernel: kernel, gamma y C",s:{kn:"rbf",g:0,C:0,nz:0.25},
 q:"Dos clases en forma de medias lunas, que ninguna recta separa. El fondo es la predicción de una máquina de vectores de soporte con el kernel elegido (aquí en su variante de mínimos cuadrados, que se resuelve en un paso y reacciona igual a kernel, gamma y C).",
 c:[["kn","kernel","sel",[["rbf","rbf (gaussiano)"],["poly","poly (polinómico de grado 3)"],["lin","linear"]]],["g","gamma (log₁₀): alcance de cada punto",-1.5,2,0.1],["C","C (log₁₀): penalización de errores",-2,3,0.1],["nz","Ruido en los datos",0.05,0.5,0.05]],
 p:["Con kernel linear la frontera es una recta y no puede seguir las lunas. Cambia a poly y luego a rbf: la frontera se curva.","Con rbf, baja gamma a −1,5: cada punto influye muy lejos y la frontera es casi una recta. Súbelo a 2: se forman islas alrededor de los puntos, el entrenamiento llega a 100 % y la validación cae.","Con gamma en 0,5, mueve C de −2 a 3. C bajo suaviza la frontera; C alto la obliga a respetar cada punto."],
 k:"El kernel define qué formas puede tomar la frontera. En rbf, gamma fija el radio de influencia de cada punto y C cuánto se castigan los errores: los dos regulan la flexibilidad y se ajustan juntos en una rejilla logarítmica. Exige escalar las variables.",
 draw(s){const {X,Y,g:g0}=axes(-3,3,-2.5,2.5,{nx:6,ny:5});let g=g0;const tr=moons(0,90,s.nz),va=moons(100,90,s.nz),n=tr.length,ga=Math.pow(10,s.g),K=s.kn==="rbf"?(a,b)=>Math.exp(-ga*((a[0]-b[0])**2+(a[1]-b[1])**2))+1:s.kn==="poly"?(a,b)=>Math.pow(ga*(a[0]*b[0]+a[1]*b[1])+1,3):(a,b)=>a[0]*b[0]+a[1]*b[1]+1;
  const A=tr.map((p,i)=>tr.map((q,j)=>K(p,q)+(i===j?1/Math.pow(10,s.C):0))),al=solve(A,tr.map(p=>p[2]?1:-1)),fp=(x,y)=>{let v=0;for(let i=0;i<n;i++)v+=al[i]*K(tr[i],[x,y]);return v>0?1:0};
  g+=cells(X,Y,-3,3,-2.5,2.5,(x,y)=>PAL[fp(x,y)])+tr.map(p=>dot(X(p[0]),Y(p[1]),"c"+PAL[p[2]],4)).join("");const at=accOf(tr,fp),av=accOf(va,fp);
  return {g,m:big(pc(av),"Exactitud en validación",av>0.9?"ok":av<0.8?"bad":"")+tbl([["Exactitud en entrenamiento",pc(at)],["Brecha entre ambas",f2((at-av)*100)+" puntos",at-av>0.08?"bad":"ok"],["gamma",s.kn==="lin"?"no se usa":ex(ga)],["C",ex(Math.pow(10,s.C))]])}}};
LAB.conv={a:[8],t:"Convolución: tamaño de filtro, paso, relleno y agrupamiento",s:{k:"vert",ks:"3",st:1,pad:"valid",dil:1,pool:1,re:0},
 q:"A la izquierda, una imagen de 14 × 14 píxeles con un cuadrado y una diagonal. A la derecha, el mapa de características que produce el filtro al deslizarse sobre ella: naranja es respuesta positiva, azul negativa. La fórmula de abajo calcula el tamaño de salida.",
 c:[["k","Filtro","sel",[["vert","Bordes verticales"],["horz","Bordes horizontales"],["blur","Desenfoque (promedio)"],["sharp","Realce"]]],["ks","kernel_size","sel",[["3","3 × 3"],["5","5 × 5"]]],["st","strides: paso del filtro",1,3,1],["pad","padding","sel",[["valid","valid (sin relleno)"],["same","same (relleno con ceros)"]]],["dil","dilation_rate",1,2,1],["pool","pool_size del agrupamiento máximo",1,3,1],["re","Aplicar ReLU a la salida","chk"]],
 p:["Con kernel 3 × 3, paso 1 y padding valid, la salida es de 12 × 12: se pierde un borde. Cambia a same: vuelve a 14 × 14.","Sube strides a 2 y luego a 3. La salida se reduce a la mitad y al tercio: el paso es una forma de bajar resolución.","Vuelve a paso 1 y sube pool_size a 2. También reduce a la mitad, pero quedándose con la respuesta más fuerte de cada bloque.","Sube dilation_rate a 2 con kernel 3 × 3. El filtro abarca lo mismo que uno de 5 × 5 con solo 9 pesos."],
 k:"El tamaño de salida de una convolución es ⌊(n + 2p − d·(k − 1) − 1) / s⌋ + 1. kernel_size y dilation fijan cuánto contexto ve cada neurona; strides y pool_size, cuánta resolución se descarta; padding, si se conservan los bordes. El número de filtros decide cuántos patrones distintos se detectan.",
 draw(s){const N=14,I=Array.from({length:N},(_,r)=>Array.from({length:N},(_,c)=>(r>=3&&r<=8&&c>=2&&c<=7)||(Math.abs(r-c+3)<1&&r<11&&c>7)||(r+c===19&&r>7)?1:0)),k=+s.ks,row=k===3?[-1,0,1]:[-1,-1,0,1,1];
  const K=Array.from({length:k},(_,i)=>Array.from({length:k},(_,j)=>s.k==="vert"?row[j]:s.k==="horz"?row[i]:s.k==="blur"?1/(k*k):(i===(k-1)/2&&j===(k-1)/2?(k===3?5:2):(k===3?((i===1||j===1)?-1:0):-1/24)))),ext=s.dil*(k-1),pd=s.pad==="same"?Math.floor(ext/2):0,at=(r,c)=>r<0||c<0||r>=N||c>=N?0:I[r][c];let O=[];
  for(let r=-pd;r+ext<N+pd;r+=s.st){const rw=[];for(let c=-pd;c+ext<N+pd;c+=s.st){let v=0;for(let i=0;i<k;i++)for(let j=0;j<k;j++)v+=K[i][j]*at(r+i*s.dil,c+j*s.dil);rw.push(s.re?Math.max(0,v):v)}O.push(rw)}
  const conv=O.length;if(s.pool>1){const Q=[];for(let r=0;r+s.pool<=O.length;r+=s.pool){const rw=[];for(let c=0;c+s.pool<=O.length;c+=s.pool){let v=-1e9;for(let i=0;i<s.pool;i++)for(let j=0;j<s.pool;j++)v=Math.max(v,O[r+i][c+j]);rw.push(v)}Q.push(rw)}O=Q}
  let g=txt(40,36,"Imagen de entrada (14 × 14)")+txt(310,36,"Mapa de características ("+O.length+" × "+O.length+")");const cs=15;
  I.forEach((rw,r)=>rw.forEach((v,c)=>{g+='<rect class="px" x="'+(40+c*cs)+'" y="'+(50+r*cs)+'" width="'+(cs-1)+'" height="'+(cs-1)+'" fill-opacity="'+(v?0.85:0.08)+'"/>'}));
  const fl=O.flat(),mx=Math.max(1e-9,...fl.map(Math.abs)),os=210/Math.max(1,O.length);O.forEach((rw,r)=>rw.forEach((v,c)=>{g+='<rect class="cell k'+(v>=0?"B":"A")+'" x="'+(310+c*os).toFixed(1)+'" y="'+(50+r*os).toFixed(1)+'" width="'+(os-1).toFixed(1)+'" height="'+(os-1).toFixed(1)+'" style="fill-opacity:'+(0.06+0.9*Math.abs(v)/mx).toFixed(2)+'"/>'}));
  g+=txt(40,290,"Filtro "+k+" × "+k+(s.dil>1?" dilatado":""));const kc=k===3?40:26;K.forEach((rw,i)=>rw.forEach((v,j)=>{g+='<rect class="inset" x="'+(40+j*(kc+2))+'" y="'+(300+i*22)+'" width="'+kc+'" height="20" rx="4"/>'+txt(40+j*(kc+2)+kc/2,314+i*22,(Math.round(v*100)/100).toString().replace(".",","),"middle")}));
  return {g,m:big(O.length+" × "+O.length,"Tamaño del mapa de salida")+tbl([["Salida de la convolución","⌊(14 + "+2*pd+" − "+ext+" − 1) / "+s.st+"⌋ + 1 = "+conv],["Tras el agrupamiento",s.pool>1?"⌊"+conv+" / "+s.pool+"⌋ = "+O.length:"sin agrupamiento"],["Campo que abarca el filtro",(ext+1)+" × "+(ext+1)+" píxeles"],["Pesos del filtro",k*k+" más un sesgo"],["Posiciones con respuesta positiva",fl.filter(v=>v>1e-9).length+" de "+fl.length]])}}};
LAB.nb={a:[7],t:"Naive Bayes y el supuesto de independencia",s:{r:0,sp:0.8,vs:-9},
 q:"Dos clases y las regiones que predice un Naive Bayes gaussiano. Este modelo supone que, dentro de cada clase, las variables no están correlacionadas. Tú controlas cuánto se incumple ese supuesto.",
 c:[["r","Correlación dentro de cada clase (de signo opuesto en cada una)",0,0.95,0.05],["sp","Separación entre las clases",0.3,1.6,0.05],["vs","var_smoothing (log₁₀)",-9,1,0.5]],
 p:["Con correlación 0 el supuesto se cumple y Naive Bayes rinde igual que un modelo que sí estima la correlación.","Sube la correlación a 0,90. Cada nube se alarga en una diagonal distinta y forman una X. El modelo con covarianza completa aprovecha esa forma; Naive Bayes no la ve.","Sube var_smoothing hasta 1. Las varianzas de las dos clases se inflan hasta parecerse y la frontera se vuelve una recta: suaviza, y si te pasas borra información."],
 k:"Naive Bayes multiplica las probabilidades de cada variable por separado. Es rápido y funciona con pocos datos, pero cuando las variables están correlacionadas cuenta la misma evidencia dos veces. var_smoothing es un estabilizador numérico; en las variantes para conteos, el parámetro equivalente es el suavizado de Laplace.",
 draw(s){const {X,Y,g:g0}=axes(-4,4,-3.5,3.5,{nx:4,ny:4});let g=g0;const mk=(o,n)=>{const d=[];for(let i=0;i<n;i++){const c=i%2,a=PZ[o+i],b=PZ[o+300+i],sg=c?1:-1,v=sg*s.r*a+Math.sqrt(1-s.r*s.r)*b;d.push([a+sg*s.sp*0.5,v,c])}return d},tr=mk(0,120),va=mk(130,160);
  const st=c=>{const d=tr.filter(p=>p[2]===c),mx=mean(d.map(p=>p[0])),my=mean(d.map(p=>p[1]));let a=0,b=0,cv=0;d.forEach(p=>{a+=(p[0]-mx)**2;b+=(p[1]-my)**2;cv+=(p[0]-mx)*(p[1]-my)});return [mx,my,a/d.length,b/d.length,cv/d.length]},S0=st(0),S1=st(1),e=Math.pow(10,s.vs)*Math.max(sd(tr.map(p=>p[0]))**2,sd(tr.map(p=>p[1]))**2);
  const lnb=(q,x,y)=>-0.5*Math.log((q[2]+e)*(q[3]+e))-0.5*((x-q[0])**2/(q[2]+e)+(y-q[1])**2/(q[3]+e)),lfull=(q,x,y)=>{const det=q[2]*q[3]-q[4]*q[4],dx=x-q[0],dy=y-q[1];return -0.5*Math.log(det)-0.5*(q[3]*dx*dx-2*q[4]*dx*dy+q[2]*dy*dy)/det},fn=(x,y)=>lnb(S1,x,y)>lnb(S0,x,y)?1:0,ff=(x,y)=>lfull(S1,x,y)>lfull(S0,x,y)?1:0;
  g+=cells(X,Y,-4,4,-3.5,3.5,(x,y)=>PAL[fn(x,y)])+tr.map(p=>dot(X(p[0]),Y(p[1]),"c"+PAL[p[2]],4)).join("");const an=accOf(va,fn),af=accOf(va,ff);
  return {g,m:big(pc(an),"Exactitud de Naive Bayes en validación",af-an>0.04?"bad":"ok")+tbl([["Exactitud con covarianza completa",pc(af)],["Costo de suponer independencia",f2((af-an)*100)+" puntos",af-an>0.04?"bad":"ok"],["Varianza añadida por var_smoothing",ex(e)]])}}};
/* motor de boosting en una variable: sirve a Gradient Boosting, XGBoost y LightGBM */
function boost1d(o){const f=x=>Math.sin(x)+0.3*x,mk=(off,n)=>{const d=[];for(let i=0;i<n;i++){const x=10*PU[(off+i)%900];d.push([x,f(x)+o.nz*PZ[(off+i)%900]])}return d.sort((a,b)=>a[0]-b[0])},tr=mk(10,70),va=mk(300,60),te=mk(400,120),n=tr.length,f0=mean(tr.map(p=>p[1])),res=tr.map(p=>p[1]-f0),trees=[],r=rng(77);
  const split=(ix,a,b)=>{let G=0;for(let i=a;i<b;i++)G+=res[ix[i]];const H=b-a;let gl=0,best=null;for(let i=a+1;i<b;i++){gl+=res[ix[i-1]];const hl=i-a,hr=b-i;if(tr[ix[i]][0]===tr[ix[i-1]][0]||hl<o.mcw||hr<o.mcw)continue;const gn=0.5*(gl*gl/(hl+o.lam)+(G-gl)**2/(hr+o.lam)-G*G/(H+o.lam))-o.gam;if(gn>1e-9&&(!best||gn>best.gn))best={gn,i}}return best},leafw=(ix,a,b)=>{let G=0;for(let i=a;i<b;i++)G+=res[ix[i]];return G/(b-a+o.lam)};
  const pv=x=>{let v=f0;for(const T of trees){let w=T[T.length-1][1];for(const sgm of T)if(x<sgm[0]){w=sgm[1];break}v+=o.lr*w}return v},rm=d=>Math.sqrt(mean(d.map(p=>(p[1]-pv(p[0]))**2))),ct=[],cv=[];let bestV=1e9,bestM=0,used=o.n,nl=0;
  for(let m=0;m<o.n;m++){const ix=[];for(let i=0;i<n;i++)if(o.sub>=1||r()<o.sub)ix.push(i);if(ix.length<2)continue;let L=[{a:0,b:ix.length,d:0}];
    for(;;){let pick=null;for(const lf of L){if(lf.s===undefined)lf.s=lf.d<o.dp?split(ix,lf.a,lf.b):null;if(lf.s&&(!pick||lf.s.gn>pick.s.gn))pick=lf}if(!pick||L.length>=o.leaves)break;L=L.filter(x=>x!==pick).concat([{a:pick.a,b:pick.s.i,d:pick.d+1},{a:pick.s.i,b:pick.b,d:pick.d+1}])}
    L.sort((x,y)=>x.a-y.a);const T=L.map((lf,k)=>[k<L.length-1?(tr[ix[lf.b-1]][0]+tr[ix[lf.b]][0])/2:1e9,leafw(ix,lf.a,lf.b)]);trees.push(T);nl+=L.length;
    for(let i=0;i<n;i++){let w=T[T.length-1][1];for(const sgm of T)if(tr[i][0]<sgm[0]){w=sgm[1];break}res[i]-=o.lr*w}
    if(m<60||m%5===0||o.es){const a=Math.sqrt(mean(res.map(v=>v*v))),b=rm(va);ct.push(a);cv.push(b);if(b<bestV-1e-6){bestV=b;bestM=m}else if(o.es&&m-bestM>=10){used=m+1;break}}}
  return {f,tr,te,pv,rmTr:Math.sqrt(mean(res.map(v=>v*v))),rmTe:rm(te),ct,cv,used:Math.min(used,trees.length),nl:trees.length?nl/trees.length:0}}
function boostDraw(o,extra){const R=boost1d(o),{X,Y,g:g0}=axes(0,10,-2,5,{nx:5,ny:7,xl:"x",yl:"y"});let g=g0;const tc=[],fc=[];for(let i=0;i<=400;i++){const x=i/40;tc.push([X(x),Y(R.f(x))]);fc.push([X(x),Y(R.pv(x))])}
  g+=pth(tc,"k3 dsh")+pth(fc,"kk thin")+R.tr.map(p=>dot(X(p[0]),Y(p[1]),"",4)).join("");const top=Math.max(...R.ct,...R.cv,0.5),ln=(a,cls)=>'<path class="ln thin '+cls+'" d="'+a.map((u,i)=>(i?"L":"M")+(64+150*i/Math.max(1,a.length-1)).toFixed(1)+" "+(104-58*Math.min(u,top)/top).toFixed(1)).join("")+'"/>';
  g+='<rect class="inset" x="56" y="36" width="166" height="76" rx="8"/>'+txt(64,50,"error: entrenamiento (azul) y validación (naranja)")+ln(R.ct,"k1")+ln(R.cv,"k2");
  return {g,m:big(f2(R.rmTe),"Error en datos de prueba (RMSE)",R.rmTe<o.nz*1.25?"ok":R.rmTe>o.nz*1.6?"bad":"")+tbl([["Error en entrenamiento (RMSE)",f2(R.rmTr)],["Ruido de los datos (lo mínimo alcanzable)",f2(o.nz)],["Árboles realmente usados",R.used],["Hojas promedio por árbol",f2(R.nl)],["Diagnóstico",R.rmTr>o.nz*1.5?"Subajuste":R.rmTe>R.rmTr*1.6?"Sobreajuste: persigue el ruido":"Equilibrado"]].concat(extra||[]))}}
LAB.gb={a:[7],t:"Gradient Boosting: corregir errores paso a paso",s:{n:20,lr:0.3,dp:1,sub:1,es:0,nz:0.4},
 q:"Puntos azules: datos de entrenamiento. Línea punteada: la función real. Línea negra: la predicción, que es la suma de muchos árboles pequeños; cada árbol nuevo se ajusta a los errores que dejaron los anteriores. El recuadro muestra el error de entrenamiento y de validación árbol tras árbol.",
 c:[["n","n_estimators: número de árboles",1,300,1],["lr","learning_rate",0.02,1,0.02],["dp","max_depth de cada árbol",1,4,1],["sub","subsample: fracción de filas por árbol",0.3,1,0.05],["es","Parada temprana (n_iter_no_change = 10)","chk"],["nz","Ruido en los datos",0.1,1,0.05]],
 p:["Con learning_rate 0,30 y profundidad 1, sube los árboles de 1 a 20 y luego a 80. La escalera se va pegando a la curva real.","Pon learning_rate en 1,00 con 300 árboles y profundidad 3. En el recuadro, el error de entrenamiento se hunde mientras el de validación sube: sobreajuste.","Sin cambiar nada más, activa la parada temprana. El entrenamiento se detiene cuando la validación deja de mejorar y usa muchos menos árboles.","Desactívala, baja learning_rate a 0,05 y subsample a 0,6. Aprende más despacio y con algo de azar, y el error de prueba mejora: es la receta habitual."],
 k:"Boosting reduce el sesgo paso a paso, así que sí puede sobreajustar. learning_rate y n_estimators se compensan: tasa baja con muchos árboles generaliza mejor. La parada temprana elige el número de árboles sola, y subsample añade azar que regulariza.",
 draw(s){return boostDraw({n:s.n,lr:s.lr,dp:s.dp,sub:s.sub,es:s.es,nz:s.nz,lam:0,gam:0,mcw:1,leaves:1e9})}};
LAB.xgb={a:[7],t:"XGBoost: regularización dentro de cada árbol",s:{n:150,lr:0.3,dp:4,lam:1,gam:0,mcw:1,sub:1,nz:0.4},
 q:"El mismo problema del experimento de Gradient Boosting, ahora con los frenos propios de XGBoost. Cada hoja vale G / (H + lambda) y un corte solo se acepta si su ganancia supera a gamma.",
 c:[["n","n_estimators",1,300,1],["lr","learning_rate (eta)",0.02,1,0.02],["dp","max_depth",1,6,1],["lam","reg_lambda: penalización L2 de las hojas",0,30,0.5],["gam","gamma: ganancia mínima para dividir",0,3,0.05],["mcw","min_child_weight: peso mínimo en cada hijo",1,20,1],["sub","subsample",0.3,1,0.05],["nz","Ruido en los datos",0.1,1,0.05]],
 p:["Con 150 árboles de profundidad 4 y sin frenos, el modelo persigue el ruido: mira el error de validación en el recuadro.","Sube min_child_weight a 8. Ningún corte puede dejar menos de 8 casos en un hijo: las hojas diminutas desaparecen y la curva se alisa.","Vuelve a 1 y sube gamma poco a poco hasta 1. Los cortes que ganan poco se rechazan y las hojas por árbol caen; si te pasas, el modelo casi deja de dividir.","Vuelve gamma a 0 y sube reg_lambda a 20. Los cortes siguen ahí, pero cada hoja aporta menos: encoge en vez de podar."],
 k:"XGBoost añade a la pérdida un castigo por número de hojas (gamma) y por tamaño de sus valores (reg_lambda), y exige un peso mínimo por hijo (min_child_weight). Son tres formas de frenar: gamma y min_child_weight podan cortes; lambda encoge valores. Se combinan con learning_rate bajo y parada temprana.",
 draw(s){return boostDraw({n:s.n,lr:s.lr,dp:s.dp,sub:s.sub,es:0,nz:s.nz,lam:s.lam,gam:s.gam,mcw:s.mcw,leaves:1e9})}};
LAB.lgb={a:[7],t:"LightGBM: crecimiento por hojas",s:{n:150,lr:0.1,nl:8,mdl:5,bf:1,nz:0.4},
 q:"El mismo problema, con árboles que crecen como en LightGBM: en lugar de completar nivel por nivel, en cada paso se divide la hoja que más reduce el error, hasta llegar a num_leaves.",
 c:[["n","n_estimators",1,300,1],["lr","learning_rate",0.02,1,0.02],["nl","num_leaves: hojas máximas por árbol",2,31,1],["mdl","min_data_in_leaf: casos mínimos por hoja",1,25,1],["bf","bagging_fraction: fracción de filas por árbol",0.3,1,0.05],["nz","Ruido en los datos",0.1,1,0.05]],
 p:["Con num_leaves en 2 cada árbol es un solo corte: aprende despacio. Súbelo a 8 y a 31: cada árbol capta más detalle.","Con 31 hojas y min_data_in_leaf en 1, el modelo sobreajusta: hojas con un solo caso. Sube min_data_in_leaf a 15 y el error de prueba se recupera.","Baja bagging_fraction a 0,5. Cada árbol ve la mitad de los datos, al azar: más rápido y con efecto regularizador."],
 k:"LightGBM controla la complejidad con num_leaves, no con la profundidad: un árbol por hojas llega más hondo donde más gana. Por eso sobreajusta con facilidad en datos pequeños, y min_data_in_leaf es su freno principal. Como regla, num_leaves debe quedar por debajo de 2 elevado a la profundidad que usarías.",
 draw(s){return boostDraw({n:s.n,lr:s.lr,dp:1e9,sub:s.bf,es:0,nz:s.nz,lam:0,gam:0,mcw:s.mdl,leaves:s.nl})}};
LAB.ada={a:[7],t:"AdaBoost: dar más peso a los casos difíciles",s:{n:1,lr:1,nz:0.25},
 q:"Dos clases en medias lunas. El modelo suma árboles de un solo corte. Después de cada árbol, los puntos mal clasificados ganan peso: aquí, cuanto más grande el punto, más peso tiene para el siguiente árbol.",
 c:[["n","n_estimators: número de estimadores",1,150,1],["lr","learning_rate",0.05,2,0.05],["nz","Ruido en los datos",0.05,0.5,0.05]],
 p:["Con 1 estimador hay un solo corte recto. Sube a 2, 3, 5: cada corte nuevo se concentra en los puntos grandes, los que el conjunto anterior fallaba.","Sube a 150. La frontera se ajusta a las lunas; con ruido alto, empieza a perseguir puntos aislados, que acumulan peso enorme.","Baja learning_rate a 0,10 con 150 estimadores. Cada árbol aporta menos y hacen falta más para llegar al mismo ajuste."],
 k:"AdaBoost entrena clasificadores débiles en serie y sube el peso de los casos que falla. Es sensible a ruido y a atípicos, porque esos casos nunca se aciertan y terminan dominando. n_estimators y learning_rate se compensan, igual que en Gradient Boosting.",
 draw(s){const {X,Y,g:g0}=axes(-3,3,-2.5,2.5,{nx:6,ny:5});let g=g0;const tr=moons(0,120,s.nz),va=moons(150,160,s.nz),n=tr.length;let w=Array(n).fill(1/n);const St=[];
  for(let m=0;m<s.n;m++){let best=null;for(let f=0;f<2;f++){const ix=tr.map((_,i)=>i).sort((a,b)=>tr[a][f]-tr[b][f]);let e=0;tr.forEach((p,i)=>{if(p[2]!==1)e+=w[i]});for(let i=0;i<n;i++){const j=ix[i];e+=tr[j][2]===1?w[j]:-w[j];if(i<n-1&&tr[ix[i+1]][f]===tr[j][f])continue;const t=i<n-1?(tr[j][f]+tr[ix[i+1]][f])/2:1e9;for(const pol of[1,0]){const er=pol?e:1-e;if(!best||er<best.er)best={er,f,t,pol}}}}
   const er=Math.min(Math.max(best.er,1e-9),0.499999),al=s.lr*0.5*Math.log((1-er)/er);St.push([best.f,best.t,best.pol,al]);let z=0;tr.forEach((p,i)=>{const h=((p[best.f]>=best.t)?1:0)===best.pol?1:0;w[i]*=Math.exp(h===p[2]?-al:al);z+=w[i]});w=w.map(v=>v/z)}
  const fp=(x,y)=>{let v=0;for(const q of St){const h=(((q[0]?y:x)>=q[1])?1:0)===q[2]?1:-1;v+=q[3]*h}return v>0?1:0};
  g+=cells(X,Y,-3,3,-2.5,2.5,(x,y)=>PAL[fp(x,y)])+tr.map((p,i)=>dot(X(p[0]),Y(p[1]),"c"+PAL[p[2]],Math.max(2.5,Math.min(13,3+w[i]*n*2.2)))).join("");const at=accOf(tr,fp),av=accOf(va,fp);
  return {g,m:big(pc(av),"Exactitud en validación",av>0.9?"ok":"")+tbl([["Exactitud en entrenamiento",pc(at)],["Brecha entre ambas",f2((at-av)*100)+" puntos",at-av>0.08?"bad":"ok"],["Peso del caso más difícil (veces el promedio)",f2(Math.max(...w)*n)]])}}};
LAB.logc={a:[7],t:"Regresión logística: C, penalty, class_weight y max_iter",s:{C:0,pen:"l2",cw:"no",mi:300},
 q:"Un problema con 15 % de casos positivos (naranja) y tres variables: x1 separa bien, x2 ayuda poco y x3 es ruido (no se dibuja). La línea es la frontera que aprende la regresión logística con los hiperparámetros elegidos.",
 c:[["C","C: inverso de la regularización (log₁₀)",-3,3,0.1],["pen","penalty","sel",[["l2","l2"],["l1","l1"]]],["cw","class_weight","sel",[["no","None"],["bal","balanced"]]],["mi","max_iter",1,400,1]],

EL JSON de <meta> tiene estas claves:
- "t": título corto en español, máximo 60 caracteres.
- "q": "Qué estás viendo": 2 o 3 frases que explican cada elemento de la figura (colores, líneas, puntos).
- "c": lista de 2 a 6 controles. Tres formas posibles:
    ["clave","Etiqueta",mínimo,máximo,paso]   deslizador numérico
    ["clave","Etiqueta","sel",[["valor","Texto"],["valor2","Texto 2"]]]   lista de opciones
    ["clave","Etiqueta","chk"]   casilla (vale 0 o 1)
  Si el control es un hiperparámetro real, pon su nombre en la etiqueta, por ejemplo "n_estimators: número de árboles".
- "s": valores iniciales, una clave por control, dentro de su rango.
- "p": 3 o 4 pasos guiados, en orden, que dicen qué mover y qué observar. Cada paso debe describir algo que tu simulación muestra de verdad con esos valores. Si no estás seguro de un número, describe la tendencia sin dar cifras.
- "k": "La idea que te llevas": 2 o 3 frases con la conclusión.

EL CÓDIGO de <code> es el cuerpo de una función JavaScript que recibe s (los valores actuales de los controles) y devuelve {g, m}:
- g: texto SVG que se dibuja dentro de un lienzo de 560 × 420 (viewBox "0 0 560 420").
- m: texto HTML con las métricas, en el panel de la derecha.
Reglas estrictas: sin DOM, sin window, sin document, sin fetch, sin async, sin timers. Determinista: los mismos s producen la misma salida, así que usa rng(semilla) o los arreglos fijos PU y PZ, nunca Math.random. Se ejecuta en cada movimiento de un control: menos de 2 millones de operaciones simples. No incluyas fences de Markdown.

FUNCIONES DISPONIBLES (ya definidas, no las redefinas):
Aleatoriedad: rng(semilla) devuelve una función r() uniforme en [0,1). gauss(r) devuelve una normal estándar usando r. PU[i] uniforme fija y PZ[i] normal fija, i de 0 a 899.
Estadística: mean(a), sd(a) (poblacional), corr(a,b), ols(puntos [[x,y]]) devuelve [b0,b1], solve(A,b) resuelve un sistema lineal, Phi(z) normal acumulada, npdf(z) densidad normal, invPhi(p), erf(x).
Datos de ejemplo: moons(offset,n,ruido) y wavy(offset,n,ruido) devuelven [[x,y,clase]] con clase 0 o 1 (moons en x de −3 a 3 e y de −2,5 a 2,5; wavy en −3 a 3 por ambos ejes). blobs(dispersión,offset,n) devuelve [[x,y,clase]] en −4 a 4. accOf(datos,f) da la exactitud de f(x,y) frente a la clase.
Formato de números (estilo es-PE): f2(x) dos decimales, pc(x) porcentaje de una proporción, ex(x) notación corta o científica, fm(x) número compacto para ejes. esc(texto) escapa HTML.
Dibujo:
- axes(x0,x1,y0,y1,{nx,ny,xl,yl}) devuelve {X,Y,g}: X(valor) e Y(valor) pasan de unidades de datos a píxeles; el área de datos va de x = 50 a 530 y de y = 370 (abajo) a 30 (arriba). g trae la rejilla y las marcas; empieza tu g con ella. nx, ny = número de divisiones; xl, yl = títulos de los ejes.
- pth([[px,py],...],clases) línea en píxeles, recortada al área de datos. Clases: "kk" tinta, "k1" azul, "k2" naranja, "k3" verde, "kr" rojo; añade "dsh" para punteada y "thin" para delgada.
- dot(px,py,clases,radio) punto. Clases: "" azul, "cA" azul, "cB" naranja, "cC" verde, "cD" morado, "cE" rosa, "cF" celeste, "c1" verde, "c0" gris, "ghost" tenue; añade "wrong" para borde rojo y "outl" para relleno rojo.
- seg(x1,y1,x2,y2,clase) segmento. Clases: "ax" eje, "gx" rejilla, "mean" punteada gris, "bnd" punteada naranja, "fit" línea gruesa, "res" residuo rojo fino.
- txt(x,y,texto,ancla) texto; ancla "middle" o "end" opcional.
- Barras: '<rect class="bar k1" x=".." y=".." width=".." height=".."/>' con k1 azul, k2 naranja, kpos verde, kneg rojo, kg gris.
- Área sombreada: '<path class="shade" d="..."/>'. Contorno: '<circle class="ctr" .../>'.
- cells(X,Y,x0,x1,y0,y1,f) colorea el fondo del área según f(x,y), que devuelve "A" (azul) o "B" (naranja): sirve para regiones de clasificación.
Métricas: big(valorTexto,etiqueta,clase) número destacado con clase "ok" (verde), "bad" (rojo) o "". tbl([[etiqueta,valorTexto,clase],...]) tabla. hint(texto) nota pequeña. Escribe m como big(...)+tbl(...)+hint(...).
