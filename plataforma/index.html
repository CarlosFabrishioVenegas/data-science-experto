<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Science Experto</title>
<style>
/* Plan: lenguaje visual tipo Apple. Lienzo gris muy claro, tarjetas blancas de esquinas amplias sin bordes,
   tipografía del sistema con titulares grandes y apretados, un solo azul, controles en píldora, barra superior translúcida. */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --sunken:#f5f5f7; --ink:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7;
  --accent:#0066cc; --fill:#0071e3; --accent-ink:#ffffff; --accent-soft:#e8f2fd; --btn:#e8e8ed;
  --ok:#248a3d; --warn:#b25000; --bad:#d70015; --shadow:0 1px 3px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.04);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --sunken:#2c2c2e; --ink:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3c;
  --accent:#2997ff; --fill:#0071e3; --accent-ink:#ffffff; --accent-soft:#12305a; --btn:#3a3a3c;
  --ok:#30d158; --warn:#ff9f0a; --bad:#ff6961; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --sunken:#2c2c2e; --ink:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3c;
  --accent:#2997ff; --fill:#0071e3; --accent-ink:#ffffff; --accent-soft:#12305a; --btn:#3a3a3c;
  --ok:#30d158; --warn:#ff9f0a; --bad:#ff6961; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--fill) 55%,transparent);outline-offset:2px}
code{font:.92em var(--f-mono);background:var(--sunken);padding:1px 5px;border-radius:5px}
.top{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:10px max(16px,calc((100vw - 1380px)/2 + 16px));
  background:color-mix(in srgb,var(--bg) 76%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.brand{font:600 17px/1.2 var(--f);letter-spacing:-.02em}
.brand small{display:block;font:400 12px/1.3 var(--f);color:var(--muted);letter-spacing:0}
.nav{display:flex;gap:2px;margin-left:auto;background:var(--btn);padding:2px;border-radius:10px;flex-wrap:wrap}
.nav a{padding:5px 14px;border-radius:8px;color:var(--ink);font-weight:500;font-size:13px}
.nav a:hover{text-decoration:none}
.nav a[aria-current="page"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sync{font-size:12px;color:var(--muted);width:100%}
@media(min-width:760px){.sync{width:auto}}
.shell{display:grid;gap:20px;padding:24px 16px 48px;max-width:1380px;margin:0 auto}
@media(min-width:960px){.shell.two{grid-template-columns:320px minmax(0,1fr);align-items:start}
  .side{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
.side{padding:18px 14px}
.side>label{font:600 19px/1.2 var(--f);letter-spacing:-.02em;padding:0 6px}
.side summary{cursor:pointer;list-style:none}
.side summary::-webkit-details-marker{display:none}
#q{width:100%;padding:8px 12px;border:0;border-radius:10px;background:var(--btn);margin:10px 0 6px}
.amb{border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.amb>summary{display:grid;grid-template-columns:26px 1fr auto;gap:6px;align-items:baseline;padding:11px 6px;font-weight:600;font-size:14px}
.amb>summary .n{font:500 12px var(--f-mono);color:var(--muted)}
.amb>summary .c{font-size:12px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.tl{list-style:none;margin:0 0 8px;padding:0}
.tl li{display:flex}
.tl button.t{flex:1;display:grid;grid-template-columns:10px 34px 1fr;gap:6px;align-items:baseline;text-align:left;background:none;border:0;padding:7px 8px;border-radius:10px;cursor:pointer;font-size:13.5px;line-height:1.35}
.tl button.t:hover{background:var(--sunken)}
.tl button.t[aria-current="true"]{background:var(--fill);color:#fff}
.tl button.t[aria-current="true"] .k{color:rgba(255,255,255,.75)}
.tl button.t[aria-current="true"] .dot{border-color:#fff}
.tl .k{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);align-self:center}
.dot.s1{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.dot.s2{border-color:var(--ok);background:var(--ok)}
.dot.s3{border-color:var(--accent);background:var(--accent);border-radius:2px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 6px}
.addrow{display:flex;gap:6px;padding:0 4px 12px}
.addrow input{flex:1;min-width:0;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);padding:12px 6px 0;border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.main{min-width:0;display:grid;gap:20px}
.head{padding:32px 32px 22px}
.eyebrow{font:600 14px/1.3 var(--f);color:var(--muted)}
h1{font:700 clamp(28px,4.2vw,46px)/1.07 var(--f);letter-spacing:-.03em;margin:6px 0 18px;text-wrap:balance}
h2{font:600 21px/1.2 var(--f);letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
h3{font:600 15px/1.3 var(--f);margin:0 0 4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--btn);padding:2px;border-radius:10px}
.seg button{border:0;background:none;padding:5px 14px;cursor:pointer;font-size:13px;font-weight:500;border-radius:8px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:980px;background:var(--accent-soft);color:var(--accent)}
.steps{display:flex;gap:6px;overflow-x:auto;padding:0 32px 14px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.steps button{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:8px 16px 8px 9px;border:0;border-radius:980px;background:var(--sunken);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.steps button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.steps .i{font-size:11px;font-weight:600;width:22px;height:22px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center}
.steps .done .i{background:var(--ok);color:#fff}
.pane{padding:28px 32px 32px;display:grid;gap:22px}
@media(max-width:640px){.head{padding:24px 18px 18px}.steps{padding:0 18px 14px}.pane{padding:20px 18px 24px}}
.grid2{display:grid;gap:20px}
@media(min-width:1100px){.grid2{grid-template-columns:1fr 1fr}}
.box{border-radius:18px;padding:20px;background:var(--sunken);display:grid;gap:10px;align-content:start;min-width:0}
.hint{color:var(--muted);font-size:14px;margin:0;max-width:68ch}
textarea,.in{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 13px}
textarea:focus,.in:focus,.addrow input:focus,#q:focus{outline:0;border-color:var(--fill);box-shadow:0 0 0 4px color-mix(in srgb,var(--fill) 25%,transparent)}
textarea{resize:vertical;line-height:1.5}
pre{font:12.5px/1.55 var(--f-mono);letter-spacing:0;margin:0;white-space:pre-wrap;word-break:break-word;background:var(--surface);border-radius:12px;padding:12px 14px;max-height:210px;overflow:auto}
.btn{border:0;background:var(--btn);border-radius:980px;padding:8px 17px;cursor:pointer;font-weight:500;color:var(--ink);display:inline-block;font-size:14px;line-height:1.3}
.btn:hover{text-decoration:none;filter:brightness(.96)}
.btn.p{background:var(--fill);color:var(--accent-ink)}
.btn.p:hover{filter:brightness(1.08)}
.btn.s{padding:5px 13px;font-size:12.5px}
.box .btn:not(.p),.file .btn{background:color-mix(in srgb,var(--btn) 70%,var(--line))}
.busy .btn.p{opacity:.5;pointer-events:none}
.msg{font-size:13px;color:var(--muted);min-height:1.2em}
.msg.err{color:var(--bad)}
.chat{display:grid;gap:8px;max-height:540px;overflow:auto;padding:4px}
.bub{padding:10px 15px;border-radius:20px;max-width:min(78ch,92%);background:var(--btn);overflow-wrap:anywhere}
.bub.a{border-bottom-left-radius:6px}
.bub.u{justify-self:end;background:var(--fill);color:#fff;border-bottom-right-radius:6px}
.bub p{margin:0 0 8px}.bub p:last-child{margin:0}
.bub pre,.doc pre{max-height:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:none;border-radius:980px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--accent)}
.chip:hover{border-color:var(--accent)}
.send{display:flex;gap:10px;align-items:flex-end}
.send textarea{flex:1;border-radius:20px;padding:10px 16px}
.fig{border-radius:18px;background:var(--sunken);padding:18px;display:grid;gap:8px;min-width:0}
.plot{width:100%;height:420px;min-width:0}
.doc{background:var(--sunken);border-radius:18px;padding:26px 30px;max-height:580px;overflow:auto;font-size:16px;line-height:1.6}
.doc>*{max-width:66ch}
.doc h2{font-size:28px;letter-spacing:-.025em}.doc h3{font-size:20px;letter-spacing:-.02em;margin-top:22px}.doc h4,.doc h5{font-size:16px;margin:16px 0 4px}
.files{display:grid;gap:10px}
.file{display:grid;gap:8px 12px;grid-template-columns:auto 1fr;align-items:center;border-radius:16px;padding:14px 16px;background:var(--sunken)}
.file .path{font:12px var(--f-mono);letter-spacing:0;color:var(--muted);overflow-wrap:anywhere}
.file .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.file input,label.row input{width:18px;height:18px;accent-color:var(--fill)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.tile{padding:22px}
.tile b{display:block;font:700 40px/1.05 var(--f);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:14px}
.bar{height:6px;background:var(--btn);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b2{background:var(--ok)}.bar .b3{background:var(--fill)}.bar .b1{background:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);vertical-align:middle}
th{font-size:12px;font-weight:600;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
label.l{font-weight:600;font-size:13px;display:grid;gap:5px}
label.l .in{font-weight:400}
ol.howto{margin:0;padding-left:20px;max-width:68ch}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.steps button,.tl button.t{transition:background-color .2s,filter .2s,border-color .2s}}
/* v3: color por ámbito, práctica interactiva, racha */
body{background-image:radial-gradient(60% 420px at 8% 0,color-mix(in srgb,#0a84ff 13%,transparent),transparent),radial-gradient(50% 380px at 92% 0,color-mix(in srgb,#ff375f 10%,transparent),transparent),radial-gradient(40% 300px at 50% 0,color-mix(in srgb,#ffd60a 8%,transparent),transparent);background-repeat:no-repeat}
.amb>summary .n{background:color-mix(in srgb,var(--amb) 24%,transparent);color:var(--ink);border-radius:6px;padding:2px 0;text-align:center;font-weight:600}
.amb>summary .mb{grid-column:1/-1;height:3px;border-radius:9px;background:var(--btn);overflow:hidden}
.amb>summary .mb i{display:block;height:100%;background:var(--amb);border-radius:9px;transition:width .5s}
.tl button.t[aria-current="true"]{background:color-mix(in srgb,var(--amb) 62%,#000)}
.head{border-radius:20px 20px 0 0;background:linear-gradient(120deg,color-mix(in srgb,var(--amb) 24%,var(--surface)),var(--surface) 72%)}
.hero{display:flex;gap:20px;justify-content:space-between;align-items:flex-start}
.eyebrow{display:inline-block;background:color-mix(in srgb,var(--amb) 22%,transparent);color:var(--ink);padding:4px 12px;border-radius:980px;font-size:13px}
.ring{position:relative;flex:0 0 auto;width:72px;height:72px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .rb{stroke:color-mix(in srgb,var(--amb) 20%,var(--btn))}
.ring .rf{stroke:var(--amb);transition:stroke-dasharray .6s}
.ring b{font-size:15px;font-variant-numeric:tabular-nums}
.grow{flex:1}
.steps{padding-top:14px}
.steps button[aria-selected="true"]{background:color-mix(in srgb,var(--amb) 60%,#000);color:#fff}
.pips{display:flex;flex-wrap:wrap;gap:6px}
.pip{width:22px;height:8px;border-radius:9px;border:0;background:var(--line);cursor:pointer;padding:0}
.pip.k{background:var(--ok)}.pip.c{outline:2px solid var(--amb);outline-offset:2px}
.flash{perspective:1200px;display:grid;border:0;background:none;padding:0;cursor:pointer;min-height:230px;text-align:left}
.face{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:20px;padding:26px;display:grid;align-content:center;gap:12px;font-size:19px;line-height:1.35;font-weight:500;letter-spacing:-.015em;overflow-wrap:anywhere}
.face small{font-size:12px;font-weight:600;opacity:.8;letter-spacing:.02em}
.face em{font-style:normal;font-size:13px;font-weight:400;opacity:.8}
.fr{background:linear-gradient(135deg,color-mix(in srgb,var(--amb) 66%,#000),color-mix(in srgb,var(--amb) 40%,#000));color:#fff}
.bk{background:var(--surface);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--amb) 55%,transparent);transform:rotateY(180deg);font-weight:400;font-size:17px}
.flash.f .fr{transform:rotateY(180deg)}.flash.f .bk{transform:rotateY(360deg)}
.q{border:0;margin:0;padding:0;display:grid;gap:6px;min-width:0}
.q legend{font-weight:600;padding:0 0 6px;max-width:68ch}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 13px;cursor:pointer;color:var(--ink)}
.opt:not([disabled]):hover{border-color:var(--amb)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt[disabled]{cursor:default;opacity:1}
.tile{background:linear-gradient(140deg,color-mix(in srgb,var(--tc) 20%,var(--surface)),var(--surface) 75%);position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;left:22px;top:0;width:36px;height:4px;border-radius:0 0 4px 4px;background:var(--tc)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;max-width:520px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--btn)}
.heat .h1{background:color-mix(in srgb,var(--ok) 40%,var(--btn))}.heat .h2{background:color-mix(in srgb,var(--ok) 70%,var(--btn))}.heat .h3{background:var(--ok)}
@media (prefers-reduced-motion:no-preference){
  .face{transition:transform .55s cubic-bezier(.2,.7,.2,1)}
  .pane{animation:rise .28s ease-out}
  @keyframes rise{from{transform:translateY(6px);opacity:.55}to{transform:none;opacity:1}}
  .tile,.file,.opt{transition:transform .2s,border-color .2s,background-color .2s}
  .tile:hover{transform:translateY(-3px)}
}
.lgrid{display:grid;gap:24px;align-items:start}
@media(min-width:1180px){.lgrid{grid-template-columns:minmax(0,1fr) 300px}.lgrid>aside{position:sticky;top:76px}}
.lmain{display:grid;gap:18px;min-width:0}
.reader{font-size:17.5px;line-height:1.72;letter-spacing:-.005em}
.reader:empty{display:none}
.reader>*{max-width:68ch}
.reader h2{font-size:34px;line-height:1.1;letter-spacing:-.03em;margin:8px 0 18px}
.reader h3{font-size:23px;letter-spacing:-.022em;margin:34px 0 8px;padding-top:18px;border-top:3px solid color-mix(in srgb,var(--amb) 55%,transparent);display:inline-block}
.reader h4,.reader h5{font-size:18px;margin:22px 0 4px}
.reader p{margin:0 0 14px}
.reader ul,.reader ol{padding-left:24px;margin:0 0 14px}
.reader li{margin:4px 0}
.reader pre{max-width:none;max-height:none;background:var(--sunken);font-size:13.5px;padding:16px 18px;border-radius:14px;overflow-x:auto;white-space:pre}
.reader strong{font-weight:600}
.srcs{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--muted);max-height:340px;overflow:auto}
.srcs li{margin:3px 0;overflow-wrap:anywhere}
details>summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:500}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,56);
const clone=o=>JSON.parse(JSON.stringify(o));

function md(src){
  const inl=s=>s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[\s(])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>");
  let out="",list=null,code=false,para=[];
  const fp=()=>{if(para.length){out+="<p>"+inl(para.join(" "))+"</p>";para=[]}};
  const cl=()=>{if(list){out+="</"+list+">";list=null}};
  for(const l of esc(src).split("\n")){
    if(l.trim().startsWith("```")){fp();cl();out+=code?"</code></pre>":"<pre><code>";code=!code;continue}
    if(code){out+=l+"\n";continue}
    let m;
    if((m=l.match(/^(#{1,4})\s+(.*)/))){fp();cl();const h=Math.min(m[1].length+1,5);out+="<h"+h+">"+inl(m[2])+"</h"+h+">"}
    else if((m=l.match(/^\s*[-*•]\s+(.*)/))){fp();if(list!=="ul"){cl();out+="<ul>";list="ul"}out+="<li>"+inl(m[1])+"</li>"}
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){fp();if(list!=="ol"){cl();out+="<ol>";list="ol"}out+="<li>"+inl(m[1])+"</li>"}
    else if(!l.trim()){fp();cl()}
    else{cl();para.push(l)}
  }
  fp();cl();if(code)out+="</code></pre>";return out;
}

let db=null,root=null,cloud=false,flushing=false,timer=null,retries=0;const dirty=new Set();
const use=n=>(window.claude&&window.claude.use)?window.claude.use(n).catch(()=>null):Promise.resolve(null);
function setSync(){const el=$("#sync");if(!el)return;el.textContent=dirty.size&&cloud?"Guardando…":cloud?"Avance guardado en tu cuenta":"Avance guardado solo en este navegador"}
function local(k){try{localStorage.setItem("dse:"+k,JSON.stringify(k==="cfg"?S.cfg:S.t[k]))}catch(e){}}
function touch(k){if(k!=="cfg")mark(k);dirty.add(k);local(k);clearTimeout(timer);timer=setTimeout(flush,1200);setSync()}
const ref=k=>k==="cfg"?root:root.collection("temas").doc(k);
async function flush(){
  if(!cloud){dirty.clear();setSync();return}
  if(flushing)return;flushing=true;
  while(dirty.size){
    const k=dirty.values().next().value;dirty.delete(k);
    try{await ref(k).set(clone(k==="cfg"?S.cfg:S.t[k]));retries=0}
    catch(e){
      if(e&&e.code==="unavailable"&&retries<2){retries++;dirty.add(k);timer=setTimeout(flush,4000);break}
      if(e&&e.code==="quota_exceeded"){note("El almacenamiento de la plataforma está lleno. Borra gráficos o conversaciones antiguas.",true)}
      cloud=false;dirty.clear();break
    }
  }
  flushing=false;setSync();
}
function loadLocal(){
  try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!key||!key.startsWith("dse:"))continue;
    const v=JSON.parse(localStorage.getItem(key));const k=key.slice(4);
    if(k==="cfg")S.cfg={...S.cfg,...v};else S.t[k]={...clone(DEF),...v}}}catch(e){}
}
async function loadCloud(){
  const [d,user]=await Promise.all([use("db"),use("user")]);
  const uid=user&&user.id?await user.id():null;
  if(!d||!uid){setSync();return}
  db=d;root=db.doc("data/users/"+uid+"/espacio");
  try{
    const wait=new Promise((_,r)=>setTimeout(()=>r({code:"timeout"}),10000));
    const [c,q]=await Promise.race([Promise.all([root.get(),root.collection("temas").limit(1000).get()]),wait]);
    if(c.exists&&!dirty.has("cfg"))S.cfg={...S.cfg,...clone(c.data())};
    q.docs.forEach(x=>{if(!dirty.has(x.id))S.t[x.id]={...clone(DEF),...clone(x.data())}});
    cloud=true;
    if(!c.exists){Object.keys(S.t).forEach(k=>dirty.add(k));dirty.add("cfg");flush()}
    if(!document.activeElement||!/TEXTAREA|INPUT/.test(document.activeElement.tagName))render();
  }catch(e){cloud=false}
  setSync();
}

async function makeFig(text){

    const prompt=REGLAS+"\n\n"+ctx(t)+"\nTAREA: diseña un gráfico didáctico para este pedido: «"+text+"».\nDevuelve SOLO un objeto JSON válido, sin texto antes ni después y sin bloques de código, con esta forma exacta:\n{\"titulo\": string, \"lectura\": string, \"data\": [trazas de Plotly.js], \"layout\": {layout de Plotly.js}, \"frames\": []}\nReglas: tipos de Plotly.js 2 (scatter, bar, histogram, box, violin, heatmap, contour, surface). Máximo 300 puntos por traza y 6 trazas. Todos los valores son números o textos literales, nunca expresiones. Títulos de ejes y leyendas en español. No definas colores de fondo, fuentes ni tamaño. Si el pedido incluye un control deslizante, usa layout.sliders con \"frames\" (máximo 8 cuadros, cada uno con name y data). \"lectura\" son 2 o 3 frases que digan qué mirar en el gráfico y, si los datos son simulados, que lo son.";
    const r=await ask(prompt,{tier:"complex"});

    let d;try{d=JSON.parse(r.text.slice(r.text.indexOf("{"),r.text.lastIndexOf("}")+1))}catch(e){throw {message:"Claude devolvió la práctica con formato inválido. Intenta de nuevo"}}

/* ---------- racha y celebración ---------- */
function mark(id){
  const d=iso(new Date()),m=S.cfg.days||(S.cfg.days={}),o=m[d]||(m[d]={});
  if(o[id])return;o[id]=1;
  const ks=Object.keys(m).sort();while(ks.length>150)delete m[ks.shift()];

}
function dayCount(d){const o=(S.cfg.days||{})[iso(d)];return o?Object.keys(o).length:0}
function streak(){const d=new Date();if(!dayCount(d))d.setDate(d.getDate()-1);let n=0;while(dayCount(d)){n++;d.setDate(d.getDate()-1)}return n}
function heat(){const out=[],d=new Date();d.setDate(d.getDate()-83);
  for(let i=0;i<84;i++){const n=dayCount(d);out.push('<i class="h'+Math.min(n,3)+'" title="'+fdate(d)+": "+n+(n===1?" tema":" temas")+'"></i>');d.setDate(d.getDate()+1)}
  return '<div class="heat" role="img" aria-label="Actividad de estudio de las últimas 12 semanas">'+out.join("")+'</div>'}
function confetti(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99";
  c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext("2d");
  const P=Array.from({length:110},()=>({x:c.width/2,y:c.height*.38,vx:(Math.random()-.5)*16,vy:-Math.random()*13-3,c:COL[Math.random()*COL.length|0],s:5+Math.random()*6,r:Math.random()*6}));
  let n=0;(function f(){x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.38;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(++n<100)requestAnimationFrame(f);else c.remove()})();
}

  else if(act==="cardyes"||act==="cardno"){const p=T(t.id),i=Math.min(UI.ci,p.cards.length-1);p.known=(p.known||[]).filter(k=>k!==i);if(act==="cardyes")p.known.push(i);
    UI.ci=(i+1)%p.cards.length;UI.flip=false;touch(t.id);render();if(p.known.length===p.cards.length&&act==="cardyes")confetti()}
  else if(act==="ans"){const p=T(t.id);UI.ans[+b.dataset.k]=+b.dataset.j;
    if(Object.keys(UI.ans).length===p.quiz.length){const g=p.quiz.filter((q,k)=>UI.ans[k]===q.c).length;p.best=Math.max(p.best??0,g);touch(t.id);if(g===p.quiz.length)confetti()}
    render()}
  else if(act==="quizreset"){UI.ans={};render()}
  else if(act==="genres")genResumen();
  else if(act==="genpost")genPost();
  else if(act==="genguion")genGuion();
  else if(act==="dlmd"){const p=peek(t.id);p.resumen.trim()?save("resumen-claude.md",p.resumen):note("Todavía no hay resumen. Genéralo en el paso Resumen.",true)}
  else if(act==="dlinf"){const p=peek(t.id);p.fuente.trim()?save("informe-notebooklm.md","# "+t.name+"\n\n"+p.fuente):note("Todavía no pegaste el informe de NotebookLM en el paso Estudiar.",true)}
  else if(act==="dlhtml"){const p=peek(t.id);p.resumen.trim()?save(slug(t.name)+"-resumen.html",printable(t,p)):note("Todavía no hay resumen que descargar.",true)}
  else if(act==="pubtoday"){const p=T(t.id);p.pub=iso(new Date());p.st=2;touch(t.id);render();confetti()}
  else if(act==="deltopic"){const a=b.dataset.a;S.cfg.custom[a]=(S.cfg.custom[a]||[]).filter(x=>x.id!==b.dataset.id);touch("cfg");render()}
  else if(act==="import"){
    const a=$("#imp-a").value,lines=$("#imp-t").value.split("\n").map(s=>s.replace(/^\s*[-*•\d.)]+\s*/,"").trim()).filter(Boolean);
    if(!lines.length){note("Pega al menos un tema.",true);return}
    if($("#imp-r").checked){S.cfg.hideBase[a]=true;S.cfg.custom[a]=[]}
    const now=Date.now().toString(36);S.cfg.custom[a]=(S.cfg.custom[a]||[]).concat(lines.map((name,i)=>({id:a+"-c"+now+i.toString(36),name:name.slice(0,140)})));
    touch("cfg");render();note(lines.length+" temas cargados.")
  }
  else if(act==="restore"){const a=$("#imp-a").value;delete S.cfg.hideBase[a];touch("cfg");render();note("Temario base restaurado.")}
  else if(act==="backup")save("data-science-experto-respaldo.json",JSON.stringify(S,null,1));
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.dataset.form==="chat"){const i=$("#chat-in"),v=i.value;i.value="";sendChat(v)}
  else if(f.dataset.form==="fig"){makeFig($("#fig-in").value)}
  else if(f.dataset.add){const a=f.dataset.add,i=f.querySelector("input"),name=i.value.trim();if(!name)return;
    const id=a+"-c"+Date.now().toString(36);(S.cfg.custom[a]=S.cfg.custom[a]||[]).push({id,name:name.slice(0,140)});S.cfg.sel=id;S.cfg.open[a]=true;touch("cfg");render()}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="q"){S.q=el.value;const pos=el.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos);return}
  if(el.dataset.f){const t=current(),p=T(t.id),f=el.dataset.f;p[f]=el.value;
    if(f==="post"&&el.value.trim()&&!p.readyAt)p.readyAt=Date.now();
    if(f==="fuente"&&p.st===0&&el.value.trim())p.st=1;
    touch(t.id);
    const c=$("#cnt-"+f);if(c)c.textContent=f==="post"?el.value.length+" de 3 000 caracteres":f==="resumen"?words(el.value)+" palabras · unas "+Math.round(words(el.value)/480*10)/10+" páginas":words(el.value)+" palabras";
    if(f==="resumen"){const d=$("#doc");if(d)d.innerHTML=md(el.value)}}
  else if(el.dataset.c){S.cfg[el.dataset.c]=el.value.trim();touch("cfg")}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.file){const t=current();T(t.id).files[el.dataset.file]=el.checked;touch(t.id);render()}
  else if(el.dataset.f==="pub"){render()}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.amb&&!S.q){S.cfg.open[d.dataset.amb]=d.open;local("cfg")}},true);
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)&&/^(chat-in|fig-in)$/.test(e.target.id)){e.target.form.requestSubmit()}});
window.addEventListener("hashchange",render);

/* ---------- inicio ---------- */
loadLocal();render();setSync();
use("sample").then(s=>{ai=s});
use("downloads").then(d=>{dl=d});
loadCloud();
</script>
</body>
