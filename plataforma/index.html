<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Science Experto</title>
<style>
/* Plan: lenguaje visual tipo Apple. Lienzo gris muy claro, tarjetas blancas de esquinas amplias sin bordes,
   tipografía del sistema con titulares grandes y apretados, un solo azul, controles en píldora, barra superior translúcida. */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --sunken:#f5f5f7; --ink:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7;
  --accent:#0066cc; --fill:#0071e3; --accent-ink:#ffffff; --accent-soft:#e8f2fd; --btn:#e8e8ed;
  --ok:#248a3d; --warn:#b25000; --bad:#d70015; --shadow:0 1px 3px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.04);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --sunken:#2c2c2e; --ink:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3c;
  --accent:#2997ff; --fill:#0071e3; --accent-ink:#ffffff; --accent-soft:#12305a; --btn:#3a3a3c;
  --ok:#30d158; --warn:#ff9f0a; --bad:#ff6961; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --sunken:#2c2c2e; --ink:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3c;
  --accent:#2997ff; --fill:#0071e3; --accent-ink:#ffffff; --accent-soft:#12305a; --btn:#3a3a3c;
  --ok:#30d158; --warn:#ff9f0a; --bad:#ff6961; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--fill) 55%,transparent);outline-offset:2px}
code{font:.92em var(--f-mono);background:var(--sunken);padding:1px 5px;border-radius:5px}
.top{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:10px max(16px,calc((100vw - 1380px)/2 + 16px));
  background:color-mix(in srgb,var(--bg) 76%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.brand{font:600 17px/1.2 var(--f);letter-spacing:-.02em}
.brand small{display:block;font:400 12px/1.3 var(--f);color:var(--muted);letter-spacing:0}
.nav{display:flex;gap:2px;margin-left:auto;background:var(--btn);padding:2px;border-radius:10px;flex-wrap:wrap}
.nav a{padding:5px 14px;border-radius:8px;color:var(--ink);font-weight:500;font-size:13px}
.nav a:hover{text-decoration:none}
.nav a[aria-current="page"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sync{font-size:12px;color:var(--muted);width:100%}
@media(min-width:760px){.sync{width:auto}}
.shell{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;padding:24px 16px 48px;max-width:1380px;margin:0 auto}
@media(min-width:960px){.shell.two{grid-template-columns:320px minmax(0,1fr);align-items:start}
  .side{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
.side{padding:18px 14px}
.side>label{font:600 19px/1.2 var(--f);letter-spacing:-.02em;padding:0 6px}
.side summary{cursor:pointer;list-style:none}
.side summary::-webkit-details-marker{display:none}
#q{width:100%;padding:8px 12px;border:0;border-radius:10px;background:var(--btn);margin:10px 0 6px}
.amb{border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.amb>summary{display:grid;grid-template-columns:26px 1fr auto;gap:6px;align-items:baseline;padding:11px 6px;font-weight:600;font-size:14px}
.amb>summary .n{font:500 12px var(--f-mono);color:var(--muted)}
.amb>summary .c{font-size:12px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.tl{list-style:none;margin:0 0 8px;padding:0}
.tl li{display:flex}
.tl button.t{flex:1;display:grid;grid-template-columns:10px 34px 1fr;gap:6px;align-items:baseline;text-align:left;background:none;border:0;padding:7px 8px;border-radius:10px;cursor:pointer;font-size:13.5px;line-height:1.35}
.tl button.t:hover{background:var(--sunken)}
.tl button.t[aria-current="true"]{background:var(--fill);color:#fff}
.tl button.t[aria-current="true"] .k{color:rgba(255,255,255,.75)}
.tl button.t[aria-current="true"] .dot{border-color:#fff}
.tl .k{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);align-self:center}
.dot.s1{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.dot.s2{border-color:var(--ok);background:var(--ok)}
.dot.s3{border-color:var(--accent);background:var(--accent);border-radius:2px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 6px}
.addrow{display:flex;gap:6px;padding:0 4px 12px}
.addrow input{flex:1;min-width:0;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);padding:12px 6px 0;border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.main{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.head{padding:32px 32px 22px}
.eyebrow{font:600 14px/1.3 var(--f);color:var(--muted)}
h1{font:700 clamp(28px,4.2vw,46px)/1.07 var(--f);letter-spacing:-.03em;margin:6px 0 18px;text-wrap:balance}
h2{font:600 21px/1.2 var(--f);letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
h3{font:600 15px/1.3 var(--f);margin:0 0 4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--btn);padding:2px;border-radius:10px}
.seg button{border:0;background:none;padding:5px 14px;cursor:pointer;font-size:13px;font-weight:500;border-radius:8px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:980px;background:var(--accent-soft);color:var(--accent)}
.steps{display:flex;gap:6px;overflow-x:auto;padding:0 32px 14px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.steps button{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:8px 16px 8px 9px;border:0;border-radius:980px;background:var(--sunken);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.steps button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.steps .i{font-size:11px;font-weight:600;width:22px;height:22px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center}
.steps .done .i{background:var(--ok);color:#fff}
.pane{padding:28px 32px 32px;display:grid;gap:22px}
@media(max-width:640px){.head{padding:24px 18px 18px}.steps{padding:0 18px 14px}.pane{padding:20px 18px 24px}}
.grid2{display:grid;gap:20px}
@media(min-width:1100px){.grid2{grid-template-columns:1fr 1fr}}
.box{border-radius:18px;padding:20px;background:var(--sunken);display:grid;gap:10px;align-content:start;min-width:0}
.hint{color:var(--muted);font-size:14px;margin:0;max-width:68ch}
textarea,.in{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 13px}
textarea:focus,.in:focus,.addrow input:focus,#q:focus{outline:0;border-color:var(--fill);box-shadow:0 0 0 4px color-mix(in srgb,var(--fill) 25%,transparent)}
textarea{resize:vertical;line-height:1.5}
pre{font:12.5px/1.55 var(--f-mono);letter-spacing:0;margin:0;white-space:pre-wrap;word-break:break-word;background:var(--surface);border-radius:12px;padding:12px 14px;max-height:210px;overflow:auto}
.btn{border:0;background:var(--btn);border-radius:980px;padding:8px 17px;cursor:pointer;font-weight:500;color:var(--ink);display:inline-block;font-size:14px;line-height:1.3}
.btn:hover{text-decoration:none;filter:brightness(.96)}
.btn.p{background:var(--fill);color:var(--accent-ink)}
.btn.p:hover{filter:brightness(1.08)}
.btn.s{padding:5px 13px;font-size:12.5px}
.box .btn:not(.p),.file .btn{background:color-mix(in srgb,var(--btn) 70%,var(--line))}
.busy .btn.p{opacity:.5;pointer-events:none}
.msg{font-size:13px;color:var(--muted);min-height:1.2em}
.msg.err{color:var(--bad)}
.chat{display:grid;gap:8px;max-height:540px;overflow:auto;padding:4px}
.bub{padding:10px 15px;border-radius:20px;max-width:min(78ch,92%);background:var(--btn);overflow-wrap:anywhere}
.bub.a{border-bottom-left-radius:6px}
.bub.u{justify-self:end;background:var(--fill);color:#fff;border-bottom-right-radius:6px}
.bub p{margin:0 0 8px}.bub p:last-child{margin:0}
.bub pre,.doc pre{max-height:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:none;border-radius:980px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--accent)}
.chip:hover{border-color:var(--accent)}
.send{display:flex;gap:10px;align-items:flex-end}
.send textarea{flex:1;border-radius:20px;padding:10px 16px}
.fig{border-radius:18px;background:var(--sunken);padding:18px;display:grid;gap:8px;min-width:0}
.plot{width:100%;height:420px;min-width:0}
.doc{background:var(--sunken);border-radius:18px;padding:26px 30px;max-height:580px;overflow:auto;font-size:16px;line-height:1.6}
.doc>*{max-width:66ch}
.doc h2{font-size:28px;letter-spacing:-.025em}.doc h3{font-size:20px;letter-spacing:-.02em;margin-top:22px}.doc h4,.doc h5{font-size:16px;margin:16px 0 4px}
.files{display:grid;gap:10px}
.file{display:grid;gap:8px 12px;grid-template-columns:auto 1fr;align-items:center;border-radius:16px;padding:14px 16px;background:var(--sunken)}
.file .path{font:12px var(--f-mono);letter-spacing:0;color:var(--muted);overflow-wrap:anywhere}
.file .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.file input,label.row input{width:18px;height:18px;accent-color:var(--fill)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.tile{padding:22px}
.tile b{display:block;font:700 40px/1.05 var(--f);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:14px}
.bar{height:6px;background:var(--btn);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b2{background:var(--ok)}.bar .b3{background:var(--fill)}.bar .b1{background:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);vertical-align:middle}
th{font-size:12px;font-weight:600;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
label.l{font-weight:600;font-size:13px;display:grid;gap:5px}
label.l .in{font-weight:400}
ol.howto{margin:0;padding-left:20px;max-width:68ch}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.steps button,.tl button.t{transition:background-color .2s,filter .2s,border-color .2s}}
/* v3: color por ámbito, práctica interactiva, racha */
body{background-image:radial-gradient(60% 420px at 8% 0,color-mix(in srgb,#0a84ff 13%,transparent),transparent),radial-gradient(50% 380px at 92% 0,color-mix(in srgb,#ff375f 10%,transparent),transparent),radial-gradient(40% 300px at 50% 0,color-mix(in srgb,#ffd60a 8%,transparent),transparent);background-repeat:no-repeat}
.amb>summary .n{background:color-mix(in srgb,var(--amb) 24%,transparent);color:var(--ink);border-radius:6px;padding:2px 0;text-align:center;font-weight:600}
.amb>summary .mb{grid-column:1/-1;height:3px;border-radius:9px;background:var(--btn);overflow:hidden}
.amb>summary .mb i{display:block;height:100%;background:var(--amb);border-radius:9px;transition:width .5s}
.tl button.t[aria-current="true"]{background:color-mix(in srgb,var(--amb) 62%,#000)}
.head{border-radius:20px 20px 0 0;background:linear-gradient(120deg,color-mix(in srgb,var(--amb) 24%,var(--surface)),var(--surface) 72%)}
.hero{display:flex;gap:20px;justify-content:space-between;align-items:flex-start}
.eyebrow{display:inline-block;background:color-mix(in srgb,var(--amb) 22%,transparent);color:var(--ink);padding:4px 12px;border-radius:980px;font-size:13px}
.ring{position:relative;flex:0 0 auto;width:72px;height:72px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .rb{stroke:color-mix(in srgb,var(--amb) 20%,var(--btn))}
.ring .rf{stroke:var(--amb);transition:stroke-dasharray .6s}
.ring b{font-size:15px;font-variant-numeric:tabular-nums}
.grow{flex:1}
.steps{padding-top:14px}
.steps button[aria-selected="true"]{background:color-mix(in srgb,var(--amb) 60%,#000);color:#fff}
.pips{display:flex;flex-wrap:wrap;gap:6px}
.pip{width:22px;height:8px;border-radius:9px;border:0;background:var(--line);cursor:pointer;padding:0}
.pip.k{background:var(--ok)}.pip.c{outline:2px solid var(--amb);outline-offset:2px}
.flash{perspective:1200px;display:grid;border:0;background:none;padding:0;cursor:pointer;min-height:230px;text-align:left}
.face{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:20px;padding:26px;display:grid;align-content:center;gap:12px;font-size:19px;line-height:1.35;font-weight:500;letter-spacing:-.015em;overflow-wrap:anywhere}
.face small{font-size:12px;font-weight:600;opacity:.8;letter-spacing:.02em}
.face em{font-style:normal;font-size:13px;font-weight:400;opacity:.8}
.fr{background:linear-gradient(135deg,color-mix(in srgb,var(--amb) 66%,#000),color-mix(in srgb,var(--amb) 40%,#000));color:#fff}
.bk{background:var(--surface);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--amb) 55%,transparent);transform:rotateY(180deg);font-weight:400;font-size:17px}
.flash.f .fr{transform:rotateY(180deg)}.flash.f .bk{transform:rotateY(360deg)}
.q{border:0;margin:0;padding:0;display:grid;gap:6px;min-width:0}
.q legend{font-weight:600;padding:0 0 6px;max-width:68ch}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 13px;cursor:pointer;color:var(--ink)}
.opt:not([disabled]):hover{border-color:var(--amb)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt[disabled]{cursor:default;opacity:1}
.tile{background:linear-gradient(140deg,color-mix(in srgb,var(--tc) 20%,var(--surface)),var(--surface) 75%);position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;left:22px;top:0;width:36px;height:4px;border-radius:0 0 4px 4px;background:var(--tc)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;max-width:520px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--btn)}
.heat .h1{background:color-mix(in srgb,var(--ok) 40%,var(--btn))}.heat .h2{background:color-mix(in srgb,var(--ok) 70%,var(--btn))}.heat .h3{background:var(--ok)}
@media (prefers-reduced-motion:no-preference){
  .face{transition:transform .55s cubic-bezier(.2,.7,.2,1)}
  .pane{animation:rise .28s ease-out}
  @keyframes rise{from{transform:translateY(6px);opacity:.55}to{transform:none;opacity:1}}
  .tile,.file,.opt{transition:transform .2s,border-color .2s,background-color .2s}
  .tile:hover{transform:translateY(-3px)}
}
.lgrid{display:grid;gap:24px;align-items:start}
@media(min-width:1180px){.lgrid{grid-template-columns:minmax(0,1fr) 300px}.lgrid>aside{position:sticky;top:76px}}
.lmain{display:grid;gap:18px;min-width:0}
.reader{font-size:17.5px;line-height:1.72;letter-spacing:-.005em}
.reader:empty{display:none}
.reader>*{max-width:68ch}
.reader h2{font-size:34px;line-height:1.1;letter-spacing:-.03em;margin:8px 0 18px}
.reader h3{font-size:23px;letter-spacing:-.022em;margin:34px 0 8px;padding-top:18px;border-top:3px solid color-mix(in srgb,var(--amb) 55%,transparent);display:inline-block}
.reader h4,.reader h5{font-size:18px;margin:22px 0 4px}
.reader p{margin:0 0 14px}
.reader ul,.reader ol{padding-left:24px;margin:0 0 14px}
.reader li{margin:4px 0}
.reader pre{max-width:none;max-height:none;background:var(--sunken);font-size:13.5px;padding:16px 18px;border-radius:14px;overflow-x:auto;white-space:pre}
.reader strong{font-weight:600}
.srcs{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--muted);max-height:340px;overflow:auto}
.srcs li{margin:3px 0;overflow-wrap:anywhere}
.box details>summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:500}
.home{padding:32px;display:grid;gap:18px;background:linear-gradient(120deg,color-mix(in srgb,var(--amb) 26%,var(--surface)),var(--surface) 75%)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.fstep{padding:20px;display:grid;gap:4px;align-content:start}
.fstep b{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-size:14px;margin-bottom:6px}
.sect{margin:8px 4px -4px;font-size:26px;letter-spacing:-.025em}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.acard{padding:20px;display:grid;gap:12px;align-content:start;border-top:4px solid var(--amb)}
.acard h3{font-size:18px;letter-spacing:-.02em;line-height:1.25;min-height:2.5em}
.acard .c{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.abadge{font:600 13px var(--f-mono);background:color-mix(in srgb,var(--amb) 24%,transparent);border-radius:8px;padding:3px 9px}
@media (prefers-reduced-motion:no-preference){.acard{transition:transform .2s}.acard:hover{transform:translateY(-3px)}}
.labgrid{display:grid;gap:20px;align-items:start}
@media(min-width:1000px){.labgrid{grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr)}}
.labfig{background:var(--sunken);border-radius:18px;padding:10px;min-width:0}
#lab-svg{width:100%;height:auto;display:block;touch-action:none;user-select:none}
#lab-svg .gx{stroke:var(--line);stroke-width:1;opacity:.6}
#lab-svg .ax{stroke:var(--muted);stroke-width:1.5}
#lab-svg .lb{fill:var(--muted);font:12px var(--f)}
#lab-svg .vv{stroke-width:3.5;stroke-linecap:round}
#lab-svg .k1{stroke:#0a84ff;fill:#0a84ff}#lab-svg .k2{stroke:#ff9f0a;fill:#ff9f0a}#lab-svg .k3{stroke:#30b050;fill:#30b050}
#lab-svg .k3.vv{stroke-width:5}
#lab-svg .dash{stroke-dasharray:6 6;opacity:.6}
#lab-svg .par{fill:color-mix(in srgb,#30b050 14%,transparent);stroke:none}
#lab-svg .hd{fill-opacity:.25;stroke-width:2;cursor:grab}
#lab-svg .pt{fill:#0a84ff;fill-opacity:.8;stroke:var(--surface);stroke-width:1.5}
#lab-svg .pt.c1{fill:#30b050}#lab-svg .pt.c0{fill:#8e8e93}
#lab-svg .pt.wrong{stroke:#ff453a;stroke-width:2.5}
#lab-svg .pt.outl{fill:#ff453a}
#lab-svg .res{stroke:#ff453a;stroke-width:1.2;opacity:.55}
#lab-svg .fit{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
#lab-svg .mean{stroke:var(--muted);stroke-dasharray:5 5}
#lab-svg .bnd{stroke:#ff9f0a;stroke-width:2;stroke-dasharray:4 4}
input[type=range]{width:100%;accent-color:var(--fill)}
output{font-variant-numeric:tabular-nums;font-weight:600}
.big{border-radius:14px;padding:14px 16px;background:var(--surface);margin:6px 0}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,56);
const clone=o=>JSON.parse(JSON.stringify(o));
const words=s=>(s.trim().match(/\S+/g)||[]).length;
function md(src){
  const inl=s=>s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[\s(])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>");
  let out="",list=null,code=false,para=[];
  const fp=()=>{if(para.length){out+="<p>"+inl(para.join(" "))+"</p>";para=[]}};
  const cl=()=>{if(list){out+="</"+list+">";list=null}};
  for(const l of esc(src).split("\n")){
    if(l.trim().startsWith("```")){fp();cl();out+=code?"</code></pre>":"<pre><code>";code=!code;continue}
    if(code){out+=l+"\n";continue}
    let m;
    if((m=l.match(/^(#{1,4})\s+(.*)/))){fp();cl();const h=Math.min(m[1].length+1,5);out+="<h"+h+">"+inl(m[2])+"</h"+h+">"}
    else if((m=l.match(/^\s*[-*•]\s+(.*)/))){fp();if(list!=="ul"){cl();out+="<ul>";list="ul"}out+="<li>"+inl(m[1])+"</li>"}
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){fp();if(list!=="ol"){cl();out+="<ol>";list="ol"}out+="<li>"+inl(m[1])+"</li>"}
    else if(!l.trim()){fp();cl()}
    else{cl();para.push(l)}
  }
  fp();cl();if(code)out+="</code></pre>";return out;
}

/* ---------- guardado: cuenta de Claude si está disponible, navegador como respaldo ---------- */
let db=null,root=null,cloud=false,flushing=false,timer=null,retries=0;const dirty=new Set();
const use=n=>(window.claude&&window.claude.use)?window.claude.use(n).catch(()=>null):Promise.resolve(null);
function setSync(){const el=$("#sync");if(!el)return;el.textContent=dirty.size&&cloud?"Guardando…":cloud?"Avance guardado en tu cuenta":"Avance guardado solo en este navegador"}
function local(k){try{localStorage.setItem("dse:"+k,JSON.stringify(k==="cfg"?S.cfg:S.t[k]))}catch(e){}}
function touch(k){if(k!=="cfg")mark(k);dirty.add(k);local(k);clearTimeout(timer);timer=setTimeout(flush,1200);setSync()}
const ref=k=>k==="cfg"?root:root.collection("temas").doc(k);
async function flush(){
  if(!cloud){dirty.clear();setSync();return}
  if(flushing)return;flushing=true;
  while(dirty.size){
    const k=dirty.values().next().value;dirty.delete(k);
    try{await ref(k).set(clone(k==="cfg"?S.cfg:S.t[k]));retries=0}
    catch(e){
      if(e&&e.code==="unavailable"&&retries<2){retries++;dirty.add(k);timer=setTimeout(flush,4000);break}
      if(e&&e.code==="quota_exceeded"){note("El almacenamiento de la plataforma está lleno. Borra gráficos o conversaciones antiguas.",true)}
      cloud=false;dirty.clear();break
    }
  }
  flushing=false;setSync();
}
function loadLocal(){
  try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!key||!key.startsWith("dse:"))continue;
    const v=JSON.parse(localStorage.getItem(key));const k=key.slice(4);
    if(k==="cfg")S.cfg={...S.cfg,...v};else S.t[k]={...clone(DEF),...v}}}catch(e){}
}
async function loadCloud(){
  const [d,user]=await Promise.all([use("db"),use("user")]);
  const uid=user&&user.id?await user.id():null;
  if(!d||!uid){setSync();return}
  db=d;root=db.doc("data/users/"+uid+"/espacio");
  try{
    const wait=new Promise((_,r)=>setTimeout(()=>r({code:"timeout"}),10000));
    const [c,q]=await Promise.race([Promise.all([root.get(),root.collection("temas").limit(1000).get()]),wait]);
    if(c.exists&&!dirty.has("cfg"))S.cfg={...S.cfg,...clone(c.data())};
    q.docs.forEach(x=>{if(!dirty.has(x.id))S.t[x.id]={...clone(DEF),...clone(x.data())}});
    cloud=true;
    if(!c.exists){Object.keys(S.t).forEach(k=>dirty.add(k));dirty.add("cfg");flush()}
    if(!document.activeElement||!/TEXTAREA|INPUT/.test(document.activeElement.tagName))render();
  }catch(e){cloud=false}
  setSync();
}

const LABS=[["vec","Vectores"],["lin","Regresión lineal y R²"],["log","Regresión logística"]];
const LABMAP={"m01-t01":"vec","m01-t03":"vec","m01-t04":"vec","m01-t05":"vec","m03-t04":"lin","m07-t02":"lin","m07-t03":"log","m07-t09":"log","m07-t10":"log"};
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R0=rng(11),DX=Array.from({length:60},()=>R0()*10),DZ=Array.from({length:60},()=>Math.sqrt(-2*Math.log(1-R0()))*Math.cos(6.2832*R0())),DU=Array.from({length:60},()=>R0());
let L={lab:"log",v:[3,1],w:[1,2.5],c:1,d:1,b0:8,b1:0.5,sg:2,out:0,g0:-2,g1:0.6,sep:1.2,thr:0.5},drag=null;
const f2=x=>(Math.round(x*100)/100).toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2});
const linData=()=>{const d=DX.slice(0,40).map((x,i)=>[x,2+1.5*x+L.sg*DZ[i]]);if(L.out)d.push([9.6,-7]);return d};
const logData=()=>DX.map((x,i)=>[x,DU[i]<1/(1+Math.exp(-L.sep*(x-5)))?1:0]);
const sl=(k,label,min,max,step)=>'<label class="l" for="lab-'+k+'"><span class="row" style="justify-content:space-between"><span>'+label+'</span><output id="o-'+k+'">'+f2(L[k])+'</output></span><input type="range" id="lab-'+k+'" data-lab="'+k+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+L[k]+'"></label>';
function labControls(k){
  if(k==="vec")return '<h3>Combinación lineal c·v + d·w</h3><p class="hint">Arrastra las puntas de v y w en la figura.</p>'+sl("c","Escalar c",-3,3,0.1)+sl("d","Escalar d",-3,3,0.1);
  if(k==="lin")return '<h3>Tu recta: y = b₀ + b₁·x</h3>'+sl("b0","Intercepto b₀",-10,20,0.1)+sl("b1","Pendiente b₁",-2,5,0.05)+sl("sg","Ruido de los datos",0,6,0.1)+'<label class="row" for="lab-out"><input type="checkbox" id="lab-out" data-lab="out"'+(L.out?" checked":"")+'> Agregar un valor atípico</label><div class="row"><button class="btn p" data-act="fitlin">Ajustar por mínimos cuadrados</button></div>';
  return '<h3>Tu curva: p = 1 / (1 + e^−(β₀ + β₁·x))</h3>'+sl("g0","Intercepto β₀",-15,15,0.1)+sl("g1","Pendiente β₁",-1,4,0.05)+sl("thr","Umbral de decisión",0.05,0.95,0.01)+sl("sep","Separación entre clases",0.2,3,0.1)+'<div class="row"><button class="btn p" data-act="fitlog">Ajustar por máxima verosimilitud</button></div>';
}
const LABTXT={
 vec:'<div class="box"><h3>Qué observar</h3><ul class="tips"><li>Con c y d recorres todo el plano solo si v y w no están alineados. Alinéalos y el resultado queda atrapado en una recta.</li><li>El determinante es el área del paralelogramo. Cuando vale cero, los vectores son linealmente dependientes.</li><li>El producto punto es positivo si apuntan hacia el mismo lado, cero si son perpendiculares y negativo si se oponen.</li><li>La proyección de w sobre v es la sombra de w en la dirección de v: la base de mínimos cuadrados.</li></ul></div><div class="box"><h3>Curiosidades</h3><ul class="tips"><li>Una fila de tu tabla de datos es un vector: cada sensor o variable es una coordenada.</li><li>El coseno del ángulo entre dos vectores de datos centrados es su correlación.</li><li>Multiplicar una matriz por un vector es hacer una combinación lineal de las columnas de la matriz.</li><li>En espacios de muchas dimensiones, dos vectores al azar son casi siempre casi perpendiculares.</li></ul></div>',
 lin:'<div class="box"><h3>Qué observar</h3><ul class="tips"><li>Las líneas verticales son los residuos. El R² sube cuando su suma al cuadrado baja.</li><li>Aleja la recta de los puntos: el R² se vuelve negativo, porque tu recta es peor que predecir la media.</li><li>Sube el ruido: la mejor recta casi no cambia, pero el R² cae. Un R² bajo no siempre es un mal modelo.</li><li>Activa el valor atípico y vuelve a ajustar: un solo punto gira la recta.</li></ul></div><div class="box"><h3>Supuestos que estás viendo</h3><ul class="tips"><li>Linealidad: la nube sigue una recta.</li><li>Homocedasticidad: el ancho de la nube es parejo a lo largo de x.</li><li>Independencia: cada punto se generó sin mirar a los demás.</li><li>Errores normales: solo importan para los intervalos de confianza, no para la recta.</li></ul></div>',
 log:'<div class="box"><h3>Qué observar</h3><ul class="tips"><li>β₁ controla lo empinada que es la S; β₀ la desplaza. El punto donde p = 0,5 está en x = −β₀/β₁.</li><li>No hay R² clásico: mira la log-loss (menor es mejor) y el pseudo-R² de McFadden.</li><li>Mueve el umbral: la curva no cambia, pero sí la matriz de confusión. Sensibilidad y precisión se intercambian.</li><li>Sube la separación entre clases y vuelve a ajustar: β₁ crece. Con separación perfecta crecería sin límite.</li></ul></div><div class="box"><h3>Supuestos y curiosidades</h3><ul class="tips"><li>Supone respuesta binaria, observaciones independientes, linealidad en el logit y ausencia de multicolinealidad fuerte.</li><li>No supone normalidad ni varianza constante.</li><li>Una neurona con activación sigmoide es una regresión logística.</li><li>Los círculos con borde rojo son los casos mal clasificados con tu umbral actual.</li></ul></div>'
};
function viewLab(){const k=L.lab;
  return '<div class="shell"><section class="card pane"><div><h2>Laboratorio interactivo</h2><p class="hint">Mueve los controles y mira cómo cambian la figura y las métricas al instante. Los datos son simulados y fijos, para que compares un intento con otro.</p></div><div class="seg" role="group" aria-label="Experimento">'+LABS.map(x=>'<button data-act="lab" data-v="'+x[0]+'" aria-pressed="'+(k===x[0])+'">'+x[1]+'</button>').join("")+'</div>'+
  '<div class="labgrid"><div class="labfig"><svg id="lab-svg" viewBox="0 0 560 420" role="img" aria-label="Figura interactiva del experimento"></svg></div><div class="box">'+labControls(k)+'<div id="lab-out"></div></div></div><div class="grid2">'+LABTXT[k]+'</div></section></div>';

const row=(a,b,cls)=>'<tr><td>'+a+'</td><td class="num '+(cls||"")+'">'+b+'</td></tr>';
function drawLab(){
  const svg=$("#lab-svg"),out=$("#lab-out");if(!svg)return;let g="",m="";
  if(L.lab==="vec"){
    const X=x=>280+x*34,Y=y=>210-y*34,{v,w,c,d}=L,r=[c*v[0]+d*w[0],c*v[1]+d*w[1]];

    for(let i=-6;i<=6;i++)g+='<line class="gx" x1="0" y1="'+Y(i)+'" x2="560" y2="'+Y(i)+'"/>';
    g+='<line class="ax" x1="0" y1="210" x2="560" y2="210"/><line class="ax" x1="280" y1="0" x2="280" y2="420"/>';
    const P=p=>X(p[0])+","+Y(p[1]),cv=[c*v[0],c*v[1]],dw=[d*w[0],d*w[1]];

    const arr=(p,cls,lab)=>'<line class="vv '+cls+'" x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(p[0])+'" y2="'+Y(p[1])+'"/><circle class="tip '+cls+'" cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="4"/><text class="lb" x="'+(X(p[0])+8)+'" y="'+(Y(p[1])-8)+'">'+lab+'</text>';
    g+=arr(cv,"k1 dash",c===1?"":"c·v")+arr(dw,"k2 dash",d===1?"":"d·w")+arr(v,"k1","v")+arr(w,"k2","w")+arr(r,"k3","c·v + d·w");
    g+='<circle class="hd k1" data-h="v" cx="'+X(v[0])+'" cy="'+Y(v[1])+'" r="11"/><circle class="hd k2" data-h="w" cx="'+X(w[0])+'" cy="'+Y(w[1])+'" r="11"/>';
    const nv=Math.hypot(v[0],v[1]),nw=Math.hypot(w[0],w[1]),dot=v[0]*w[0]+v[1]*w[1],det=v[0]*w[1]-v[1]*w[0],ang=nv&&nw?Math.acos(Math.max(-1,Math.min(1,dot/(nv*nw))))*180/Math.PI:0,dep=Math.abs(det)<0.15;
    m='<table>'+row("v","("+f2(v[0])+"; "+f2(v[1])+")")+row("w","("+f2(w[0])+"; "+f2(w[1])+")")+row("c·v + d·w","("+f2(r[0])+"; "+f2(r[1])+")")+row("Norma de v y de w",f2(nv)+" y "+f2(nw))+row("Producto punto v·w",f2(dot))+row("Ángulo entre v y w",f2(ang)+"°")+row("Proyección de w sobre v",nv?f2(dot/nv):"0,00")+row("Determinante (área)",f2(det),dep?"bad":"ok")+'</table><p class="hint">'+(dep?"v y w están casi alineados: son linealmente dependientes y solo generan una recta.":"v y w son linealmente independientes: con c y d alcanzas cualquier punto del plano.")+'</p>';
  }else if(L.lab==="lin"){
    const X=x=>50+x*48,Y=y=>370-(y+10)*10,d=linData(),n=d.length,my=d.reduce((s,p)=>s+p[1],0)/n;
    for(let i=0;i<=10;i+=2)g+='<line class="gx" x1="'+X(i)+'" y1="20" x2="'+X(i)+'" y2="370"/><text class="lb" x="'+(X(i)-4)+'" y="388">'+i+'</text>';
    for(let y=-10;y<=25;y+=5)g+='<line class="gx" x1="50" y1="'+Y(y)+'" x2="530" y2="'+Y(y)+'"/><text class="lb" x="22" y="'+(Y(y)+4)+'">'+y+'</text>';
    g+='<line class="mean" x1="50" y1="'+Y(my)+'" x2="530" y2="'+Y(my)+'"/><text class="lb" x="440" y="'+(Y(my)-6)+'">media de y</text>';
    let sse=0,sst=0;d.forEach(p=>{const h=L.b0+L.b1*p[0];sse+=(p[1]-h)**2;sst+=(p[1]-my)**2;g+='<line class="res" x1="'+X(p[0])+'" y1="'+Y(p[1])+'" x2="'+X(p[0])+'" y2="'+Y(Math.max(-10,Math.min(25,h)))+'"/>'});
    d.forEach((p,i)=>{g+='<circle class="pt'+(L.out&&i===n-1?" outl":"")+'" cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="5"/>'});
    g+='<line class="fit" x1="'+X(0)+'" y1="'+Y(L.b0)+'" x2="'+X(10)+'" y2="'+Y(L.b0+10*L.b1)+'" clip-path="url(#cl)"/>';
    const r2=1-sse/sst;
    m='<div class="big '+(r2>0.7?"ok":r2<0?"bad":"")+'"><b>'+f2(r2)+'</b><span>R² de tu recta</span></div><table>'+row("Suma de residuos al cuadrado (SSE)",f2(sse))+row("Variabilidad total (SST)",f2(sst))+row("Error típico (RMSE)",f2(Math.sqrt(sse/n)))+row("Recta","y = "+f2(L.b0)+" + "+f2(L.b1)+"·x")+'</table><p class="hint">'+(r2<0?"R² negativo: tu recta predice peor que la media.":"R² = 1 − SSE / SST. Los datos se generaron con y = 2 + 1,5·x más ruido.")+'</p>';
  }else{
    const X=x=>50+x*48,Y=p=>350-p*300,d=logData(),n=d.length,P=x=>1/(1+Math.exp(-(L.g0+L.g1*x)));
    for(let i=0;i<=10;i+=2)g+='<line class="gx" x1="'+X(i)+'" y1="50" x2="'+X(i)+'" y2="350"/><text class="lb" x="'+(X(i)-4)+'" y="372">'+i+'</text>';
    [0,0.25,0.5,0.75,1].forEach(p=>{g+='<line class="gx" x1="50" y1="'+Y(p)+'" x2="530" y2="'+Y(p)+'"/><text class="lb" x="16" y="'+(Y(p)+4)+'">'+f2(p)+'</text>'});
    g+='<line class="mean" x1="50" y1="'+Y(L.thr)+'" x2="530" y2="'+Y(L.thr)+'"/><text class="lb" x="452" y="'+(Y(L.thr)-6)+'">umbral</text>';
    if(Math.abs(L.g1)>1e-6){const xb=(Math.log(L.thr/(1-L.thr))-L.g0)/L.g1;if(xb>0&&xb<10)g+='<line class="bnd" x1="'+X(xb)+'" y1="50" x2="'+X(xb)+'" y2="350"/><text class="lb" x="'+(X(xb)+6)+'" y="42">frontera</text>'}

    let ll=0,tp=0,fp=0,fn=0,tn=0,s1=0;
    d.forEach((q,i)=>{const p=Math.min(1-1e-9,Math.max(1e-9,P(q[0]))),y=q[1],pred=p>=L.thr?1:0;ll+=y?Math.log(p):Math.log(1-p);s1+=y;if(y&&pred)tp++;else if(!y&&pred)fp++;else if(y&&!pred)fn++;else tn++;
      g+='<circle class="pt c'+y+(pred!==y?" wrong":"")+'" cx="'+X(q[0])+'" cy="'+(Y(y)+DZ[i]*5)+'" r="5"/>'});
    const pb=s1/n,ll0=s1*Math.log(pb)+(n-s1)*Math.log(1-pb),mc=1-ll/ll0;

  }
  svg.innerHTML='<defs><clipPath id="cl"><rect x="50" y="20" width="480" height="350"/></clipPath></defs>'+g;out.innerHTML=m;
  document.querySelectorAll("[data-lab]").forEach(e=>{const o=$("#o-"+e.dataset.lab);if(o)o.textContent=f2(L[e.dataset.lab]);if(e.type==="range"&&document.activeElement!==e)e.value=L[e.dataset.lab]});
}
function fitLin(){const d=linData(),n=d.length,mx=d.reduce((s,p)=>s+p[0],0)/n,my=d.reduce((s,p)=>s+p[1],0)/n;let a=0,b=0;d.forEach(p=>{a+=(p[0]-mx)*(p[1]-my);b+=(p[0]-mx)**2});L.b1=Math.round(a/b*100)/100;L.b0=Math.round((my-a/b*mx)*100)/100;drawLab()}
function fitLog(){const d=logData();let b0=0,b1=0;
  for(let it=0;it<40;it++){let g0=0,g1=0,h00=0,h01=0,h11=0;d.forEach(q=>{const p=1/(1+Math.exp(-(b0+b1*q[0]))),w=p*(1-p);g0+=q[1]-p;g1+=(q[1]-p)*q[0];h00+=w;h01+=w*q[0];h11+=w*q[0]*q[0]});
    const det=h00*h11-h01*h01;if(det<1e-9)break;b0+=(h11*g0-h01*g1)/det;b1+=(h00*g1-h01*g0)/det}
  L.g0=Math.max(-15,Math.min(15,Math.round(b0*100)/100));L.g1=Math.max(-1,Math.min(4,Math.round(b1*100)/100));drawLab()}

const LEC={"m01-t01":"# Informe Pedagógico: Vectores, Matrices y Combinaciones Lineales en la Industria Pesada\n\n## 1. Mapa del tema y objetivos de aprendizaje\n\nEl álgebra lineal no es simplemente una rama de las matemáticas; es el sistema operativo de la ciencia de datos moderna y el lenguaje estratégico para la optimización de activos industriales. En el contexto de la Industria 4.0, donde la digitalización genera flujos masivos de datos, el álgebra lineal permite transformar señales de sensores en estructuras lógicas procesables. Como afirma Gilbert Strang, los vectores y las matrices se han convertido en el lenguaje que debemos dominar para navegar el siglo de los datos, permitiéndonos transitar de lo analógico a lo digital con precisión quirúrgica.\n\n**Objetivos de aprendizaje:** Al finalizar este informe, el profesional habrá desarrollado las siguientes competencias:\n\n- **Dominio de operaciones en Rⁿ:** Comprender la aritmética de vectores en espacios multidimensionales, diferenciando entre componentes individuales y la entidad vectorial.\n- **Dominio de Combinaciones Lineales:** Adquirir la capacidad de construir nuevos vectores y entender cómo estos generan subespacios (planos o volúmenes) críticos para el control de procesos.\n- **Modelado de Activos Físicos:** Conectar la abstracción de la independencia lineal con el \"vector de estado\", permitiendo la creación de Gemelos Digitales (Digital Twins) de maquinaria pesada.\n\nPara construir modelos predictivos robustos, debemos asegurar que los cimientos aritméticos sean sólidos. La transición de la lógica escalar a la multidimensional es, de hecho, el cuello de botella más crítico en la transformación digital industrial.\n\n## 2. Repaso de prerrequisitos: Nivelación desde el álgebra básica\n\nEl paso de las variables escalares simples (donde una temperatura se representa como T=450°C) a estructuras multidimensionales representa el primer gran salto conceptual. El álgebra de secundaria nos enseña a manipular números aislados, pero la industria moderna exige tratar grupos de variables interdependientes como una sola entidad funcional.\n\nConceptos esenciales de nivelación:\n\n- **Manejo de variables y constantes:** Operaciones aritméticas básicas aplicadas a símbolos.\n- **Sistemas de ecuaciones:** Entender que una variable puede estar vinculada a otras mediante relaciones proporcionales.\n- **Representación en el plano:** Familiaridad con el plano cartesiano xy, el precursor natural del espacio Rⁿ.\n\nEsta base aritmética es el punto de partida necesario para definir el objeto fundamental que rige la inteligencia artificial industrial: el vector.\n\n## 3. Desarrollo conceptual desde cero: De la intuición a la idea formal\n\nMientras la mente humana visualiza datos en tres dimensiones, los algoritmos de Machine Learning operan en espacios de cientos de dimensiones. La brecha entre la intuición física y la capacidad de cómputo se cierra mediante la representación vectorial.\n\n### La analogía de las \"manzanas y naranjas\"\n\nBasándonos en la metodología de Strang, un vector es la solución al problema de \"sumar manzanas y naranjas\". En la industria, no podemos sumar directamente la vibración (mm/s) con la temperatura (°C). Un vector nos permite organizar estas categorías en una lista donde cada posición tiene un significado único, manteniéndolas separadas pero vinculadas en una entidad común.\n\n### La dualidad del vector\n\nUn vector posee una naturaleza dual esencial para el ingeniero:\n\n- **Punto de vista de datos (Lista):** Es una columna de números. Es la forma en que el PLC o el sistema SCADA almacena la información.\n- **Punto de vista geométrico (Flecha):** Es una flecha en el espacio que parte del origen. La dirección de esta flecha representa la \"firma\" o el estado actual de la máquina.\n\n### La Combinación Lineal: Construir el espacio\n\nLa Combinación Lineal es la operación reina. Es la capacidad de visualizar y construir nuevos vectores mediante el escalado (estirar/encoger) y la suma (unión punta-con-cola). Si combinamos todos los posibles escalamientos de dos vectores independientes, \"llenamos\" un plano. Si añadimos un tercer vector independiente, llenamos el espacio tridimensional.\n\n## 4. Formalización: Definiciones y fórmulas paso a paso\n\nLa formalización matemática permite una comunicación inequívoca entre el ingeniero y la máquina. Según las fuentes de Strang, estas son las reglas que rigen el universo vectorial:\n\n### 1. Suma de Vectores (v+w)\n\nSe realiza componente a componente. Si v=[v₁; v₂] y w=[w₁; w₂], entonces v+w=[v₁+w₁; v₂+w₂]. Geométricamente, esto produce la diagonal de un paralelogramo.\n\n### 2. Multiplicación por Escalar (cv)\n\nEl escalar c afecta la magnitud. Si c=2, el vector se duplica. Si c=−1, el vector invierte su dirección. Nota técnica: El vector resultante −v+v es el vector cero (0), el cual posee componentes [0;0]. Es vital distinguir este objeto matemático del número cero, especialmente al calibrar sensores (offset cero).\n\n### 3. Combinación Lineal (cv+dw)\n\nEs la estructura fundamental del álgebra lineal:\n\ncv+dw = c[v₁; v₂] + d[w₁; w₂]\n\nAquí, c y d son coeficientes que determinan la influencia de cada vector original en el resultado.\n\n### Nota sobre el formato de vectores\n\nEn este informe priorizamos el vector columna. En textos técnicos, para ahorrar espacio, se suelen escribir horizontalmente como (v₁, v₂), pero matemáticamente debemos entenderlos como la transpuesta vᵀ.\n\n## 5. Ejemplos numéricos resueltos\n\n### Ejemplo 1: Combinación en R²\n\nDados v=[1; 1] y w=[2; 3], calculemos 3v+5w: 3[1; 1] + 5[2; 3] = [3; 3] + [10; 15] = [13; 18].\n\n### Ejemplo 2: El límite del subespacio en R³\n\nConsidere los vectores v=[1;1;1] y w=[2;3;4]. ¿Podemos alcanzar el vector b=[1;0;0] mediante una combinación lineal cv+dw? Esto genera el sistema:\n\n1. c+2d=1\n2. c+3d=0\n3. c+4d=0\n\nDe (2) y (3) se deduce que d=0 y c=0, lo cual contradice la ecuación (1). Resultado: El vector b no está en el plano generado por v y w. En una planta de gas, esto significaría que el setpoint deseado es \"inalcanzable\" dadas las restricciones actuales de los actuadores.\n\n## 6. Puente hacia Machine Learning: Tensores y el \"Column Picture\"\n\nEl corazón del álgebra lineal, según Strang, reside en la conexión entre las filas y las columnas de una matriz.\n\n**La multiplicación Matriz-Vector (Ax=b):** Contrario a la enseñanza tradicional de \"fila por columna\", un experto en IA debe ver Ax=b como una combinación lineal de las columnas de A. Si A=[C₁ | C₂], entonces Ax = x₁C₁ + x₂C₂. Esta es la esencia de las redes neuronales: los pesos (x) determinan cuánto contribuye cada característica (columna) al resultado final (b).\n\n## 7. Capa aplicada a la industria: El vector de estado y matrices especiales\n\nEn la industria pesada, el estado de un activo se define como su posición en un subespacio vectorial.\n\n- **Minería (Molino de Bolas):** Case Study: El análisis de vibraciones utiliza matrices de covarianza para detectar fallas. Estas matrices son siempre Simétricas (A=Aᵀ), una propiedad que garantiza valores propios reales y facilita el diagnóstico predictivo.\n- **Cementera (Horno Rotatorio):** Las variables de temperatura y velocidad forman un vector de estado. Si el activo es \"saludable\", su vector reside en un subespacio de operación óptima. Si el vector se vuelve linealmente independiente respecto a la historia de salud, el Digital Twin detecta una anomalía.\n- **Eléctrica (Transformadores):** La descomposición de señales de carga utiliza matrices Ortogonales (donde las columnas son perpendiculares). Esto permite aislar ruidos de armónicos sin perder información de la frecuencia fundamental.\n- **Gas (Pipelines):** El balance de flujo se modela con matrices Triangulares durante la resolución de sistemas de presiones. Si el vector de salida se desvía del plano esperado, el sistema identifica una fuga residual.\n\n## 8. Errores comunes y malentendidos técnicos\n\nLa transición al pensamiento multidimensional presenta fricciones técnicas documentadas:\n\n- **Identidad vs. Transposición:** Confundir un vector fila con uno columna. En computación industrial, esto genera errores de dimensiones en las multiplicaciones de matrices.\n- **Componentes vs. Magnitud:** Olvidar que la magnitud de v+w no es ∣v∣+∣w∣, sino que depende del ángulo (correlación) entre las variables.\n- **La barrera 4D+:** Intentar visualizar espacios de alta dimensión. Debemos confiar en el formalismo: las leyes algebraicas de 3D se mantienen inmutables para n dimensiones.\n\n## 9. Mini-proyecto guiado: Biblioteca matemática desde cero\n\nEntender la lógica \"low-level\" es vital para el control de procesos.\n\n- **Paso 1:** Definir el vector como una lista inmutable de componentes.\n- **Paso 2:** Implementar funciones de suma componente a componente y escalado.\n- **Paso 3:** Desarrollar la lógica de combinación lineal cv+dw.\n- **Paso 4:** Implementar la multiplicación matriz-vector como una combinación lineal de las columnas de la matriz, aplicando los principios de Strang de eficiencia computacional.\n\n## 10. Glosario técnico\n\n- **Escalar:** Un número real que estira o encoge un vector.\n- **Vector:** Una flecha en el espacio Rⁿ o una lista ordenada de datos.\n- **Matriz:** Un conjunto de vectores columna que representan un sistema o transformación.\n- **Combinación Lineal:** La suma de vectores escalados (cv+dw).\n- **Espacio Vectorial:** El conjunto de todas las combinaciones posibles; el \"universo\" de datos disponible.\n- **Independencia Lineal:** Un conjunto de vectores es independiente si ninguno puede ser descartado sin reducir el \"span\" (el espacio que llenan).\n\n## 11. Resumen y Checklist de comprensión\n\nLos vectores y matrices no son abstracciones; son la infraestructura digital de la Industria 4.0. Dominar la combinación lineal es el primer paso para controlar la complejidad de cualquier activo pesado.\n\nChecklist de autoevaluación:\n\n- Si el vector de vibración de su motor es v y el de temperatura es w, ¿por qué la combinación v+w solo tiene sentido matemático si definimos un espacio de estado conjunto?\n- ¿Puede identificar si las variables de presión en su pipeline son linealmente independientes o si una depende de las otras?\n- ¿Cómo interpreta el \"vector cero\" en un sistema de balance de masas de una planta procesadora?\n- Si una matriz de sensores es simétrica, ¿qué información nos da sobre la correlación de las fallas?\n- ¿Por qué el Gemelo Digital falla cuando el vector de estado real sale del subespacio generado por los datos históricos?","m07-t03":"# Regresión logística\n\n## La idea en una frase\n\nLa regresión logística estima la probabilidad de que ocurra un evento binario (paga o no paga, falla o no falla) pasando una combinación lineal de las variables por una curva en forma de S.\n\n## Cómo funciona\n\nPrimero se calcula un puntaje lineal: z = β₀ + β₁x₁ + … + βₖxₖ. Ese puntaje puede valer cualquier número, así que se comprime al intervalo entre 0 y 1 con la función sigmoide:\n\np = 1 / (1 + e^(−z))\n\nSi se despeja z se obtiene la forma que da nombre al modelo: ln(p / (1 − p)) = z. El lado izquierdo es el logit, el logaritmo de las chances (odds). El modelo es lineal en el logit, no en la probabilidad.\n\nDe ahí sale la interpretación de los coeficientes: cuando x₁ sube una unidad, las chances se multiplican por e^β₁. Si β₁ = 0,7, las chances se duplican aproximadamente, porque e^0,7 ≈ 2. El efecto sobre la probabilidad no es constante: es grande cerca de p = 0,5 y casi nulo en los extremos.\n\n## Cómo se ajusta\n\nNo se minimizan errores al cuadrado. Se buscan los coeficientes que hacen más verosímiles los datos observados, maximizando la log-verosimilitud:\n\nLL = Σ [ y·ln(p) + (1 − y)·ln(1 − p) ]\n\nNo existe una fórmula cerrada como en mínimos cuadrados. Se resuelve de forma iterativa, con Newton-Raphson (también llamado IRLS) o con descenso de gradiente. El gradiente tiene una forma muy simple: Xᵀ(y − p), el error de probabilidad ponderado por cada variable. La función es convexa, así que si existe un óptimo finito, es único.\n\nEl negativo de la log-verosimilitud promedio es la log-loss o entropía cruzada, la misma función de pérdida que usan las redes neuronales para clasificar.\n\n## Supuestos\n\n1. **Respuesta binaria.** Hay extensiones para varias clases (multinomial) y para clases ordenadas.\n2. **Observaciones independientes.** Datos repetidos del mismo cliente o del mismo equipo rompen este supuesto.\n3. **Linealidad en el logit.** Cada variable continua debe relacionarse de forma lineal con el logaritmo de las chances. Es el supuesto que más se incumple y el que menos se revisa.\n4. **Sin multicolinealidad fuerte.** Variables muy correlacionadas inflan la varianza de los coeficientes y los vuelven inestables.\n5. **Sin separación perfecta.** Si una variable separa por completo las dos clases, la verosimilitud no tiene máximo finito y los coeficientes crecen sin límite.\n6. **Muestra suficiente.** Importa el número de eventos de la clase minoritaria, no el total de filas. La guía habitual de unos diez eventos por variable es una referencia, no una ley.\n\nLo que **no** supone: normalidad de las variables, homocedasticidad, ni una relación lineal entre x y la probabilidad.\n\n## Por qué no tiene R²\n\nEl R² clásico mide qué fracción de la varianza explica el modelo, y eso exige residuos continuos. Aquí la respuesta es 0 o 1. Por eso se usan sustitutos:\n\n- **Pseudo-R² de McFadden:** 1 − LL / LL₀, donde LL₀ es la log-verosimilitud de un modelo que solo predice la tasa promedio. Sus valores son mucho más bajos que los de un R² lineal: McFadden señaló que entre 0,2 y 0,4 ya indica un ajuste muy bueno.\n- **Log-loss:** cuanto más baja, mejor; castiga con dureza las predicciones seguras y equivocadas.\n- **AUC, KS y Gini:** miden capacidad de ordenar, no calibración.\n- **Curva de calibración:** compara la probabilidad predicha con la frecuencia observada.\n\n## Curiosidades\n\n- Se llama regresión, pero casi siempre se usa para clasificar. Lo que \"regresa\" es una probabilidad.\n- Una neurona con activación sigmoide es exactamente una regresión logística. Una red neuronal para clasificación binaria termina en una.\n- La curva logística nació en demografía: Pierre-François Verhulst la propuso en el siglo XIX para describir poblaciones que crecen hasta un tope.\n- La frontera de decisión es una recta (o un hiperplano), aunque la curva de probabilidad sea una S.\n- El umbral de 0,5 no es sagrado. Si un falso negativo cuesta diez veces más que un falso positivo, el umbral debe bajar.\n- Con clases perfectamente separables, el modelo \"más seguro de sí mismo\" es también el que no converge.\n\n## En minería y cemento\n\nProbabilidad de falla de un equipo en el próximo turno a partir de vibración y temperatura; probabilidad de que un lote salga fuera de especificación según variables del proceso. La ventaja frente a modelos más complejos es que el signo y el tamaño de cada coeficiente se pueden discutir con el ingeniero de planta.\n\n## En banca\n\nEs la base histórica del credit scoring: estima la probabilidad de incumplimiento y sus coeficientes se traducen en puntos de una scorecard. Su interpretabilidad y su estabilidad la mantienen vigente como modelo de referencia frente al cual se comparan los modelos de boosting.\n\n## Errores comunes\n\n- Leer β como \"cambio en la probabilidad\". Es cambio en el logit.\n- Evaluar con exactitud cuando las clases están desbalanceadas: un modelo que siempre dice \"no\" acierta el 95 % si el evento ocurre el 5 % de las veces.\n- Regularizar sin escalar las variables: la penalización castiga más a las de escala pequeña.\n- Confundir buena discriminación con buena calibración. Un modelo puede ordenar bien y dar probabilidades infladas.\n\n## Pruébalo\n\nEn el Laboratorio, mueve β₀ y β₁ y observa cómo cambian la curva, la log-loss, el pseudo-R² y la matriz de confusión. Luego pulsa el ajuste por máxima verosimilitud y compara con tu intento manual.","m03-t04":"# Regresión lineal y sus supuestos\n\n## La idea en una frase\n\nLa regresión lineal resume la relación entre una respuesta continua y una o más variables con la recta (o el plano) que deja los errores al cuadrado lo más pequeños posible.\n\n## El modelo\n\ny = β₀ + β₁x + ε. El término ε recoge todo lo que la recta no explica. Mínimos cuadrados ordinarios (OLS) elige β₀ y β₁ para minimizar la suma de residuos al cuadrado, SSE = Σ(yᵢ − ŷᵢ)². En el caso simple hay fórmula cerrada:\n\n- β₁ = cov(x, y) / var(x)\n- β₀ = ȳ − β₁·x̄\n\nLa recta siempre pasa por el punto de las medias (x̄, ȳ).\n\n## Qué mide el R²\n\nR² = 1 − SSE / SST, donde SST = Σ(yᵢ − ȳ)² es el error que cometería quien predijera siempre la media. R² es entonces la fracción de esa variabilidad que la recta logra explicar.\n\n- R² = 1: todos los puntos caen sobre la recta.\n- R² = 0: la recta no mejora a la media.\n- R² negativo: solo aparece cuando la recta no fue ajustada por OLS (o se evalúa en datos nuevos) y resulta peor que predecir la media. En el Laboratorio lo verás al mover la recta lejos de los puntos.\n\n## Supuestos\n\n1. **Linealidad.** La media de y cambia de forma lineal con x.\n2. **Independencia de los errores.** En series de tiempo suele fallar: los errores vecinos se parecen.\n3. **Homocedasticidad.** La dispersión de los errores es la misma en todo el rango de x.\n4. **Normalidad de los errores.** No hace falta para estimar los coeficientes; hace falta para que los intervalos y las pruebas sean exactos en muestras pequeñas.\n5. **Sin multicolinealidad perfecta** y variables explicativas no correlacionadas con el error.\n\nCon los supuestos 1 a 3 y 5, OLS es el estimador lineal insesgado de menor varianza (teorema de Gauss-Markov).\n\n## Curiosidades\n\n- \"Regresión\" viene de Francis Galton, que observó que los hijos de padres muy altos tendían a ser menos altos que ellos: regresaban hacia la media.\n- El cuarteto de Anscombe son cuatro conjuntos de datos con la misma recta y prácticamente el mismo R², y cuatro gráficos por completo distintos. Por eso se grafica antes de confiar en un número.\n- R² nunca baja al agregar una variable, aunque sea ruido. Para comparar modelos se usa el R² ajustado o un criterio de validación.\n- Un solo valor atípico con mucha palanca puede girar la recta entera. Actívalo en el Laboratorio.\n- Un R² alto no prueba causalidad ni que el modelo sea correcto; un R² bajo no impide que un coeficiente sea útil.\n\n## En minería y cemento\n\nRelacionar el consumo específico de energía de un molino con el tonelaje y la dureza del mineral, o la resistencia del cemento con la finura. Los residuos graficados contra el tiempo delatan derivas del proceso.\n\n## En banca\n\nModelos de pérdida dado el incumplimiento, proyección de saldos y, sobre todo, como línea base contra la que se justifica cualquier modelo más complejo.\n\n## Pruébalo\n\nEn el Laboratorio, mueve el intercepto y la pendiente para acercar la recta a los puntos y mira subir el R². Después sube el ruido, agrega el valor atípico y compara con el ajuste de mínimos cuadrados."};

async function runBatch(){
  if(busy||batch)return;
  const list=topicsOf(AMB[current().an-1]).filter(x=>!peek(x.id).leccion.trim()&&!LEC[x.id]);
  if(!list.length)return;
  batch={stop:false,done:0,n:list.length};busy=true;render();
  for(const t of list){
    if(batch.stop)break;
    note("Escribiendo la lección "+(batch.done+1)+" de "+batch.n+": "+t.name+". Puedes seguir leyendo.");
    try{const r=await ask(lecPrompt(t),{tier:"complex"});const p=T(t.id);p.leccion=r.text.trim();if(p.st===0)p.st=1;touch(t.id);batch.done++}
    catch(e){const d=batch.done;busy=false;batch=null;render();note(why(e)+" Se escribieron "+d+" lecciones antes de parar.",true);return}
  }
  const d=batch.done;busy=false;batch=null;render();note("Listo: "+d+" lecciones nuevas en este ámbito, escritas con "+lastModel+".");
}

function confetti(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99";
  c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext("2d");
  const P=Array.from({length:110},()=>({x:c.width/2,y:c.height*.38,vx:(Math.random()-.5)*16,vy:-Math.random()*13-3,c:COL[Math.random()*COL.length|0],s:5+Math.random()*6,r:Math.random()*6}));
  let n=0;(function f(){x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.38;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(++n<100)requestAnimationFrame(f);else c.remove()})();
}

/* ---------- copiar y descargar ---------- */
async function copyText(text){
  try{await navigator.clipboard.writeText(text);note("Copiado.");return true}
  catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}
    ta.remove();note(ok?"Copiado.":"No se pudo copiar. Selecciona el texto y cópialo a mano.",!ok);return ok}
}
async function save(filename,data){
  if(!dl){note("La descarga no está disponible en esta vista. Usa el botón Copiar.",true);return}
  try{await dl.save({filename,data});note("Archivo guardado: "+filename)}
  catch(e){note(e&&e.code==="declined"?"Descarga cancelada.":"No se pudo descargar el archivo.",e&&e.code!=="declined")}
}
function printable(t,p){
  return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>'+esc(t.name)+'</title><style>@page{size:A4;margin:22mm 20mm}body{font:11.5pt/1.6 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;color:#1d1d1f;max-width:170mm;margin:auto;padding:12mm 0}header{font-weight:600;font-size:9.5pt;color:#6e6e73;border-bottom:1px solid #d2d2d7;padding-bottom:8px;margin-bottom:22px}h2{font-size:26pt;line-height:1.1;letter-spacing:-.03em}h3{font-size:15pt;letter-spacing:-.02em;margin-top:22px}h4,h5{font-size:12pt}pre{font:9.5pt Menlo,Consolas,monospace;background:#f5f5f7;padding:10px;border-radius:8px;white-space:pre-wrap}footer{margin-top:26px;font-size:9pt;color:#6e6e73;border-top:1px solid #d2d2d7;padding-top:8px}</style></head><body><header>Fabrishio · Ciencia de Datos · Ámbito '+pad(t.an)+" "+esc(t.aName)+'</header>'+md(p.resumen)+'<footer>'+esc(S.cfg.repo)+'</footer></body></html>';
}

/* ---------- eventos ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,t=current();
  if(act==="copyopen"){copyText(peek(t.id).post);return}
  e.preventDefault();
  if(act==="sel"||act==="go"){UI={ci:0,flip:false,ans:{}};S.cfg.sel=b.dataset.id;if(act==="go"){S.cfg.tab="linkedin";location.hash="estudio"}touch("cfg");render();window.scrollTo(0,0)}
  else if(act==="go2"){location.hash="estudio"}
  else if(act==="goamb"){const ts=topicsOf(AMB.find(a=>a.id===b.dataset.a)),n=ts.find(x=>stage(x.id)<2)||ts[0];UI={ci:0,flip:false,ans:{}};S.cfg.sel=n.id;S.cfg.tab="leer";S.cfg.open[b.dataset.a]=true;touch("cfg");location.hash="estudio";window.scrollTo(0,0)}
  else if(act==="tab"){S.cfg.tab=b.dataset.v;touch("cfg");render()}
  else if(act==="st"){T(t.id).st=+b.dataset.v;touch(t.id);render();if(b.dataset.v==="2")confetti()}
  else if(act==="copy"){const el=document.getElementById(b.dataset.from);copyText(el.value!==undefined?el.value:el.textContent)}
  else if(act==="chatq")sendChat(b.dataset.q);
  else if(act==="figq")makeFig(b.dataset.q+" para el tema "+t.name);
  else if(act==="chatclear"){T(t.id).chat=[];touch(t.id);render()}
  else if(act==="figdel"){T(t.id).charts.splice(+b.dataset.i,1);touch(t.id);render()}
  else if(act==="figpng"){
    try{const url=await Plotly.toImage($("#plot-"+b.dataset.i),{format:"png",width:1600,height:900});
      const bin=atob(url.split(",")[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      save(slug(peek(t.id).charts[+b.dataset.i].titulo||"grafico")+".png",new Blob([u]))}
    catch(_){note("No se pudo exportar el gráfico.",true)}
  }
  else if(act==="theme"){setTheme(themeNow()==="dark"?"light":"dark");render()}
  else if(act==="lab"){L.lab=b.dataset.v;render()}
  else if(act==="labgo"){L.lab=b.dataset.v;location.hash="laboratorio";window.scrollTo(0,0)}
  else if(act==="fitlin")fitLin();
  else if(act==="fitlog")fitLog();
  else if(act==="gencur")stream("curios",REGLAS+"\n\n"+ctx(t)+"\nTAREA: escribe 6 curiosidades del tema que ayuden a recordarlo: origen del nombre o historia, un caso límite sorprendente, una conexión con otro método, un error famoso, un uso en minería o cemento y uno en banca. Cada una en una viñeta de 2 o 3 frases, en Markdown. Solo hechos de los que estés seguro; si dudas de un dato, no lo incluyas. Devuelve solo la lista.","default");
  else if(act==="genlec")genLeccion();
  else if(act==="batch")runBatch();
  else if(act==="batchstop"){if(batch){batch.stop=true;note("Se detendrá al terminar la lección en curso.")}}
  else if(act==="copylec"){const p=peek(t.id);copyText(p.leccion.trim()||p.fuente)}
  else if(act==="genprac")genPrac();
  else if(act==="flip"){UI.flip=!UI.flip;$("#flash").classList.toggle("f",UI.flip)}
  else if(act==="cardgo"){UI.ci=+b.dataset.i;UI.flip=false;render()}
  else if(act==="cardyes"||act==="cardno"){const p=T(t.id),i=Math.min(UI.ci,p.cards.length-1);p.known=(p.known||[]).filter(k=>k!==i);if(act==="cardyes")p.known.push(i);
    UI.ci=(i+1)%p.cards.length;UI.flip=false;touch(t.id);render();if(p.known.length===p.cards.length&&act==="cardyes")confetti()}
  else if(act==="ans"){const p=T(t.id);UI.ans[+b.dataset.k]=+b.dataset.j;
    if(Object.keys(UI.ans).length===p.quiz.length){const g=p.quiz.filter((q,k)=>UI.ans[k]===q.c).length;p.best=Math.max(p.best??0,g);touch(t.id);if(g===p.quiz.length)confetti()}
    render()}
  else if(act==="quizreset"){UI.ans={};render()}
  else if(act==="genres")genResumen();
  else if(act==="genpost")genPost();
  else if(act==="genguion")genGuion();
  else if(act==="dlmd"){const p=peek(t.id);p.resumen.trim()?save("resumen-claude.md",p.resumen):note("Todavía no hay resumen. Genéralo en el paso Resumen.",true)}
  else if(act==="dlinf"){const p=peek(t.id);p.fuente.trim()?save("informe-notebooklm.md","# "+t.name+"\n\n"+p.fuente):note("Todavía no pegaste el informe de NotebookLM en el paso Estudiar.",true)}
  else if(act==="dlhtml"){const p=peek(t.id);p.resumen.trim()?save(slug(t.name)+"-resumen.html",printable(t,p)):note("Todavía no hay resumen que descargar.",true)}
  else if(act==="pubtoday"){const p=T(t.id);p.pub=iso(new Date());p.st=2;touch(t.id);render();confetti()}
  else if(act==="deltopic"){const a=b.dataset.a;S.cfg.custom[a]=(S.cfg.custom[a]||[]).filter(x=>x.id!==b.dataset.id);touch("cfg");render()}
  else if(act==="import"){
    const a=$("#imp-a").value,lines=$("#imp-t").value.split("\n").map(s=>s.replace(/^\s*[-*•\d.)]+\s*/,"").trim()).filter(Boolean);
    if(!lines.length){note("Pega al menos un tema.",true);return}
    if($("#imp-r").checked){S.cfg.hideBase[a]=true;S.cfg.custom[a]=[]}
    const now=Date.now().toString(36);S.cfg.custom[a]=(S.cfg.custom[a]||[]).concat(lines.map((name,i)=>({id:a+"-c"+now+i.toString(36),name:name.slice(0,140)})));
    touch("cfg");render();note(lines.length+" temas cargados.")
  }
  else if(act==="restore"){const a=$("#imp-a").value;delete S.cfg.hideBase[a];touch("cfg");render();note("Temario base restaurado.")}
  else if(act==="backup")save("data-science-experto-respaldo.json",JSON.stringify(S,null,1));
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.dataset.form==="chat"){const i=$("#chat-in"),v=i.value;i.value="";sendChat(v)}
  else if(f.dataset.form==="fig"){makeFig($("#fig-in").value)}
  else if(f.dataset.add){const a=f.dataset.add,i=f.querySelector("input"),name=i.value.trim();if(!name)return;
    const id=a+"-c"+Date.now().toString(36);(S.cfg.custom[a]=S.cfg.custom[a]||[]).push({id,name:name.slice(0,140)});S.cfg.sel=id;S.cfg.open[a]=true;touch("cfg");render()}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.lab){const k=el.dataset.lab;L[k]=el.type==="checkbox"?+el.checked:+el.value;drawLab();return}
  if(el.id==="q"){S.q=el.value;const pos=el.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos);return}
  if(el.dataset.f){const t=current(),p=T(t.id),f=el.dataset.f;p[f]=el.value;
    if(f==="post"&&el.value.trim()&&!p.readyAt)p.readyAt=Date.now();
    if(f==="fuente"&&p.st===0&&el.value.trim())p.st=1;
    touch(t.id);
    const c=$("#cnt-"+f);if(c)c.textContent=f==="post"?el.value.length+" de 3 000 caracteres":f==="resumen"?words(el.value)+" palabras · unas "+Math.round(words(el.value)/480*10)/10+" páginas":words(el.value)+" palabras";
    if(f==="resumen"){const d=$("#doc");if(d)d.innerHTML=md(el.value)}}
  else if(el.dataset.c){S.cfg[el.dataset.c]=el.value.trim();touch("cfg")}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.file){const t=current();T(t.id).files[el.dataset.file]=el.checked;touch(t.id);render()}
  else if(el.dataset.f==="pub"){render()}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.amb&&!S.q){S.cfg.open[d.dataset.amb]=d.open;local("cfg")}},true);
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)&&/^(chat-in|fig-in)$/.test(e.target.id)){e.target.form.requestSubmit()}});
window.addEventListener("hashchange",render);

/* ---------- inicio ---------- */
loadLocal();try{const th=localStorage.getItem("dse-theme");if(th)document.documentElement.setAttribute("data-theme",th)}catch(e){}
render();setSync();{const b=$("#theme");if(b)b.textContent=themeNow()==="dark"?"Modo claro":"Modo oscuro"}
use("sample").then(s=>{ai=s});
use("downloads").then(d=>{dl=d});
loadCloud();
</script>
