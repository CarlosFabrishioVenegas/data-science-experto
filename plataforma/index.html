la impureza de Gini ('gini') o la entropía de información ('entropy'). Para regresión, el estándar es el error cuadrático medio ('squared_error' o 'mse') o el error absoluto medio ('absolute_error' o 'mae'). Valores típicos: Clasificación: ['gini', 'entropy', 'log_loss']; Regresión: ['squared_error', 'friedman_mse', 'absolute_error', 'poisson']. Default en scikit-learn = 'gini' (clasificación), 'squared_error' (regresión).","alto":"N/A.","bajo":"N/A.","inter":"N/A.","tun":"Por regla empírica general. Para clasificación, mantener 'gini' por su mayor velocidad de cómputo, ya que no requiere calcular logaritmos de forma continua. Sintonizar a 'entropy' o 'absolute_error' si se sospecha de presencia de anomalías severas en el dataset de entrenamiento y se busca mayor robustez.","err":"Forzar el uso de 'absolute_error' ('mae') en regresores CART sobre datasets masivos sin justificación de outliers, ralentizando de forma catastrófica el tiempo de entrenamiento de la CPU debido a que requiere ordenar y rastrear constantemente las medianas en cada una de las divisiones candidates.","apl":"Modelado de fuga de clientes (churn) de cuentas corrientes bancarias. Usar 'entropy' permite cuantificar directamente la ganancia de información (Information Gain) en cada división lógica del árbol, facilitando al equipo de marketing entender el valor porcentual de reducción de incertidumbre que aporta saber si un cliente posee o no una tarjeta de crédito activa.","pri":"OPCIONAL","code":"criterion"},{"name":"Poda por Costo-Complejidad","nivel":"Avanzado","que":"Poda posterior al entrenamiento (Minimal Cost-Complexity Pruning): elimina las ramas cuya ganancia no compensa su complejidad, ponderada por ccp_alpha.","val":"[0.0, 0.001, 0.005, 0.01, 0.05]. Default: 0.0 (sin poda).","alto":"Árbol excesivamente podado; queda casi solo la raíz (subajuste).","bajo":"Sin poda; el árbol crece hasta sobreajustar.","inter":"Complementa max_depth y min_samples_leaf. Actúa después del crecimiento, no durante.","tun":"Usar cost_complexity_pruning_path() para obtener alphas candidatos y validar por CV (ver código).","err":"Controlar el sobreajuste solo con max_depth e ignorar la poda formal, teóricamente mejor.","apl":"Obtener un árbol compacto y estable para explicar una decisión a un equipo no técnico, sin ramas espurias por ruido.","pri":"IMPORTANTE","code":"ccp_alpha"},{"name":"Máximo Número de Hojas","nivel":"Intermedio","que":"Limita el número de hojas terminales, forzando un crecimiento best-first. Alternativa directa a max_depth para acotar la complejidad.","val":"[None, 10, 16, 32, 64]. Default: None.","alto":"Equivale a None; sin efecto práctico.","bajo":"Árbol demasiado simple (subajuste).","inter":"Con max_depth: si se fija max_leaf_nodes, max_depth puede quedar en None.","tun":"Útil cuando se necesita un número exacto de reglas finales.","err":"Desconocer el parámetro y depender solo de max_depth.","apl":"Generar un árbol con exactamente 8 hojas para traducirlo en un conjunto reducido de reglas operativas legibles.","pri":"IMPORTANTE","code":"max_leaf_nodes"}]},{"n":"7","t":"Random Forest","hp":[{"name":"Número de Árboles en el Ensamble","nivel":"Básico","que":"Define la cantidad exacta de árboles de decisión individuales e independientes que se construirán para formar el bosque cooperativo. El resultado final del ensamble será el promedio aritmético directo de las predicciones en regresión, o la votación de la mayoría de etiquetas en clasificación.","val":"[50, 100, 200, 500, 1000]. Default en scikit-learn = 100.","alto":"Provoca un desperdicio masivo de recursos de cómputo de CPU y memoria. El modelo aumentará su tiempo de procesamiento de forma lineal al requerir construir y almacenar cientos de árboles adicionales, pero la precisión del ensamble se estancará en una meseta (la varianza del modelo no disminuye indefinidamente una vez que el bosque converge).","bajo":"Deteriora severamente el rendimiento y la estabilidad de las predicciones del bosque. Al contar con muy pocos árboles, no se explota el beneficio de la agregación bootstrap (bagging) para neutralizar la varianza del modelo, resultando en predicciones inestables y sensibles al subconjunto de entrenamiento.","inter":"Su valor se puede sintonizar junto con n_jobs (cantidad de procesadores de CPU asignados en paralelo). Aumentar n_estimators no incrementa el riesgo de sobreajuste de forma matemática debido al principio del promedio asintótico del bagging.","tun":"Configurar un valor moderadamente alto (e.g., 200 o 300) y evaluar la métrica de validación cruzada. Si el hardware disponible de la CPU lo permite, mantener un número elevado sin necesidad de hacer una sintonía fina exhaustiva en este hiperparámetro específico.","err":"Realizar búsquedas de cuadrícula costosas tratando de encontrar el \"mejor\" n_estimators exacto (e.g. comparar 100 vs 105), desperdiciando ciclos de procesamiento en un hiperparámetro que solo requiere ser \"suficientemente grande\" para converger.","apl":"Estimación del rendimiento metalúrgico de mineral de cobre triturado en base a lecturas de vibración mecánica y flujo de agua. Configurar n_estimators=300 estabiliza por completo las predicciones contra picos instantáneos de ruido mecánico del molino autógeno de planta.","pri":"ESENCIAL","code":"n_estimators"},{"name":"Selección Aleatoria de Características para Divisiones","nivel":"Básico","que":"Define la cantidad de variables predictoras que se seleccionarán completamente de forma aleatoria en cada nodo individual de cada árbol del bosque como candidatas a evaluar para realizar el mejor corte. Es el hiperparámetro crucial para descorrelacionar los árboles entre sí.","val":"['sqrt', 'log2', None] o fracciones numéricas flotantes (e.g. 0.2, 0.5). Default en scikit-learn = 'sqrt' (para clasificación), 1.0 o None (para regresión).","alto":"(e.g. 1.0 o None). Los árboles de decisión del bosque se volverán muy similares y altamente correlacionados entre sí al evaluar siempre las mismas variables, anulando gran parte del beneficio estadístico de la reducción de varianza del ensamble.","bajo":"Se evalúan muy pocas variables de forma aleatoria en cada nodo. El modelo ganará velocidad, pero sus árboles individuales perderán drásticamente capacidad predictiva, deteriorando el rendimiento predictivo del bosque por subajuste localizado de los estimadores individuales.","inter":"N/A.","tun":"Por regla empírica general. Para clasificación, mantener el default de 'sqrt' (que equivale a sqrtp). Para regresión, el óptimo suele estar cerca de 0.3 o 1/3 de las variables disponibles.","err":"No sintonizar max_features en problemas de regresión industrial de alta dimensión, permitiendo que scikit-learn utilice todas las variables por defecto (max_features=None), reduciendo el bosque a un simple bagging correlacionado ineficiente.","apl":"Detección de lavado de dinero en base a patrones de comportamiento transaccional del cliente. Sintonizar un max_features='sqrt' asegura que variables transaccionales ruidosas pero comunes no enmascaren a variables de alerta silenciosas de comportamiento inusual, obligando a los árboles a explorar variables predictoras alternativas.","pri":"ESENCIAL","code":"max_features"},{"name":"Uso de Bootstrap para Muestras","nivel":"Intermedio","que":"Define si los árboles de decisión individuales se entrenarán sobre muestras de entrenamiento tomadas de forma aleatoria con reemplazo de los datos originales de entrenamiento (muestreo bootstrap de tamaño n), o si por el contrario cada uno de los árboles se ajustará sobre el conjunto completo de datos de entrenamiento al 100%.","val":"Booleano: True o False. Default en scikit-learn = True.","alto":"N/A.","bajo":"Si se desactiva (bootstrap=False), todos los árboles de decisión se entrenarán sobre el conjunto exacto de datos de entrenamiento completo al 100%. Esto elimina el beneficio de la variabilidad del bagging, provocando un mayor sobreajuste y haciendo inútil el cálculo interno del error fuera de bolsa (Out-of-Bag error).","inter":"Si bootstrap=True, se habilita el cálculo del estimador oob_score, permitiendo evaluar el error de generalización en muestras \"fuera de bolsa\" de forma gratuita sin necesidad de realizar validación cruzada explícita.","tun":"Mantener siempre en True en la práctica industrial para garantizar la correcta reducción de varianza del bosque.","err":"Desactivar bootstrap esperando aumentar la precisión en entrenamiento, perdiendo por completo la propiedad fundamental de descorrelación del ensamble.","apl":"Clasificación de la propensión a la fuga de clientes. Mantener bootstrap=True habilita el uso de las métricas internas de OOB (Out-of-Bag) para estimar el error de generalización del modelo sin desperdiciar datos adicionales de validación en fases preliminares del proyecto.","pri":"IMPORTANTE","code":"bootstrap"},{"name":"Muestras Mínimas por Nodo Hoja","nivel":"Intermedio","que":"Al igual que en los árboles CART de base, restringe la cantidad mínima admitida de observaciones dentro de cada una de las hojas finales de todos los árboles del bosque. Controla indirectamente el tamaño final y la profundidad de crecimiento de los árboles individuales del bosque.","val":"Enteros: [1, 5, 10, 20, 50]. Default en scikit-learn = 1.","alto":"Suaviza excesivamente las predicciones del bosque. Conduce a un subajuste severo al forzar a que los árboles estimadores individuales promedien demasiadas muestras en sus decisiones, perdiendo la finura predictiva de las variables del proceso.","bajo":"Permite que los árboles individuales crezcan hasta su máxima profundidad lógica posible con hojas puras, aumentando la varianza del modelo. Sin embargo, la varianza de Random Forest se mitiga internamente de forma natural gracias al principio del promedio del bagging.","inter":"Interactúa de forma directa con max_depth. Restringir min_samples_leaf a un valor mayor a 1 estabiliza el modelo de regresión y reduce drásticamente el tamaño en disco del archivo serializado final del modelo (pkl / joblib).","tun":"Búsqueda en cuadrícula en un rango acotado: [1, 3, 5, 10]. Para problemas industriales de regresión con alto ruido instrumental en planta, valores de 3 a 10 son recomendados.","err":"Mantener min_samples_leaf=1 en problemas industriales con millones de registros de sensores ruidosos, generando archivos serializados del modelo inmensos (e.g. gigabytes) que ralentizan de forma prohibitiva la memoria del servidor de producción en el despliegue del FastAPI de planta.","apl":"Predicción del nivel de emisión de material particulado por la chimenea en miligramos en base a la velocidad de giro de los extractores. Configurar un min_samples_leaf=5 previene que lecturas de ruido puntual de los sensores generen picos absurdos e inexplicables en las predicciones en vivo.","pri":"IMPORTANTE","code":"min_samples_leaf"},{"name":"Estimación Out-of-Bag","nivel":"Intermedio","que":"Calcula el error de generalización usando, para cada árbol, las muestras que no entraron en su bootstrap. Da una validación interna casi gratis.","val":"[True, False]. Default: False.","alto":"N/A (booleano).","bajo":"N/A.","inter":"Requiere bootstrap=True; es inválido con bootstrap=False.","tun":"Activarlo como estimación rápida preliminar y complementar con validación cruzada formal.","err":"Activarlo con bootstrap=False, lo que genera un error.","apl":"Validar el modelo cuando cada etiqueta es cara de obtener (ensayos de laboratorio), sin sacrificar datos para un conjunto de validación separado.","pri":"IMPORTANTE","code":"oob_score"}]},{"n":"8","t":"Gradient Boosting","hp":[{"name":"Tasa de Aprendizaje","nivel":"Básico","que":"Multiplica el valor de predicción aportado por cada nuevo árbol que se añade al ensamble secuencial: Fm(x) = Fm-1(x) + nu gammam hm(x). Actúa como un factor de contracción de peso (shrinkage) para desacelerar la velocidad de ajuste del modelo, asegurando que cada árbol individual aporte únicamente un pequeño paso correctivo a la predicción acumulada.","val":"[0.001, 0.01, 0.05, 0.1, 0.2]. Default en scikit-learn = 0.1.","alto":"(e.g. learning_rate >= 0.5). El modelo converge demasiado rápido de forma impaciente sobre las muestras de entrenamiento. Esto provoca un sobreajuste inmediato, donde el algoritmo memoriza los patrones específicos de entrenamiento y pierde la capacidad de generalización fina.","bajo":"(e.g. learning_rate <= 0.001). El aprendizaje secuencial se vuelve excesivamente lento y conservador. Se requerirán miles de árboles adicionales (n_estimators) para lograr ajustar los datos de forma correcta, prolongando de forma insostenible el tiempo computacional de entrenamiento y arriesgando subajuste si no se compensa.","inter":"Estrechamente acoplado con n_estimators (relación inversamente proporcional). Si disminuyes la tasa de aprendizaje, debes incrementar de forma proporcional la cantidad de árboles para asegurar la convergencia completa del ensamble.","tun":"Fijar una tasa de aprendizaje moderadamente baja (e.g. 0.05 o 0.1) durante la exploración inicial, y luego afinar el número de árboles óptimo mediante validación cruzada con parada temprana (early_stopping) para evitar el sobreajuste.","err":"Disminuir drásticamente la tasa de aprendizaje a un valor infinitesimal (como 1e-5) tratando de maximizar la precisión, pero olvidando incrementar el número de árboles predictivos, dejando al ensamble a medio entrenar (subajuste extremo).","apl":"Pronóstico semanal de la demanda de efectivo en cajeros automáticos (ATMs) del BCP en base a calendarios festivos y ubicación de agencias. Ajustar learning_rate=0.03 con un número alto de árboles secuenciales asegura que el modelo capture sutilmente las tendencias de retiro sin sobrereaccionar ante feriados imprevistos de un año específico.","pri":"ESENCIAL","code":"learning_rate o shrinkage"},{"name":"Número de Árboles Secuenciales","nivel":"Básico","que":"Define la cantidad total de árboles secuenciales débiles que se construirán paso a paso en el proceso iterativo del ensamble para corregir los residuos acumulados de los pasos previos.","val":"[100, 200, 500, 1000]. Default en scikit-learn = 100.","alto":"Conduce a un sobreajuste severo del ensamble secuencial. A diferencia de Random Forest, donde añadir árboles adicionales nunca sobreajusta el modelo, en Gradient Boosting un número excesivo de árboles secuenciales inevitablemente intentará ajustar y memorizar los residuos ruidosos y outliers individuales de entrenamiento.","bajo":"El modelo sufrirá de subajuste severo, dejando al ensamble de árboles débiles a medio camino de corregir los errores iniciales de predicción de la planta.","inter":"Enlazado con learning_rate. Se recomienda usarlo junto con el parámetro validation_fraction y un disparador de parada temprana (n_iter_no_change o early_stopping_rounds) para detener de forma segura la construcción de nuevos árboles una vez que el error de validación empiece a incrementarse.","tun":"No tunear de forma manual. Configurar un valor alto de estimadores (e.g. 1000) y habilitar la parada temprana utilizando validación cruzada, permitiendo que el algoritmo decida de forma automática el corte óptimo basado en datos.","err":"Intentar sintonizar n_estimators como un número constante fijo mediante un GridSearch estático sin parada temprana, desperdiciando horas de cómputo sobreajustando el modelo.","apl":"Pronóstico de consumo eléctrico acumulado por hora en hornos de arco eléctrico de acería. Sintonizar el número óptimo de árboles mediante parada temprana previene que el modelo asuma picos de consumo causados por mantenimiento correctivo inusual como comportamientos cíclicos normales.","pri":"ESENCIAL","code":"n_estimators"},{"name":"Fracción de Muestras para cada Árbol","nivel":"Intermedio","que":"Define la fracción de muestras de entrenamiento del total que se seleccionarán al azar y sin reemplazo para entrenar cada uno de los árboles individuales secuenciales del ensamble (Gradient Boosting Estocástico).","val":"Rango cerrado: [0.5, 0.7, 0.8, 1.0]. Default en scikit-learn = 1.0 (evaluar todas las muestras).","alto":"(e.g. 1.0, el default). El modelo se comportará de forma puramente determinista al procesar el gradiente sobre el conjunto completo de datos, perdiendo la oportunidad de inyectar diversidad y reducir la varianza general mediante aleatoriedad estocástica.","bajo":"(e.g. subsample <= 0.5). Los árboles individuales secuenciales perderán de forma crítica su capacidad de ajuste debido a la escasez de datos informativos disponibles para evaluar, aumentando el sesgo del modelo por subajuste localizado de los estimadores secuenciales.","inter":"Sintonizar un subsample menor a 1.0 habilita el Gradient Boosting Estocástico, reduciendo drásticamente el tiempo de cómputo general del entrenamiento al procesar menos muestras en cada paso del gradiente.","tun":"Configurar valores de 0.8 o 0.9 por defecto para problemas operacionales ruidosos. Rara vez se requiere realizar un GridSearch exhaustivo sobre este hiperparámetro específico.","err":"Ajustar subsample por debajo de 0.3 en datasets industriales pequeños creyendo que evitará el sobreajuste de forma milagrosa, ignorando que solo está destruyendo la poca señal informativa que posee su conjunto de entrenamiento.","apl":"Clasificación del perfil de riesgo de transacciones de comercio electrónico en banca digital. Usar subsample=0.8 inyecta robustez en el Gradient Boosting Estocástico, filtrando picos transaccionales inusuales de días festivos específicos sin alterar la precisión del motor en vivo.","pri":"IMPORTANTE","code":"subsample"},{"name":"Profundidad de cada Árbol Débil","nivel":"Intermedio","que":"Define el número máximo de niveles o profundidad que se le permite crecer a cada uno de los estimadores secuenciales individuales (árboles débiles) del ensamble. Controla directamente el grado de interacción de variables capturado por cada paso de gradiente.","val":"Rango acotado muy bajo: [2, 3, 4, 5, 6, 8]. Default en scikit-learn = 3.","alto":"(e.g. max_depth >= 10). Transforma los estimadores individuales del gradiente en modelos complejos individuales que sobreajustarán de forma instantánea al ruido local del dataset, arruinando por completo el principio de boosting (un ensamble de aprendices débiles coordinados secuencialmente).","bajo":"(e.g. max_depth = 1, tocones de decisión o stumps). El modelo se vuelve lento de entrenar y puede requerir miles de estimadores secuenciales, pero tiene alta robustez ante el ruido operacional.","inter":"Su sintonización define el número óptimo de árboles secuenciales a construir.","tun":"Usar de forma estándar max_depth = 3 o 4 para tabular ruidoso. Solo subir a 6 u 8 si existen interacciones de múltiples variables complejas en sistemas físicos.","err":"Permitir que los árboles del Gradient Boosting crezcan de forma ilimitada como en Random Forest, destruyendo el poder predictivo del ensamble en producción.","apl":"Predicción del desgaste por vibración de cojinetes en rodillos de laminación. Un max_depth=4 permite capturar de forma exacta interacciones de segundo orden (vibración x temperatura de aceite x rpm), sin sobreajustar a lecturas anómalas aisladas de fallas de medición eléctrica de los sensores de planta.","pri":"IMPORTANTE","code":"max_depth"},{"name":"Fracción de Validación y Parada Temprana","nivel":"Intermedio","que":"validation_fraction reserva parte del entrenamiento para monitoreo; n_iter_no_change detiene el boosting si esa métrica no mejora en N etapas.","val":"validation_fraction=0.1, n_iter_no_change=[5, 10, 20]. Default: 0.1 y None (desactivado).","alto":"Un n_iter_no_change grande apenas adelanta la parada.","bajo":"Un valor muy pequeño puede detener el entrenamiento por fluctuaciones de ruido.","inter":"Con n_estimators (que se vuelve un tope) y learning_rate.","tun":"Fijar n_estimators alto y dejar que la parada temprana elija el punto óptimo (ver código).","err":"Entrenar un número fijo de árboles sin parada temprana y sobreajustar.","apl":"Ajustar el número de árboles automáticamente cuando no se sabe de antemano cuántas etapas de boosting son necesarias.","pri":"ESENCIAL","code":"validation_fraction, n_iter_no_change"}]},{"n":"9","t":"XGBoost","hp":[{"name":"Tasa de Aprendizaje / Eta","nivel":"Básico","que":"Cumple la misma función de contracción de peso (shrinkage) que en el algoritmo de Gradient Boosting clásico de scikit-learn, escalando los coeficientes de los nuevos árboles añadidos al ensamble secuencial.","val":"Rango logarítmico lineal fino: [0.01, 0.03, 0.05, 0.1, 0.2, 0.3]. Default en XGBoost = 0.3.","alto":"(e.g. 0.3 o superior). Aumenta dramáticamente la impaciencia de entrenamiento del algoritmo sobre el gradiente. XGBoost sobreajustará rápidamente de forma agresiva en las fases iniciales, perdiendo precisión de generalización en datos de validación cruzada.","bajo":"(e.g. 0.01 o inferior). Exige que el ensamble requiera una enorme cantidad de iteraciones secuenciales de reentrenamiento, prolongando el tiempo computacional de la CPU.","inter":"Enlazado inversamente al número de rondas secuenciales de ajuste (num_boost_round o n_estimators) y a la sintonización fina de regularización de hojas (reg_lambda, reg_alpha).","tun":"Sintonizar de forma secuencial junto con parada temprana. Un valor de 0.05 es un estándar industrial ideal para un equilibrio óptimo de precisión y velocidad de procesamiento de datos en el reentrenamiento semanal de planta.","err":"Ajustar tasas de aprendizaje elevadas confiando puramente en la capacidad de regularización nativa de XGBoost para evitar el sobreajuste del modelo.","apl":"Clasificación en tiempo real de anomalías de vibración en molinos de bolas horizontales gigantescos en base a 24 mediciones continuas de sensores piezoeléctricos. Configurar un learning_rate=0.05 permite que el clasificador en vivo aprenda tendencias estables sin disparar alertas de falsas alarmas operacionales ante ruidos puntuales de arranque mecánico de los molinos de la planta.","pri":"ESENCIAL","code":"learning_rate o eta"},{"name":"Peso Mínimo en Nodo Hijo","nivel":"Intermedio","que":"Especifica el requerimiento de la suma mínima ponderada de las Hessianas (segundas derivadas locales de la pérdida) que deben poseer de forma obligatoria las muestras que residan en un nodo hijo para que el algoritmo permita realizar una nueva división recursiva en las ramas del árbol. En regresión con pérdida cuadrática (MSE), equivale matemáticamente a la cantidad mínima de observaciones de entrenamiento que deben habitar en cada subnodo.","val":"Enteros: [1, 3, 5, 10, 20, 50]. Default en XGBoost = 1.","alto":"Regulariza severamente el crecimiento de las ramas de los árboles. El algoritmo detendrá la ramificación secuencial de forma muy conservadora al no poder cumplir la restricción del peso hessiano en el subnodo, evitando el sobreajuste pero arriesgando un subajuste severo del ensamble.","bajo":"(e.g. 1, el default). Permite que XGBoost continúe ramificando los árboles de forma sinuosa para crear nodos que contengan muy pocas observaciones o incluso una sola muestra de entrenamiento ruidosa, lo que conduce a un sobreajuste masivo y localizada en las hojas.","inter":"Su sintonía se combina con la profundidad máxima de los árboles secuenciales (max_depth).","tun":"Sintonización prioritaria en problemas tabulares desbalanceados utilizando optimización bayesiana con validación cruzada. En presencia de clases raras del negocio, configuraciones de 5 a 15 previenen de forma sumamente robusta que el modelo asuma ruido como patrones reales.","err":"Mantener min_child_weight=1 sobre conjuntos de datos con clases altamente desbalanceadas, permitiendo que XGBoost cree ramas específicas adaptadas únicamente a un par de outliers aislados ruidosos.","apl":"Detección de fraude transaccional financiero digital en cajeros automáticos del BCP. Al presentarse una tasa de fraude ínfima (menos del 0.1% de los datos), configurar un min_child_weight=10 asegura que el clasificador secuencial de XGBoost solo asuma patrones si cuentan con un peso robusto de soporte en la Hessiana local, eliminando de raíz las falsas alarmas operativas para el cliente.","pri":"ESENCIAL","code":"min_child_weight"},{"name":"Fracción de Características por Árbol","nivel":"Intermedio","que":"Define la fracción del total de variables predictoras que se seleccionarán completamente al azar para entrenar cada uno de los árboles secuenciales individuales que se añaden al ensamble de XGBoost.","val":"Rango continuo: [0.5, 0.6, 0.7, 0.8, 0.9, 1.0]. Default en XGBoost = 1.0.","alto":"(e.g. 1.0, el default). Se evalúan exactamente todas las variables predictoras del dataset en cada árbol secuencial construido. El algoritmo pierde variabilidad de descorrelacionamiento y ralentiza su tiempo de cómputo computacional en datasets con alta dimensionalidad.","bajo":"(e.g. colsample_bytree <= 0.4). Reduce el número de características a evaluar de forma extrema en cada nodo, acelerando el procesamiento computacional de la CPU pero arriesgando un subajuste si se excluyen las variables físicas predictoras dominantes.","inter":"Interactúa en conjunto con colsample_bylevel (fracción por nivel de árbol) y colsample_bynode (fracción por división de nodo), permitiendo una sintonía fina de aleatoriedad espacial en tres capas jerárquicas.","tun":"Configurar de forma estándar un valor de 0.7 u 0.8 para inyectar diversidad espacial y agilizar enormemente el tiempo de entrenamiento sobre miles de columnas del dataset de planta.","err":"Mantener colsample_bytree=1.0 en datasets tabulares gigantescos con cientos de variables redundantes, lo que dispara innecesariamente el consumo de hardware de la CPU sin aportar mejoras reales en la precisión del clasificador en vivo.","apl":"Pronóstico del consumo energético del sistema de ventilación forzada en base a telemetría ambiental (vibración de aspas, temperatura externa, humedad, velocidad de aire). Usar colsample_bytree=0.8 acelera un 40% el tiempo de cómputo de reentrenamiento del modelo diario sin alterar la precisión predictiva.","pri":"IMPORTANTE","code":"colsample_bytree"},{"name":"Regularización L2","nivel":"Avanzado","que":"Coeficiente multiplicador del término de penalización de la norma L2 aplicado directamente sobre los pesos de las hojas de los árboles secuenciales dentro del funcional formal de regularización de la función objetivo de XGBoost. Actúa para contraer y suavizar las predicciones numéricas individuales de cada hoja.","val":"Rango logarítmico lineal: [0.0, 0.1, 1.0, 5.0, 10.0, 50.0, 100.0]. Default en XGBoost = 1.0.","alto":"Obliga a que los pesos calculados de las hojas finales tiendan fuertemente a igualarse hacia cero, regularizando rígidamente el ensamble y provocando subajuste del modelo.","bajo":"Permite que las hojas de los árboles adquieran pesos con magnitudes extremas e inestables para aislar ruidos locales de entrenamiento del dataset, conduciendo a sobreajuste.","inter":"Interactúa en conjunto con la tasa de aprendizaje (learning_rate) y la regularización L1 (reg_alpha).","tun":"Sintonizar de forma logarítmica si se observa que el modelo final muestra picos o inestabilidades numéricas drásticas en producción.","err":"Dejar el parámetro de regularización L2 en cero (reg_lambda=0.0) esperando ganar precisión de forma milagrosa en problemas tabulares ruidosos, perdiendo el beneficio de la regularización objetivo estructural de XGBoost.","apl":"Modelo predictivo de asignación de tasas de interés preferenciales personalizadas para clientes de préstamos hipotecarios. Sintonizar un reg_lambda=10.0 previene que clientes individuales con historiales de pago atípicos ruidosos generen picos o valles absurdos en el cálculo de tasas automatizado.","pri":"IMPORTANTE","code":"reg_lambda"},{"name":"Regularización L1","nivel":"Avanzado","que":"Coeficiente multiplicador del término de penalización de la norma L1 aplicado directamente sobre los pesos de las hojas secuenciales dentro del funcional formal de regularización de la función objetivo de XGBoost. Induce a que los pesos no informativos de las hojas terminales se contraigan a exactamente cero de forma neta.","val":"Rango logarítmico lineal: [0.0, 0.1, 1.0, 5.0, 10.0, 50.0]. Default en XGBoost = 0.0.","alto":"Provoca una reducción severa de la complejidad de los pesos de las hojas finales de los árboles, apagando la expresividad no lineal y conduciendo a subajuste del modelo.","bajo":"No realiza contracción neta de los pesos de las hojas terminales individuales de forma estable, permitiendo al modelo ajustar en exceso el ruido local del dataset.","inter":"Su sintonía se combina con la regularización L2 (reg_lambda).","tun":"Sintonizar como hiperparámetro de última capa mediante optimización bayesiana en datasets con alta variabilidad.","err":"Confundir reg_alpha con reg_lambda y no comprender que la penalización L1 induce de forma neta a que muchos pesos de hojas terminales sean exactamente cero (sparsity estructural), facilitando el descarte nativo de ruido de planta.","apl":"Predicción en tiempo real del desgaste superficial del acero laminado en frío en base a telemetría de vibración de la prensa hidráulica. Un reg_alpha=5.0 estabiliza de forma robusta las alertas lógicas predictivas semanales de planta.","pri":"OPCIONAL","code":"reg_alpha"},{"name":"Reducción Mínima de Pérdida para Dividir","nivel":"Avanzado","que":"Ganancia mínima de la función de pérdida requerida para hacer una partición adicional. Mayor gamma produce árboles más conservadores.","val":"[0, 0.1, 0.5, 1.0, 5.0]. Default: 0.","alto":"Árboles poco profundos y conservadores (subajuste).","bajo":"Sin restricción; se acepta cualquier división que reduzca la pérdida.","inter":"Complementa min_child_weight y max_depth como control estructural.","tun":"Empezar en 0; subir solo si persiste el sobreajuste tras ajustar profundidad.","err":"Ignorarlo cuando max_depth y learning_rate no bastan para regularizar.","apl":"Frenar divisiones espurias cuando las variables predictoras están muy correlacionadas y el modelo tiende a memorizar ruido.","pri":"IMPORTANTE","code":"gamma / min_split_loss"},{"name":"Balance de Clases","nivel":"Intermedio","que":"Multiplica el peso de la clase positiva en la función de pérdida. Valor típico: cociente entre negativos y positivos.","val":"[1, 5, 10, 50, 100]. Default: 1.","alto":"Sobre-predice la clase positiva; muchos falsos positivos.","bajo":"Con desbalance real, el modelo ignora la clase minoritaria.","inter":"Alternativa a class_weight. No combinar con resampling.","tun":"Calcular como n_negativos / n_positivos y afinar con la curva precisión-recall.","err":"Dejarlo en 1 cuando la clase positiva es inferior al 1 % (ver código).","apl":"Detectar defectos o fallas poco frecuentes donde la clase de interés apenas aparece en los datos.","pri":"ESENCIAL","code":"scale_pos_weight"},{"name":"Método de Construcción y Discretización","nivel":"Intermedio","que":"tree_method=\"hist\" construye árboles por histogramas (mucho más rápido); max_bin fija cuántos bins discretizan cada variable continua.","val":"tree_method en {auto, exact, approx, hist}; max_bin en [128, 256, 512]. Default: auto y 256.","alto":"Un max_bin grande mejora la precisión de los cortes pero consume más memoria y tiempo.","bajo":"Pocos bins pierden resolución en variables continuas.","inter":"max_bin y grow_policy solo surten pleno efecto con hist.","tun":"Usar hist para datasets grandes; dejar max_bin=256 salvo restricciones de memoria.","err":"Usar exact en millones de filas, desperdiciando horas de cómputo.","apl":"Reentrenar sobre millones de registros de telemetría en minutos en lugar de horas al elegir el método por histogramas.","pri":"IMPORTANTE","code":"tree_method, max_bin"},{"name":"Restricciones de Monotonía","nivel":"Avanzado","que":"Fuerza que la predicción sea monótona creciente (1), decreciente (-1) o libre (0) respecto a cada variable, inyectando conocimiento del dominio.","val":"Tupla de 0/1/-1 por variable. Default: sin restricciones.","alto":"N/A.","bajo":"N/A.","inter":"Limita la forma funcional sin restringir la complejidad; independiente del resto.","tun":"Aplicar cuando la relación física o lógica es conocida y debe respetarse (ver código).","err":"Desconocer el parámetro cuando se dispone de conocimiento del dominio valioso.","apl":"Garantizar que, a más horas de uso, la probabilidad de falla nunca baje en el modelo, de modo que las predicciones sean creíbles para los expertos.","pri":"IMPORTANTE","code":"monotone_constraints"}]},{"n":"10","t":"LightGBM","hp":[{"name":"Número Máximo de Hojas por Árbol","nivel":"Básico","que":"Define la cantidad máxima admisible de nodos terminales u hojas que se le permite poseer a cada uno de los árboles secuenciales individuales entrenados de forma paralela. Al utilizar LightGBM un crecimiento leaf-wise, este es el hiperparámetro fundamental para controlar la complejidad estructural y evitar el sobreajuste del modelo.","val":"[15, 31, 63, 127, 255]. Default en LightGBM = 31.","alto":"(e.g. num_leaves >= 127 en datasets pequeños). El árbol crecerá de forma sumamente sinuosa e indisciplinada, adaptándose milimétricamente a cada observación ruidosa del set de entrenamiento y provocando sobreajuste severo.","bajo":"(e.g. num_leaves <= 7). Reduce la capacidad y la expresividad no lineal de los árboles secuenciales de forma crítica, impidiendo capturar interacciones complejas de variables predictoras continuas del sistema físico y conduciendo a subajuste.","inter":"Limitado y enlazado matemáticamente con la profundidad máxima de los árboles (max_depth). Por definición, para que un árbol tenga num_leaves hojas terminales, se requiere que la profundidad máxima permita un crecimiento de al menos 2maxdepth ge numleaves.","tun":"Búsqueda en cuadrícula en conjunto con max_depth. Para la gran mayoría de problemas tabulares reales de ingeniería industrial de la planta, valores de 31 a 63 proveen un balance de sesgo-varianza inmejorable.","err":"Incrementar num_leaves a valores muy elevados (e.g. 255) sin restringir la cantidad mínima de datos en las hojas, lo que disparará un sobreajuste localizado catastrófico sobre el ruido del dataset.","apl":"Clasificación de transacciones bancarias sospechosas de fraude electrónico digital. Un valor de num_leaves=63 optimiza la sensibilidad no lineal del clasificador secuencial de LightGBM, capturando combinaciones atípicas complejas de hora, geolocalización y montos transaccionales.","pri":"ESENCIAL","code":"num_leaves"},{"name":"Mínima Cantidad de Datos en una Hoja","nivel":"Básico","que":"Especifica el número mínimo admisible de observaciones de entrenamiento que deben residir de forma obligatoria dentro de cada uno de los subnodos u hojas finales de todos los árboles del bosque secuencial de LightGBM.","val":"Enteros: [10, 20, 50, 100, 200, 500]. Default en LightGBM = 20.","alto":"Regulariza excesivamente el crecimiento de los árboles de forma drástica. Obliga a que cada una de las hojas contenga demasiadas observaciones físicas promedio, impidiendo que el modelo distinga subpatrones lógicos sutiles del proceso productivo y conduciendo a subajuste.","bajo":"(e.g. min_data_in_leaf <= 5). Permite que el crecimiento leaf-wise de LightGBM cree hojas marginales con muy pocas observaciones ruidosas aisladas, capturando outliers del set de entrenamiento y provocando sobreajuste severo.","inter":"Su sintonía de regularización es complementaria a la sintonía del número de hojas del árbol (num_leaves).","tun":"Sintonización prioritaria mediante validación cruzada. En datasets tabulares con cientos de miles de filas, valores de min_data_in_leaf=100 o 200 previenen de forma sumamente robusta que el modelo asuma ruido instrumental como patrones reales.","err":"Mantener el default de min_data_in_leaf=20 en datasets tabulares industriales de gran tamaño (e.g., millones de filas de telemetría de molino minero), permitiendo sobreajuste localized invisible para el científico de datos.","apl":"Predicción mensual del consumo neto de agua industrial del chancador primario en base al tipo de roca y temperatura ambiental. Configurar un min_data_in_leaf=100 inyecta robustez en el Gradient Boosting secuencial, filtrando comportamientos de mantenimiento puntuales semanales.","pri":"ESENCIAL","code":"min_data_in_leaf o min_child_samples"},{"name":"Fracción de Características por División","nivel":"Intermedio","que":"Define la fracción del total de variables predictoras que se evaluarán completamente al azar en cada uno de los árboles secuenciales individuales que se añaden al ensamble de LightGBM.","val":"Rango continuo: [0.5, 0.6, 0.7, 0.8, 0.9, 1.0]. Default en LightGBM = 1.0.","alto":"(e.g. 1.0, el default). Se evalúan exactamente todas las variables predictoras en cada nodo de todos los árboles secuenciales construidos. El modelo pierde variabilidad de descorrelacionamiento y ralentiza su tiempo de cómputo computacional en datasets con alta dimensionalidad.","bajo":"(e.g. feature_fraction <= 0.4). Reduce la cantidad de características a evaluar de forma extrema en cada nodo, acelerando el procesamiento computacional de la CPU pero arriesgando un subajuste si se excluyen las variables físicas predictoras dominantes.","inter":"Interactúa de forma directa con la tasa de aprendizaje (learning_rate) y el número de árboles secuenciales de LightGBM.","tun":"Configurar de forma estándar un valor de 0.7 u 0.8 para inyectar diversidad espacial y agilizar enormemente el tiempo de entrenamiento sobre miles de columnas del dataset de planta.","err":"Mantener feature_fraction=1.0 en datasets con cientos de variables redundantes, ralentizando de forma catastrófica el procesamiento sin aportar mejoras reales en la precisión del clasificador en vivo.","apl":"Pronóstico del consumo energético del sistema de ventilación forzada en base a telemetría ambiental (vibración de aspas, temperatura externa, humedad, velocidad de aire). Usar feature_fraction=0.8 acelera un 40% el tiempo de cómputo de reentrenamiento del modelo diario sin alterar la precisión predictiva.","pri":"IMPORTANTE","code":"feature_fraction o colsample_bytree"},{"name":"Bagging Periódico","nivel":"Intermedio","que":"bagging_fraction submuestrea filas; bagging_freq indica cada cuántas iteraciones se aplica ese submuestreo. Juntos regularizan y aceleran.","val":"bagging_fraction=0.8, bagging_freq=5. Default: 1.0 y 0 (desactivado).","alto":"Un bagging_freq grande hace el submuestreo demasiado infrecuente para regularizar.","bajo":"bagging_freq=1 aplica bagging en cada iteración: máxima regularización, algo más lento.","inter":"CLAVE: bagging_freq no surte efecto si bagging_fraction es 1.0.","tun":"Combo estándar 0.8 + 5 (ver código).","err":"Fijar bagging_fraction=0.8 pero dejar bagging_freq=0, lo que desactiva el bagging sin aviso.","apl":"Regularizar un modelo entrenado sobre miles de registros diarios sin ralentizar el reentrenamiento nocturno.","pri":"IMPORTANTE","code":"bagging_fraction, bagging_freq"},{"name":"Tipo de Boosting","nivel":"Avanzado","que":"Algoritmo de boosting: gbdt (clásico), dart (con dropout), goss (muestreo de un solo lado basado en gradiente).","val":"{gbdt, dart, goss, rf}. Default: gbdt.","alto":"N/A (categórico).","bajo":"N/A.","inter":"goss no usa bagging_fraction; dart añade drop_rate y max_drop.","tun":"Usar gbdt por defecto; goss para datasets enormes donde importa la velocidad.","err":"Poner dart en producción sin notar que es varias veces más lento.","apl":"Elegir goss para procesar telemetría masiva cuando el tiempo de reentrenamiento es el cuello de botella.","pri":"IMPORTANTE","code":"boosting_type"}]},{"n":"11","t":"CatBoost","hp":[{"name":"Profundidad de los Árboles Oblicuos Simétricos","nivel":"Básico","que":"Define el número de niveles o profundidad al que se le permite crecer a cada uno de los árboles secuenciales simétricos (oblivious trees) entrenados de forma paralela en el ensamble de CatBoost. En estos árboles, se evalúa exactamente la misma variable de corte y condición de forma simétrica a través de todos los nodos de un mismo nivel jerárquico del árbol.","val":"Rango acotado muy bajo: [4, 5, 6, 7, 8, 10]. Default en CatBoost = 6.","alto":"(e.g. depth >= 10 en datasets pequeños). Aumenta dramáticamente la complejidad estructural de los árboles simétricos, duplicando de forma exponencial el número de hojas terminales simultáneas por nivel, lo que conduce a un sobreajuste masivo y localizada en las hojas.","bajo":"(e.g. depth <= 4). Reduce la capacidad y la expresividad no lineal de los árboles simétricos de forma crítica, impidiendo capturar interacciones complejas de variables continuas del sistema físico y conduciendo a subajuste.","inter":"Su sintonía se combina con la regularización L2 de hojas (l2_leaf_reg) y la tasa de aprendizaje (learning_rate).","tun":"Búsqueda en cuadrícula en conjunto con l2_leaf_reg. Para la gran mayoría de problemas tabulares reales de ingeniería industrial de la planta, valores de depth = 6 o 7 proveen un balance de sesgo-varianza inmejorable.","err":"Intentar sintonizar profundidades elevadas (como 12 o 16) creyendo que mejorará la precisión, provocando un desbordamiento de la memoria RAM del servidor de producción y deteniendo el proceso de reentrenamiento automático semanal de planta.","apl":"Clasificación en tiempo real del perfil de riesgo de transacciones de comercio electrónico en banca digital. Usar depth=6 en los árboles simétricos de CatBoost asegura que el clasificador secuencial de Yandex capture sutilmente las tendencias de fraude transaccional sin sobrereaccionar ante ruidos aislados del dataset.","pri":"ESENCIAL","code":"depth"},{"name":"Coeficiente de Regularización L2","nivel":"Intermedio","que":"Coeficiente multiplicador del término de penalización de la norma L2 aplicado directamente sobre los pesos de las hojas secuenciales dentro del funcional formal de regularización de la función objetivo de CatBoost.","val":"Rango lineal: [1.0, 3.0, 5.0, 10.0, 50.0]. Default en CatBoost = 3.0.","alto":"Obliga a que los pesos calculados de las hojas finales tiendan fuertemente a igualarse hacia cero, regularizando rígidamente el ensamble y provocando subajuste del modelo.","bajo":"Permite que las hojas de los árboles adquieran pesos con magnitudes extremas e inestables para aislar ruidos locales de entrenamiento del dataset, conduciendo a sobreajuste.","inter":"Su sintonía de regularización es complementaria a la sintonía del número de hojas de los árboles simétricos de CatBoost.","tun":"Sintonizar de forma logarítmica o lineal según el volumen del dataset de entrenamiento. En datasets industriales medianos (e.g. 50,000 muestras), usar valores de [3.0, 5.0, 10.0, 20.0] suele estabilizar enormemente las reglas lógicas resultantes.","err":"Dejar el parámetro de regularización L2 en cero (l2_leaf_reg=0.0) esperando ganar precisión de forma milagrosa en problemas tabulares ruidosos, perdiendo el beneficio de la regularización estructural de CatBoost.","apl":"Predicción en tiempo real del desgaste superficial del acero laminado en frío en base a telemetría de vibración de la prensa hidráulica. Un l2_leaf_reg=5.0 estabiliza de forma robusta las alertas lógicas predictivas semanales de planta.","pri":"IMPORTANTE","code":"l2_leaf_reg"},{"name":"Intensidad de Aleatoriedad para Divisiones","nivel":"Avanzado","que":"Define la intensidad de la aleatoriedad que se añade al evaluar las mejores divisiones candidatos en las ramas de los árboles secuenciales individuales del ensamble de CatBoost. Se utiliza para perturbar y descorrelacionar las decisiones lógicas linderas de los oblivious trees de Yandex.","val":"Rango cerrado: [0.0, 0.5, 1.0, 2.0, 5.0]. Default en CatBoost = 1.0.","alto":"(e.g. random_strength >= 5.0). Perturba de forma excesiva e inestable la selección de divisiones candidatas linderas de los oblivious trees, impidiendo que el algoritmo elija las variables físicas de corte óptimas del sistema y conduciendo a subajuste del modelo.","bajo":"(e.g. random_strength = 0.0). El modelo se comportará de forma puramente determinista al procesar las divisiones de las ramas secuenciales de los oblivious trees, perdiendo la oportunidad de inyectar diversidad espacial y reducir la varianza general mediante aleatoriedad estocástica.","inter":"Su sintonía se combina con la tasa de aprendizaje (learning_rate) y la regularización L2 de hojas (l2_leaf_reg).","tun":"Sintonizar como hiperparámetro de última capa mediante validación cruzada F1-Score.","err":"No comprender que la perturbación aleatoria de divisiones de CatBoost es una herramienta nativa de descorrelacionamiento estructural de oblivious trees y desactivarla por defecto (random_strength=0.0) en problemas industriales con alto ruido instrumental.","apl":"Predicción de fallas operacionales en ventiladores de extracción de polvo. Configurar un random_strength=1.0 inyecta robustez en el Gradient Boosting secuencial, filtrando eventos de fallas de medición eléctrica de los sensores de planta.","pri":"OPCIONAL","code":"random_strength"},{"name":"Tipo de Bootstrap","nivel":"Avanzado","que":"Estrategia de muestreo de los árboles: Bayesian (con bagging_temperature), Bernoulli, MVS, Poisson o No.","val":"bootstrap_type en {Bayesian, Bernoulli, MVS}; bagging_temperature en [0, 1, 10]. Default: Bayesian y 1.","alto":"Una bagging_temperature alta intensifica la aleatoriedad del muestreo.","bajo":"bagging_temperature=0 elimina la aleatoriedad del bootstrap bayesiano.","inter":"Bayesian usa bagging_temperature; Bernoulli/MVS usan subsample.","tun":"Mantener Bayesian por defecto; pasar a MVS en datasets muy grandes.","err":"Intentar usar subsample con bootstrap_type=\"Bayesian\" (se ignora).","apl":"Estabilizar un modelo de calidad cuyos datos varían por temporada, dejando que el muestreo bayesiano suavice la aleatoriedad.","pri":"IMPORTANTE","code":"bootstrap_type, bagging_temperature"},{"name":"Declaración de Variables Categóricas","nivel":"Intermedio","que":"Lista de columnas categóricas. CatBoost les aplica target encoding2 ordenado nativo (su ventaja distintiva), evitando one-hot ineficiente.","val":"Índices [0, 3, 7] o nombres de columna. Default: autodetección.","alto":"N/A.","bajo":"N/A.","inter":"Con one_hot_max_size (umbral de cardinalidad para one-hot vs target encoding).","tun":"Declarar explícitamente todas las categóricas; no confiar en la autodetección.","err":"No declararlas y dejar que se traten como numéricas, perdiendo la ventaja principal de CatBoost.","apl":"Modelar variables de alta cardinalidad (tipo de producto, origen, turno) sin explotar la dimensionalidad con one-hot encoding.","pri":"ESENCIAL","code":"cat_features"}]},{"n":"12","t":"AdaBoost","hp":[{"name":"Estimador Base","nivel":"Intermedio","que":"Define la clase matemática específica y la arquitectura estructural del estimador débil individual o aprendiz base que se construirá paso a paso de forma secuencial en el proceso iterativo del ensamble. Valores típicos: (tocón de decisión o stump por defecto), DecisionTreeClassifier(max_depth=1) DecisionTreeClassifier(max_depth=2), o regresores lineales débiles. Default en scikit-learn = DecisionTreeClassifier(max_depth=1) (un árbol de un solo corte lógico).","alto":"(e.g. DecisionTreeClassifier(max_depth=10)). Transforma los estimadores individuales en modelos complejos e independientes que sobreajustarán de forma instantánea al ruido local del dataset, anulando por completo el principio fundamental de boosting (aprendices débiles reponderados secuencialmente).","bajo":"(e.g. un regresor constante fijo inexpresivo). Impide que el ensamble aditivo de AdaBoost aprenda patrones reales mínimos del proceso productivo, conduciendo a subajuste del modelo secuencial.","inter":"Su configuración define la tasa de aprendizaje óptima (learning_rate) y la cantidad de estimadores secuenciales a construir del ensamble.","tun":"Por regla general. Mantener el default de tocones de decisión (max_depth=1) o probar profundidades muy bajas (max_depth=2 o 3) si el dataset tabular industrial posee alta no linealidad física y se requiere capturar interacciones lógicas mínimas.","err":"Utilizar estimadores base excesivamente complejos en AdaBoost, permitiendo que el modelo sobreajuste de forma exponencial al ruido del set de entrenamiento.","apl":"Clasificación de defectos en bobinas de acero en base a mediciones dimensionales de bobinado. Un estimator=DecisionTreeClassifier(max_depth=2) permite capturar interacciones mínimas de ancho x espesor x tensión mecánica de bobinado de forma estable.","pri":"IMPORTANTE","code":"estimator o base_estimator"},{"name":"Número de Estimadores","nivel":"Básico","que":"Define la cantidad total de estimadores secuenciales débiles que se construirán paso a paso en el proceso iterativo del ensamble para corregir los residuos acumulados de los pasos previos.","val":"[50, 100, 200, 500]. Default en scikit-learn = 50.","alto":"Conduce a un sobreajuste severo del ensamble secuencial. Un número excesivo de estimadores secuenciales inevitablemente intentará ajustar y memorizar las muestras más difíciles y ruidosas de entrenamiento.","bajo":"El modelo sufrirá de subajuste severo, dejando al ensamble de árboles débiles a medio camino de corregir los errores de predicción.","inter":"Enlazado inversamente al multiplicador de tasa de aprendizaje (learning_rate).","tun":"Búsqueda en cuadrícula o regla empírica. Se recomienda probar valores específicos como [100, 200, 300] mediante validación cruzada F1-Score.","err":"Configurar valores de n_estimators muy elevados sin inyectar regularización mediante una tasa de aprendizaje menor, provocando un sobreajuste severo del ensamble secuencial.","apl":"Análisis de propensión de compra de préstamos personales sobre millones de clientes activos. Sintonizar el número óptimo de árboles previene que el modelo asuma comportamientos inusuales estacionales puntuales como tendencias grupales cíclicas de la banca.","pri":"ESENCIAL","code":"n_estimators"},{"name":"Multiplicador de Tasa de Aprendizaje","nivel":"Básico","que":"Multiplica el valor de la predicción y el peso de ajuste aportado por cada nuevo estimador secuencial que se añade al ensamble.","val":"[0.01, 0.05, 0.1, 0.5, 1.0]. Default en scikit-learn = 1.0.","alto":"(e.g. learning_rate = 1.0, el default). El modelo converge demasiado rápido sobre las muestras de entrenamiento. Esto provoca un sobreajuste inmediato, donde el algoritmo memoriza los patrones de ruido locales.","bajo":"(e.g. learning_rate <= 0.01). El aprendizaje secuencial se vuelve excesivamente lento. Se requerirán miles de estimadores base adicionales para lograr ajustar los datos, prolongando el tiempo computacional de entrenamiento.","inter":"Íntimamente acoplado con n_estimators (relación inversamente proporcional).","tun":"Fijar una tasa de aprendizaje moderadamente baja (e.g. 0.1 o 0.2) durante la exploración inicial, y luego afinar el número de estimadores secuenciales óptimo mediante validación cruzada.","err":"Disminuir drásticamente la tasa de aprendizaje a un valor infinitesimal sin incrementar la cantidad de estimadores, dejando al ensamble de AdaBoost a medio entrenar.","apl":"Pronóstico de consumo eléctrico diario para una acería. Usar una tasa de aprendizaje baja (learning_rate=0.1) con un número adecuado de estimadores secuenciales asegura que el modelo capte las tendencias reales de consumo eléctrico sin verse alterado por anomalías mecánicas puntuales de la acería.","pri":"ESENCIAL","code":"learning_rate"}]},{"n":"13","t":"Clustering: K-Means, DBSCAN y Jerárquico","hp":[{"name":"Número de Centroides / Grupos","nivel":"Básico","que":"Define de forma determinista la cantidad exacta de centroides espaciales (K-Means) o de grupos finales de la jerarquía (Agrupamiento Jerárquico) que el algoritmo tiene permitido converger o recortar. En K-Means, el algoritmo buscará de forma iterativa actualizar las posiciones de las coordenadas de las K medias para minimizar la inercia intracluster (suma de cuadrados internos de las distancias de las muestras a su centroide).","val":"Enteros: [2, 3, 5, 8, 12, 20]. Default en scikit-learn = 8.","alto":"El algoritmo segmentará el espacio en demasiados subgrupos pequeños hiper-localizados y redundantes. En el límite extremo, si K es igual a la cantidad de observaciones, cada muestra será su propio cluster, obteniendo una inercia de cero pero destruyendo toda utilidad analítica de agrupación.","bajo":"(e.g. K = 1 o 2). Conduce a un agrupamiento masivo subajustado, donde grupos con comportamientos mecánicos o geológicos radicalmente dispares se promedian de forma artificial bajo un mismo centroide global lejana.","inter":"Su sintonía depende de forma crítica del preprocesamiento y escalamiento de variables con media cero y varianza unitaria (StandardScaler). Sin escalamiento previo, K-Means calculará las distancias vectoriales basándose casi exclusivamente en la variable de mayor magnitud del sistema.","tun":"Evaluar la inercia intracluster mediante el método del codo (Elbow Method) en combinación con el coeficiente de silueta (Silhouette Score) para validar de forma matemática y visual el punto óptimo del balance de compactación y separación.","err":"Elegir un valor de K basándose puramente en un criterio analítico rígido sin contrastar si el resultado posee sentido de ingeniería, negocio o aplicabilidad práctica para el personal operativo de la planta.","apl":"Segmentación automática de tipos de mineral de roca sobre cintas transportadoras en base a lecturas continuas de telemetría espectral infrarroja. Sintonizar un K=4 óptimo delimita de forma estable los cuatro dominios mineralógicos clave de alimentación para la molienda de la planta.","pri":"ESENCIAL","code":"n_clusters o k"},{"name":"Radio del Vecindario de Densidad","nivel":"Intermedio","que":"Define la distancia física o el radio máximo de proximidad espacial admisible alrededor de cualquier observación para que se le considere como \"vecino inmediato\" de dicho punto en el cálculo de densidad de DBSCAN.","val":"Rango continuo según escala de los datos: [0.1, 0.3, 0.5, 1.0, 2.0]. Default en scikit-learn = 0.5.","alto":"DBSCAN unirá de forma artificial grupos distantes y dispares en un solo cluster gigantesco y continuo, ignorando pasillos de separación de baja densidad y perdiendo la granularidad estructural del sistema.","bajo":"El radio se vuelve tan restrictivo que casi ninguna muestra logrará acumular suficientes vecinos cercanos en su vecindario local. El algoritmo clasificará de forma errática a la gran mayoría de las muestras de entrenamiento como ruido operacional (outliers), impidiendo la convergencia de clusters lógicos.","inter":"Su sintonización está totalmente acoplada con la cantidad de vecinos mínimos requeridos (min_samples).","tun":"Calcular y graficar las distancias a los K-vecinos más cercanos (K-distance plot) ordenadas de mayor a menor. El valor óptimo de eps se localiza exactamente en la zona de inflexión o del codo pronunciado de la curva de distancias.","err":"Usar el valor por defecto eps=0.5 sobre datos numéricos que no han sido escalados de forma adecuada, provocando que todas las muestras queden clasificadas instantáneamente como ruido o viceversa en un solo grupo global.","apl":"Agrupamiento de eventos microsísmicos locales registrados por geófonos para perfilar fallas tectónicas activas y prevenir derrumbes en el tajo abierto de la mina. Sintonizar el eps óptimo delimita de forma exacta la forma arqueada libre de las fallas tectónicas sin verse alterado por el ruido de fondo de las voladuras mecánicas programadas.","pri":"ESENCIAL","code":"eps o epsilon"},{"name":"Número Mínimo de Vecinos en el Radio","nivel":"Intermedio","que":"Especifica la cantidad mínima de observaciones que deben residir de forma obligatoria dentro del radio eps de una muestra para que esta se clasifique de forma matemática como un punto núcleo (core point) con densidad suficiente para iniciar el crecimiento de un nuevo grupo.","val":"Enteros: [3, 4, 5, 10, 20, 50]. Default en scikit-learn = 5.","alto":"Se exige un nivel de densidad local extremadamente elevado para iniciar clusters. DBSCAN se volverá muy intolerante y clasificará casi todas las observaciones de entrenamiento como ruido operacional, dejando únicamente grupos densos muy concentrados.","bajo":"(e.g. min_samples <= 2). El algoritmo perderá la capacidad de distinguir y descartar el ruido de forma segura. Pequeños ruidos o anomalías aisladas de 2 o 3 muestras consecutivas lograrán formar clusters independientes de forma errática, restando robustez no supervisada.","inter":"Íntimamente acoplado con eps. A mayor min_samples, se requiere incrementar el radio eps de forma correspondiente para permitir que los vecindarios locales recopilen suficientes observaciones para el core point.","tun":"Por regla general, configurar un valor mínimo de minsamples ge D + 1 (donde D es la cantidad de variables predictoras en el espacio n-dimensional). Incrementar de forma proporcional si el conjunto de datos de entrenamiento posee un alto nivel de ruido de fondo.","err":"Configurar min_samples=1 sobre datasets reales ruidosos, convirtiendo de forma inútil al algoritmo DBSCAN en un agrupamiento jerárquico de enlace simple donde no se descarta ningún ruido del sistema de planta.","apl":"Agrupamiento de lecturas anómalas de telemetría de vibración multiaxial de motores eléctricos para clasificar modos de falla específicos. Sintonizar min_samples=10 asegura que las anomalías se agrupen de forma robusta e independiente de picos de ruido momentáneos e individuales de medición eléctrica del sensor.","pri":"IMPORTANTE","code":"min_samples"},{"name":"Criterio de Enlace de Clusters","nivel":"Avanzado","que":"Especifica la fórmula geométrica utilizada para cuantificar la distancia entre dos subgrupos candidatos de la jerarquía antes de decidir su fusión aglomerativa secuencial (bottom-up). Las opciones estándar en scikit-learn son 'ward' (minimiza el incremento de la varianza interna total), 'complete' (distancia máxima entre puntos), 'average' (distancia promedio de las observaciones de los grupos) y 'single' (distancia mínima de enlace).","val":"['ward', 'complete', 'average', 'single']. Default en scikit-learn = 'ward'.","alto":"N/A (Categórico).","bajo":"N/A.","inter":"Su sintonización define la estructura visual final del dendrograma jerárquico del dataset. 'single' tiende a formar clusters alargados y continuos (efecto encadenamiento), mientras que 'ward' genera clusters circulares y compactos altamente balanceados en tamaño.","tun":"Usar 'ward' por defecto debido a su robustez estadística en la gran mayoría de problemas de ingeniería. Utilizar 'average' o 'complete' si el dendrograma de validación muestra estructuras dispares o se sospecha de presencia de anomalías extremas.","err":"Utilizar 'single' linkage sobre datos reales ruidosos de sensores de planta, provocando que casi todas las muestras de la planta se encadenen de forma artificial en un solo cluster gigantesco debido al ruido de fondo.","apl":"Clasificación de tipos de fallas complejas basadas en registros de vibración multiaxiales de trenes de laminación. El uso de 'ward' permite estructurar de forma clara y jerárquica un dendrograma con la taxonomía natural de fallas lógicas de rodamiento, facilitando al equipo de mecánicos de planta entender las causas físicas subyacentes.","pri":"OPCIONAL","code":"linkage"},{"name":"Inicialización y Reintentos de K-Means","nivel":"Intermedio","que":"init=\"k-means++\" elige centroides iniciales de forma inteligente; n_init repite el ajuste con distintas semillas y conserva el de menor inercia.","val":"init en {k-means++, random}; n_init en [1, 5, 10, 20]. Default: k-means++ y auto.","alto":"Un n_init grande es más robusto pero proporcionalmente más lento.","bajo":"n_init=1 arriesga caer en un mínimo local subóptimo.","inter":"k-means++ reduce la necesidad de un n_init alto.","tun":"Mantener k-means++; bajar n_init solo si el cómputo es crítico (ver código).","err":"Cambiar a random esperando velocidad sin notar la caída de calidad de los clusters.","apl":"Obtener una segmentación estable que no cambie entre reentrenamientos, para que los grupos sean comparables en el tiempo.","pri":"IMPORTANTE","code":"init, n_init"}]},{"n":"14","t":"Reducción de Dimensionalidad: PCA, t-SNE y UMAP","hp":[{"name":"Número de Componentes o Dimensiones de Salida","nivel":"Básico","que":"Define la cantidad de dimensiones, componentes principales o coordenadas latentes que tendrá el espacio de salida proyectado una vez aplicada la reducción lineal o no lineal. En PCA, calcula los autovectores principales correspondientes a los autovalores más grandes de la matriz de covarianza de las características del dataset.","val":"PCA: [2, 3, 5, 10, 15, 20, 50]. t-SNE / UMAP: [2, 3] (para visualización gráfica directa en 2D o 3D). Default en scikit-learn (PCA) = None (retorna todas las variables proyectadas).","alto":"Se reduce el beneficio de la reducción de dimensiones. El subespacio conservará gran parte de la dimensionalidad, el ruido de fondo y la redundancia del dataset, obligando a los clasificadores subsecuentes a procesar hardware innecesario y arriesgando la maldición de la dimensionalidad.","bajo":"(e.g. n_components = 1 o 2 en datasets con miles de variables complejas). Provoca una pérdida catastrófica de información e interpretabilidad. En PCA, la varianza explicada acumulada será insignificante, diluyendo los patrones predictivos reales de los sensores físicos del proceso de la planta.","inter":"Su sintonización define el rendimiento computacional de clasificadores complejos como SVM.","tun":"Para PCA, graficar la curva de varianza explicada acumulada (Scree Plot) en base a los autovalores y elegir el número de componentes donde la curva se estabilice en un codo pronunciado (típicamente reteniendo entre el 80% y 95% de la varianza total de los sensores). Para t-SNE/UMAP, mantener estrictamente en 2 para visualización gráfica bidimensional.","err":"Utilizar PCA sin estandarizar previamente las variables de la planta. PCA maximiza la varianza lineal. Si una variable tiene magnitudes de miles (como rpm de molino) y otra decimales de milímetros, la primera componente principal se alineará casi en su totalidad con la variable de mayor rango mecánico.","apl":"Reducción de 200 sensores ruidosos de una planta de laminado de acería. Reducir mediante PCA a n_components=15 retiene el 92% de la varianza física real, depurando por completo el ruido ambiental y acelerando el entrenamiento de modelos clasificadores subsecuentes semanales de planta.","pri":"ESENCIAL","code":"n_components"},{"name":"Perplejidad o Vecindario Local","nivel":"Intermedio","que":"Define el número efectivo de puntos de entrenamiento que se evaluarán como vecinos inmediatos al aproximar la densidad de distribución de probabilidad conjunta local en el espacio multidimensional complejo original. Actúa de forma intuitiva como un balanceador entre enfocar el algoritmo en la estructura local estrecha de los datos o en la estructura global amplia.","val":"Rango lineal continuo: [5, 10, 30, 50, 100]. Default en scikit-learn = 30.0.","alto":"(e.g. perplexity >= 100 en datasets pequeños). El algoritmo promediará relaciones espaciales excesivamente distantes en la distribución Gaussiana original, fundiendo grupos que poseen dinámicas físicas independientes en un único aglomerado informe y sin estructura local clara.","bajo":"(e.g. perplexity <= 2). El algoritmo enfocará su cómputo de probabilidad exclusivamente en vecindarios hiper-localizados y diminutos. Esto provocará la fragmentación artificial de grupos naturales consolidados en decenas de micro-clusters artificiales (efecto bola de nieve), desorientando por completo el análisis visual.","inter":"Íntimamente acoplado con la tasa de aprendizaje del optimizador de gradientes estocásticos (learning_rate) y el número de iteraciones computacionales de t-SNE.","tun":"Usar regla empírica. Se recomienda probar valores específicos en el rango de [10, 30, 50] y evaluar visualmente las agrupaciones lógicas en base al conocimiento físico del proceso de la planta.","err":"Creer de forma ingenua que existe un único valor de perplexity matemáticamente óptimo, ignorando que t-SNE es una técnica altamente heurística donde el resultado visual debe interpretarse de forma visual complementaria con la física de la planta.","apl":"Visualización bidimensional de agrupamientos de comportamiento transaccional del cliente. Sintonizar un perplexity=40 permite delimitar de forma clara y compacta los subgrupos transaccionales (e.g., ahorradores pasivos, compradores digitales nocturnos, inversionistas de bolsa BCP) sin fragmentaciones artificiales.","pri":"IMPORTANTE","code":"perplexity para t-SNE"},{"name":"Número de Vecinos de Vecindad Local","nivel":"Intermedio","que":"Define la cantidad de vecinos inmediatos que se evaluarán al aproximar la geometría del colector local de datos sobre el cual residen las observaciones en el espacio multidimensional complejo. Controla el balance entre enfocar el algoritmo en la estructura de proximidad hiper-local o en la topología global amplia.","val":"Enteros: [5, 15, 30, 50, 100]. Default en UMAP = 15.","alto":"El algoritmo priorizará conservar la topología de grandes distancias y la estructura macro de los datos, perdiendo la finura de separación de micro-grupos muy especializados en el espacio de salida.","bajo":"(e.g. n_neighbors <= 4). El algoritmo se enfocará exclusivamente en preservar las distancias hiper-locales, fragmentando de forma artificial grupos consolidados y perdiendo la visión de la macro-estructura del sistema de planta.","inter":"Su sintonización está totalmente enlazada con la distancia mínima de empaquetamiento de coordenadas (min_dist).","tun":"Usar de forma estándar n_neighbors = 15 o 30 para la gran mayoría de problemas tabulares reales de ingeniería.","err":"Configurar valores extremadamente bajos en datasets masivos donde unas pocas variables de planta concentran la señal, provocando fragmentaciones artificiales del colector geométrico.","apl":"Visualización bidimensional del mapa de estados térmicos de un horno químico de fundición de acero de alta complejidad física. Un n_neighbors=30 permite delimitar de forma clara las trayectorias de transición térmica estables del horno de la planta.","pri":"IMPORTANTE","code":"n_neighbors para UMAP"},{"name":"Distancia Mínima de Empaquetamiento","nivel":"Avanzado","que":"Define la distancia física mínima admisible de separación entre puntos en el espacio de salida proyectado de baja dimensión (2D o 3D). Controla qué tan densamente empaquetados e incrustados estarán los puntos individuales dentro de las regiones de sus respectivos clusters en el gráfico de salida.","val":"Rango continuo de [0.0, 0.01, 0.1, 0.25, 0.5]. Default en UMAP = 0.1.","alto":"Los puntos se distribuirán de forma muy holgada y difusa en el gráfico, perdiendo la nitidez visual de la forma compacta de los clusters y asimilándose a un mapa uniforme ruidoso de planta.","bajo":"(e.g. min_dist = 0.0 o cercano). El algoritmo forzará a que los puntos similares colapsen exactamente a coordenadas idénticas, compactando los clusters en puntos discretos hiper-densos en el mapa, perdiendo el gradiente interno de variabilidad física.","inter":"Íntimamente acoplado con n_neighbors.","tun":"Búsqueda lineal fina en escala continua. min_dist=0.1 provee una definición estándar óptima. Si se busca máxima definición visual de las fronteras físicas de los clusters de planta, reducir a 0.01 o 0.05.","err":"Forzar min_dist = 0.0 sobre datos operacionales ruidosos de sensores de planta, provocando colapsos de coordenadas ininterpretables en el FastAPI semanal.","apl":"Visualización del mapa de estados térmicos de una fundidora de metal compleja de alta dimensión. Configurar un min_dist=0.05 permite compactar de forma nítida los clusters de anomalías de vibración.","pri":"OPCIONAL","code":"min_dist para UMAP"},{"name":"Blanqueamiento y Solver de PCA","nivel":"Intermedio","que":"whiten=True escala las componentes a varianza unitaria; svd_solver=\"randomized\" acelera la descomposición cuando hay muchas variables.","val":"whiten en {True, False}; svd_solver en {auto, full, randomized}. Default: False y auto.","alto":"N/A.","bajo":"N/A.","inter":"whiten=True evita tener que estandarizar después del PCA; randomized exige pocas componentes frente al total.","tun":"Activar whiten si el PCA alimenta a un modelo sensible a escala; usar randomized con cientos de variables (ver código).","err":"Aplicar StandardScaler después de un PCA con whiten=True (doble escalado innecesario).","apl":"Comprimir cientos de variables de sensores a una decena de componentes en segundos antes de alimentar un clasificador.","pri":"IMPORTANTE","code":"whiten, svd_solver"}]},{"n":"15","t":"Redes Neuronales Densas (MLP)","hp":[{"name":"Estructura y Cantidad de Neuronas por Capa Oculta","nivel":"Básico","que":"Define de forma directa la arquitectura y topología estructural del cerebro del conexionismo profundo. Especifica cuántas capas ocultas independientes se construirán en secuencia, y exactamente cuántas neuronas artificiales computarán de forma paralela en el espacio de representación de cada una de esas capas.","val":"Tuplas de enteros: [(100,) (una sola capa con 100 neuronas), (50, 50) (dos capas con 50 c/u), (128, 64, 32) (tres capas reduciendo dimensionalidad en embudo)]. Default en scikit-learn = (100,).","alto":"(e.g. (512, 256, 128) en datasets con pocas filas). Dispara la capacidad y expresividad del conexionismo profundo de forma excesiva, multiplicando los millones de pesos libres de entrenamiento del modelo de forma redundante y provocando sobreajuste severo del modelo. Además, prolonga drásticamente el tiempo de entrenamiento de la CPU.","bajo":"(e.g. (2,)). El modelo sufrirá de subajuste severo del conexionismo profundo, siendo incapaz de aproximar fronteras de decisión curvadas no lineales complejas del sistema físico.","inter":"Su sintonía de regularización es complementaria a la sintonía de Dropout y regularización L2 (alpha).","tun":"Búsqueda en cuadrícula en un rango acotado combinando la estructura y cantidad de neuronas. Un embudo descendente clásico (e.g. (64, 32)) suele converger de forma óptima en datos tabulares industriales.","err":"Diseñar redes neuronales profundas gigantescas y complejas de múltiples capas ocultas sobre datasets tabulares pequeños donde un simple regresor OLS Ridge estabilizaría de forma muy superior la varianza.","apl":"Clasificación no lineal de la calidad física del acero laminado en base a 20 mediciones de sensores continuos de la prensa. Configurar una arquitectura de hidden_layer_sizes=(64, 32) permite al MLP capturar de forma exacta interacciones térmicas complejas, minimizando los desperdicios en producción.","pri":"ESENCIAL","code":"hidden_layer_sizes"},{"name":"Función de Activación No Lineal","nivel":"Básico","que":"Define la función matemática específica empleada para transformar la suma ponderada neta de entrada de cada neurona en su valor de salida final. Inyecta la no linealidad necesaria para que el modelo pueda aproximar cualquier función matemática arbitraria (Teorema de Aproximación Universal).","val":"'relu' (Rectified Linear Unit), 'tanh' (tangente hiperbólica), 'logistic' (sigmoidea). Default en scikit-learn = 'relu'.","alto":"N/A (Categórico).","bajo":"N/A.","inter":"Si se utiliza 'relu', el entrenamiento computacional será drásticamente más rápido, pero se debe vigilar la tasa de aprendizaje (learning_rate) para evitar el fenómeno de \"muerte de neuronas ReLU\".","tun":"Mantener 'relu' por defecto por su gran velocidad de convergencia matemática y bajo costo computacional.","err":"Utilizar 'logistic' de forma general en todas las capas ocultas profundas de la red, provocando un estancamiento del aprendizaje debido al fenómeno del desvanecimiento del gradiente (vanishing gradient).","apl":"Predicción mensual de la demanda de efectivo en cajeros automáticos (ATMs) en base a ubicación de agencias. Usar 'relu' asegura que la convergencia del modelo se logre en minutos sobre millones de transacciones de entrenamiento.","pri":"IMPORTANTE","code":"activation"},{"name":"Tasa de Penalización L2 / Decaimiento de Pesos","nivel":"Intermedio","que":"Coeficiente multiplicador del término de regularización L2 aplicado directamente sobre los pesos de la red conexionista profunda. Actúa para contraer las magnitudes absolutas de los pesos de la red profunda, forzando a que las decisiones dependientes del conexionismo profundo sean más suaves y regulares.","val":"Rango logarítmico lineal fino: [1e-5, 1e-4, 1e-3, 0.01, 0.1]. Default en scikit-learn = 1e-4.","alto":"Comprime excesivamente los pesos hacia cero, neutralizando el poder de aprendizaje de la red profunda y conduciendo a subajuste del modelo.","bajo":"No realiza contracción de pesos de la red conexionista, permitiendo al modelo ajustar en exceso el ruido local de entrenamiento de planta y sobreajustar.","inter":"Su sintonía se combina con la tasa de aprendizaje (learning_rate) y la estructura de neuronas de las capas ocultas de la red profunda.","tun":"Búsqueda exponencial bidimensional en cuadrícula combinando alpha y learning_rate.","err":"Ignorar este parámetro en redes neuronales MLP complejas entrenadas sobre datos ruidosos de sensores de planta, permitiendo sobreajuste masivo invisible para el científico de datos.","apl":"Predicción de fallas mecánicas por fatiga estructural en revestimiento interno del horno en base a telemetría de sensores continuos térmicos de planta. Un alpha=1e-3 regulariza de forma robusta las predicciones diarias.","pri":"IMPORTANTE","code":"alpha"},{"name":"Algoritmo de Optimización y Tasa Inicial","nivel":"Intermedio","que":"solver elige el optimizador (adam, sgd, lbfgs); learning_rate_init fija el tamaño inicial del paso de actualización de pesos.","val":"solver en {adam, sgd, lbfgs}; learning_rate_init en [1e-4, 1e-3, 1e-2]. Default: adam y 0.001.","alto":"Una tasa alta provoca oscilaciones y divergencia del entrenamiento.","bajo":"Convergencia lentísima o estancamiento en mínimos locales.","inter":"lbfgs ignora learning_rate_init y batch_size; converge mejor en datasets pequeños.","tun":"Usar adam para datos medianos/grandes y lbfgs para pocos cientos de muestras; búsqueda logarítmica de la tasa.","err":"Usar sgd sin configurar la tasa ni el momentum y obtener convergencia lentísima.","apl":"Entrenar un MLP sobre un conjunto pequeño de mediciones de laboratorio, donde lbfgs suele converger mejor que adam.","pri":"IMPORTANTE","code":"solver, learning_rate_init"}]},{"n":"16","t":"Redes Neuronales Convolucionales (CNN)","hp":[{"name":"Tamaño del Filtro de Convolución","nivel":"Básico","que":"Define la altura y el ancho bidimensional de la ventana del filtro deslizante (receptivo local) que se convoluciona a través de la matriz de entrada para calcular el producto punto local de las características espaciales.","val":"Matrices cuadradas de enteros impares: [(3, 3), (5, 5), (7, 7)] o enteros simples para Conv1D. Default en keras = (3, 3).","alto":"(e.g. (11, 11)). Fuerza a que el filtro tenga un campo receptivo excesivamente ancho de forma burda en las capas iniciales, asumiendo características espaciales demasiado generales y perdiendo la granularidad fina necesaria para identificar pequeños bordes o texturas locales físicas, además de multiplicar de forma drástica el tiempo computacional de convolución.","bajo":"(e.g. (1, 1)). Se reduce a una proyección de mezcla de canales individuales lineal. Si se parametriza como (1,1) de forma general, la red será incapaz de capturar la vecindad o el contexto espacial mínimo de las características espaciales linderas de la cuadrícula de entrada.","inter":"Su efectividad define la necesidad de relleno de bordes (padding) y el desplazamiento del paso del filtro (stride).","tun":"Usar de forma estándar (3, 3) para capas profundas, ya que apilar múltiples capas pequeñas de (3, 3) posee el mismo campo receptivo que un filtro de (5, 5) pero con una enorme reducción en la cantidad de parámetros libres de entrenamiento y mayor no linealidad intermedia.","err":"Diseñar filtros de gran tamaño en capas profundas del conexionismo de visión creyendo que aumentará la resolución, provocando una ralentización drástica del procesamiento y sobreajuste del modelo.","apl":"Detección en vivo de micro-grietas superficiales en bobinas de acero en caliente mediante visión artificial. Un kernel_size=(3, 3) en las primeras capas convolucionales de la red profunda captura con precisión quirúrgica el borde fino de la grieta física del metal.","pri":"ESENCIAL","code":"kernel_size"},{"name":"Paso del Desplazamiento del Filtro","nivel":"Intermedio","que":"Define la cantidad de píxeles o celdas de cuadrícula de entrada que la ventana del filtro deslizante de convolución o pooling tiene permitido avanzar de forma consecutiva al desplazarse horizontal y verticalmente sobre la matriz de entrada.","val":"Enteros: [1, 2, 3] o tuplas: (1, 1), (2, 2). Default en keras = 1.","alto":"(e.g. stride = 4). Provoca un muestreo de salida excesivamente abrupto e inestable de las características espaciales del dataset. El filtro se saltará gran parte de las zonas de solapamiento de la cuadrícula, provocando una pérdida catastrófica de resolución y de señal de generalización de la red profunda.","bajo":"(e.g. stride = 1). El filtro avanzará de forma muy lenta píxel a píxel de forma redundante. Esto aumentará drásticamente la dimensión matemática de la capa de salida resultante (mapa de activación) y el tiempo computacional de procesamiento de convolución de la CPU / GPU.","inter":"Enlazado con padding. Aumentar stride es una técnica alternativa para reducir de forma drástica las dimensiones espaciales sin recurrir a capas de agrupamiento (pooling).","tun":"Mantener en 1 por defecto para capas convolucionales primarias para preservar al máximo la resolución espacial. Utilizar stride = 2 exclusivamente en capas convolucionales de última milla para comprimir las dimensiones espaciales antes de la capa densa del clasificador final.","err":"Configurar pasos elevados (stride > 2) sobre datasets de imágenes de baja resolución de campo, provocando la desaparición instantánea de las micro-características físicas de las soldaduras o texturas.","apl":"Clasificación de la calidad del granulado del clínker de cemento mediante procesamiento en tiempo real de imágenes de cámara del horno de Pacasmayo. Un stride=1 en las capas primarias de la red convolucional asegura capturar las texturas finas tridimensionales de las partículas individuales de clínker.","pri":"IMPORTANTE","code":"stride"},{"name":"Relleno de Bordes de la Entrada","nivel":"Intermedio","que":"Define la estrategia matemática utilizada para rellenar de forma artificial los bordes externos de la matriz o imagen de entrada de la capa convolucional antes de aplicar el deslizamiento del filtro. Las dos opciones estándar son 'valid' (sin relleno, el filtro solo se desliza dentro de los límites estrictos reales de la matriz de entrada) o 'same' (rellena los bordes perimetrales con ceros para garantizar que la matriz de salida tenga exactamente las mismas dimensiones horizontales y verticales que la matriz de entrada).","val":"['valid', 'same']. Default en keras = 'valid'.","alto":"N/A (Categórico).","bajo":"N/A.","inter":"Si se utiliza 'valid', la dimensión espacial de los mapas de activación de salida se contraerá de forma continua e inevitable con cada nueva capa convolucional agregada: Nout = Nin - F + 1. Esto limita de forma estricta la profundidad de capas de la arquitectura convolucional que se puede apilar en la CPU.","tu
