LAB.nb={a:[7],t:"Naive Bayes y el supuesto de independencia",s:{r:0,sp:0.8},
 q:"Dos clases y las regiones que predice un Naive Bayes gaussiano. Este modelo supone que, dentro de cada clase, las variables no están correlacionadas. Tú controlas cuánto se incumple ese supuesto.",
 c:[["r","Correlación entre las variables dentro de cada clase (de signo opuesto en cada una)",0,0.95,0.05],["sp","Separación entre las clases",0.3,1.6,0.05]],
 p:["Con correlación 0 el supuesto se cumple y Naive Bayes rinde igual que un modelo que sí estima la correlación.","Sube la correlación a 0,90. Cada nube se alarga en una diagonal distinta y forman una X. El modelo con covarianza completa aprovecha esa forma y mejora mucho; Naive Bayes no la ve.","Mira la frontera: Naive Bayes sigue cortando casi en vertical, como si las nubes fueran redondas."],
 k:"Naive Bayes multiplica las probabilidades de cada variable por separado. Es rápido, funciona con pocos datos y con muchas variables, pero cuando las variables están correlacionadas cuenta la misma evidencia dos veces y sus probabilidades salen exageradas.",
 draw(s){const {X,Y,g:g0}=axes(-4,4,-3.5,3.5,{nx:4,ny:4});let g=g0;const mk=(o,n)=>{const d=[];for(let i=0;i<n;i++){const c=i%2,a=PZ[o+i],b=PZ[o+300+i],sg=c?1:-1,v=sg*s.r*a+Math.sqrt(1-s.r*s.r)*b;d.push([a+sg*s.sp*0.5,v,c])}return d},tr=mk(0,120),va=mk(130,160);
  const st=c=>{const d=tr.filter(p=>p[2]===c),mx=mean(d.map(p=>p[0])),my=mean(d.map(p=>p[1]));let a=0,b=0,cv=0;d.forEach(p=>{a+=(p[0]-mx)**2;b+=(p[1]-my)**2;cv+=(p[0]-mx)*(p[1]-my)});return [mx,my,a/d.length,b/d.length,cv/d.length]},S0=st(0),S1=st(1);
  const lnb=(q,x,y)=>-0.5*Math.log(q[2]*q[3])-0.5*((x-q[0])**2/q[2]+(y-q[1])**2/q[3]),lfull=(q,x,y)=>{const det=q[2]*q[3]-q[4]*q[4],dx=x-q[0],dy=y-q[1];return -0.5*Math.log(det)-0.5*(q[3]*dx*dx-2*q[4]*dx*dy+q[2]*dy*dy)/det};
  const fn=(x,y)=>lnb(S1,x,y)>lnb(S0,x,y)?1:0,ff=(x,y)=>lfull(S1,x,y)>lfull(S0,x,y)?1:0;
  g+=cells(X,Y,-4,4,-3.5,3.5,(x,y)=>PAL[fn(x,y)])+tr.map(p=>dot(X(p[0]),Y(p[1]),"c"+PAL[p[2]],4)).join("");const an=accOf(va,fn),af=accOf(va,ff);
  return {g,m:big(pc(an),"Exactitud de Naive Bayes en validación",af-an>0.04?"bad":"ok")+tbl([["Exactitud con covarianza completa",pc(af)],["Costo de suponer independencia",f2((af-an)*100)+" puntos",af-an>0.04?"bad":"ok"]])}}};
LAB.rf={a:[7],t:"Random Forest: muchos árboles votando",s:{nt:1,dp:8,mf:1,nz:1},
 q:"Dos clases en forma de medias lunas con ruido. El fondo es la predicción por mayoría de un bosque de árboles profundos, cada uno entrenado con una remuestra distinta de los datos.",
 c:[["nt","Número de árboles",1,80,1],["dp","Profundidad máxima de cada árbol",1,10,1],["mf","Variables candidatas en cada corte",1,2,1],["nz","Ruido en los datos",0,1.2,0.1]],
 p:["Con 1 árbol profundo la frontera tiene cajitas caprichosas. Sube los árboles a 20 y luego a 80: la frontera se suaviza y la exactitud en validación sube unos puntos y se estabiliza.","Con 80 árboles, compara la exactitud del bosque con la de un solo árbol. Cada árbol sobreajusta de forma distinta y el promedio cancela esos errores.","Baja la profundidad a 1. Aunque haya 80 árboles, el bosque queda demasiado simple: promediar reduce varianza, no sesgo."],
 k:"Un bosque aleatorio promedia árboles profundos entrenados con remuestras de los datos y con variables elegidas al azar en cada corte. Eso los descorrelaciona y el promedio reduce la varianza sin subir el sesgo. Más árboles nunca sobreajusta; solo cuesta tiempo.",
 draw(s){const {X,Y,g:g0}=axes(-3,3,-2.5,2.5,{nx:6,ny:5});let g=g0;const tr=moons(0,140,0.2+0.3*s.nz),va=moons(150,200,0.2+0.3*s.nz),F=[];
  for(let t=0;t<s.nt;t++){const r=rng(50+t),bs=tr.map(()=>tr[Math.floor(r()*tr.length)]);F.push(cart(bs,s.dp,r,s.mf))}
  const fp=(x,y)=>{let v=0;F.forEach(T=>v+=cpred(T,x,y));return v*2>=F.length?1:0};
  g+=cells(X,Y,-3,3,-2.5,2.5,(x,y)=>PAL[fp(x,y)])+tr.map(p=>dot(X(p[0]),Y(p[1]),"c"+PAL[p[2]],4)).join("");const av=accOf(va,fp),a1=accOf(va,(x,y)=>cpred(F[0],x,y));
  return {g,m:big(pc(av),"Exactitud del bosque en validación",av>0.82?"ok":"")+tbl([["Exactitud de un solo árbol",pc(a1)],["Ganancia por promediar",f2((av-a1)*100)+" puntos",av>=a1?"ok":"bad"],["Exactitud en entrenamiento",pc(accOf(tr,fp))]])}}};
LAB.gb={a:[7],t:"Gradient Boosting: corregir errores paso a paso",s:{n:10,lr:0.3,nz:0.4},
 q:"Puntos azules: datos de entrenamiento. Línea punteada: la función real. Línea negra: la predicción del modelo, que es la suma de muchos árboles de un solo corte. Cada árbol nuevo se ajusta a los errores que dejaron los anteriores.",
 c:[["n","Número de árboles",1,300,1],["lr","Tasa de aprendizaje",0.02,1,0.02],["nz","Ruido en los datos",0.1,1,0.05]],
 p:["Con tasa 0,30, sube los árboles de 1 a 10 y luego a 60. La escalera se va pegando a la curva real: cada árbol corrige un poco.","Pon la tasa en 1,00 con 300 árboles. El error de entrenamiento se va casi a cero y la línea persigue cada punto: sobreajuste.","Baja la tasa a 0,05 con 300 árboles. Aprende más despacio, la curva queda más suave y el error de prueba es menor. Tasa baja con muchos árboles es la receta habitual."],
 k:"Boosting construye el modelo en serie: cada árbol pequeño aprende el residuo del conjunto anterior. Reduce sesgo paso a paso, así que sí puede sobreajustar si se dejan demasiados árboles. Número de árboles y tasa de aprendizaje se compensan, y se eligen con parada temprana sobre validación.",
 draw(s){const {X,Y,g:g0}=axes(0,10,-2,5,{nx:5,ny:7,xl:"x",yl:"y"});let g=g0;const f=x=>Math.sin(x)+0.3*x,tr=[],te=[];for(let i=0;i<50;i++)tr.push([10*PU[i+10],0]);tr.sort((a,b)=>a[0]-b[0]);tr.forEach((p,i)=>p[1]=f(p[0])+s.nz*PZ[i+10]);for(let i=0;i<120;i++){const x=10*PU[i+400];te.push([x,f(x)+s.nz*PZ[i+400]])}
  const n=tr.length,f0=mean(tr.map(p=>p[1])),res=tr.map(p=>p[1]-f0),st=[];
  for(let m=0;m<s.n;m++){let tot=res.reduce((a,b)=>a+b,0),l=0,best=null;for(let i=1;i<n;i++){l+=res[i-1];if(tr[i][0]===tr[i-1][0])continue;const sc=l*l/i+(tot-l)**2/(n-i);if(!best||sc>best.sc)best={sc,t:(tr[i][0]+tr[i-1][0])/2,a:l/i,b:(tot-l)/(n-i)}}
   st.push(best);for(let i=0;i<n;i++)res[i]-=s.lr*(tr[i][0]<best.t?best.a:best.b)}
  const h=x=>{let v=f0;for(const q of st)v+=s.lr*(x<q.t?q.a:q.b);return v},rm=d=>Math.sqrt(mean(d.map(p=>(p[1]-h(p[0]))**2))),tc=[],fc=[];
  for(let i=0;i<=400;i++){const x=i/40;tc.push([X(x),Y(f(x))]);fc.push([X(x),Y(h(x))])}g+=pth(tc,"k3 dsh")+pth(fc,"kk thin")+tr.map(p=>dot(X(p[0]),Y(p[1]),"",4)).join("");const a=rm(tr),b=rm(te);
  return {g,m:big(f2(b),"Error en datos de prueba (RMSE)",b<s.nz*1.25?"ok":b>s.nz*1.6?"bad":"")+tbl([["Error en entrenamiento (RMSE)",f2(a)],["Ruido de los datos (lo mínimo alcanzable)",f2(s.nz)],["Diagnóstico",a>s.nz*1.5?"Subajuste: faltan árboles":b>a*1.6?"Sobreajuste: persigue el ruido":"Equilibrado"]])}}};
LAB.svmk={a:[7],t:"SVM con kernel RBF: gamma y C",s:{g:0,C:0,nz:0.25},
 q:"Dos clases en forma de medias lunas, que ninguna recta separa. El fondo es la predicción de una máquina de vectores de soporte con kernel gaussiano (aquí en su variante de mínimos cuadrados, que se resuelve en un paso y reacciona igual a gamma y C).",
 c:[["g","gamma (log₁₀): alcance de cada punto",-1.5,2,0.1],["C","C (log₁₀): penalización de errores",-2,3,0.1],["nz","Ruido en los datos",0.05,0.5,0.05]],
 p:["Baja gamma a −1,5. Cada punto influye muy lejos y la frontera es casi una recta: subajuste.","Sube gamma a 2. Cada punto solo influye en su vecindad: la frontera forma islas alrededor de los puntos, la exactitud de entrenamiento sube a 100 % y la de validación cae.","Con gamma en 0,5, mueve C de −2 a 3. C bajo suaviza la frontera; C alto la obliga a respetar cada punto."],
 k:"El kernel RBF mide similitud por distancia: gamma fija el radio de influencia de cada punto y C cuánto se castigan los errores. Los dos regulan la flexibilidad y se ajustan juntos en una rejilla logarítmica con validación cruzada. Exige escalar las variables.",
 draw(s){const {X,Y,g:g0}=axes(-3,3,-2.5,2.5,{nx:6,ny:5});let g=g0;const tr=moons(0,90,s.nz),va=moons(100,90,s.nz),n=tr.length,ga=Math.pow(10,s.g),K=(a,b)=>Math.exp(-ga*((a[0]-b[0])**2+(a[1]-b[1])**2))+1;
  const A=tr.map((p,i)=>tr.map((q,j)=>K(p,q)+(i===j?1/Math.pow(10,s.C):0))),al=solve(A,tr.map(p=>p[2]?1:-1)),fp=(x,y)=>{let v=0;for(let i=0;i<n;i++)v+=al[i]*K(tr[i],[x,y]);return v>0?1:0};
  g+=cells(X,Y,-3,3,-2.5,2.5,(x,y)=>PAL[fp(x,y)])+tr.map(p=>dot(X(p[0]),Y(p[1]),"c"+PAL[p[2]],4)).join("");const at=accOf(tr,fp),av=accOf(va,fp);
  return {g,m:big(pc(av),"Exactitud en validación",av>0.9?"ok":av<0.8?"bad":"")+tbl([["Exactitud en entrenamiento",pc(at)],["Brecha entre ambas",f2((at-av)*100)+" puntos",at-av>0.08?"bad":"ok"],["gamma",ex(ga)],["C",ex(Math.pow(10,s.C))]])}}};
LAB.dbscan={a:[7],t:"DBSCAN: agrupar por densidad",s:{eps:0.37,mp:5},
 q:"Dos medias lunas más algunos puntos sueltos. DBSCAN une puntos que tienen suficientes vecinos dentro de un radio. Cada color es un grupo encontrado; los puntos grises tenues son los que declara ruido.",
 c:[["eps","Radio de vecindad (eps)",0.05,0.9,0.01],["mp","Vecinos mínimos para ser punto central",2,15,1]],
 p:["Con radio 0,05 casi todo es ruido: ningún punto tiene suficientes vecinos tan cerca.","Sube el radio hasta que aparezcan exactamente dos grupos que siguen la forma de las lunas. k-means no puede hacer esto: corta las lunas por la mitad.","Sigue subiendo el radio. Las dos lunas se funden en un solo grupo. El radio útil vive en un rango estrecho."],
 k:"DBSCAN no pide el número de grupos y encuentra formas arbitrarias, además de marcar el ruido. A cambio depende de dos parámetros de densidad y falla cuando los grupos tienen densidades muy distintas. El radio se elige mirando la distancia al k-ésimo vecino.",
 draw(s){const {X,Y,g:g0}=axes(-3,3,-2.5,2.5,{nx:6,ny:5});let g=g0;const P=[];for(let i=0;i<160;i++){const c=i%2,t=Math.PI*(Math.floor(i/2)+0.5)/80;P.push([(c?1-Math.cos(t):Math.cos(t))*1.5-0.75+0.1*PZ[i],(c?0.5-Math.sin(t):Math.sin(t))*1.5-0.4+0.1*PZ[i+200]])}for(let i=0;i<14;i++)P.push([PU[i+700]*6-3,PU[i+720]*5-2.5]);
  const n=P.length,nb=i=>{const o=[];for(let j=0;j<n;j++)if((P[i][0]-P[j][0])**2+(P[i][1]-P[j][1])**2<=s.eps*s.eps)o.push(j);return o},lab=Array(n).fill(-2);let c=-1;
  for(let i=0;i<n;i++){if(lab[i]!==-2)continue;const N=nb(i);if(N.length<s.mp){lab[i]=-1;continue}c++;lab[i]=c;const qu=[...N];while(qu.length){const j=qu.pop();if(lab[j]===-1)lab[j]=c;if(lab[j]!==-2)continue;lab[j]=c;const M=nb(j);if(M.length>=s.mp)qu.push(...M)}}
  P.forEach((p,i)=>{g+=dot(X(p[0]),Y(p[1]),lab[i]<0?"ghost":"c"+PAL[lab[i]%6],4)});const nz=lab.filter(v=>v<0).length;
  return {g,m:big(c+1,"Grupos encontrados",c+1===2?"ok":"")+tbl([["Puntos declarados ruido",nz+" de "+n],["Grupo más grande",c>=0?Math.max(...Array.from({length:c+1},(_,k)=>lab.filter(v=>v===k).length)):0],["Grupos reales en los datos","2 lunas más 14 puntos sueltos"]])}}};
LAB.hier={a:[7],t:"Clustering jerárquico y tipo de enlace",s:{ln:"single",k:3},
 q:"Tres nubes de puntos, dos de ellas unidas por un puente delgado de puntos. El clustering jerárquico parte de cada punto por separado y va fusionando los dos grupos más cercanos; aquí se detiene al llegar al número de grupos que elijas.",
 c:[["ln","Cómo se mide la distancia entre grupos (enlace)","sel",[["single","Simple: los dos puntos más cercanos"],["complete","Completo: los dos puntos más lejanos"],["average","Promedio de todas las distancias"]]],["k","Número de grupos al cortar",1,8,1]],
 p:["Con enlace simple y 3 grupos, las dos nubes unidas por el puente quedan fusionadas en un solo grupo: el enlace simple encadena.","Cambia a enlace completo. Ahora separa las dos nubes, porque mide por los puntos más alejados y prefiere grupos compactos.","Mueve el número de grupos de 1 a 8 con cada enlace. Es el mismo árbol cortado a distinta altura: no hay que reentrenar."],
 k:"El clustering jerárquico construye un árbol completo de fusiones (dendrograma) y el número de grupos se decide después, al cortarlo. El enlace define qué se entiende por grupos cercanos y cambia por completo el resultado. Es costoso con muchos datos.",
 draw(s){const {X,Y,g:g0}=axes(-5,5,-4,4,{nx:5,ny:4});let g=g0;const P=[];for(let i=0;i<22;i++){P.push([-2.6+0.55*PZ[i],1+0.55*PZ[i+100]]);P.push([1.6+0.55*PZ[i+30],1+0.55*PZ[i+130]]);P.push([0+0.6*PZ[i+60],-2.4+0.6*PZ[i+160]])}for(let i=0;i<9;i++)P.push([-1.9+0.36*i,1+0.08*PZ[i+200]]);
  const n=P.length,D=P.map(a=>P.map(b=>Math.hypot(a[0]-b[0],a[1]-b[1])));let C=P.map((_,i)=>[i]),last=0;
  const dist=(A,B)=>{let mn=1e9,mx=0,sm=0;for(const i of A)for(const j of B){const d=D[i][j];if(d<mn)mn=d;if(d>mx)mx=d;sm+=d}return s.ln==="single"?mn:s.ln==="complete"?mx:sm/(A.length*B.length)};
  const nearest=()=>{let bi=0,bj=1,bd=1e9;for(let i=0;i<C.length;i++)for(let j=i+1;j<C.length;j++){const d=dist(C[i],C[j]);if(d<bd){bd=d;bi=i;bj=j}}return [bi,bj,bd]};
  while(C.length>s.k){const [i,j]=nearest();C[i]=C[i].concat(C[j]);C.splice(j,1)}if(C.length>1)last=nearest()[2];
  C.sort((a,b)=>b.length-a.length).forEach((cl,k)=>cl.forEach(i=>{g+=dot(X(P[i][0]),Y(P[i][1]),"c"+PAL[k%6],4.5)}));
  return {g,m:big(C.map(c=>c.length).join(" · "),"Tamaño de cada grupo")+tbl([["Distancia de la siguiente fusión",C.length>1?f2(last):"no quedan fusiones"],["Puntos en total",n]])}}};
LAB.gmm={a:[7],t:"Mezcla de gaussianas (EM) frente a k-means",s:{cv:"sph",it:25},
 q:"Dos grupos alargados y paralelos. Cada elipse es una gaussiana del modelo; cada punto toma el color de la gaussiana que más probablemente lo generó. El algoritmo EM alterna entre asignar puntos de forma probabilística y reajustar las gaussianas.",
 c:[["cv","Forma permitida de cada gaussiana","sel",[["sph","Esférica (equivale a k-means)"],["full","Covarianza completa (elipses libres)"]]],["it","Iteraciones de EM",0,40,1]],
 p:["Con gaussianas esféricas y 25 iteraciones, el modelo corta los dos grupos alargados por la mitad: solo sabe hacer círculos, igual que k-means.","Cambia a covarianza completa. Las elipses se estiran y cada grupo queda bien separado.","Baja las iteraciones a 0 y súbelas una por una para ver cómo EM gira y estira las elipses hasta encajar."],
 k:"Una mezcla de gaussianas es un k-means con formas elípticas y pertenencia probabilística: cada punto tiene una probabilidad de venir de cada componente. El tipo de covarianza es su hiperparámetro clave; como EM converge a óptimos locales, se reinicia varias veces.",
 draw(s){const {X,Y,g:g0}=axes(-5,5,-4,4,{nx:5,ny:4});let g=g0;const P=[],L_=[];for(let i=0;i<140;i++){const c=i%2,a=PZ[i],b=PZ[i+300];P.push([2.1*a,(c?1:-1)*1.05+0.3*a*0+0.32*b+0.35*a]);L_.push(c)}
  let M=[[-2.5,0],[2.5,0]],Sg=[[1,0,1],[1,0,1]],W=[0.5,0.5],R=[];const pdf=(p,m,S_)=>{const det=S_[0]*S_[2]-S_[1]*S_[1],dx=p[0]-m[0],dy=p[1]-m[1];return Math.exp(-0.5*(S_[2]*dx*dx-2*S_[1]*dx*dy+S_[0]*dy*dy)/det)/(6.2832*Math.sqrt(det))};
  const E=()=>{R=P.map(p=>{const a=W[0]*pdf(p,M[0],Sg[0]),b=W[1]*pdf(p,M[1],Sg[1]),t=a+b||1e-300;return [a/t,b/t]})};E();
  for(let t=0;t<s.it;t++){for(let k=0;k<2;k++){const nk=R.reduce((u,r)=>u+r[k],0)||1e-9;W[k]=nk/P.length;const mx=P.reduce((u,p,i)=>u+R[i][k]*p[0],0)/nk,my=P.reduce((u,p,i)=>u+R[i][k]*p[1],0)/nk;let a=0,b=0,c=0;P.forEach((p,i)=>{const dx=p[0]-mx,dy=p[1]-my;a+=R[i][k]*dx*dx;b+=R[i][k]*dx*dy;c+=R[i][k]*dy*dy});a/=nk;b/=nk;c/=nk;M[k]=[mx,my];Sg[k]=s.cv==="sph"?[(a+c)/2+1e-6,0,(a+c)/2+1e-6]:[a+1e-6,b,c+1e-6]}E()}
  let ok=0;P.forEach((p,i)=>{const k=R[i][1]>R[i][0]?1:0;if(k===L_[i])ok++;g+=dot(X(p[0]),Y(p[1]),"c"+PAL[k],4)});
  for(let k=0;k<2;k++){const [a,b,c]=Sg[k],tr_=a+c,dt=a*c-b*b,l1=tr_/2+Math.sqrt(Math.max(0,tr_*tr_/4-dt)),l2=tr_/2-Math.sqrt(Math.max(0,tr_*tr_/4-dt)),th=0.5*Math.atan2(2*b,a-c),el=[];for(let i=0;i<=60;i++){const t=i/60*6.2832,u=2*Math.sqrt(l1)*Math.cos(t),v=2*Math.sqrt(Math.max(l2,1e-9))*Math.sin(t);el.push([X(M[k][0]+u*Math.cos(th)-v*Math.sin(th)),Y(M[k][1]+u*Math.sin(th)+v*Math.cos(th))])}g+=pth(el,k?"k2":"k1")}
  const pur=Math.max(ok,P.length-ok)/P.length;
  return {g,m:big(pc(pur),"Puntos asignados a su grupo real",pur>0.9?"ok":pur<0.7?"bad":"")+tbl([["Peso de cada componente",f2(W[0])+" · "+f2(W[1])],["Iteraciones de EM",s.it]])}}};
LAB.cal={a:[7,13],t:"Calibración de probabilidades",s:{T:2,fix:0},
 q:"Diagrama de confiabilidad. En horizontal, la probabilidad que dice el modelo; en vertical, la frecuencia con que el evento ocurre de verdad entre los casos con esa probabilidad. Un modelo calibrado cae sobre la diagonal.",
 c:[["T","Exceso de confianza del modelo",0.3,4,0.05],["fix","Recalibrar con el método de Platt","chk"]],
 p:["Con exceso de confianza 1, los puntos caen sobre la diagonal. Súbelo a 3: cuando el modelo dice 90 %, el evento ocurre bastante menos. Así se comportan muchos modelos de boosting y redes.","Mira el AUC mientras mueves el control: no cambia. El modelo ordena igual de bien; solo sus probabilidades están mal.","Activa la recalibración. La curva vuelve a la diagonal y el error de calibración cae, sin tocar el AUC."],
 k:"Discriminar y calibrar son cosas distintas. Si la probabilidad se usa como número (pérdida esperada, precio, umbral por costo), hay que calibrar con datos que el modelo no vio: Platt ajusta una sigmoide, la regresión isotónica una curva monótona libre. Se mide con el diagrama, el error de calibración y el puntaje de Brier.",
 draw(s){const r=rng(13),N=3000,D=[];for(let i=0;i<N;i++){const z=1.6*gauss(r)-0.6,y=r()<1/(1+Math.exp(-z))?1:0;D.push([s.T*z,y])}
  let a=1,b=0;if(s.fix){a=0;for(let it=0;it<40;it++){let g0_=0,g1=0,h00=0,h01=0,h11=0;D.forEach(q=>{const p=1/(1+Math.exp(-(b+a*q[0]))),w=p*(1-p);g0_+=q[1]-p;g1+=(q[1]-p)*q[0];h00+=w;h01+=w*q[0];h11+=w*q[0]*q[0]});const det=h00*h11-h01*h01;if(det<1e-9)break;b+=(h11*g0_-h01*g1)/det;a+=(h00*g1-h01*g0_)/det}}
  const {X,Y,g:g0}=axes(0,1,0,1,{nx:5,ny:5,xl:"Probabilidad que dice el modelo",yl:"Frecuencia real"});let g=g0+pth([[X(0),Y(0)],[X(1),Y(1)]],"mean");const B=Array.from({length:10},()=>[0,0,0]);let br=0;
  D.forEach(q=>{const p=1/(1+Math.exp(-(b+a*q[0]))),k=Math.min(9,Math.floor(p*10));B[k][0]++;B[k][1]+=p;B[k][2]+=q[1];br+=(p-q[1])**2});
  const pts=[];let ece=0;B.forEach(v=>{if(v[0]>20){pts.push([X(v[1]/v[0]),Y(v[2]/v[0])]);ece+=v[0]/N*Math.abs(v[1]/v[0]-v[2]/v[0])}});g+=pth(pts,"k1")+pts.map(p=>dot(p[0],p[1],"c1",6)).join("");
  const so=[...D].sort((x,y)=>x[0]-y[0]);let rk=0,n1=0;so.forEach((q,i)=>{if(q[1]){rk+=i+1;n1++}});const auc=(rk-n1*(n1+1)/2)/(n1*(N-n1));
  return {g,m:big(f2(ece),"Error de calibración esperado (ECE)",ece<0.03?"ok":ece>0.08?"bad":"")+tbl([["Puntaje de Brier (menor es mejor)",f2(br/N)],["AUC (no depende de la calibración)",f2(auc)]])}}};

LAB.bin={a:[6],t:"Discretización, WoE y valor de información",s:{nb:5,st:1},
 q:"Una variable continua de 1 500 clientes, cortada en tramos con igual número de casos. Cada barra es la tasa de incumplimiento del tramo. Así se preparan las variables de una scorecard de crédito.",
 c:[["nb","Número de tramos",2,30,1],["st","Fuerza real de la variable",0,2,0.1]],
 p:["Con 5 tramos, la tasa de malos baja de forma ordenada de un tramo al siguiente: la relación es monótona y fácil de explicar.","Sube a 30 tramos. El valor de información aumenta, pero las barras empiezan a subir y bajar sin orden: estás midiendo ruido, y cada tramo tiene pocos casos.","Pon la fuerza real en 0. Con 30 tramos el valor de información no baja a cero aunque la variable no sirve para nada."],
 k:"Agrupar una variable en tramos permite captar relaciones no lineales con un modelo lineal y da estabilidad. El peso de la evidencia (WoE) de cada tramo es el logaritmo del cociente entre la proporción de buenos y de malos; el valor de información (IV) resume cuánto separa la variable. Demasiados tramos inflan el IV.",
 draw(s){const r=rng(23),N=1500,D=[];for(let i=0;i<N;i++){const x=gauss(r);D.push([x,r()<1/(1+Math.exp(-(-1.8-s.st*0.8*x)))?1:0])}D.sort((a,b)=>a[0]-b[0]);
  const tb=D.reduce((t,q)=>t+q[1],0),tg=N-tb,B=[];for(let k=0;k<s.nb;k++){const sl=D.slice(Math.floor(k*N/s.nb),Math.floor((k+1)*N/s.nb)),bad=sl.reduce((t,q)=>t+q[1],0);B.push([sl.length,bad])}
  const top=Math.max(0.3,...B.map(v=>v[1]/v[0]))*1.1,{X,Y,g:g0}=axes(0,s.nb,0,top,{nx:Math.min(s.nb,10),ny:4,xl:"Tramo (de menor a mayor valor de la variable)",yl:"Tasa de incumplimiento"});let g=g0,iv=0,inv=0;
  B.forEach((v,k)=>{const rt=v[1]/v[0];g+='<rect class="bar k1" x="'+(X(k)+2)+'" y="'+Y(rt)+'" width="'+Math.max(2,480/s.nb-4)+'" height="'+(370-Y(rt))+'"/>';const pb=(v[1]+0.5)/(tb+0.5),pg=(v[0]-v[1]+0.5)/(tg+0.5);iv+=(pg-pb)*Math.log(pg/pb);if(k&&rt>B[k-1][1]/B[k-1][0]+1e-9)inv++});
  g+=seg(50,Y(tb/N),530,Y(tb/N),"mean");
  return {g,m:big(f2(iv),"Valor de información (IV)",iv<0.02?"bad":iv>0.1?"ok":"")+tbl([["Lectura habitual del IV",iv<0.02?"No predictiva":iv<0.1?"Débil":iv<0.3?"Media":"Fuerte"],["Tramos que rompen la tendencia",inv+" de "+(s.nb-1),inv>s.nb/4?"bad":"ok"],["Casos por tramo",Math.floor(N/s.nb)],["Malos por tramo (promedio)",f2(tb/s.nb)]])}}};
LAB.resam={a:[6,7],t:"Desbalance: peso de clase y sobremuestreo",s:{w:1,pi:0.08},
 q:"Un problema con pocos casos positivos (naranja) frente a muchos negativos (azul). La línea es la frontera de una regresión logística. El peso de la clase positiva dice cuánto más cuenta un error en un positivo que en un negativo.",
 c:[["w","Peso de la clase positiva",1,30,0.5],["pi","Proporción de positivos",0.03,0.5,0.01]],
 p:["Con peso 1 y 8 % de positivos, la frontera queda muy metida en la zona naranja: el modelo casi nunca dice positivo y la sensibilidad es baja.","Sube el peso hasta cerca de 12, que es la razón entre negativos y positivos. La frontera se mueve hacia el centro y la sensibilidad sube, a costa de precisión.","Sigue hasta 30: ahora hay demasiadas falsas alarmas. El peso no mejora el modelo; solo elige otro punto del mismo intercambio."],
 k:"Dar peso a la clase minoritaria, duplicar sus casos o reducir la mayoritaria hacen casi lo mismo: mueven la frontera, igual que cambiar el umbral. No crean información nueva y descalibran las probabilidades, así que después hay que recalibrar. El remuestreo se aplica solo al conjunto de entrenamiento.",
 draw(s){const {X,Y,g:g0}=axes(-4,4,-3.5,3.5,{nx:4,ny:4});let g=g0;const mk=(o,n)=>{const d=[];for(let i=0;i<n;i++){const c=PU[o+i]<s.pi?1:0;d.push([(c?1.1:-0.7)+PZ[o+i],(c?0.8:-0.5)+PZ[o+300+i],c])}return d},tr=mk(0,280),va=mk(300,280);let w0=0,w1=0,b=0;
  for(let it=0;it<400;it++){let g0_=0,g1=0,gb=0,sw=0;tr.forEach(p=>{const k=p[2]?s.w:1,q=(1/(1+Math.exp(-(w0*p[0]+w1*p[1]+b)))-p[2])*k;g0_+=q*p[0];g1+=q*p[1];gb+=q;sw+=k});w0-=1.5*g0_/sw;w1-=1.5*g1/sw;b-=1.5*gb/sw}
  const nw=Math.hypot(w0,w1)||1e-9,pts=[];for(const t of[-9,9])pts.push([X(-w0*b/(nw*nw)-w1/nw*t),Y(-w1*b/(nw*nw)+w0/nw*t)]);
  g+=tr.map(p=>dot(X(p[0]),Y(p[1]),"c"+PAL[p[2]],p[2]?5:3)).join("")+pth(pts,"kk");let tp=0,fp=0,fn=0;va.forEach(p=>{const pr=w0*p[0]+w1*p[1]+b>0?1:0;if(pr&&p[2])tp++;else if(pr)fp++;else if(p[2])fn++});
  const re=tp+fn?tp/(tp+fn):0,pr=tp+fp?tp/(tp+fp):0;
  return {g,m:big(pc(re),"Sensibilidad en validación",re>0.7?"ok":re<0.4?"bad":"")+tbl([["Precisión",tp+fp?pc(pr):"sin alarmas"],["F1",f2(pr+re?2*pr*re/(pr+re):0)],["Falsas alarmas",fp],["Razón negativos / positivos en entrenamiento",f2(tr.filter(p=>!p[2]).length/Math.max(1,tr.filter(p=>p[2]).length))]])}}};
LAB.split=(()=>{const D=[];for(let i=0;i<120;i++){const c=i%2;D.push([(c?0.7:-0.7)+PZ[i],(c?0.5:-0.5)+PZ[i+300],c])}const fitacc=(tr,te)=>{const m=[0,1].map(c=>{const d=tr.filter(p=>p[2]===c);return [mean(d.map(p=>p[0])),mean(d.map(p=>p[1]))]});return mean(te.map(p=>(((p[0]-m[1][0])**2+(p[1]-m[1][1])**2<(p[0]-m[0][0])**2+(p[1]-m[0][1])**2)?1:0)===p[2]?1:0))};
 return {a:[6,7],t:"Partición de datos y validación cruzada",s:{tf:0.2,k:5},
 q:"El mismo modelo y los mismos 120 datos, evaluados 300 veces cambiando solo qué filas van a prueba. Barras azules: exactitud medida con una sola partición. Barras naranjas: exactitud medida con validación cruzada de k pliegues.",
 c:[["tf","Proporción de datos para prueba (una sola partición)",0.05,0.5,0.05],["k","Número de pliegues de la validación cruzada",2,12,1]],
 p:["Con 10 % para prueba, el histograma azul es muy ancho: según la suerte de la partición, el mismo modelo parece malo o excelente.","Sube la proporción de prueba a 40 %. La medición se estabiliza, pero quedan menos datos para entrenar.","Compara con la validación cruzada: su histograma naranja es más estrecho porque cada dato se usa una vez para probar. Subir los pliegues de 2 a 10 la mejora un poco más."],
 k:"Una métrica de validación es una estimación con su propio error. Con pocos datos, una sola partición es una lotería. La validación cruzada promedia k evaluaciones y da una cifra más estable; el conjunto de prueba final se guarda aparte y se usa una sola vez.",
 draw(s){const r=rng(41),H=[],C=[],sh=()=>{const a=[...D];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  for(let t=0;t<300;t++){const a=sh(),nt=Math.max(4,Math.round(s.tf*120));H.push(fitacc(a.slice(nt),a.slice(0,nt)));const b=sh(),f=[];for(let j=0;j<s.k;j++){const lo=Math.floor(j*120/s.k),hi=Math.floor((j+1)*120/s.k);f.push(fitacc(b.slice(0,lo).concat(b.slice(hi)),b.slice(lo,hi)))}C.push(mean(f))}
  const nb=24,hh=Array(nb).fill(0),hc=Array(nb).fill(0),bi=v=>Math.max(0,Math.min(nb-1,Math.floor((v-0.4)/0.6*nb)));H.forEach(v=>hh[bi(v)]++);C.forEach(v=>hc[bi(v)]++);
  const {X,Y,g:g0}=axes(0.4,1,0,Math.max(...hh,...hc)*1.1,{nx:6,ny:4,xl:"Exactitud medida",yl:"Veces"});let g=g0;
  hh.forEach((c,i)=>{g+='<rect class="bar k1" x="'+X(0.4+0.6*i/nb)+'" y="'+Y(c)+'" width="9" height="'+(370-Y(c))+'"/>'});hc.forEach((c,i)=>{g+='<rect class="bar k2" x="'+(X(0.4+0.6*i/nb)+10)+'" y="'+Y(c)+'" width="9" height="'+(370-Y(c))+'"/>'});
  const sh_=sd(H),sc=sd(C);
  return {g,m:big(f2(sh_*100)+" puntos","Variación de la medición con una sola partición",sh_>0.07?"bad":"")+tbl([["Variación con validación cruzada",f2(sc*100)+" puntos","ok"],["Rango observado con una partición",pc(Math.min(...H))+" a "+pc(Math.max(...H))],["Datos de prueba en una partición",Math.max(4,Math.round(s.tf*120))]])}}}})();
LAB.transf={a:[6],t:"Transformaciones: logaritmo y Box-Cox",s:{l:1},
 q:"Histograma de una variable muy asimétrica (como montos o tiempos) después de aplicarle una transformación de potencia Box-Cox con el parámetro lambda que elijas. La curva es la normal con la misma media y desviación.",
 c:[["l","Lambda de Box-Cox",-1,2,0.05]],
 p:["Con lambda 1 la variable queda como estaba: cola larga a la derecha y asimetría alta.","Lleva lambda a 0, que equivale al logaritmo. El histograma se vuelve simétrico y calza con la curva normal.","Prueba lambda 0,5 (raíz cuadrada) y −1 (inverso). La raíz corrige a medias; el inverso se pasa y deja la cola al otro lado."],
 k:"Transformar una variable asimétrica acerca su forma a la normal, estabiliza la varianza y reduce el peso de los valores extremos, lo que ayuda a modelos lineales y basados en distancias. Los árboles no lo necesitan. El lambda se estima solo con entrenamiento.",
 draw(s){const d=PZ.slice(0,400).map(z=>Math.exp(1+0.8*z)),t=d.map(v=>Math.abs(s.l)<1e-9?Math.log(v):(Math.pow(v,s.l)-1)/s.l),m=mean(t),sg=sd(t),z=t.map(v=>(v-m)/sg),nb=40,h=Array(nb).fill(0);z.forEach(v=>{const b=Math.floor((v+4)/8*nb);if(b>=0&&b<nb)h[b]++});
  const dens=h.map(c=>c/400/(8/nb)),{X,Y,g:g0}=axes(-4,4,0,Math.max(0.5,...dens)*1.08,{nx:8,ny:4,xl:"Valor transformado y estandarizado"});let g=g0;dens.forEach((v,i)=>{g+='<rect class="bar k1" x="'+X(-4+8*i/nb)+'" y="'+Y(v)+'" width="11" height="'+(370-Y(v))+'"/>'});
  const cu=[];for(let i=0;i<=160;i++){const x=-4+i/20;cu.push([X(x),Y(npdf(x))])}g+=pth(cu,"kk");const sk=mean(z.map(v=>v**3));
  return {g,m:big(f2(sk),"Asimetría (0 es simétrico)",Math.abs(sk)<0.3?"ok":Math.abs(sk)>1?"bad":"")+tbl([["Transformación",Math.abs(s.l)<0.03?"Logaritmo":Math.abs(s.l-1)<0.03?"Ninguna":Math.abs(s.l-0.5)<0.03?"Raíz cuadrada":Math.abs(s.l+1)<0.03?"Inverso":"Potencia "+f2(s.l)],["Valores a más de 3 desviaciones",z.filter(v=>Math.abs(v)>3).length+" de 400"]])}}};
LAB.outdet={a:[6],t:"Detección de atípicos: z-score, IQR y MAD",s:{me:"z",k:3,nc:3},
 q:"Sesenta mediciones normales (azul) y algunas contaminadas (naranja) que tú agregas. Borde rojo: punto que la regla elegida marca como atípico. Las líneas punteadas son los límites de la regla.",
 c:[["me","Regla","sel",[["z","Z-score (media y desviación)"],["iqr","Rango intercuartílico (regla de Tukey)"],["mad","Mediana y MAD"]]],["k","Umbral de la regla",1,5,0.1],["nc","Mediciones contaminadas",0,20,1]],
 p:["Con z-score, umbral 3 y 3 contaminadas, la regla las detecta todas.","Sube las contaminadas a 15. El z-score deja de verlas: los propios atípicos inflan la media y la desviación con que se los juzga. Se llama enmascaramiento.","Cambia a mediana y MAD con las mismas 15. Vuelve a detectarlas, porque la mediana y la MAD casi no se mueven."],
 k:"Una regla de atípicos solo es tan robusta como las estadísticas que usa. Media y desviación se contaminan con lo que intentan detectar; cuartiles y mediana resisten hasta una cuarta parte o la mitad de datos malos. Marcar un punto no es borrarlo: primero hay que saber si es error o un caso real.",
 draw(s){const N=PZ.slice(520,580).map(z=>50+5*z),C=[];for(let i=0;i<s.nc;i++)C.push(80+6*PU[i+50]);const d=N.concat(C),so=[...d].sort((a,b)=>a-b),q=p=>{const i=(so.length-1)*p,l=Math.floor(i);return so[l]+(so[Math.min(l+1,so.length-1)]-so[l])*(i-l)};let lo,hi;
  if(s.me==="z"){const m=mean(d),sg=sd(d);lo=m-s.k*sg;hi=m+s.k*sg}else if(s.me==="iqr"){const a=q(0.25),b=q(0.75);lo=a-s.k*(b-a);hi=b+s.k*(b-a)}else{const md=q(0.5),ad=d.map(v=>Math.abs(v-md)).sort((a,b)=>a-b),mad=1.4826*ad[Math.floor(ad.length/2)];lo=md-s.k*mad;hi=md+s.k*mad}
  const X=v=>50+(v-30)/65*480;let g=seg(50,230,530,230,"ax"),tp=0,fp=0;[30,40,50,60,70,80,90].forEach(v=>g+=txt(X(v),252,v,"middle"));
  d.forEach((v,i)=>{const an=i>=60,fl=v<lo||v>hi;if(fl){an?tp++:fp++}g+=dot(X(Math.min(95,v)),205-(i%7)*13,(an?"cB":"")+(fl?" wrong":""),5)});
  [lo,hi].forEach(v=>{if(v>30&&v<95)g+=seg(X(v),90,X(v),240,"bnd")});g+=txt(52,60,"Límites de la regla: "+f2(lo)+" a "+f2(hi));
  return {g,m:big(tp+" de "+s.nc,"Contaminadas detectadas",s.nc&&tp===s.nc?"ok":tp<s.nc/2?"bad":"")+tbl([["Normales marcadas por error",fp+" de 60",fp>2?"bad":"ok"],["Media de todos los datos",f2(mean(d))],["Mediana de todos los datos",f2(q(0.5))]])}}};

 tree:{m:"Árbol de decisión",sup:["No supone linealidad ni distribución alguna.","No necesita escalar variables.","Las fronteras son cortes paralelos a los ejes: le cuesta una relación diagonal.","Es inestable: pequeños cambios en los datos cambian el árbol."],hp:[["max_depth","Profundidad máxima. Es el control principal del sobreajuste."],["min_samples_leaf","Casos mínimos en una hoja: evita hojas con uno o dos casos."],["min_samples_split","Casos mínimos para intentar un corte."],["ccp_alpha","Poda por costo-complejidad: más alto, árbol más pequeño."],["criterion","Medida de impureza: gini o entropy."]]},

 gb:{m:"Gradient Boosting (XGBoost, LightGBM, CatBoost)",sup:["Sin supuestos de linealidad ni de escala.","Los errores se corrigen de forma aditiva, árbol tras árbol.","Sensible a ruido en las etiquetas: puede perseguir casos mal etiquetados.","No extrapola fuera del rango visto."],hp:[["n_estimators","Número de árboles. Aquí más sí puede sobreajustar."],["learning_rate","Cuánto aporta cada árbol. Bajo exige más árboles y suele generalizar mejor."],["max_depth o num_leaves","Tamaño de cada árbol; habitual entre 3 y 8 niveles."],["subsample y colsample_bytree","Fracción de filas y de columnas por árbol: agregan azar y regularizan."],["reg_lambda y reg_alpha","Penalización L2 y L1 sobre los valores de las hojas."],["early_stopping_rounds","Detiene el entrenamiento cuando la validación deja de mejorar."]]},
 svm:{m:"SVM lineal",sup:["Las clases son separables, al menos aproximadamente, por un hiperplano.","Variables escaladas: el margen es una distancia.","No da probabilidades de forma nativa."],hp:[["C","Penalización por violar el margen: alto es margen estrecho, bajo es margen ancho."],["loss y penalty","Tipo de pérdida y de regularización en LinearSVC."],["class_weight","Peso de clases para desbalance."]]},
 svmk:{m:"SVM con kernel RBF",sup:["Los casos cercanos en distancia pertenecen a la misma clase.","Variables escaladas.","Costo de entrenamiento que crece rápido con el número de casos: no escala a millones."],hp:[["C","Penalización de errores: alto ajusta más a cada punto."],["gamma","Radio de influencia de cada punto: alto es influencia muy local y sobreajuste."],["kernel","rbf, poly, sigmoid o linear; rbf es el punto de partida."],["Búsqueda conjunta","C y gamma se ajustan juntos en rejilla logarítmica."]]},
 nb:{m:"Naive Bayes gaussiano",sup:["Las variables son independientes entre sí dentro de cada clase.","Cada variable sigue una normal dentro de cada clase.","Las probabilidades previas de clase reflejan la población real."],hp:[["var_smoothing","Varianza mínima añadida para estabilidad numérica."],["priors","Probabilidades previas de clase, si no se quieren las de la muestra."]]},
 km:{m:"k-means",sup:["Grupos aproximadamente esféricos.","Grupos de tamaño y dispersión parecidos.","Variables escaladas.","El número de grupos se conoce o se elige aparte."],hp:[["n_clusters","Número de grupos."],["n_init","Cuántas veces se reinicia con centroides distintos; se queda con la mejor."],["init","'k-means++' reparte mejor los centroides iniciales que el azar."],["max_iter","Tope de iteraciones."]]},
 dbscan:{m:"DBSCAN",sup:["Los grupos son zonas de alta densidad separadas por zonas de baja densidad.","Todos los grupos tienen densidad parecida.","Variables escaladas."],hp:[["eps","Radio de vecindad. Es el parámetro más delicado."],["min_samples","Vecinos mínimos para ser punto central; más alto exige grupos más densos."],["metric","Cómo se mide la distancia."]]},
 hier:{m:"Clustering jerárquico aglomerativo",sup:["Existe una estructura anidada de grupos.","La distancia elegida tiene sentido para los datos.","Variables escaladas.","Tamaño de datos moderado: el costo crece con el cuadrado de los casos."],hp:[["n_clusters o distance_threshold","Dónde se corta el árbol."],["linkage","ward, complete, average o single: define qué son grupos cercanos."],["metric","Distancia entre puntos."]]},
 gmm:{m:"Mezcla de gaussianas",sup:["Cada grupo sigue una distribución normal multivariada.","El número de componentes se conoce o se elige con BIC o AIC.","Suficientes datos por componente para estimar su covarianza."],hp:[["n_components","Número de gaussianas."],["covariance_type","full, tied, diag o spherical: cuánta libertad de forma tiene cada una."],["n_init","Reinicios para evitar óptimos locales."],["reg_covar","Regularización que evita covarianzas degeneradas."]]},
 pca:{m:"PCA",sup:["Las relaciones entre variables son lineales.","Las direcciones de mayor varianza son las que importan.","Variables centradas y, casi siempre, estandarizadas.","Sensible a valores atípicos."],hp:[["n_components","Cuántas componentes conservar, como número o como fracción de varianza."],["whiten","Si reescala las componentes a varianza 1."],["svd_solver","Algoritmo de descomposición; 'randomized' para datos grandes."]]},
 mlp:{m:"Red neuronal multicapa",sup:["Hay suficientes datos para la cantidad de parámetros.","Variables escaladas.","La relación puede ser no lineal y compleja; no supone forma alguna.","El resultado depende de la inicialización."],hp:[["hidden_layer_sizes","Número de capas y neuronas: la capacidad de la red."],["learning_rate_init","Tamaño del paso de aprendizaje; es el más sensible."],["alpha","Regularización L2 sobre los pesos."],["activation","relu, tanh o logistic."],["batch_size, max_iter y early_stopping","Controlan el entrenamiento y cuándo parar."]]},
 cal:{m:"Calibración de probabilidades",sup:["Se calibra con datos que el modelo no usó para entrenar.","Platt supone que la distorsión tiene forma de sigmoide.","La isotónica solo supone monotonía, pero necesita más datos."],hp:[["method","'sigmoid' (Platt) o 'isotonic'."],["cv","Pliegues para calibrar sin contaminar el entrenamiento."]]}

const GUIA=[{"n":"1","t":"Regresión Lineal, Ridge, Lasso y ElasticNet","hp":[{"name":"Multiplicador de Regularización","nivel":"Básico","que":"Controla la severidad de la penalización de los coeficientes del modelo. Multiplica el término de la norma L1 (Lasso), L2 (Ridge) o la combinación de ambas (ElasticNet). En la fórmula de Ridge, añade alpha Suma[j=1..p] thetaj2 al error cuadrático medio, forzando a que las magnitudes de los coeficientes disminuyan. En Lasso, añade alpha Suma[j=1..p] |thetaj|, induciendo a que los coeficientes menos importantes se reduzcan a exactamente cero.","val":"Rango logarítmico exponencial. Por ejemplo, [1e-5, 1e-4, 1e-3, 0.01, 0.1, 1.0, 10.0, 100.0]. Default en scikit-learn = 1.0.","alto":"Provoca un fuerte subajuste (underfitting). Los coeficientes se contraen demasiado hacia cero (en Ridge) o se eliminan por completo (en Lasso), convirtiendo la recta en un modelo plano equivalente al promedio de la variable objetivo.","bajo":"Se reduce al estimador clásico de mínimos cuadrados ordinarios (OLS). Si hay alta colinealidad o más variables que observaciones (p > n), el modelo sufrirá de sobreajuste severo, varianza extrema e inestabilidad numérica (matrices no invertibles).","inter":"Íntimamente relacionado con l1_ratio (ElasticNet). A mayor alpha, el impacto de la elección de la penalización L1 vs L2 se magnifica de forma exponencial.","tun":"Búsqueda en cuadrícula en escala logarítmica (GridSearchCV o RidgeCV / LassoCV en scikit-learn, que utilizan la validación cruzada eficiente \"leave-one-out\" de forma nativa).","err":"Intentar regularizar datos sin estandarizar previamente. Los algoritmos penalizan la magnitud absoluta de los coeficientes. Si una variable está en milímetros y otra en kilómetros, la variable con escala menor recibirá una penalización injustamente alta.","apl":"Predicción de la resistencia a la compresión del clínker en base a las proporciones químicas porcentuales del mineral de alimentación. Al estar las composiciones altamente correlacionadas (multicolinealidad), un OLS tradicional arroja coeficientes absurdos (e.g. correlación positiva teórica con signo negativo). Sintonizar alpha estabiliza los coeficientes físicos permitiendo la interpretación correcta para el operador de horno.","pri":"ESENCIAL","code":"alpha o lambda en la literatura"},{"name":"Proporción de Mezcla de Penalizaciones","nivel":"Intermedio","que":"Es el factor de ponderación convexa entre la penalización L1 (Lasso) y L2 (Ridge). En la función de costo: J(theta) = MSE(theta) + r alpha Suma |thetai| + (1-r)/(2) alpha Suma thetai2. Un valor de l1_ratio = 1.0 equivale a Lasso puro, y l1_ratio = 0.0 equivale a Ridge puro.","val":"Rango cerrado [0.0, 1.0]. Default en scikit-learn = 0.5.","alto":"El modelo se comportará como Lasso, promoviendo la \"escasez\" (sparsity), forzando a que las variables menos influyentes tengan coeficientes exactamente de cero y realizando una selección automática de variables.","bajo":"El modelo se comportará como Ridge. Mantendrá todas las variables en el modelo pero reduciendo uniformemente su magnitud, lo cual es perjudicial si la mayoría de variables del dataset son puramente ruido.","inter":"Su efectividad depende directamente de la magnitud de alpha. Si alpha es muy cercano a cero, alterar l1_ratio no tendrá ningún efecto perceptible.","tun":"Búsqueda en cuadrícula bidimensional combinando alpha y l1_ratio. Se recomienda probar valores específicos como [0.1, 0.5, 0.7, 0.9, 0.95, 0.99, 1.0] debido a que el comportamiento óptimo suele concentrarse cerca de L1 para lograr sparsity conservando el efecto de agrupación de Ridge.","err":"Ajustar l1_ratio muy alto en presencia de variables altamente correlacionadas, esperando que el modelo seleccione de forma estable. Lasso tiende a elegir una variable al azar del grupo correlacionado e ignorar las demás. Mantener un l1_ratio menor (e.g. 0.5 - 0.8) permite el \"efecto agrupación\" (grouping effect) donde los coeficientes correlacionados entran o salen juntos.","apl":"Selección de sensores clave de un total de 120 variables de proceso correlacionadas (vibración de molino, flujo de agua, presión de aire, pH) para predecir la recuperación de mineral valioso. ElasticNet selecciona un conjunto representativo y estable sin descartar arbitrariamente variables físicas complementarias.","pri":"IMPORTANTE","code":"l1_ratio o r"},{"name":"Ajustar Intercepto","nivel":"Básico","que":"Define si el modelo calculará matemáticamente el sesgo o intercepto de la función lineal (theta0 o sesgo b). Si se configura como False, se asume que los datos están perfectamente centrados y que la recta o hiperplano de regresión debe pasar obligatoriamente por el origen dimensional exacto (0,0).","val":"Booleano: True o False. Default en scikit-learn = True.","alto":"N/A (Booleano).","bajo":"Si se define como False en datos no centrados, el modelo intentará forzar el paso por el origen, sesgando severamente todos los coeficientes dependientes y arruinando la métrica de ajuste R2, que puede volverse altamente negativa.","inter":"Si fit_intercept=True pero los datos ya han sido preprocesados con un escalador (como StandardScaler), el intercepto calculado será prácticamente cero.","tun":"Por regla empírica del negocio. Mantener siempre en True, a menos que por leyes físicas estrictas del proceso de ingeniería sepamos que cuando todas las variables predictoras valen cero, la variable objetivo debe ser exactamente cero.","err":"Desactivar fit_intercept para simplificar el modelo sin haber centrado previamente la variable objetivo Y, provocando un grave sesgo sistemático en las predicciones.","apl":"Estimación del desgaste de un revestimiento interno en milímetros en base a las horas de operación acumuladas. Si las horas son cero, el desgaste debe ser exactamente cero, lo que justifica parametrizar fit_intercept=False para respetar la restricción física del sistema real.","pri":"OPCIONAL","code":"fit_intercept"},{"name":"Iteraciones Máximas del Solver","nivel":"Intermedio","que":"Número máximo de iteraciones del solver iterativo antes de detenerse. Si no converge dentro de este límite, emite un ConvergenceWarning1.","val":"[1000, 5000, 10000]. Default: Lasso/ElasticNet = 1000.","alto":"Entrenamiento más lento sin ganancia si ya convergió.","bajo":"El modelo no converge; coeficientes subóptimos y advertencia silenciosa.","inter":"Con tol y con el escalado de features (datos sin escalar requieren más iteraciones).","tun":"Subir hasta que desaparezca el warning; estandarizar features primero.","err":"Ignorar el ConvergenceWarning y reportar coeficientes no convergidos.","apl":"Ajustar una regresión Lasso sobre decenas de variables correlacionadas: sin un max_iter suficiente, la selección de variables queda a medio converger y cambia entre corridas.","pri":"IMPORTANTE","code":"max_iter"},{"name":"Tolerancia de Convergencia","nivel":"Intermedio","que":"Umbral de mejora entre iteraciones: si la mejora cae por debajo de tol, el algoritmo se detiene. Equilibra precisión numérica y velocidad.","val":"[1e-3, 1e-4, 1e-5]. Default: ~1e-4.","alto":"Para prematuramente antes de la convergencia real (subajuste).","bajo":"Itera de más sin ganancia práctica, desperdiciando cómputo.","inter":"Con max_iter, que puede volverse el límite real si tol es muy pequeño.","tun":"Dejar el default salvo problemas de convergencia o exigencias de velocidad.","err":"Bajarlo a 1e-10 creyendo que mejora la precisión del modelo.","apl":"Acelerar el reentrenamiento periódico de un modelo lineal en un pipeline automático sin sacrificar calidad práctica.","pri":"OPCIONAL","code":"tol"}]},{"n":"2","t":"Regresión Logística","hp":[{"name":"Parámetro del Término de Penalización","nivel":"Básico","que":"Es el parámetro inverso de la fuerza de regularización. Matemáticamente se expresa como C = 1 / lambda o C = 1 / alpha. Un valor menor de C especifica una regularización más fuerte (penaliza coeficientes grandes con mayor severidad), mientras que valores altos de C permiten al modelo ajustar los pesos con mayor libertad al entrenar.","val":"Rango logarítmico: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]. Default en scikit-learn = 1.0.","alto":"El modelo se desregulariza, permitiendo coeficientes con magnitudes elevadas. Esto conduce a sobreajuste (overfitting), donde el límite de decisión se vuelve demasiado complejo y sensible al ruido operacional.","bajo":"Provoca un subajuste (underfitting) extremo. La regularización comprime casi todos los coeficientes hacia cero, impidiendo que el modelo aprenda patrones complejos y reduciendo el clasificador a una constante basada únicamente en el sesgo promedio.","inter":"Interactúa críticamente con el tipo de penalización (penalty). Si se define penalty='l1', un C bajo extinguirá la mayoría de características del dataset.","tun":"Búsqueda exponencial cruzada (GridSearchCV o optimización bayesiana con Optuna o Hyperopt) evaluada bajo la métrica F1-Macro o AUC-ROC en contextos de desbalance de clases.","err":"Configurar valores de C extremadamente pequeños (e.g. 1e-7) sin darse cuenta de que están silenciando por completo todas las variables predictoras del modelo de clasificación.","apl":"Modelo de Admisión Crediticia. Predicción de la probabilidad de impago (default) de un cliente minorista. Ajustar adecuadamente C evita que variables de comportamiento transaccional reciente (muy ruidosas) dominen la decisión, asegurando que el modelo generalice de forma estable ante cambios en el ciclo económico.","pri":"ESENCIAL","code":"C"},{"name":"Tipo de Penalización","nivel":"Intermedio","que":"Especifica la norma matemática utilizada para penalizar la complejidad del vector de pesos. Las opciones estándar en scikit-learn son 'l2' (Ridge, penalización cuadrática), 'l1' (Lasso, penalización de valor absoluto), 'elasticnet' (combinación lineal de ambas) y 'none' o None (sin regularización).","val":"['l1', 'l2', 'elasticnet', None]. Default en scikit-learn = 'l2'.","alto":"N/A (Parámetro categórico).","bajo":"N/A.","inter":"Restringe fuertemente la elección del solucionador numérico (solver). Por ejemplo, el optimizador clásico 'lbfgs' solo soporta 'l2' o None. Para utilizar 'l1' se requiere usar solucionadores como 'liblinear' o 'saga'.","tun":"Condicionada por el objetivo de negocio. Si el objetivo es el despliegue rápido en producción con recursos limitados de CPU, priorizar 'l1' para realizar selección de variables integrada. Si se busca máxima robustez y precisión predictiva pura, priorizar 'l2'.","err":"Intentar entrenar una regresión logística con penalty='l1' usando el solver por defecto 'lbfgs', lo cual disparará un error inmediato en tiempo de ejecución de Python, deteniendo el flujo automático de producción.","apl":"Detección de fraude con tarjetas de crédito. Dado que existen miles de variables de telemetría transaccional (coincidencia de IPs, velocidad de compra, montos históricos), configurar penalty='l1' depura el modelo en tiempo real, apagando el 95% de variables irrelevantes y reduciendo la latencia de respuesta de la API a menos de 50 milisegundos.","pri":"IMPORTANTE","code":"penalty"},{"name":"Algoritmo de Optimización","nivel":"Avanzado","que":"Especifica el algoritmo numérico encargado de aproximar la solución al problema de optimización convexa (minimización de la entropía cruzada).","val":"['lbfgs', 'liblinear', 'newton-cg', 'sag', 'saga']. Default en scikit-learn = 'lbfgs'.","alto":"N/A (Categórico).","bajo":"N/A.","inter":"Su efectividad está dictada por el tamaño del dataset (filas) y el tipo de penalización. 'saga' y 'sag' son los únicos solucionadores eficientes que convergen en tiempo razonable para datasets masivos, y son altamente sensibles al preprocesamiento de escalamiento de variables.","tun":"Para datasets pequeños o medianos, usar 'lbfgs'. Para datasets lineales masivos con variables escasas, usar 'saga' con datos estandarizados.","err":"Utilizar 'liblinear' en datasets masivos creyendo que acelerará el proceso por ser simple, ignorando que es un solucionador de coordenadas descendentes de un solo hilo que escalará de forma prohibitiva en tiempo.","apl":"Análisis de propensión de compra de préstamos personales sobre millones de clientes activos. Cambiar el solver por defecto 'lbfgs' a 'saga' reduce el tiempo de reentrenamiento semanal de 3 horas a menos de 10 minutos, manteniendo exactamente la misma precisión.","pri":"OPCIONAL","code":"solver"},{"name":"Iteraciones Máximas","nivel":"Intermedio","que":"Número máximo de pasos del solver antes de detenerse. Los solvers como lbfgs a menudo necesitan más de las 100 iteraciones por defecto.","val":"[100, 500, 1000, 5000]. Default: 100.","alto":"Tiempo de entrenamiento innecesario si ya convergió.","bajo":"Coeficientes no convergidos y ConvergenceWarning.","inter":"Con solver, C y el escalado. Datos sin estandarizar disparan la cantidad de iteraciones.","tun":"Subir a 1000 como valor seguro; escalar siempre las variables.","err":"Reportar un modelo con la advertencia de convergencia activa.","apl":"Clasificar solicitudes en categorías cuando hay muchas variables predictoras: sin suficientes iteraciones el modelo no estabiliza sus coeficientes.","pri":"IMPORTANTE","code":"max_iter"},{"name":"Ponderación de Clases","nivel":"Intermedio","que":"Pondera las clases inversamente a su frecuencia (balanced) o según un diccionario manual, multiplicando su aporte a la función de pérdida.","val":"[None, \"balanced\", {0:1, 1:10}]. Default: None.","alto":"Sobre la clase minoritaria: exceso de falsos positivos.","bajo":"Ignora la clase rara; recall cercano a cero para eventos importantes.","inter":"Alternativa a scale_pos_weight (XGBoost) y al resampling (SMOTE).","tun":"Empezar con balanced; refinar con un diccionario guiado por la matriz de costos.","err":"Combinarlo con oversampling, aplicando una doble corrección que sesga el clasificador.","apl":"Detectar eventos raros (fraude, defectos, fallas) cuando representan menos del 5 % de los datos y el clasificador tiende a ignorarlos.","pri":"ESENCIAL","code":"class_weight"}]},{"n":"3","t":"K-Nearest Neighbors (KNN)","hp":[{"name":"Número de Vecinos","nivel":"Básico","que":"Define la cantidad de muestras más cercanas del conjunto de entrenamiento que se evaluarán para emitir la predicción de un nuevo dato (por voto de mayoría en clasificación o por promedio aritmético en regresión).","val":"Enteros impares (para evitar empates en clasificación binaria) de [1, 3, 5, 11, 15, 21] o la regla empírica k = sqrtn donde n es el número de muestras. Default en scikit-learn = 5.","alto":"Conduce a un subajuste y sobre-suavizado de la frontera de decisión. El modelo se vuelve demasiado simple e introduce un sesgo elevado al verse influenciado por muestras lejanas de otras clases en regiones densas.","bajo":"(e.g. n_neighbors = 1) Provoca un sobreajuste masivo. El modelo memoriza el ruido de entrenamiento obteniendo un error de cero en el set de desarrollo, pero se vuelve extremadamente sensible a datos anómalos (outliers) y ruido operacional, con una varianza insostenible en validación.","inter":"Su efectividad depende críticamente del escalamiento previo del espacio n-dimensional. Si las características no están estandarizadas, el cálculo de vecinos se sesgará por completo hacia las variables con magnitudes numéricas mayores.","tun":"Graficar la curva de complejidad (Error vs K) tanto en el set de entrenamiento como en el de validación cruzada para identificar visualmente el punto óptimo del codo donde se minimiza el error de generalización.","err":"Configurar un valor de K par (como 4 o 6) en problemas de clasificación binaria, provocando empates constantes que scikit-learn resolverá de forma aleatoria, dañando la reproducibilidad científica.","apl":"Clasificación rápida del tipo de roca o dureza del mineral basándose en mediciones tridimensionales de perforación. Un K óptimo filtra el ruido de los sensores de perforación sin perder la definición geométrica de las vetas de mineral.","pri":"ESENCIAL","code":"n_neighbors o k"},{"name":"Métrica de Distancia","nivel":"Intermedio","que":"Define la función matemática utilizada para cuantificar la \"cercanía\" u homofilia espacial entre los vectores de características en el espacio multidimensional.","val":"'euclidean' (L2), 'manhattan' (L1), 'chebyshev' (L-infinito) o 'minkowski' generalizada. Default en scikit-learn = 'minkowski' con parámetro de potencia p=2 (que equivale a la Euclidiana).","alto":"N/A (Categórico).","bajo":"N/A.","inter":"Si se utiliza 'minkowski', el hiperparámetro de potencia p controla la transición continua de L1 (p=1) a L2 (p=2).","tun":"Evaluar la métrica en conjunto con las dimensiones del dataset. En espacios de alta dimensionalidad (d > 20), la distancia Euclidiana sufre fuertemente por la \"maldición de la dimensionalidad\" (todas las distancias convergen al mismo valor). Manhattan (p=1) suele ser más estable en dimensiones altas.","err":"Usar la distancia Euclidiana clásica sobre datos mixtos (numéricos y categóricos codificados con One-Hot), lo que genera distancias inconsistentes y sin sentido físico real.","apl":"Optimización del flujo de repuestos críticos entre almacenes interconectados. Al calcular distancias de ruta en ciudades con trazado de cuadrícula, la métrica de Manhattan (manhattan) predice con precisión milimétrica los tiempos reales de traslado frente a la Euclidiana aérea clásica.","pri":"IMPORTANTE","code":"metric"},{"name":"Ponderación de los Vecinos","nivel":"Intermedio","que":"Define si todos los K vecinos tendrán el mismo peso en la decisión final o si su influencia se ponderará de forma inversamente proporcional a su distancia física respecto a la consulta.","val":"['uniform', 'distance']. Default en scikit-learn = 'uniform'.","alto":"N/A (Categórico).","bajo":"N/A.","inter":"Su configuración como 'distance' amortigua el impacto negativo de elegir un n_neighbors demasiado alto, ya que los vecinos lejanos tendrán una influencia matemáticamente insignificante en el resultado.","tun":"Probar 'distance' si los datos de validación cruzada muestran patrones altamente densos pero con bordes de decisión ruidosos o mezclados.","err":"Configurar 'distance' en datasets con alto nivel de ruido en las etiquetas, lo que provocará que el modelo se comporte de forma errática al dar un peso infinito a un vecino ruidoso que coincida exactamente con la muestra evaluada.","apl":"Segmentación y tasación automática de propiedades inmobiliarias para colaterales de crédito hipotecario. Los inmuebles inmediatamente adyacentes proveen una referencia de precio drásticamente superior a los ubicados a 500 metros, lo cual se captura perfectamente parametrizando weights='distance'.","pri":"OPCIONAL","code":"weights"},{"name":"Algoritmo de Búsqueda de Vecinos","nivel":"Intermedio","que":"Estructura de datos para encontrar vecinos: ball_tree, kd_tree, brute o auto. Afecta la velocidad, no el resultado.","val":"[\"auto\", \"kd_tree\", \"ball_tree\", \"brute\"]. Default: auto.","alto":"N/A (categórico).","bajo":"N/A.","inter":"Con leaf_size y metric. En alta dimensión, todos los árboles degradan a fuerza bruta.","tun":"Dejar auto; forzar brute solo con métricas poco comunes o pocos datos.","err":"Forzar kd_tree con datos de alta dimensionalidad esperando aceleración que no ocurre.","apl":"Acelerar la búsqueda de vecinos al clasificar muestras por su firma multivariable cuando el conjunto de referencia es grande.","pri":"OPCIONAL","code":"algorithm"},{"name":"Potencia de la Distancia Minkowski","nivel":"Intermedio","que":"Exponente de la distancia Minkowski: p=1 es Manhattan, p=2 es Euclídea. Cambia qué se considera \"cercano\".","val":"[1, 2]. Default: 2.","alto":"Distancias dominadas por la dimensión de mayor diferencia.","bajo":"p=1 es más robusto ante valores atípicos.","inter":"Solo aplica con metric=\"minkowski\".","tun":"Probar p=1 cuando hay ruido o outliers en las mediciones.","err":"No escalar las variables antes de calcular distancias.","apl":"Imputar mediciones faltantes de sensores por vecinos: la distancia Manhattan resiste mejor lecturas ruidosas.","pri":"IMPORTANTE","code":"p"}]},{"n":"4","t":"Naive Bayes","hp":[{"name":"Parámetro de Suavizado de Laplace","nivel":"Básico","que":"Controla el factor de suavizado aditivo (Laplace / Lidstone). Añade un pseudo-conteo artificial al numerador y denominador al calcular la probabilidad condicional de cada palabra o categoría: hatthetajck = fracNdck + alphaNc + alpha K. Esto evita el fenómeno catastrófico del \"error de probabilidad cero\" cuando una categoría no aparece en el set de entrenamiento de una clase.","val":"Rango lineal/escala fina: [0.01, 0.1, 0.5, 1.0, 2.0, 5.0]. Default en scikit-learn = 1.0 (Suavizado de Laplace).","alto":"Provoca un sobre-suavizado extremo de las probabilidades. Todas las probabilidades de transición de las variables condicionales tenderán a igualarse de forma artificial hacia una distribución uniforme, anulando por completo el poder discriminativo del modelo y conduciendo a subajuste.","bajo":"(e.g. alpha = 0.0 o extremadamente pequeño). Se anula el suavizado. Si un nuevo lote de datos contiene un solo sensor o palabra que nunca antes se vio en la clase, la probabilidad acumulada del producto condicional colapsará instantáneamente a cero, impidiendo que el modelo lo clasifique.","inter":"N/A.","tun":"Búsqueda lineal fina usando validación cruzada F1-Score.","err":"Desactivar por completo el suavizado de Laplace (alpha=0) creyendo que mejorará la pureza de clasificación, provocando fallas masivas del clasificador al procesar datos operacionales en vivo.","apl":"Clasificación automatizada de correos electrónicos y reclamos dirigidos a las agencias bancarias (e.g., reclamos de fraude vs solicitudes de préstamo). Configurar alpha=1.0 asegura que palabras de vocabulario nuevo o poco frecuente introducidas por el cliente no arruinen la probabilidad predictiva del sistema.","pri":"ESENCIAL","code":"alpha"},{"name":"Aprender Probabilidades Previas de Clase","nivel":"Básico","que":"Determina si el clasificador calculará de forma automática las probabilidades de clase a priori basadas en su proporción empírica en el conjunto de entrenamiento (frecuencia relativa), o si por el contrario asumirá una distribución a priori perfectamente uniforme para todas las clases.","val":"Booleano: True o False. Default en scikit-learn = True.","alto":"N/A.","bajo":"N/A.","inter":"Si se parametriza como False, se puede suministrar manualmente un vector de probabilidades pre-calculadas usando el hiperparámetro class_prior.","tun":"Evaluar la representatividad de la muestra. Si el desbalance de clases de tu conjunto de entrenamiento representa fielmente la realidad física u operativa en producción, mantener en True. Si el dataset de entrenamiento ha sido balanceado artificialmente (submuestreo), usar fit_prior=False para evitar sesgar el clasificador.","err":"Configurar fit_prior=True sobre datasets donde una clase crítica está subrepresentada únicamente por falta de recolección de muestras, provocando que el modelo de Bayes la ignore sistemáticamente por su bajísima probabilidad prior.","apl":"Clasificación de la calidad del empaque del cemento (e.g. bolsas rotas vs bolsas correctas). Las bolsas rotas ocurren en menos del 0.05% de los casos. Configurar fit_prior=False nos permite entrenar un modelo con datos balanceados sin que el sesgo de la probabilidad prior ignore el evento de falla crítico.","pri":"IMPORTANTE","code":"fit_prior"},{"name":"Estabilizador de Varianza","nivel":"Avanzado","que":"Porción de la varianza más grande obtenida entre todas las características que se le añade de forma artificial a la varianza de cada una de las variables. Actúa como un factor estabilizador numérico para ensanchar de forma artificial la curva normal Gaussiana de probabilidad.","val":"Rango extremadamente pequeño: [1e-9, 1e-8, 1e-6, 1e-4]. Default en scikit-learn = 1e-9.","alto":"Aplana y ensancha artificialmente las campanas Gaussianas, lo que incrementa el sesgo del clasificador y diluye la diferencia entre clases de variables muy concentradas, conduciendo a subajuste.","bajo":"Puede provocar inestabilidad numérica extrema en tiempo de ejecución. Si una variable tiene una varianza empírica de prácticamente cero (e.g., lecturas constantes de un sensor industrial bajo control), calcular la función de densidad de probabilidad Gaussiana generará divisiones por cero o desbordamientos lógicos (overflow).","inter":"N/A.","tun":"Usar búsqueda en cuadrícula logarítmica si se observa que el modelo falla en presencia de características numéricas con varianzas extremadamente dispares.","err":"Ignorar este hiperparámetro al procesar variables continuas industriales que tienen rangos estables de medición, provocando errores silenciosos de cálculo de densidades.","apl":"Monitoreo de vibración constante de polines en fajas transportadoras. Si un polín funciona con lecturas perfectas y estables (varianza casi nula), var_smoothing garantiza que el cálculo no colapse y que pequeñas desviaciones del sensor no se traduzcan en falsas alarmas probabilísticas extremas.","pri":"OPCIONAL","code":"var_smoothing para GaussianNB"}]},{"n":"5","t":"Support Vector Machines (SVM)","hp":[{"name":"Parámetro de Costo de Penalización","nivel":"Básico","que":"Es el parámetro de regularización de la función objetivo de optimización de SVM. Controla el balance dinámico entre maximizar el ancho del \"margen de la calle\" (margen geométrico) y penalizar de forma lineal las violaciones del margen o las clasificaciones erróneas del conjunto de entrenamiento mediante variables de holgura (slack variables xii). Un C menor da mayor flexibilidad al modelo y tolera más violaciones, mientras que un C alto exige que la separación sea estrictamente perfecta en los datos de entrenamiento.","val":"Rango logarítmico: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]. Default en scikit-learn = 1.0.","alto":"Obliga al modelo a evitar a toda costa cualquier error de clasificación de entrenamiento, lo que conduce a un sobreajuste extremo. El hiperplano de separación se volverá sumamente complejo y sinuoso para capturar cada punto ruidoso del dataset.","bajo":"Prioriza la máxima anchura de margen geométrico sobre la precisión de entrenamiento, provocando un subajuste severo. Tolera demasiados errores de entrenamiento, lo que destruye el poder predictivo del modelo en producción.","inter":"Su comportamiento depende críticamente de la elección del kernel. Con el kernel 'linear', el modelo es linealmente restrictivo. Con el kernel 'rbf', interactúa con el parámetro de radio gamma.","tun":"Búsqueda en cuadrícula exponencial bidimensional gruesa y luego fina combinando C y gamma utilizando validación cruzada.","err":"Ajustar un C sumamente alto sobre datasets ruidosos. SVM no maneja bien de forma nativa los conjuntos de datos que poseen un alto solapamiento de clases, por lo que un C alto solo incrementará de forma desastrosa el tiempo de entrenamiento O(n³) y sobreajustará el modelo.","apl":"Clasificación de firmas digitales y patrones biométricos para autenticación en aplicaciones móviles bancarias (BCP). Un valor de C moderado permite una generalización geométrica óptima ante cambios menores de iluminación o sensor sin rechazar a usuarios legítimos.","pri":"ESENCIAL","code":"C"},{"name":"Coeficiente de Kernel","nivel":"Intermedio","que":"Define la distancia de influencia matemática de cada uno de los vectores de soporte individuales. Para el kernel 'rbf' (función de base radial), controla el parámetro de ancho de banda local: K(x,y) = exp(-gamma ||x-y||2). Un gamma alto decrece drásticamente el radio de influencia, requiriendo que los nuevos puntos estén extremadamente cerca de los vectores de soporte para ser clasificados en la misma clase.","val":"['scale', 'auto'] o valores numéricos en escala logarítmica exponencial: [1e-4, 1e-3, 0.01, 0.1, 1.0, 10.0]. Default en scikit-learn = 'scale' (que equivale a 1 / (d times Var(X))).","alto":"Provoca un sobreajuste masivo y localizado. El modelo rodea de forma estrecha y aislada a cada punto de entrenamiento (islas aisladas de decisión), perdiendo completamente la capacidad de generalización espacial global.","bajo":"El radio de influencia se expande tanto que el clasificador se comporta de forma cuasi-lineal, ignorando los patrones curvados complejos y conduciendo a subajuste del modelo.","inter":"Su sintonización está totalmente enlazada con C. Si gamma es muy bajo, C no tendrá suficientes regiones complejas que sintonizar.","tun":"Búsqueda en cuadrícula logarítmica bidimensional cruzada. Un punto de partida ideal es el valor por defecto de 'scale'.","err":"Incrementar gamma en exceso tratando de aumentar la precisión en entrenamiento, lo que convierte al modelo en un clasificador de memorización puntual de un solo vecino.","apl":"Clasificación no lineal de tipos de fallas de soldadura (estructural, superficial, poro) en base a 15 variables continuas de imágenes de rayos X. Ajustar un gamma óptimo rodea de forma suave las densidades no lineales de cada defecto geológico, minimizando los falsas alarmas de soldaduras conformes.","pri":"ESENCIAL","code":"gamma"},{"name":"Tipo de Kernel","nivel":"Intermedio","que":"Define la función matemática específica empleada para mapear de forma implícita los datos de entrada a un espacio de características de dimensiones superiores, donde las clases se vuelvan linealmente separables sin computar la costosa proyección de forma explícita (el truco del kernel).","val":"['linear', 'poly', 'rbf', 'sigmoid']. Default en scikit-learn = 'rbf'.","alto":"N/A (Categórico).","bajo":"N/A.","inter":"El kernel 'poly' activa el parámetro de grado degree y el coeficiente independiente coef0. El kernel 'linear' es numéricamente mucho más veloz pero no puede modelar fronteras de decisión curvadas.","tun":"Empezar siempre probando 'linear' por simplicidad y eficiencia de recursos (especialmente si hay miles de variables y pocas observaciones). Si hay patrones fuertemente no lineales comprobados y el volumen de datos no excede las 50,000 muestras, usar 'rbf'.","err":"Elegir 'rbf' o 'poly' por defecto en datasets masivos (n > 200,000), provocando que el entrenamiento en la CPU tarde días en completar debido al costo computacional cúbico O(n3) de la implementación de la matriz de Gram de libsvm.","apl":"Clasificación geológica compleja de yacimientos de mineral. La alta irregularidad de la composición de la roca requiere el mapeo no lineal flexible que ofrece el kernel 'rbf' para delimitar con exactitud las zonas de explotación segura.","pri":"IMPORTANTE","code":"kernel"},{"name":"Ancho del Tubo de Tolerancia de Error","nivel":"Avanzado","que":"Especifica el ancho de la banda o del \"tubo\" de tolerancia epsilon alrededor de la función estimada de regresión, dentro del cual no se penaliza ninguna desviación de las muestras observadas en la función de pérdida del optimizador (pérdida epsilon-insensible). Cualquier residuo menor a epsilon vale exactamente cero en el cómputo de la optimización.","val":"Escala continua en relación con la escala de la variable objetivo: [0.01, 0.05, 0.1, 0.2, 0.5]. Default en scikit-learn = 0.1.","alto":"El tubo de tolerancia se vuelve excesivamente ancho, permitiendo que casi todas las muestras de entrenamiento queden sin penalizar. Esto conduce a un fuerte subajuste y genera un regresor plano incapaz de capturar la tendencia de los datos.","bajo":"Se penaliza casi cualquier desviación insignificante por pequeña que sea, incrementando drásticamente el número de vectores de soporte, prolongando el tiempo de entrenamiento numérico y provocando sobreajuste al ruido.","inter":"Su efectividad se sintoniza en conjunto con el factor de costo C y los parámetros del kernel.","tun":"Búsqueda en cuadrícula logarítmica o regla empírica basada en el nivel de ruido de fondo de los sensores físicos del proceso industrial.","err":"Configurar epsilon en un valor numérico menor que el error instrumental de medición de los sensores industriales de campo, desperdiciando cómputo en forzar la precisión de decimales que representan puro ruido mecánico.","apl":"Predicción del nivel de llenado de mineral en una celda de flotación industrial en base a telemetría hidráulica de sensores ultrasónicos. Ajustar epsilon = 0.05 (5% de tolerancia de ruido ultrasónico) optimiza los recursos de la CPU y estabiliza las alertas de rebose operacional.","pri":"IMPORTANTE","code":"epsilon para SVR"},{"name":"Tamaño de Caché del Kernel","nivel":"Intermedio","que":"Memoria en MB reservada para almacenar el cálculo del kernel. Subirla acelera notablemente el entrenamiento en datasets medianos.","val":"[200, 500, 1000, 2000]. Default: 200.","alto":"Consume RAM que podría necesitar el resto del sistema.","bajo":"Recalcula entradas del kernel repetidamente; entrenamiento más lento.","inter":"Independiente del resto; solo afecta velocidad y memoria.","tun":"Subir a 1000 en datasets de miles de muestras si hay RAM disponible.","err":"Dejarlo en 200 y atribuir la lentitud al kernel en lugar de a la caché.","apl":"Entrenar un SVR de regresión sobre miles de muestras: ampliar la caché reduce el tiempo de ajuste de forma perceptible.","pri":"IMPORTANTE","code":"cache_size"}]},{"n":"6","t":"Árboles de Decisión","hp":[{"name":"Profundidad Máxima del Árbol","nivel":"Básico","que":"Define la longitud de la ruta más larga que va desde el nodo raíz hasta cualquier nodo hoja terminal en el árbol construido. Es el hiperparámetro principal para regular la capacidad de complejidad y la libertad geométrica del árbol.","val":"[3, 5, 7, 10, 15, None] (donde None indica que el árbol crecerá de forma ilimitada hasta lograr hojas perfectamente puras o alcanzar otros límites de parada). Default en scikit-learn = None.","alto":"(e.g. None o superior a 15 en datasets pequeños). Provoca un sobreajuste severo del árbol. El algoritmo continuará dividiendo las muestras de forma recursiva hasta aislar cada una de las observaciones individuales de entrenamiento en sus propias hojas, memorizando por completo el ruido operacional.","bajo":"(e.g. max_depth = 1 o 2, conocidos como tocones de decisión o decision stumps). Provoca un fuerte subajuste del modelo. El árbol será incapaz de capturar interacciones simples y relaciones no lineales complejas entre las características predictoras del sistema.","inter":"Altamente acoplado con min_samples_split y min_samples_leaf. Restringir cualquiera de ellos disminuye la necesidad de fijar un max_depth estricto, ya que actúan de forma complementaria para regularizar el crecimiento.","tun":"Búsqueda en cuadrícula en un rango acotado: [3, 5, 7, 9, 11, 13]. Rara vez se justifica en la práctica industrial permitir profundidades de un solo árbol CART superiores a 10 debido a la pérdida drástica de interpretabilidad para el personal de planta.","err":"Dejar el parámetro por defecto max_depth=None en árboles individuales entrenados de forma directa en producción, generando árboles monstruosos e ininterpretables que fallarán catastróficamente al predecir sobre datos nuevos de validación cruzada.","apl":"Creación de un flujo lógico de decisiones para que los asesores de la red de agencias recomienden campañas comerciales (e.g. oferta de tarjeta de crédito). Un max_depth=4 genera una estructura jerárquica con reglas de decisión altamente intuitivas que caben perfectamente en una sola hoja impresa, facilitando el despliegue operativo en campo.","pri":"ESENCIAL","code":"max_depth"},{"name":"Mínimo de Muestras para Dividir un Nodo","nivel":"Intermedio","que":"Especifica la cantidad mínima de observaciones de entrenamiento que deben residir obligatoriamente en un nodo interno para que el algoritmo CART evalúe realizar una nueva división recursiva de sus ramas.","val":"Enteros: [2, 5, 10, 20, 50, 100] o porcentajes flotantes del total de la muestra. Default en scikit-learn = 2.","alto":"Regulariza fuertemente el árbol. Evita que el algoritmo continúe dividiendo subnodos pequeños, deteniendo el crecimiento de forma prematura y forzando a que las hojas contengan más muestras, previniendo sobreajuste pero arriesgando subajuste si es excesivo.","bajo":"(e.g. 2, el default). Permite que el árbol evalúe divisiones sobre nodos extremadamente pequeños que contienen casi puras observaciones individuales, lo que conduce a memorizar el ruido de entrenamiento y sobreajustar.","inter":"Su acción se combina con min_samples_leaf. min_samples_split debe ser por definición matemática al menos el doble del valor configurado para min_samples_leaf para que la división sea realizable dentro de los límites de las hojas de destino.","tun":"Sintonizar de forma logarítmica o lineal según el volumen del dataset de entrenamiento. En datasets industriales medianos (e.g. 50,000 muestras), usar valores de [20, 50, 100, 200] suele estabilizar enormemente las reglas lógicas resultantes.","err":"Mantener min_samples_split=2 en datasets con alto nivel de ruido, permitiendo que el árbol se ramifique de forma sinuosa para aislar ruidos individuales en vez de generalizar tendencias grupales de la planta.","apl":"Predicción de fallas operacionales en ventiladores centrífugos de extracción de polvo. Configurar un min_samples_split=50 asegura que las reglas de alerta lógicas solo se generen si cuentan con al menos 50 registros históricos de telemetría de soporte en cada nodo, filtrando eventos de fallas de medición puntuales del sensor de vibración.","pri":"IMPORTANTE","code":"min_samples_split"},{"name":"Mínimo de Muestras Requeridas en una Hoja","nivel":"Intermedio","que":"Define la cantidad mínima admisible de observaciones que deben residir obligatoriamente dentro de cada nodo terminal u hoja final para que se permita realizar una partición candidata en las ramas superiores. Si un corte candidato genera una hoja izquierda o derecha que tiene menos de min_samples_leaf muestras, ese corte se rechaza inmediatamente por el algoritmo CART.","val":"Enteros: [1, 5, 10, 20, 50]. Default en scikit-learn = 1.","alto":"Suaviza en exceso las predicciones, reduciendo el árbol a muy pocas hojas. En regresión, el modelo promediará un gran grupo de muestras dispares dentro de la misma hoja, conduciendo a subajuste del modelo.","bajo":"(e.g. 1, el default). Permite la existencia de hojas \"singulares\" con una sola observación física de entrenamiento, capturando outliers ruidosos y provocando sobreajuste severo.","inter":"Su sintonización anula de forma práctica el impacto negativo de configurar un max_depth ilimitado, ya que el árbol detendrá su crecimiento natural de forma segura mucho antes de llegar a profundidades altas al no poder cumplir la restricción de las hojas.","tun":"Sintonización prioritaria mediante optimización bayesiana o validación cruzada. Para la mayoría de procesos de ingeniería industrial, valores de [5, 10, 25, 50] proveen un excelente balance de sesgo-varianza.","err":"Mantener min_samples_leaf=1 en problemas de regresión CART, generando predicciones escalonadas e inestables que reaccionan de forma drástica y absurda ante pequeños cambios en los valores de entrada de los sensores.","apl":"Control operacional automático del flujo de reactivos químicos en celdas de flotación. Parametrizar min_samples_leaf=20 en el árbol de regresión suaviza los saltos de dosificación de reactivos, evitando oscilaciones mecánicas dañinas en las válvulas de dosificación de la planta.","pri":"IMPORTANTE","code":"min_samples_leaf"},{"name":"Número de Características a Evaluar en cada Split","nivel":"Intermedio","que":"Define la cantidad máxima de características o variables predictoras del dataset que el algoritmo CART tiene permitido evaluar de forma aleatoria en cada uno de los nodos individuales para buscar la mejor combinación de división y corte.","val":"['sqrt', 'log2', None] (donde None evalúa todas las variables predictoras del dataset, y 'sqrt' evalúa el equivalente a la raíz cuadrada del total de variables). Default en scikit-learn = None.","alto":"Se evalúan todas las características del dataset en cada nodo. El árbol se volverá determinista y buscará con codicia (algoritmo greedy) la variable que brinde la pureza máxima de forma global, aumentando el tiempo computacional si el volumen de variables es elevado.","bajo":"Se evalúa una porción insignificante de variables en cada nodo. El crecimiento del árbol se acelerará drásticamente en tiempo, pero se corre el riesgo de subajustar el modelo al forzar decisiones basadas en características no informativas asignadas puramente al azar.","inter":"Crucial para el modelado de bosques aleatorios (Random Forest), donde inyectar aleatoriedad mediante un max_features bajo es el pilar para descorrelacionar los árboles individuales del ensamble.","tun":"Para un árbol CART individual, se recomienda mantener en None (evaluar todas las variables predictoras) para asegurar la máxima interpretabilidad analítica de la estructura de decisión.","err":"Configurar valores extremadamente pequeños en datasets masivos donde unas pocas variables concentran todo el poder de predicción, provocando que el árbol tome decisiones absurdas basadas en variables irrelevantes en la mayoría de sus nodos.","apl":"Diagnóstico de fallas en montacargas de almacén en base a 18 variables de sensores. Mantener max_features=None garantiza que el árbol de diagnóstico resultante siempre evalúe las variables más significativas físicamente (como presión hidráulica o temperatura del motor) en los niveles jerárquicos superiores, optimizando la resolución de fallas por parte del equipo de mecánicos de planta.","pri":"OPCIONAL","code":"max_features"},{"name":"Criterio de Medición de Pureza o Pérdida","nivel":"Intermedio","que":"Define la función de costo matemática que se utilizará para cuantificar la calidad y pureza de cada una de las divisiones candidatas en los nodos. Para clasificación, las opciones son
