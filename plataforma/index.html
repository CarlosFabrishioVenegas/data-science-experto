<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Science Experto</title>
<style>
/* Plan: lenguaje visual tipo Apple. Lienzo gris muy claro, tarjetas blancas de esquinas amplias sin bordes,
   tipografía del sistema con titulares grandes y apretados, un solo azul, controles en píldora, barra superior translúcida. */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --sunken:#f5f5f7; --ink:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7;
  --accent:#0066cc; --fill:#0071e3; --accent-ink:#ffffff; --accent-soft:#e8f2fd; --btn:#e8e8ed;
  --ok:#248a3d; --warn:#b25000; --bad:#d70015; --shadow:0 1px 3px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.04);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --sunken:#2c2c2e; --ink:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3c;
  --accent:#2997ff; --fill:#0071e3; --accent-ink:#ffffff; --accent-soft:#12305a; --btn:#3a3a3c;
  --ok:#30d158; --warn:#ff9f0a; --bad:#ff6961; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --sunken:#2c2c2e; --ink:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3c;
  --accent:#2997ff; --fill:#0071e3; --accent-ink:#ffffff; --accent-soft:#12305a; --btn:#3a3a3c;
  --ok:#30d158; --warn:#ff9f0a; --bad:#ff6961; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--fill) 55%,transparent);outline-offset:2px}
code{font:.92em var(--f-mono);background:var(--sunken);padding:1px 5px;border-radius:5px}
.top{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:10px max(16px,calc((100vw - 1380px)/2 + 16px));
  background:color-mix(in srgb,var(--bg) 76%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.brand{font:600 17px/1.2 var(--f);letter-spacing:-.02em}
.brand small{display:block;font:400 12px/1.3 var(--f);color:var(--muted);letter-spacing:0}
.nav{display:flex;gap:2px;margin-left:auto;background:var(--btn);padding:2px;border-radius:10px;flex-wrap:wrap}
.nav a{padding:5px 14px;border-radius:8px;color:var(--ink);font-weight:500;font-size:13px}
.nav a:hover{text-decoration:none}
.nav a[aria-current="page"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sync{font-size:12px;color:var(--muted);width:100%}
@media(min-width:760px){.sync{width:auto}}
.shell{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;padding:24px 16px 48px;max-width:1380px;margin:0 auto}
@media(min-width:960px){.shell.two{grid-template-columns:320px minmax(0,1fr);align-items:start}
  .side{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
.side{padding:18px 14px}
.side>label{font:600 19px/1.2 var(--f);letter-spacing:-.02em;padding:0 6px}
.side summary{cursor:pointer;list-style:none}
.side summary::-webkit-details-marker{display:none}
#q{width:100%;padding:8px 12px;border:0;border-radius:10px;background:var(--btn);margin:10px 0 6px}
.amb{border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.amb>summary{display:grid;grid-template-columns:26px 1fr auto;gap:6px;align-items:baseline;padding:11px 6px;font-weight:600;font-size:14px}
.amb>summary .n{font:500 12px var(--f-mono);color:var(--muted)}
.amb>summary .c{font-size:12px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.tl{list-style:none;margin:0 0 8px;padding:0}
.tl li{display:flex}
.tl button.t{flex:1;display:grid;grid-template-columns:10px 34px 1fr;gap:6px;align-items:baseline;text-align:left;background:none;border:0;padding:7px 8px;border-radius:10px;cursor:pointer;font-size:13.5px;line-height:1.35}
.tl button.t:hover{background:var(--sunken)}
.tl button.t[aria-current="true"]{background:var(--fill);color:#fff}
.tl button.t[aria-current="true"] .k{color:rgba(255,255,255,.75)}
.tl button.t[aria-current="true"] .dot{border-color:#fff}
.tl .k{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);align-self:center}
.dot.s1{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.dot.s2{border-color:var(--ok);background:var(--ok)}
.dot.s3{border-color:var(--accent);background:var(--accent);border-radius:2px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 6px}
.addrow{display:flex;gap:6px;padding:0 4px 12px}
.addrow input{flex:1;min-width:0;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);padding:12px 6px 0;border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.main{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.head{padding:32px 32px 22px}
.eyebrow{font:600 14px/1.3 var(--f);color:var(--muted)}
h1{font:700 clamp(28px,4.2vw,46px)/1.07 var(--f);letter-spacing:-.03em;margin:6px 0 18px;text-wrap:balance}
h2{font:600 21px/1.2 var(--f);letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
h3{font:600 15px/1.3 var(--f);margin:0 0 4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--btn);padding:2px;border-radius:10px}
.seg button{border:0;background:none;padding:5px 14px;cursor:pointer;font-size:13px;font-weight:500;border-radius:8px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:980px;background:var(--accent-soft);color:var(--accent)}
.steps{display:flex;gap:6px;overflow-x:auto;padding:0 32px 14px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.steps button{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:8px 16px 8px 9px;border:0;border-radius:980px;background:var(--sunken);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.steps button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.steps .i{font-size:11px;font-weight:600;width:22px;height:22px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center}
.steps .done .i{background:var(--ok);color:#fff}
.pane{padding:28px 32px 32px;display:grid;gap:22px}
@media(max-width:640px){.head{padding:24px 18px 18px}.steps{padding:0 18px 14px}.pane{padding:20px 18px 24px}}
.grid2{display:grid;gap:20px}
@media(min-width:1100px){.grid2{grid-template-columns:1fr 1fr}}
.box{border-radius:18px;padding:20px;background:var(--sunken);display:grid;gap:10px;align-content:start;min-width:0}
.hint{color:var(--muted);font-size:14px;margin:0;max-width:68ch}
textarea,.in{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 13px}
textarea:focus,.in:focus,.addrow input:focus,#q:focus{outline:0;border-color:var(--fill);box-shadow:0 0 0 4px color-mix(in srgb,var(--fill) 25%,transparent)}
textarea{resize:vertical;line-height:1.5}
pre{font:12.5px/1.55 var(--f-mono);letter-spacing:0;margin:0;white-space:pre-wrap;word-break:break-word;background:var(--surface);border-radius:12px;padding:12px 14px;max-height:210px;overflow:auto}
.btn{border:0;background:var(--btn);border-radius:980px;padding:8px 17px;cursor:pointer;font-weight:500;color:var(--ink);display:inline-block;font-size:14px;line-height:1.3}
.btn:hover{text-decoration:none;filter:brightness(.96)}
.btn.p{background:var(--fill);color:var(--accent-ink)}
.btn.p:hover{filter:brightness(1.08)}
.btn.s{padding:5px 13px;font-size:12.5px}
.box .btn:not(.p),.file .btn{background:color-mix(in srgb,var(--btn) 70%,var(--line))}
.busy .btn.p{opacity:.5;pointer-events:none}
.msg{font-size:13px;color:var(--muted);min-height:1.2em}
.msg.err{color:var(--bad)}
.chat{display:grid;gap:8px;max-height:540px;overflow:auto;padding:4px}
.bub{padding:10px 15px;border-radius:20px;max-width:min(78ch,92%);background:var(--btn);overflow-wrap:anywhere}
.bub.a{border-bottom-left-radius:6px}
.bub.u{justify-self:end;background:var(--fill);color:#fff;border-bottom-right-radius:6px}
.bub p{margin:0 0 8px}.bub p:last-child{margin:0}
.bub pre,.doc pre{max-height:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:none;border-radius:980px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--accent)}
.chip:hover{border-color:var(--accent)}
.send{display:flex;gap:10px;align-items:flex-end}
.send textarea{flex:1;border-radius:20px;padding:10px 16px}
.fig{border-radius:18px;background:var(--sunken);padding:18px;display:grid;gap:8px;min-width:0}
.plot{width:100%;height:420px;min-width:0}
.doc{background:var(--sunken);border-radius:18px;padding:26px 30px;max-height:580px;overflow:auto;font-size:16px;line-height:1.6}
.doc>*{max-width:66ch}
.doc h2{font-size:28px;letter-spacing:-.025em}.doc h3{font-size:20px;letter-spacing:-.02em;margin-top:22px}.doc h4,.doc h5{font-size:16px;margin:16px 0 4px}
.files{display:grid;gap:10px}
.file{display:grid;gap:8px 12px;grid-template-columns:auto 1fr;align-items:center;border-radius:16px;padding:14px 16px;background:var(--sunken)}
.file .path{font:12px var(--f-mono);letter-spacing:0;color:var(--muted);overflow-wrap:anywhere}
.file .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.file input,label.row input{width:18px;height:18px;accent-color:var(--fill)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.tile{padding:22px}
.tile b{display:block;font:700 40px/1.05 var(--f);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:14px}
div.bar{height:6px;background:var(--btn);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b2{background:var(--ok)}.bar .b3{background:var(--fill)}.bar .b1{background:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);vertical-align:middle}
th{font-size:12px;font-weight:600;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
label.l{font-weight:600;font-size:13px;display:grid;gap:5px}
label.l .in{font-weight:400}
ol.howto{margin:0;padding-left:20px;max-width:68ch}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.steps button,.tl button.t{transition:background-color .2s,filter .2s,border-color .2s}}
/* v3: color por ámbito, práctica interactiva, racha */
body{background-image:radial-gradient(60% 420px at 8% 0,color-mix(in srgb,#0a84ff 13%,transparent),transparent),radial-gradient(50% 380px at 92% 0,color-mix(in srgb,#ff375f 10%,transparent),transparent),radial-gradient(40% 300px at 50% 0,color-mix(in srgb,#ffd60a 8%,transparent),transparent);background-repeat:no-repeat}
.amb>summary .n{background:color-mix(in srgb,var(--amb) 24%,transparent);color:var(--ink);border-radius:6px;padding:2px 0;text-align:center;font-weight:600}
.amb>summary .mb{grid-column:1/-1;height:3px;border-radius:9px;background:var(--btn);overflow:hidden}
.amb>summary .mb i{display:block;height:100%;background:var(--amb);border-radius:9px;transition:width .5s}
.tl button.t[aria-current="true"]{background:color-mix(in srgb,var(--amb) 62%,#000)}
.head{border-radius:20px 20px 0 0;background:linear-gradient(120deg,color-mix(in srgb,var(--amb) 24%,var(--surface)),var(--surface) 72%)}
.hero{display:flex;gap:20px;justify-content:space-between;align-items:flex-start}
.eyebrow{display:inline-block;background:color-mix(in srgb,var(--amb) 22%,transparent);color:var(--ink);padding:4px 12px;border-radius:980px;font-size:13px}
.ring{position:relative;flex:0 0 auto;width:72px;height:72px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .rb{stroke:color-mix(in srgb,var(--amb) 20%,var(--btn))}
.ring .rf{stroke:var(--amb);transition:stroke-dasharray .6s}
.ring b{font-size:15px;font-variant-numeric:tabular-nums}
.grow{flex:1}
.steps{padding-top:14px}
.steps button[aria-selected="true"]{background:color-mix(in srgb,var(--amb) 60%,#000);color:#fff}
.pips{display:flex;flex-wrap:wrap;gap:6px}
.pip{width:22px;height:8px;border-radius:9px;border:0;background:var(--line);cursor:pointer;padding:0}
.pip.k{background:var(--ok)}.pip.c{outline:2px solid var(--amb);outline-offset:2px}
.flash{perspective:1200px;display:grid;border:0;background:none;padding:0;cursor:pointer;min-height:230px;text-align:left}
.face{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:20px;padding:26px;display:grid;align-content:center;gap:12px;font-size:19px;line-height:1.35;font-weight:500;letter-spacing:-.015em;overflow-wrap:anywhere}
.face small{font-size:12px;font-weight:600;opacity:.8;letter-spacing:.02em}
.face em{font-style:normal;font-size:13px;font-weight:400;opacity:.8}
.fr{background:linear-gradient(135deg,color-mix(in srgb,var(--amb) 66%,#000),color-mix(in srgb,var(--amb) 40%,#000));color:#fff}
.bk{background:var(--surface);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--amb) 55%,transparent);transform:rotateY(180deg);font-weight:400;font-size:17px}
.flash.f .fr{transform:rotateY(180deg)}.flash.f .bk{transform:rotateY(360deg)}
.q{border:0;margin:0;padding:0;display:grid;gap:6px;min-width:0}
.q legend{font-weight:600;padding:0 0 6px;max-width:68ch}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 13px;cursor:pointer;color:var(--ink)}
.opt:not([disabled]):hover{border-color:var(--amb)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt[disabled]{cursor:default;opacity:1}
.tile{background:linear-gradient(140deg,color-mix(in srgb,var(--tc) 20%,var(--surface)),var(--surface) 75%);position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;left:22px;top:0;width:36px;height:4px;border-radius:0 0 4px 4px;background:var(--tc)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;max-width:520px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--btn)}
.heat .h1{background:color-mix(in srgb,var(--ok) 40%,var(--btn))}.heat .h2{background:color-mix(in srgb,var(--ok) 70%,var(--btn))}.heat .h3{background:var(--ok)}
@media (prefers-reduced-motion:no-preference){
  .face{transition:transform .55s cubic-bezier(.2,.7,.2,1)}
  .pane{animation:rise .28s ease-out}
  @keyframes rise{from{transform:translateY(6px);opacity:.55}to{transform:none;opacity:1}}
  .tile,.file,.opt{transition:transform .2s,border-color .2s,background-color .2s}
  .tile:hover{transform:translateY(-3px)}
}
.lgrid{display:grid;gap:24px;align-items:start}
@media(min-width:1180px){.lgrid{grid-template-columns:minmax(0,1fr) 300px}.lgrid>aside{position:sticky;top:76px}}
.lmain{display:grid;gap:18px;min-width:0}
.reader{font-size:17.5px;line-height:1.72;letter-spacing:-.005em}
.reader:empty{display:none}
.reader>*{max-width:68ch}
.reader h2{font-size:34px;line-height:1.1;letter-spacing:-.03em;margin:8px 0 18px}
.reader h3{font-size:23px;letter-spacing:-.022em;margin:34px 0 8px;padding-top:18px;border-top:3px solid color-mix(in srgb,var(--amb) 55%,transparent);display:inline-block}
.reader h4,.reader h5{font-size:18px;margin:22px 0 4px}
.reader p{margin:0 0 14px}
.reader ul,.reader ol{padding-left:24px;margin:0 0 14px}
.reader li{margin:4px 0}
.reader pre{max-width:none;max-height:none;background:var(--sunken);font-size:13.5px;padding:16px 18px;border-radius:14px;overflow-x:auto;white-space:pre}
.reader strong{font-weight:600}
.srcs{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--muted);max-height:340px;overflow:auto}
.srcs li{margin:3px 0;overflow-wrap:anywhere}
.box details>summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:500}
.home{padding:32px;display:grid;gap:18px;background:linear-gradient(120deg,color-mix(in srgb,var(--amb) 26%,var(--surface)),var(--surface) 75%)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.fstep{padding:20px;display:grid;gap:4px;align-content:start}
.fstep b{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-size:14px;margin-bottom:6px}
.sect{margin:8px 4px -4px;font-size:26px;letter-spacing:-.025em}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.acard{padding:20px;display:grid;gap:12px;align-content:start;border-top:4px solid var(--amb)}
.acard h3{font-size:18px;letter-spacing:-.02em;line-height:1.25;min-height:2.5em}
.acard .c{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.abadge{font:600 13px var(--f-mono);background:color-mix(in srgb,var(--amb) 24%,transparent);border-radius:8px;padding:3px 9px}
@media (prefers-reduced-motion:no-preference){.acard{transition:transform .2s}.acard:hover{transform:translateY(-3px)}}
.labgrid{display:grid;gap:20px;align-items:start}
@media(min-width:1000px){.labgrid{grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr)}}
.labfig{background:var(--sunken);border-radius:18px;padding:10px;min-width:0}
#lab-svg{width:100%;height:auto;display:block;touch-action:none;user-select:none}
#lab-svg .gx{stroke:var(--line);stroke-width:1;opacity:.6}
#lab-svg .ax{stroke:var(--muted);stroke-width:1.5}
#lab-svg .lb{fill:var(--muted);font:12px var(--f)}
#lab-svg .vv{stroke-width:3.5;stroke-linecap:round}
#lab-svg .k1{stroke:#0a84ff;fill:#0a84ff}#lab-svg .k2{stroke:#ff9f0a;fill:#ff9f0a}#lab-svg .k3{stroke:#30b050;fill:#30b050}
#lab-svg .k3.vv{stroke-width:5}
#lab-svg .dash{stroke-dasharray:6 6;opacity:.6}
#lab-svg .par{fill:color-mix(in srgb,#30b050 14%,transparent);stroke:none}
#lab-svg .hd{fill-opacity:.25;stroke-width:2;cursor:grab}
#lab-svg .pt{fill:#0a84ff;fill-opacity:.8;stroke:var(--surface);stroke-width:1.5}
#lab-svg .pt.c1{fill:#30b050}#lab-svg .pt.c0{fill:#8e8e93}
#lab-svg .pt.wrong{stroke:#ff453a;stroke-width:2.5}
#lab-svg .pt.outl{fill:#ff453a}
#lab-svg .res{stroke:#ff453a;stroke-width:1.2;opacity:.55}
#lab-svg .fit{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
#lab-svg .mean{stroke:var(--muted);stroke-dasharray:5 5}
#lab-svg .bnd{stroke:#ff9f0a;stroke-width:2;stroke-dasharray:4 4}
input[type=range]{width:100%;accent-color:var(--fill)}
output{font-variant-numeric:tabular-nums;font-weight:600}
.big{border-radius:14px;padding:14px 16px;background:var(--surface);margin:6px 0}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,56);
const clone=o=>JSON.parse(JSON.stringify(o));
const words=s=>(s.trim().match(/\S+/g)||[]).length;
function md(src){
  const inl=s=>s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[\s(])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>");
  let out="",list=null,code=false,para=[];
  const fp=()=>{if(para.length){out+="<p>"+inl(para.join(" "))+"</p>";para=[]}};
  const cl=()=>{if(list){out+="</"+list+">";list=null}};
  for(const l of esc(src).split("\n")){
    if(l.trim().startsWith("```")){fp();cl();out+=code?"</code></pre>":"<pre><code>";code=!code;continue}
    if(code){out+=l+"\n";continue}
    let m;
    if((m=l.match(/^(#{1,4})\s+(.*)/))){fp();cl();const h=Math.min(m[1].length+1,5);out+="<h"+h+">"+inl(m[2])+"</h"+h+">"}
    else if((m=l.match(/^\s*[-*•]\s+(.*)/))){fp();if(list!=="ul"){cl();out+="<ul>";list="ul"}out+="<li>"+inl(m[1])+"</li>"}
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){fp();if(list!=="ol"){cl();out+="<ol>";list="ol"}out+="<li>"+inl(m[1])+"</li>"}
    else if(!l.trim()){fp();cl()}
    else{cl();para.push(l)}
  }
  fp();cl();if(code)out+="</code></pre>";return out;
}

/* ---------- guardado: cuenta de Claude si está disponible, navegador como respaldo ---------- */
let db=null,root=null,cloud=false,flushing=false,timer=null,retries=0;const dirty=new Set();
const use=n=>(window.claude&&window.claude.use)?window.claude.use(n).catch(()=>null):Promise.resolve(null);
function setSync(){const el=$("#sync");if(!el)return;el.textContent=dirty.size&&cloud?"Guardando…":cloud?"Avance guardado en tu cuenta":"Avance guardado solo en este navegador"}
function local(k){try{const v=vget(k);if(v===undefined)localStorage.removeItem("dse:"+k);else localStorage.setItem("dse:"+k,JSON.stringify(v))}catch(e){}}
function touch(k){if(k!=="cfg"&&!k.startsWith("ul-"))mark(k);dirty.add(k);local(k);clearTimeout(timer);timer=setTimeout(flush,1200);setSync()}
const ref=k=>k==="cfg"?root:root.collection(k.startsWith("ul-")?"labs":"temas").doc(k);
async function flush(){
  if(!cloud){dirty.clear();setSync();return}
  if(flushing)return;flushing=true;
  while(dirty.size){
    const k=dirty.values().next().value;dirty.delete(k);
    try{const v=vget(k);if(v===undefined)await ref(k).delete();else await ref(k).set(clone(v));retries=0}
    catch(e){
      if(e&&e.code==="unavailable"&&retries<2){retries++;dirty.add(k);timer=setTimeout(flush,4000);break}
      if(e&&e.code==="quota_exceeded"){note("El almacenamiento de la plataforma está lleno. Borra gráficos o conversaciones antiguas.",true)}
      cloud=false;dirty.clear();break
    }
  }
  flushing=false;setSync();
}
function loadLocal(){
  try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!key||!key.startsWith("dse:"))continue;
    const v=JSON.parse(localStorage.getItem(key));const k=key.slice(4);
    if(k==="cfg")S.cfg={...S.cfg,...v};else if(k.startsWith("ul-")){if(v)S.ul[k]=v}else S.t[k]={...clone(DEF),...v}}}catch(e){}
}
async function loadCloud(){
  const [d,user]=await Promise.all([use("db"),use("user")]);
  const uid=user&&user.id?await user.id():null;
  if(!d||!uid){setSync();return}
  db=d;root=db.doc("data/users/"+uid+"/espacio");
  try{
    const wait=new Promise((_,r)=>setTimeout(()=>r({code:"timeout"}),10000));
    const [c,q,ql]=await Promise.race([Promise.all([root.get(),root.collection("temas").limit(1000).get(),root.collection("labs").limit(300).get()]),wait]);
    ql.docs.forEach(x=>{if(!dirty.has(x.id))S.ul[x.id]=clone(x.data())});regAllUL();
    if(c.exists&&!dirty.has("cfg"))S.cfg={...S.cfg,...clone(c.data())};
    q.docs.forEach(x=>{if(!dirty.has(x.id))S.t[x.id]={...clone(DEF),...clone(x.data())}});
    cloud=true;
    if(!c.exists){Object.keys(S.t).concat(Object.keys(S.ul)).forEach(k=>dirty.add(k));dirty.add("cfg");flush()}
    if(!document.activeElement||!/TEXTAREA|INPUT/.test(document.activeElement.tagName))render();
  }catch(e){cloud=false}
  setSync();
}

  return [
   ["Informe","nb-informe",base+"\n\nEscribe un informe extenso y pedagógico que permita entender el tema completo leyendo solo este documento: intuición, definiciones, derivaciones matemáticas paso a paso, algoritmo, hiperparámetros y su efecto, supuestos, errores comunes y código Python comentado. Cierra con dos aplicaciones desarrolladas: una en minería o cemento y otra en banca. Cita la fuente de cada afirmación importante."],
   ["Tarjetas","nb-tarjetas",base+"\n\nGenera todas las tarjetas didácticas que las fuentes permitan, sin número fijo. Una idea por tarjeta: pregunta al frente, respuesta breve y exacta al reverso. Cubre definiciones, fórmulas, supuestos, hiperparámetros, errores comunes y casos de uso."],

}

  return {g,m:tbl([["v","("+f2(v[0])+"; "+f2(v[1])+")"],["w","("+f2(w[0])+"; "+f2(w[1])+")"],["c·v + d·w","("+f2(r[0])+"; "+f2(r[1])+")"],["Producto punto v·w",f2(dt)],["Ángulo entre v y w",f2(ang)+"°"],["Proyección de w sobre v",nv?f2(dt/nv):"0,00"],["Determinante (área)",f2(det),dep?"bad":"ok"]])+hint(dep?"v y w están casi alineados: son linealmente dependientes.":"v y w son linealmente independientes.")}}};
LAB.opt={a:[1,8],t:"Descenso de gradiente y optimizadores",s:{k:12,lr:0.1,n:40,m:"sgd"},
 q:"Las elipses son curvas de nivel de una función de pérdida con forma de valle. La línea muestra el camino del optimizador desde el punto de partida hacia el mínimo, en el centro.",

 k:"Lo que frena al descenso de gradiente no es la distancia al mínimo sino la diferencia de curvatura entre direcciones. Escalar las variables redondea el valle; momentum y Adam compensan lo que quede.",
 draw(s){const {X,Y,g:g0}=axes(-5,5,-2.5,2.5,{nx:10,ny:5});let g=g0;const K=s.k,f=(x,y)=>0.5*(x*x+K*y*y);

LAB.clt={a:[2],t:"Teorema central del límite",s:{d:"exp",n:1},

  const w=(hi-lo)/nb,dens=h.map(c=>c/2000/w),se=sg/Math.sqrt(s.n),top=Math.max(Math.max(...dens),1/(se*2.5066))*1.08,{X,Y,g:g0}=axes(lo,hi,0,top,{nx:8,ny:4,xl:"Promedio de la muestra"});let g=g0;

LAB.pca={a:[6,1],t:"PCA: la dirección que más varianza conserva",s:{r:0.85,th:20},
 q:"Una nube de puntos con dos variables. La línea gruesa es un eje sobre el que proyectas los datos; las líneas finas muestran a dónde cae cada punto. Reducir de dos dimensiones a una es quedarte solo con la posición sobre ese eje.",
 c:[["th","Dirección del eje (grados)",0,180,1],["r","Correlación entre las variables",0,0.98,0.02]],
 b:[["Ir a la primera componente principal",(s,c)=>{s.th=Math.round(c.pc1)}]],
 p:["Gira el eje y busca a ojo el ángulo que conserva más varianza. Luego pulsa el botón y compara.","Pon el eje perpendicular a la primera componente: es la segunda componente y conserva lo que queda.","Baja la correlación a 0. Ninguna dirección destaca: no hay nada que comprimir."],
 k:"La primera componente principal es la dirección de máxima varianza y a la vez la que minimiza las distancias perpendiculares a los puntos. PCA solo sirve si las variables están correlacionadas, y es sensible a la escala.",
 draw(s,c){const {X,Y,g:g0}=axes(-6,6,-4.25,4.25,{nx:6,ny:4});let g=g0;const P=[];for(let i=0;i<80;i++){const a=PZ[500+i],b=PZ[600+i];P.push([2*a,1.6*(s.r*a+Math.sqrt(1-s.r*s.r)*b)])}
  const mx=mean(P.map(p=>p[0])),my=mean(P.map(p=>p[1]));let sxx=0,syy=0,sxy=0;P.forEach(p=>{sxx+=(p[0]-mx)**2;syy+=(p[1]-my)**2;sxy+=(p[0]-mx)*(p[1]-my)});
  c.pc1=((0.5*Math.atan2(2*sxy,sxx-syy)*180/Math.PI)+180)%180;const t=s.th*Math.PI/180,ux=Math.cos(t),uy=Math.sin(t);let vp=0;
  P.forEach(p=>{const k=(p[0]-mx)*ux+(p[1]-my)*uy;vp+=k*k;g+=seg(X(p[0]),Y(p[1]),X(mx+k*ux),Y(my+k*uy),"res")+dot(X(mx+k*ux),Y(my+k*uy),"cB",3)});
  P.forEach(p=>g+=dot(X(p[0]),Y(p[1])));g+=pth([[X(mx-9*ux),Y(my-9*uy)],[X(mx+9*ux),Y(my+9*uy)]],"kk");const fr=vp/(sxx+syy);
  return {g,m:big(pc(fr),"Varianza que conserva este eje",fr>0.85?"ok":"")+tbl([["Ángulo de la primera componente",f2(c.pc1)+"°"],["Varianza que se pierde",pc(1-fr)],["Correlación de la nube",f2(sxy/Math.sqrt(sxx*syy))]])}}};
/* 07 Aprendizaje automático */
const logData=s=>PU.slice(0,60).map((u,i)=>[u*10,PU[100+i]<1/(1+Math.exp(-s.sep*(u*10-5)))?1:0]);
LAB.log={a:[7],t:"Regresión logística",s:{g0:-2,g1:0.6,sep:1.2,thr:0.5},
 q:"Arriba están los casos con respuesta 1 y abajo los de respuesta 0. La curva en S es la probabilidad que predice tu modelo para cada x. Borde rojo: caso mal clasificado con el umbral actual.",
 c:[["g0","Intercepto β₀",-15,15,0.1],["g1","Pendiente β₁",-1,4,0.05],["thr","Umbral de decisión",0.05,0.95,0.01],["sep","Separación entre clases en los datos",0.2,3,0.1]],
 b:[["Ajustar por máxima verosimilitud",s=>{const d=logData(s);let b0=0,b1=0;for(let it=0;it<40;it++){let g0=0,g1=0,h00=0,h01=0,h11=0;d.forEach(q=>{const p=1/(1+Math.exp(-(b0+b1*q[0]))),w=p*(1-p);g0+=q[1]-p;g1+=(q[1]-p)*q[0];h00+=w;h01+=w*q[0];h11+=w*q[0]*q[0]});const det=h00*h11-h01*h01;if(det<1e-9)break;b0+=(h11*g0-h01*g1)/det;b1+=(h00*g1-h01*g0)/det}
   s.g0=Math.max(-15,Math.min(15,Math.round(b0*100)/100));s.g1=Math.max(-1,Math.min(4,Math.round(b1*100)/100))}]],
 p:["Mueve β₁: controla lo empinada que es la S. Mueve β₀: la desplaza. El cruce con 0,5 está en x = −β₀/β₁.","Pulsa el ajuste y luego mueve solo el umbral. La curva no cambia, pero la matriz de confusión sí: sensibilidad y precisión se intercambian.","Sube la separación entre clases a 3 y vuelve a ajustar. β₁ crece; con separación perfecta crecería sin límite."],
 k:"No hay R² clásico porque la respuesta es 0 o 1. Se ajusta maximizando la verosimilitud y se evalúa con log-loss, pseudo-R² de McFadden, AUC y calibración. Supone linealidad en el logit, no normalidad.",
 draw(s){const {X,Y,g:g0}=axes(0,10,0,1,{ny:4,xl:"x",yl:"Probabilidad predicha"});let g=g0;const d=logData(s),n=d.length,P=x=>1/(1+Math.exp(-(s.g0+s.g1*x)));
  g+=seg(50,Y(s.thr),530,Y(s.thr),"mean")+txt(452,Y(s.thr)-6,"umbral");
  if(Math.abs(s.g1)>1e-6){const xb=(Math.log(s.thr/(1-s.thr))-s.g0)/s.g1;if(xb>0&&xb<10)g+=seg(X(xb),30,X(xb),370,"bnd")+txt(X(xb)+6,24,"frontera")}
  const cu=[];for(let i=0;i<=100;i++)cu.push([X(i/10),Y(P(i/10))]);g+=pth(cu,"kk");let ll=0,tp=0,fp=0,fn=0,tn=0,s1=0;
  d.forEach((q,i)=>{const p=Math.min(1-1e-9,Math.max(1e-9,P(q[0]))),y=q[1],pr=p>=s.thr?1:0;ll+=y?Math.log(p):Math.log(1-p);s1+=y;if(y&&pr)tp++;else if(!y&&pr)fp++;else if(y&&!pr)fn++;else tn++;g+=dot(X(q[0]),Y(y)+PZ[i]*5,"c"+y+(pr!==y?" wrong":""))});
  const pb=s1/n,ll0=s1*Math.log(pb)+(n-s1)*Math.log(1-pb),mc=1-ll/ll0;
  return {g,m:big(f2(mc),"Pseudo-R² de McFadden",mc>0.3?"ok":mc<0?"bad":"")+tbl([["Log-loss (menor es mejor)",f2(-ll/n)],["Exactitud",pc((tp+tn)/n)],["Sensibilidad",tp+fn?pc(tp/(tp+fn)):"sin casos"],["Precisión",tp+fp?pc(tp/(tp+fp)):"sin casos"]])+'<table class="cm"><thead><tr><th></th><th>Predice 1</th><th>Predice 0</th></tr></thead><tbody><tr><th>Real 1</th><td class="num ok">'+tp+'</td><td class="num bad">'+fn+'</td></tr><tr><th>Real 0</th><td class="num bad">'+fp+'</td><td class="num ok">'+tn+'</td></tr></tbody></table>'}}};
LAB.bv={a:[7],t:"Sesgo, varianza y regularización",s:{deg:3,lam:-8,nz:0.25},
 q:"Puntos azules: 12 datos de entrenamiento. Línea punteada: la función real que los generó. Línea negra: el polinomio que ajustaste. Los puntos naranjas pequeños son datos de prueba que el modelo no vio.",
 c:[["deg","Grado del polinomio",1,11,1],["lam","Regularización ridge (log₁₀ de λ)",-8,1,0.25],["nz","Ruido en los datos",0.05,0.6,0.05]],
 p:["Con grado 1 la recta no puede seguir la curva: error alto en entrenamiento y en prueba. Eso es sesgo (subajuste).","Sube el grado a 11 sin regularización. La curva pasa por los 12 puntos, el error de entrenamiento cae casi a cero y el de prueba se duplica: el modelo memorizó el ruido. Eso es varianza (sobreajuste).","Sin bajar el grado, sube la regularización hasta cerca de −3. La curva se calma y el error de prueba vuelve a bajar."],
 k:"El error de entrenamiento siempre baja al dar más flexibilidad; el de prueba baja y luego sube. El mejor modelo está en el mínimo del error de prueba. Regularizar es otra forma de quitar flexibilidad sin cambiar de modelo.",
 draw(s){const {X,Y,g:g0}=axes(-1,1,-2,2,{nx:4,ny:4,xl:"x",yl:"y"});let g=g0;const f=x=>Math.sin(Math.PI*x),tr=[],te=[];
  for(let i=0;i<12;i++){const x=-0.95+1.9*i/11;tr.push([x,f(x)+s.nz*PZ[700+i]])}for(let i=0;i<60;i++){const x=-0.98+1.96*PU[700+i];te.push([x,f(x)+s.nz*PZ[720+i]])}
  const p=s.deg+1,lam=Math.pow(10,s.lam),A=Array.from({length:p},()=>Array(p).fill(0)),b=Array(p).fill(0);
  tr.forEach(q=>{const v=[];for(let j=0;j<p;j++)v.push(Math.pow(q[0],j));for(let i=0;i<p;i++){b[i]+=v[i]*q[1];for(let j=0;j<p;j++)A[i][j]+=v[i]*v[j]}});for(let i=1;i<p;i++)A[i][i]+=lam;
  const w=solve(A,b),h=x=>{let t=0;for(let j=p-1;j>=0;j--)t=t*x+w[j];return t},rm=d=>Math.sqrt(mean(d.map(q=>(q[1]-h(q[0]))**2)));
  const tc=[],fc=[];for(let i=0;i<=200;i++){const x=-1+i/100;tc.push([X(x),Y(f(x))]);fc.push([X(x),Y(Math.max(-4,Math.min(4,h(x))))])}
  g+=pth(tc,"k3 dsh")+te.map(q=>dot(X(q[0]),Y(q[1]),"cB",2.5)).join("")+pth(fc,"kk")+tr.map(q=>dot(X(q[0]),Y(q[1]))).join("");const a=rm(tr),c=rm(te);
  return {g,m:big(isFinite(c)&&c<50?f2(c):"muy alto","Error en datos de prueba (RMSE)",c<s.nz*1.4?"ok":c>s.nz*2.5?"bad":"")+tbl([["Error en entrenamiento (RMSE)",f2(a)],["Ruido de los datos (lo mínimo alcanzable)",f2(s.nz)],["Coeficientes del modelo",p],["Diagnóstico",a>s.nz*1.8?"Subajuste: falta flexibilidad":c>a*2.2?"Sobreajuste: memoriza ruido":"Equilibrado"]])}}};
const blobs=(s,off,n)=>{const d=[];for(let i=0;i<n;i++){const c=i%2;d.push([(c?1.1:-1.1)+s*PZ[off+i],(c?0.6:-0.6)+s*PZ[off+200+i],c])}return d};
LAB.knn={a:[7],t:"k vecinos más cercanos",s:{k:1,sp:1},
 q:"Dos clases de puntos. El color de fondo es lo que el modelo predeciría en cada lugar del plano: cada zona toma la clase mayoritaria entre sus k vecinos más cercanos.",
 c:[["k","Número de vecinos k",1,41,2],["sp","Solapamiento entre clases",0.4,1.8,0.1]],
 p:["Con k = 1 la frontera rodea cada punto suelto y la exactitud en entrenamiento es 100 %. En validación es bastante menor.","Sube k hasta 15. La frontera se suaviza, la exactitud de entrenamiento baja y la de validación sube.","Lleva k a 41. La frontera es casi una recta y la validación deja de mejorar: suavizar más ya no ayuda y, con k todavía mayor, el modelo se vuelve demasiado simple."],
 k:"k es un hiperparámetro que regula la flexibilidad: k pequeño es varianza alta, k grande es sesgo alto. Se elige con datos de validación, nunca con los de entrenamiento. Como usa distancias, exige escalar las variables.",
 draw(s){const {X,Y,g:g0}=axes(-4,4,-3.5,3.5,{nx:4,ny:4});let g=g0;const tr=blobs(s.sp,0,80),va=blobs(s.sp,90,100);
  const pred=(x,y,skip)=>{const d=tr.map((p,i)=>[i===skip?1e9:(p[0]-x)**2+(p[1]-y)**2,p[2]]).sort((a,b)=>a[0]-b[0]);let v=0;for(let i=0;i<s.k;i++)v+=d[i][1];return v*2>s.k?1:0};
  g+=cells(X,Y,-4,4,-3.5,3.5,(x,y)=>PAL[pred(x,y,-1)])+tr.map(p=>dot(X(p[0]),Y(p[1]),"c"+PAL[p[2]])).join("");
  const at=mean(tr.map(p=>pred(p[0],p[1],-1)===p[2]?1:0)),av=mean(va.map(p=>pred(p[0],p[1],-1)===p[2]?1:0));
  return {g,m:big(pc(av),"Exactitud en validación",av>0.85?"ok":"")+tbl([["Exactitud en entrenamiento",pc(at)],["Brecha entre ambas",pc(at-av),at-av>0.08?"bad":"ok"]])+hint("Una brecha grande entre entrenamiento y validación indica sobreajuste.")}}};
LAB.km={a:[7],t:"k-means paso a paso",s:{k:3,it:0,sd:1},
 q:"Puntos sin etiqueta. Las cruces son los centroides; cada punto toma el color del centroide más cercano. Cada iteración reasigna los puntos y mueve cada centroide al promedio de los suyos.",
 c:[["k","Número de grupos k",1,6,1],["it","Iteraciones",0,12,1],["sd","Inicio de los centroides",1,6,1]],
 p:["Con k = 3, sube las iteraciones de 0 a 6 una por una y mira cómo los centroides viajan hasta el centro de cada nube. La inercia baja en cada paso.","Pon k = 4 con 12 iteraciones y cambia el inicio de los centroides. La inercia final no es siempre la misma: algunos inicios terminan en un agrupamiento peor. Son mínimos locales.","Sube k a 6. La inercia sigue bajando aunque solo hay tres nubes reales: la inercia sola no dice cuál k es el correcto."],
 k:"k-means minimiza la suma de distancias al cuadrado a los centroides (inercia). Converge siempre, pero a un mínimo local que depende del inicio; por eso se repite varias veces. Supone grupos redondos y de tamaño parecido.",
 draw(s){const {X,Y,g:g0}=axes(-5,5,-4,4,{nx:5,ny:4});let g=g0;const C0=[[-2.4,1.6],[2.4,1.4],[0,-2]],P=[];for(let i=0;i<120;i++){const c=C0[i%3];P.push([c[0]+0.85*PZ[i],c[1]+0.85*PZ[300+i]])}
  let cen=[];for(let j=0;j<s.k;j++){const p=P[(j*17+s.sd*23)%120];cen.push([p[0],p[1]])}let as=[];
  const assign=()=>{as=P.map(p=>{let b=0,bd=1e9;cen.forEach((c,j)=>{const d=(p[0]-c[0])**2+(p[1]-c[1])**2;if(d<bd){bd=d;b=j}});return b})};assign();
  for(let t=0;t<s.it;t++){cen=cen.map((c,j)=>{const m=P.filter((_,i)=>as[i]===j);return m.length?[mean(m.map(p=>p[0])),mean(m.map(p=>p[1]))]:c});assign()}
  let ine=0;P.forEach((p,i)=>{const c=cen[as[i]];ine+=(p[0]-c[0])**2+(p[1]-c[1])**2;g+=dot(X(p[0]),Y(p[1]),"c"+PAL[as[i]],4)});
  cen.forEach((c,j)=>{g+='<path class="cen c'+PAL[j]+'" d="M'+(X(c[0])-9)+" "+(Y(c[1])-9)+"l18 18m0 -18l-18 18"+'"/>'});
  return {g,m:big(f2(ine),"Inercia (suma de distancias al cuadrado)")+tbl([["Grupos",s.k],["Tamaño de cada grupo",cen.map((_,j)=>as.filter(a=>a===j).length).join(" · ")]])}}};
LAB.tree={a:[7],t:"Árbol de decisión y profundidad",s:{dp:2,nz:1},
 q:"Dos clases separadas por una frontera curva. El fondo muestra las regiones del árbol: cada división es un corte horizontal o vertical sobre una sola variable.",
 c:[["dp","Profundidad máxima",0,10,1],["nz","Ruido en las etiquetas",0,1.2,0.1]],
 p:["Sube la profundidad de 0 a 3. Cada nivel agrega cortes rectos; la frontera curva se aproxima con escalones.","Lleva la profundidad a 10. Aparecen cajitas alrededor de puntos sueltos: la exactitud de entrenamiento llega a 100 % y la de validación baja respecto de un árbol poco profundo.","Baja el ruido a 0 y repite: con datos limpios el árbol profundo ya no pierde en validación. El sobreajuste es memorizar ruido; por eso Random Forest promedia muchos árboles."],
 k:"Un árbol divide el espacio en rectángulos eligiendo en cada paso el corte que más reduce la impureza de Gini. La profundidad controla el sobreajuste. No necesita escalar variables y capta relaciones no lineales, pero es inestable: pequeños cambios en los datos cambian los cortes.",
 draw(s){const {X,Y,g:g0}=axes(-3,3,-3,3,{nx:6,ny:6});let g=g0;const mk=(o,n)=>{const d=[];for(let i=0;i<n;i++){const x=PU[o+i]*6-3,y=PU[o+300+i]*6-3;d.push([x,y,y+s.nz*PZ[o+i]>1.4*Math.sin(1.4*x)?1:0])}return d},tr=mk(0,140),va=mk(150,140);let leaves=0;
  const gini=(a,n)=>n?1-(a/n)**2-((n-a)/n)**2:0;
  const build=(d,dep)=>{const n=d.length,ones=d.reduce((t,p)=>t+p[2],0);if(dep>=s.dp||n<2||ones===0||ones===n){leaves++;return {v:ones*2>=n?1:0}}let best=null;
   for(let f=0;f<2;f++){const so=[...d].sort((a,b)=>a[f]-b[f]);let l1=0;for(let i=1;i<n;i++){l1+=so[i-1][2];if(so[i][f]===so[i-1][f])continue;const sc=(i*gini(l1,i)+(n-i)*gini(ones-l1,n-i))/n;if(!best||sc<best.sc)best={sc,f,t:(so[i][f]+so[i-1][f])/2}}}
   if(!best||best.sc>=gini(ones,n)-1e-9){leaves++;return {v:ones*2>=n?1:0}}return {f:best.f,t:best.t,l:build(d.filter(p=>p[best.f]<best.t),dep+1),r:build(d.filter(p=>p[best.f]>=best.t),dep+1)}};
  const T=build(tr,0),pr=(x,y)=>{let nd=T;while(nd.l)nd=(nd.f?y:x)<nd.t?nd.l:nd.r;return nd.v};
  g+=cells(X,Y,-3,3,-3,3,(x,y)=>PAL[pr(x,y)])+tr.map(p=>dot(X(p[0]),Y(p[1]),"c"+PAL[p[2]],4)).join("");
  const at=mean(tr.map(p=>pr(p[0],p[1])===p[2]?1:0)),av=mean(va.map(p=>pr(p[0],p[1])===p[2]?1:0));
  return {g,m:big(pc(av),"Exactitud en validación",av>0.85?"ok":"")+tbl([["Exactitud en entrenamiento",pc(at)],["Hojas del árbol",leaves],["Brecha entre ambas",pc(at-av),at-av>0.08?"bad":"ok"]])}}};
LAB.roc={a:[7,13],t:"Curva ROC, AUC, KS y Gini",s:{sep:1.5,t:0.75},
 q:"La curva ROC recorre todos los umbrales posibles: en horizontal la tasa de falsos positivos, en vertical la de verdaderos positivos. El punto es tu umbral actual. La diagonal es un modelo que adivina.",
 c:[["sep","Qué tan bien separa el modelo",0,4,0.1],["t","Umbral sobre el puntaje",-3,6,0.05]],
 p:["Mueve el umbral: el punto recorre la curva, pero la curva no cambia. El AUC no depende del umbral.","Lleva la separación a 0. La curva cae sobre la diagonal: AUC 0,50, Gini 0, KS 0.","Sube la separación y busca el umbral donde la distancia vertical a la diagonal es máxima. Ese valor es el KS."],
 k:"AUC es la probabilidad de que un positivo al azar reciba más puntaje que un negativo al azar. Gini = 2·AUC − 1 y KS es la máxima separación entre las dos distribuciones acumuladas. Las tres miden capacidad de ordenar, no calibración.",
 draw(s){const {X,Y,g:g0}=axes(0,1,0,1,{nx:4,ny:4,xl:"Tasa de falsos positivos",yl:"Tasa de verdaderos positivos"});let g=g0;const c=[];let ks=0;
  for(let i=0;i<=240;i++){const t=7-i/20,f=1-Phi(t),v=1-Phi(t-s.sep);c.push([X(f),Y(v)]);ks=Math.max(ks,v-f)}
  const f=1-Phi(s.t),v=1-Phi(s.t-s.sep),auc=Phi(s.sep/Math.SQRT2);
  g+=pth([[X(0),Y(0)],[X(1),Y(1)]],"mean")+pth(c,"k1")+seg(X(f),Y(f),X(f),Y(v),"bnd")+dot(X(f),Y(v),"c1",7);
  return {g,m:big(f2(auc),"AUC",auc>0.8?"ok":auc<0.6?"bad":"")+tbl([["Gini",f2(2*auc-1)],["KS (máxima separación)",f2(ks)],["Separación en tu umbral",f2(v-f)],["Verdaderos positivos en tu umbral",pc(v)],["Falsos positivos en tu umbral",pc(f)]])}}};
/* 08 Aprendizaje profundo */
const ACT={sig:[x=>1/(1+Math.exp(-x)),x=>{const v=1/(1+Math.exp(-x));return v*(1-v)}],tanh:[Math.tanh,x=>1-Math.tanh(x)**2],relu:[x=>Math.max(0,x),x=>x>0?1:0],leaky:[x=>x>0?x:0.1*x,x=>x>0?1:0.1],gelu:[x=>x*Phi(x),x=>Phi(x)+x*npdf(x)]};
LAB.act={a:[8],t:"Funciones de activación y gradiente que se desvanece",s:{f:"sig",x:1.5,n:10},
 q:"Línea negra: la función de activación. Línea naranja punteada: su derivada, que es el factor por el que se multiplica el gradiente al pasar por una capa. El punto marca la entrada x que elegiste.",

 p:["Con sigmoide, la derivada nunca pasa de 0,25. Sube las capas a 10: el gradiente que llega a la primera capa es prácticamente cero.","Cambia a ReLU con x positivo. La derivada vale 1 y el gradiente llega intacto por muchas capas.","Con ReLU pon x negativo. La derivada es 0: la neurona está muerta y no aprende. Compara con Leaky ReLU y GELU."],
 k:"En retropropagación el gradiente es un producto de derivadas, una por capa. Si cada factor es menor que 1, el producto se desvanece con la profundidad. Por eso las redes profundas usan ReLU y sus variantes en lugar de sigmoide.",
 draw(s){const {X,Y,g:g0}=axes(-5,5,-1.5,3,{nx:10,ny:6,xl:"x"});let g=g0;const [f,d]=ACT[s.f],a=[],b=[];for(let i=0;i<=200;i++){const x=-5+i/20;a.push([X(x),Y(f(x))]);b.push([X(x),Y(d(x))])}
  g+=seg(50,Y(0),530,Y(0),"ax")+pth(b,"k2 dsh")+pth(a,"kk")+seg(X(s.x),Y(0),X(s.x),Y(f(s.x)),"bnd")+dot(X(s.x),Y(f(s.x)),"c1",7)+dot(X(s.x),Y(d(s.x)),"cB",6);
  const gr=Math.pow(d(s.x),s.n),sh=gr===0?"0":gr<0.001?gr.toExponential(1).replace(".",","):f2(gr);
  return {g,m:big(sh,"Gradiente que sobrevive tras "+s.n+" capas",gr<0.01?"bad":"ok")+tbl([["Salida f(x)",f2(f(s.x))],["Derivada f′(x)",f2(d(s.x))]])+hint(gr<0.01?"El gradiente se desvanece: las primeras capas casi no aprenden.":"El gradiente llega con fuerza suficiente a las primeras capas.")}}};
LAB.mlp={a:[8],t:"Red neuronal: aprender una frontera no lineal",s:{ds:"xor",h:4,ep:0,lr:0.5},
 q:"Dos clases que ninguna recta puede separar. El fondo es lo que predice una red con una capa oculta; cada paso de entrenamiento ajusta los pesos con retropropagación. La curva pequeña es la pérdida a lo largo del entrenamiento.",
 c:[["ds","Datos","sel",[["xor","XOR (cuatro esquinas)"],["cir","Círculo dentro de anillo"]]],["h","Neuronas en la capa oculta",1,10,1],["ep","Pasos de entrenamiento",0,800,20],["lr","Tasa de aprendizaje",0.05,1.5,0.05]],
 p:["Con 4 neuronas, sube los pasos de 0 a 800 y mira cómo la frontera se dobla hasta separar las clases mientras la pérdida baja.","Pon 1 neurona oculta y entrena. Solo puede trazar una recta: no resuelve XOR por más que entrenes. Con 2 ya puede.","Cambia a círculo. Prueba con 2, 3 y 6 neuronas: hacen falta al menos 3 para cerrar una región."],
 k:"Cada neurona oculta aporta un corte recto; la capa de salida los combina. Con pocas neuronas la red no puede representar la frontera (falta capacidad); con suficientes sí, y el entrenamiento la encuentra bajando el gradiente de la pérdida.",
 draw(s){const {X,Y,g:g0}=axes(-2,2,-2,2,{nx:4,ny:4});let g=g0;const D=[];for(let i=0;i<120;i++){if(s.ds==="xor"){const a=i%2?1:-1,b=(i>>1)%2?1:-1;D.push([a+0.32*PZ[i],b+0.32*PZ[200+i],a*b>0?1:0])}else{const in_=i%2,r=in_?0.45*PU[i]:1.2+0.4*PU[i],t=6.2832*PU[300+i];D.push([r*Math.cos(t),r*Math.sin(t),in_])}}
  const H=s.h,W=[],B=[],V=[];let c=0;for(let j=0;j<H;j++){W.push([1.2*PZ[800+j],1.2*PZ[820+j]]);B.push(0.3*PZ[840+j]);V.push(0.8*PZ[860+j])}
  const fw=(x,y)=>{const h=[];let o=c;for(let j=0;j<H;j++){h[j]=Math.tanh(W[j][0]*x+W[j][1]*y+B[j]);o+=V[j]*h[j]}return [1/(1+Math.exp(-o)),h]},loss=()=>mean(D.map(p=>{const q=Math.min(1-1e-9,Math.max(1e-9,fw(p[0],p[1])[0]));return -(p[2]?Math.log(q):Math.log(1-q))})),hist=[loss()];
  for(let e=1;e<=s.ep;e++){const gW=W.map(()=>[0,0]),gB=Array(H).fill(0),gV=Array(H).fill(0);let gc=0;D.forEach(p=>{const [q,h]=fw(p[0],p[1]),d=q-p[2];gc+=d;for(let j=0;j<H;j++){gV[j]+=d*h[j];const b=d*V[j]*(1-h[j]*h[j]);gW[j][0]+=b*p[0];gW[j][1]+=b*p[1];gB[j]+=b}});
   const k=s.lr/D.length;c-=k*gc;for(let j=0;j<H;j++){V[j]-=k*gV[j];W[j][0]-=k*gW[j][0];W[j][1]-=k*gW[j][1];B[j]-=k*gB[j]}if(e%20===0)hist.push(loss())}
  g+=cells(X,Y,-2,2,-2,2,(x,y)=>PAL[fw(x,y)[0]>0.5?1:0])+D.map(p=>dot(X(p[0]),Y(p[1]),"c"+PAL[p[2]],4)).join("");
  const top=Math.max(...hist,0.75);g+='<rect class="inset" x="388" y="38" width="134" height="66" rx="8"/>'+txt(396,54,"pérdida")+'<path class="ln kk" fill="none" d="'+hist.map((v,i)=>(i?"L":"M")+(396+118*i/Math.max(1,hist.length-1)).toFixed(1)+" "+(98-36*v/top).toFixed(1)).join("")+'"/>';
  const ac=mean(D.map(p=>(fw(p[0],p[1])[0]>0.5?1:0)===p[2]?1:0)),ls=hist[hist.length-1];
  return {g,m:big(pc(ac),"Exactitud",ac>0.95?"ok":ac<0.7?"bad":"")+tbl([["Pérdida (entropía cruzada)",f2(s.ep?loss():ls)],["Pérdida antes de entrenar",f2(hist[0])],["Parámetros de la red",3*H+H+1]])}}};

LAB.ar={a:[9],t:"Autocorrelación, tendencia y estacionalidad",s:{phi:0.6,b:0,A:0},
 q:"Arriba, una serie simulada de 144 periodos. Abajo, su función de autocorrelación: cuánto se parece la serie a sí misma desplazada 1, 2, … 18 periodos.",
 c:[["phi","Memoria del proceso (φ)",0,1.02,0.02],["b","Tendencia por periodo",0,0.3,0.01],["A","Amplitud estacional (ciclo de 12)",0,6,0.25]],
 p:["Con φ = 0 la serie es ruido blanco y las barras de autocorrelación son casi nulas. Sube φ a 0,9: las barras decaen despacio.","Lleva φ a 1 o más. La serie deambula sin volver a un nivel: es una caminata aleatoria, no estacionaria. La autocorrelación casi no decae.","Vuelve a φ = 0,3 y sube la amplitud estacional. Aparece un pico en el rezago 12. Agrega tendencia y mira cómo todas las barras suben."],
 k:"Una serie es estacionaria si su media y su varianza no cambian en el tiempo. La autocorrelación que decae lento delata tendencia o raíz unitaria; los picos periódicos delatan estacionalidad. Por eso se diferencia antes de ajustar un ARIMA.",
 draw(s){const n=144,x=[];let v=0;for(let t=0;t<n;t++){v=s.phi*v+PZ[t];x.push(v+s.b*t+s.A*Math.sin(6.2832*t/12))}
  const lo=Math.min(...x),hi=Math.max(...x),X=t=>50+t/(n-1)*480,Y=u=>215-(u-lo)/(hi-lo||1)*180;let g=txt(52,24,"Serie")+seg(50,215,530,215,"ax");
  g+=pth(x.map((u,t)=>[X(t),Y(u)]),"k1");const m=mean(x),den=x.reduce((t,u)=>t+(u-m)**2,0),ac=[];
  for(let k=1;k<=18;k++){let t=0;for(let i=k;i<n;i++)t+=(x[i]-m)*(x[i-k]-m);ac.push(t/den)}
  g+=txt(52,252,"Autocorrelación por rezago")+seg(50,320,530,320,"ax");const ci=1.96/Math.sqrt(n);g+=seg(50,320-ci*60,530,320-ci*60,"mean")+seg(50,320+ci*60,530,320+ci*60,"mean");
  ac.forEach((a,i)=>{const h=a*60;g+='<rect class="bar k1" x="'+(58+i*26)+'" y="'+(h>=0?320-h:320)+'" width="16" height="'+Math.abs(h).toFixed(1)+'"/>'+txt(66+i*26,400,i+1,"middle")});
  return {g,m:big(f2(ac[0]),"Autocorrelación en el rezago 1",ac[0]>0.95?"bad":"")+tbl([["Autocorrelación en el rezago 12",f2(ac[11])],["Rezagos fuera de la banda del 95 %",ac.filter(a=>Math.abs(a)>ci).length+" de 18"],["¿Estacionaria?",s.phi>=1||s.b>0.02?"No":s.A>0?"Sí, con estacionalidad":"Sí"]])}}};
/* 10 Cálculo estocástico */
LAB.bm={a:[10],t:"Movimiento browniano geométrico",s:{mu:0.1,sg:0.3,n:25},
 q:"Trayectorias simuladas de un precio que parte de 100 y evoluciona durante un año. La línea negra es el valor esperado; la punteada, la mediana teórica.",
 c:[["mu","Deriva anual μ",-0.3,0.5,0.01],["sg","Volatilidad anual σ",0.05,0.9,0.01],["n","Número de trayectorias",5,80,5]],
 p:["Con μ = 0,10, sube la volatilidad de 0,10 a 0,80. El valor esperado no cambia, pero la mediana cae por debajo de 100: la mayoría de trayectorias pierde.","Pon μ = 0 y volatilidad alta. La probabilidad de terminar bajo el precio inicial supera el 50 %.","Mira el percentil 5: es el valor en riesgo a un año. Crece con la volatilidad mucho más rápido que con la deriva."],
 k:"El precio es lognormal: su media crece con μ, pero su mediana crece con μ − σ²/2. Esa diferencia, que sale del lema de Itô, explica por qué alta volatilidad destruye el crecimiento típico aunque el promedio se mantenga.",
 draw(s){const T=100,r=rng(3),paths=[];let hi=100,lo=100;for(let p=0;p<s.n;p++){let v=100;const a=[v];for(let t=1;t<=T;t++){v*=Math.exp((s.mu-s.sg*s.sg/2)/T+s.sg*Math.sqrt(1/T)*gauss(r));a.push(v)}paths.push(a);hi=Math.max(hi,...a);lo=Math.min(lo,...a)}
  hi=Math.min(hi*1.05,400);const {X,Y,g:g0}=axes(0,1,Math.max(0,lo*0.9),hi,{nx:4,ny:5,xl:"Años"});let g=g0;
  paths.forEach(a=>g+=pth(a.map((v,t)=>[X(t/T),Y(v)]),"thinp"));const e=[],md=[];for(let t=0;t<=T;t++){e.push([X(t/T),Y(100*Math.exp(s.mu*t/T))]);md.push([X(t/T),Y(100*Math.exp((s.mu-s.sg*s.sg/2)*t/T))])}
  g+=pth(e,"kk")+pth(md,"k2 dsh");const d=s.mu-s.sg*s.sg/2,pl=Phi(-d/s.sg);
  return {g,m:big(pc(pl),"Probabilidad de terminar bajo 100",pl>0.5?"bad":"ok")+tbl([["Valor esperado a un año",f2(100*Math.exp(s.mu))],["Mediana a un año",f2(100*Math.exp(d))],["Percentil 5 (valor en riesgo)",f2(100*Math.exp(d-1.645*s.sg))],["Crecimiento típico μ − σ²/2",f2(d)]])}}};

LAB.viz={a:[11],t:"El eje truncado: cómo un gráfico exagera",s:{a:94,s0:0},

 p:["Con A = 94 y el eje en 0, la diferencia se ve como es: pequeña.","Sube el inicio del eje hasta 65. Los datos son los mismos, pero la diferencia que se ve entre las barras es más del triple de la real.","Mira el factor de exageración. Edward Tufte lo llamó factor de mentira: efecto mostrado dividido entre efecto real."],
 k:"En un gráfico de barras el ojo compara longitudes, así que el eje debe empezar en cero. Si lo que importa es la variación y no la magnitud, usa líneas o puntos, donde truncar el eje sí es legítimo.",
 draw(s){const {X,Y,g:g0}=axes(0,3,s.s0,105,{nx:3,ny:5});let g=g0;[["A",s.a,"k1",0.6],["B",100,"k2",1.8]].forEach(b=>{g+='<rect class="bar '+b[2]+'" x="'+X(b[3])+'" y="'+Y(b[1])+'" width="96" height="'+(370-Y(b[1]))+'"/>'+txt(X(b[3])+48,Y(b[1])-8,b[0]+" = "+b[1],"middle")});

LAB.spc={a:[12],t:"Carta de control de un proceso",s:{sh:0,dr:0,nz:1},
 q:"Mediciones sucesivas de una variable de proceso. Los límites de control se calculan con las primeras 25 muestras, cuando el proceso estaba estable. En rojo, los puntos que disparan una alarma.",
 c:[["sh","Desplazamiento de la media desde la muestra 40 (en σ)",0,4,0.1],["dr","Deriva gradual por muestra (en σ)",0,0.12,0.005],["nz","Variabilidad después de la muestra 40",1,3,0.1]],
 p:["Sin cambios, casi ningún punto sale de los límites: con ±3σ se espera una falsa alarma cada 370 muestras.","Sube el desplazamiento a 1,5σ. Pocos puntos cruzan el límite, pero la regla de rachas (ocho seguidos al mismo lado) lo detecta.","Vuelve a 0 y aplica una deriva gradual. Compara cuántas muestras tarda cada regla en avisar."],
 k:"La carta de control separa la variación normal del proceso de las causas asignables. Los límites salen de los datos, no de la especificación. Los cambios pequeños y sostenidos se detectan con reglas de rachas, no con el límite de 3σ.",
 draw(s){const n=80,x=[];for(let t=0;t<n;t++){const af=t>=40;x.push(100+2*((af?s.nz:1)*PZ[t+50]+(af?s.sh+s.dr*(t-40):0)))}
  const b=x.slice(0,25),m=mean(b),sg=sd(b),ucl=m+3*sg,lcl=m-3*sg,lo=Math.min(lcl-2,...x),hi=Math.max(ucl+2,...x),{X,Y,g:g0}=axes(0,n,lo,hi,{nx:8,ny:5,xl:"Número de muestra"});let g=g0;
  g+=seg(50,Y(m),530,Y(m),"ax")+seg(50,Y(ucl),530,Y(ucl),"bnd")+seg(50,Y(lcl),530,Y(lcl),"bnd")+txt(526,Y(ucl)-5,"+3σ","end")+txt(526,Y(lcl)+14,"−3σ","end")+seg(X(40),30,X(40),370,"mean");
  g+=pth(x.map((v,t)=>[X(t+0.5),Y(v)]),"thinp");let out=0,first=0,run=0,side=0,frun=0,mxr=0;
  x.forEach((v,t)=>{const o=v>ucl||v<lcl,sd_=v>m?1:-1;run=sd_===side?run+1:1;side=sd_;mxr=Math.max(mxr,run);const r8=run>=8;if(o){out++;if(!first)first=t+1}if(r8&&!frun&&t>=25)frun=t+1;g+=dot(X(t+0.5),Y(v),o||r8?"outl":"",4)});
  return {g,m:big(out,"Puntos fuera de los límites de 3σ",out?"bad":"ok")+tbl([["Primera alarma por límite","Muestra "+(first||"ninguna")],["Primera alarma por racha de 8","Muestra "+(frun||"ninguna")],["Racha más larga a un lado",mxr],["Límites de control",f2(lcl)+" a "+f2(ucl)]])}}};

const DEC=[-1.2816,-0.8416,-0.5244,-0.2533,0,0.2533,0.5244,0.8416,1.2816];
LAB.drift={a:[13],t:"Deriva de datos y PSI",s:{sh:0,sc:1},
 q:"En azul, la distribución de una variable cuando se entrenó el modelo, repartida en diez tramos de igual tamaño. En naranja, cómo se reparte hoy en esos mismos tramos.",
 c:[["sh","Desplazamiento de la media (en σ)",-2,2,0.05],["sc","Cambio de dispersión (veces)",0.4,2.5,0.05]],
 p:["Sin cambios, las barras naranjas igualan a las azules y el PSI es 0.","Desplaza la media 0,35σ: el PSI pasa de 0,10, la zona de vigilancia. Con 0,6σ ya supera 0,25.","Vuelve la media a 0 y duplica la dispersión. La media no cambió y el PSI igual se dispara: por eso no basta vigilar promedios."],
 k:"El índice de estabilidad poblacional suma, tramo por tramo, (actual − esperado) × ln(actual/esperado). Como regla práctica habitual, menos de 0,10 es estable, entre 0,10 y 0,25 pide revisión, y más de 0,25 indica un cambio importante. Mide que la población cambió, no que el modelo falle.",
 draw(s){const ed=[-Infinity,...DEC,Infinity],cur=[];for(let i=0;i<10;i++)cur.push(Math.max(1e-6,Phi((ed[i+1]-s.sh)/s.sc)-Phi((ed[i]-s.sh)/s.sc)));
  const top=Math.max(0.3,Math.max(...cur)*1.1),{X,Y,g:g0}=axes(0,10,0,top,{nx:10,ny:4,xl:"Tramo (decil de la distribución de entrenamiento)",yl:"Proporción de casos"});let g=g0,psi=0;
  cur.forEach((c,i)=>{psi+=(c-0.1)*Math.log(c/0.1);g+='<rect class="bar k1" x="'+(X(i)+5)+'" y="'+Y(0.1)+'" width="18" height="'+(370-Y(0.1))+'"/><rect class="bar k2" x="'+(X(i)+25)+'" y="'+Y(c)+'" width="18" height="'+(370-Y(c))+'"/>'});
  return {g,m:big(f2(psi),"PSI",psi<0.1?"ok":psi>0.25?"bad":"")+tbl([["Lectura",psi<0.1?"Estable":psi>0.25?"Cambio importante":"Requiere revisión"],["Tramo con más casos hoy","Tramo "+(cur.indexOf(Math.max(...cur))+1)+" ("+pc(Math.max(...cur))+")"],["Tramo con menos casos hoy","Tramo "+(cur.indexOf(Math.min(...cur))+1)+" ("+pc(Math.min(...cur))+")"]])}}};

const DOCS=[["Política de crédito",15],["Manual de cobranza",40],["Reporte de riesgo de modelos",70],["Guía de molienda",150],["Mantenimiento del horno",175],["Plan de mina",205],["Manual de vacaciones",275],["Recetas del comedor",320]];
LAB.rag={a:[14],t:"Recuperación por similitud en un RAG",s:{q:55,k:3,th:0.5},
 q:"Cada flecha gris es un documento convertido en vector; la azul es la pregunta del usuario. Los documentos en verde son los que el sistema recupera y entrega al modelo como contexto.",
 c:[["q","Dirección de la pregunta (grados)",0,360,1],["k","Cuántos documentos recuperar (top-k)",1,6,1],["th","Similitud mínima exigida",0,1,0.01]],
 p:["Gira la pregunta hacia los documentos de banca y luego hacia los de planta. Cambia qué se recupera: la cercanía en el espacio de vectores hace de cercanía de significado.","Pon la similitud mínima en 0 y apunta la pregunta a 110°, entre los temas de banca y los de planta. El sistema igual entrega tres documentos, de temas distintos y ninguno sobre la pregunta: así empiezan muchas alucinaciones.","Sin mover la pregunta, sube la similitud mínima a 0,85. Ahora no se recupera nada y el agente puede decir que no sabe."],
 k:"Un RAG no entiende la pregunta: busca los vectores más cercanos por similitud de coseno. Top-k siempre devuelve algo; el umbral decide si ese algo es suficiente. Los vectores reales tienen cientos de dimensiones, pero la geometría es la misma.",
 draw(s){const cx=280,cy=210,R=150,rad=a=>a*Math.PI/180;let g='<circle class="ctr" cx="280" cy="210" r="150"/>';
  const sim=DOCS.map((d,i)=>[Math.cos(rad(d[1]-s.q)),i]).sort((a,b)=>b[0]-a[0]),got=sim.slice(0,s.k).filter(x=>x[0]>=s.th).map(x=>x[1]);
  DOCS.forEach((d,i)=>{const a=rad(d[1]),x=cx+R*Math.cos(a),y=cy-R*Math.sin(a),on=got.includes(i);g+=seg(cx,cy,x,y,"vv "+(on?"k3":"kg"))+txt(cx+(R+12)*Math.cos(a),cy-(R+12)*Math.sin(a)+4,d[0],Math.cos(a)<-0.2?"end":Math.cos(a)>0.2?"start":"middle")});
  const a=rad(s.q);g+=seg(cx,cy,cx+(R-20)*Math.cos(a),cy-(R-20)*Math.sin(a),"vv k1")+dot(cx+(R-20)*Math.cos(a),cy-(R-20)*Math.sin(a),"c1",6)+txt(cx+(R-44)*Math.cos(a)+10,cy-(R-44)*Math.sin(a)-10,"pregunta");
  return {g,m:big(got.length,"Documentos entregados al modelo",got.length?"ok":"bad")+tbl(sim.slice(0,5).map(x=>[DOCS[x[1]][0],f2(x[0]),got.includes(x[1])?"ok":""]))+hint(got.length?"La columna muestra la similitud de coseno con la pregunta.":"Nada supera el umbral: lo correcto es que el agente diga que no tiene la información.")}}};

/* refuerzo 06 y 08 */
LAB.leak={a:[6],t:"Fuga de datos al seleccionar variables",s:{p:40},
 q:"La respuesta y y todas las variables candidatas son ruido puro: no hay nada que aprender. Aun así, si eliges la 'mejor' variable mirando todos los datos y luego validas, parece que encontraste señal. El gráfico muestra esa variable elegida contra y en las filas de validación.",
 c:[["p","Número de variables candidatas (todas son ruido)",1,200,1]],
 p:["Con 1 variable candidata, las dos correlaciones son parecidas y bajas: no hay de dónde elegir.","Sube a 200 candidatas. La correlación 'contaminada' en validación crece mucho, aunque todo sigue siendo ruido.","Mira la correlación honesta: se queda cerca del nivel del azar sin importar cuántas candidatas haya."],
 k:"Toda decisión que mira los datos (seleccionar variables, escalar, imputar, ajustar hiperparámetros) debe tomarse solo con el conjunto de entrenamiento. Si la validación participa en la decisión, deja de ser validación y el resultado sale inflado.",
 draw(s){const n=60,R=30,r=rng(21);let cs=0,hs=0,keep=null;
  for(let t=0;t<R;t++){const y=Array.from({length:n},()=>gauss(r)),F=Array.from({length:s.p},()=>Array.from({length:n},()=>gauss(r))),va=a=>a.slice(30),tr=a=>a.slice(0,30);
   let bc=0,bh=0,mc=-1,mh=-1;F.forEach((f,j)=>{const a=Math.abs(corr(f,y)),b=Math.abs(corr(tr(f),tr(y)));if(a>mc){mc=a;bc=j}if(b>mh){mh=b;bh=j}});
   cs+=Math.abs(corr(va(F[bc]),va(y)));hs+=Math.abs(corr(va(F[bh]),va(y)));if(!t)keep=[va(F[bc]),va(y)]}
  const {X,Y,g:g0}=axes(-3,3,-3,3,{nx:6,ny:6,xl:"Variable elegida mirando todos los datos",yl:"y (ruido)"});let g=g0;const d=keep[0].map((v,i)=>[v,keep[1][i]]),[b0,b1]=ols(d);
  g+=d.map(q=>dot(X(q[0]),Y(q[1]))).join("")+pth([[X(-3),Y(b0-3*b1)],[X(3),Y(b0+3*b1)]],"kk");const c=cs/R,h=hs/R;

 draw(s){const mu=[2,9,4,7,12],cnt=[20,20,20,20,4],D=[];let k=0;mu.forEach((m,c)=>{for(let i=0;i<cnt[c];i++)D.push([c,m+s.nz*PZ[k++]])});

 c:[["p","Probabilidad de apagar cada neurona",0,0.9,0.05],["sd","Paso de entrenamiento (máscara distinta en cada uno)",1,30,1],["ph","Fase","sel",[["tr","Entrenamiento"],["in","Inferencia"]]]],
 p:["Con probabilidad 0,50, avanza el paso de entrenamiento. En cada paso se apaga un grupo distinto y las neuronas vivas valen el doble.","Mira el promedio de la suma sobre 500 máscaras: coincide con la suma original. Por eso se divide entre 1 − p: la capa siguiente recibe, en promedio, la misma señal.","Cambia a inferencia. No se apaga nada y no se escala: la red usa todas las neuronas, como el promedio de las subredes que entrenó."],
 k:"Dropout obliga a la red a no depender de ninguna neurona en particular, porque cualquiera puede faltar. Equivale a entrenar muchas subredes que comparten pesos y promediarlas al predecir. Solo actúa en entrenamiento.",
 draw(s){const {X,Y,g:g0}=axes(0,20,0,5,{nx:10,ny:5,xl:"Neurona",yl:"Activación"});let g=g0;const a=Array.from({length:20},(_,i)=>0.3+Math.abs(PZ[i+60])*0.9),r=rng(100+s.sd),mk=a.map(()=>s.ph==="in"?1:(r()<s.p?0:1)),o=a.map((v,i)=>s.ph==="in"?v:mk[i]*v/(1-s.p));
  a.forEach((v,i)=>{g+='<rect class="bar kg" x="'+(X(i)+4)+'" y="'+Y(v)+'" width="16" height="'+(370-Y(v))+'" style="fill-opacity:.25"/>'+(o[i]>0?'<rect class="bar k1" x="'+(X(i)+8)+'" y="'+Y(Math.min(o[i],5))+'" width="8" height="'+(370-Y(Math.min(o[i],5)))+'"/>':"")});
  const sa=a.reduce((x,y)=>x+y,0),r2=rng(7),S_=[];for(let t=0;t<500;t++){let u=0;a.forEach(v=>{if(r2()>=s.p)u+=v/(1-s.p)});S_.push(u)}
  return {g,m:big(mk.reduce((x,y)=>x+y,0)+" de 20","Neuronas activas en este paso")+tbl([["Suma de activaciones original",f2(sa)],["Suma que pasa en este paso",f2(o.reduce((x,y)=>x+y,0))],["Promedio de la suma en 500 máscaras",s.ph==="in"?f2(sa):f2(mean(S_))],["Variación entre máscaras (desviación)",s.ph==="in"?"0,00":f2(sd(S_))]])}}};
LAB.rnn={a:[8,9],t:"Memoria en redes recurrentes y LSTM",s:{w:0.85,f:0.98,T:50},
 q:"Cuánta señal de aprendizaje llega desde el final de una secuencia hasta un paso anterior. El eje vertical es logarítmico: cada marca es un factor de 1 000. Azul: red recurrente simple, que multiplica por su peso en cada paso. Naranja: celda LSTM, que multiplica por su puerta de olvido.",
 c:[["w","Peso recurrente de la red simple",0.3,1.5,0.01],["f","Puerta de olvido de la LSTM",0.5,1,0.005],["T","Largo de la secuencia",5,100,1]],
 p:["Con peso 0,85 y secuencia de 50 pasos, el gradiente de la red simple se desvanece: lo que pasó al inicio ya no puede influir en el aprendizaje.","Sube el peso a 1,20. Ahora el gradiente explota: el entrenamiento se vuelve inestable y hay que recortar gradientes.","Deja la puerta de olvido en 0,98. La LSTM conserva una fracción útil de la señal a 50 pasos. Bájala a 0,80 y la pierde igual: la memoria larga existe solo si la red aprende a mantener la puerta abierta."],
 k:"Una red recurrente simple multiplica el gradiente por casi el mismo factor en cada paso, así que la señal se desvanece o explota de forma exponencial. La LSTM agrega una celda con una puerta que puede valer casi 1 y dejar pasar la señal. Versión simplificada: una sola neurona, sin la derivada de la activación.",
 draw(s){const {X,Y,g:g0}=axes(0,s.T,-12,6,{nx:5,ny:6,xl:"Pasos hacia atrás en la secuencia",yl:"Gradiente (log₁₀)"});let g=g0;const a=[],b=[],cl=v=>Math.max(-12.5,Math.min(6.5,v));
  for(let t=0;t<=s.T;t++){a.push([X(t),Y(cl(t*Math.log10(s.w)))]);b.push([X(t),Y(cl(t*Math.log10(s.f)))])}
  g+=seg(50,Y(0),530,Y(0),"ax")+pth(a,"k1")+pth(b,"k2");const gr=Math.pow(s.w,s.T),gl=Math.pow(s.f,s.T);
  return {g,m:big(ex(gr),"Gradiente de la red simple tras "+s.T+" pasos",gr<1e-3||gr>1e3?"bad":"ok")+tbl([["Gradiente de la LSTM tras "+s.T+" pasos",ex(gl),gl<1e-3?"bad":"ok"],["Diagnóstico de la red simple",gr<1e-3?"Se desvanece":gr>1e3?"Explota":"Estable"]])}}};
LAB.ae={a:[8,12],t:"Autoencoder para detectar anomalías",s:{th:1,am:1},
 q:"Mediciones de dos variables de un equipo. La mayoría sigue un patrón normal a lo largo de la línea negra, que es lo que aprende un autoencoder lineal con una sola neurona en el centro. Las líneas finas son el error de reconstrucción de cada punto. Borde rojo: punto marcado como anomalía. Los puntos naranjas son anomalías reales.",
 c:[["th","Umbral de error de reconstrucción",0.2,3.5,0.05],["am","Tamaño de las anomalías",0.4,2.5,0.1]],
 p:["Baja el umbral a 0,30. Se detectan todas las anomalías, pero también se marcan muchos puntos normales: falsas alarmas.","Sube el umbral hasta que las falsas alarmas lleguen a cero y sigue subiendo: empiezan a escaparse anomalías reales.","Reduce el tamaño de las anomalías a 0,40. Ya no hay un umbral limpio: o se escapan anomalías o aparecen falsas alarmas. El método tiene un límite."],
 k:"Un autoencoder aprende a comprimir y reconstruir lo normal. Lo que no se parece a lo que vio se reconstruye mal, y ese error sirve de alarma sin necesidad de ejemplos de falla. Con una capa lineal equivale a PCA; con capas no lineales capta patrones curvos.",
 draw(s){const {X,Y,g:g0}=axes(-6,6,-4.25,4.25,{nx:6,ny:4});let g=g0;const N=[],A=[];for(let i=0;i<90;i++){const a=PZ[400+i],b=PZ[500+i];N.push([2*a,1.2*a+0.42*b])}
  for(let i=0;i<8;i++){const t=PZ[650+i]*1.6,sg=i%2?1:-1,o=sg*s.am*(1.5+0.25*i);A.push([2*t-0.51*o,1.2*t+0.86*o])}
  const mx=mean(N.map(p=>p[0])),my=mean(N.map(p=>p[1]));let sxx=0,syy=0,sxy=0;N.forEach(p=>{sxx+=(p[0]-mx)**2;syy+=(p[1]-my)**2;sxy+=(p[0]-mx)*(p[1]-my)});
  const t=0.5*Math.atan2(2*sxy,sxx-syy),ux=Math.cos(t),uy=Math.sin(t);g+=pth([[X(mx-9*ux),Y(my-9*uy)],[X(mx+9*ux),Y(my+9*uy)]],"kk");let tp=0,fp=0;
  const put=(p,an)=>{const k=(p[0]-mx)*ux+(p[1]-my)*uy,e=Math.hypot(p[0]-mx-k*ux,p[1]-my-k*uy),fl=e>s.th;if(fl){an?tp++:fp++}g+=seg(X(p[0]),Y(p[1]),X(mx+k*ux),Y(my+k*uy),"res")+dot(X(p[0]),Y(p[1]),(an?"cB":"")+(fl?" wrong":""),an?6:4)};
  N.forEach(p=>put(p,0));A.forEach(p=>put(p,1));
  return {g,m:big(tp+" de 8","Anomalías reales detectadas",tp===8?"ok":tp<5?"bad":"")+tbl([["Falsas alarmas",fp+" de 90",fp?"bad":"ok"],["Precisión de las alarmas",tp+fp?pc(tp/(tp+fp)):"sin alarmas"],["Sensibilidad",pc(tp/8)]])}}};
LAB.tl={a:[8],t:"Transfer learning: aprovechar un modelo ya entrenado",s:{n:6,dl:15},
 q:"Una tarea nueva con pocos ejemplos etiquetados (los puntos). Línea punteada: la frontera correcta. Naranja: modelo entrenado desde cero con esos ejemplos. Azul: modelo que parte de los pesos de otra tarea parecida y se ajusta con los mismos ejemplos.",
 c:[["n","Ejemplos etiquetados de la tarea nueva",4,100,2],["dl","Diferencia entre la tarea original y la nueva (grados)",0,120,5]],
 p:["Con 6 ejemplos y tareas parecidas (15°), el modelo con transferencia acierta más que el entrenado desde cero.","Sube los ejemplos a 100. La ventaja desaparece e incluso se invierte: con datos de sobra, partir de cero alcanza y el conocimiento previo ya no aporta.","Vuelve a 6 ejemplos y sube la diferencia entre tareas a 120°. La transferencia ahora perjudica: se llama transferencia negativa."],
 k:"Transferir es empezar con conocimiento previo en vez de con pesos al azar. Ayuda cuando la tarea nueva se parece a la original y hay pocos datos etiquetados; con muchos datos importa menos, y si las tareas no se parecen puede estorbar. Las exactitudes son el promedio de 20 repeticiones.",
 draw(s){const {X,Y,g:g0}=axes(-3,3,-3,3,{nx:6,ny:6});let g=g0;const tb=60*Math.PI/180,wb=[Math.cos(tb),Math.sin(tb)],ta=(60-s.dl)*Math.PI/180,wa=[3*Math.cos(ta),3*Math.sin(ta)],r=rng(31),T=[];
  for(let i=0;i<300;i++){const x=gauss(r),y=gauss(r);T.push([x,y,wb[0]*x+wb[1]*y>0?1:0])}
  const fit=(D,w,pr)=>{w=[...w];for(let it=0;it<150;it++){let g0_=0,g1=0;D.forEach(p=>{const q=1/(1+Math.exp(-(w[0]*p[0]+w[1]*p[1])))-p[2];g0_+=q*p[0];g1+=q*p[1]});const k=0.5/D.length,l=pr?0.15:0.01;w[0]-=k*g0_+0.5*l*(w[0]-(pr?pr[0]:0));w[1]-=k*g1+0.5*l*(w[1]-(pr?pr[1]:0))}return w},acc=w=>mean(T.map(p=>((w[0]*p[0]+w[1]*p[1]>0)?1:0)===p[2]?1:0));
  let as=0,at=0,keep=null;for(let rep=0;rep<20;rep++){const D=[];for(let i=0;i<s.n;i++){const x=gauss(r),y=gauss(r);D.push([x,y,(wb[0]*x+wb[1]*y+0.35*gauss(r))>0?1:0])}const ws=fit(D,[0,0],null),wt=fit(D,wa,wa);as+=acc(ws);at+=acc(wt);if(!rep)keep=[D,ws,wt]}
  const ln=(w,cls)=>{const n=Math.hypot(w[0],w[1])||1;return pth([[X(-w[1]/n*5),Y(w[0]/n*5)],[X(w[1]/n*5),Y(-w[0]/n*5)]],cls)};
  g+=keep[0].map(p=>dot(X(p[0]),Y(p[1]),"c"+PAL[p[2]],6)).join("")+ln(wb,"kk dsh")+ln(keep[1],"k2")+ln(keep[2],"k1");as/=20;at/=20;
  return {g,m:big(pc(at),"Exactitud con transferencia",at>as+0.01?"ok":at<as-0.01?"bad":"")+tbl([["Exactitud desde cero",pc(as)],["Ventaja de transferir",(at>=as?"+":"−")+f2(Math.abs(at-as)*100)+" puntos",at>=as?"ok":"bad"]])}}};
/* 02 Probabilidad */
LAB.dist={a:[2],t:"Distribuciones de probabilidad",s:{d:"nor",a:8,b:2},
 q:"La forma de una distribución y cómo cambia con sus parámetros. La línea vertical es la media; la franja entre líneas punteadas, una desviación estándar a cada lado.",
 c:[["d","Distribución","sel",[["nor","Normal"],["bin","Binomial"],["poi","Poisson"],["exp","Exponencial"]]],["a","Primer parámetro (media, número de ensayos o tasa)",1,15,0.5],["b","Segundo parámetro (dispersión o probabilidad)",0.5,5,0.1]],
 p:["Con la normal, mueve el segundo parámetro. La media no cambia; la campana se abre o se cierra.","Cambia a Poisson. Solo responde al primer parámetro, y media y varianza siempre coinciden. Es la huella de un conteo de eventos independientes.","Cambia a binomial con muchos ensayos, y a Poisson con media alta. Las dos se parecen a una normal: es el teorema central del límite."],
 k:"Una distribución es un modelo de cómo se reparte la incertidumbre, y cada una nace de un mecanismo: suma de muchos efectos (normal), éxitos en n intentos (binomial), eventos en un intervalo (Poisson), tiempo entre eventos (exponencial). Elegirla es afirmar algo sobre el proceso.",
 draw(s){const P=[];let par="";
  if(s.d==="nor"){par="μ = "+f2(s.a)+", σ = "+f2(s.b);for(let i=0;i<=300;i++){const x=-5+i/10;P.push([x,npdf((x-s.a)/s.b)/s.b,0.1])}}
  else if(s.d==="exp"){par="tiempo medio = "+f2(s.a);for(let i=0;i<=300;i++){const x=i/10;P.push([x,Math.exp(-x/s.a)/s.a,0.1])}}
  else if(s.d==="poi"){par="λ = "+f2(s.a);let p=Math.exp(-s.a);for(let k=0;k<=25;k++){if(k)p*=s.a/k;P.push([k,p,1])}}
  else{const n=Math.round(s.a*2),pp=Math.min(0.95,s.b/5.3);par="n = "+n+", p = "+f2(pp);let p=Math.pow(1-pp,n);for(let k=0;k<=n;k++){if(k)p*=(n-k+1)/k*pp/(1-pp);P.push([k,p,1])}}
  const cont=s.d==="nor"||s.d==="exp",m=P.reduce((t,q)=>t+q[0]*q[1]*q[2],0),v=P.reduce((t,q)=>t+(q[0]-m)**2*q[1]*q[2],0),top=Math.max(...P.map(q=>q[1]))*1.12,x0=cont&&s.d==="nor"?-5:0,{X,Y,g:g0}=axes(x0,25,0,top,{nx:6,ny:4,xl:"Valor",yl:cont?"Densidad":"Probabilidad"});let g=g0;
  if(cont)g+=pth(P.map(q=>[X(q[0]),Y(q[1])]),"k1");else P.forEach(q=>{g+='<rect class="bar k1" x="'+(X(q[0])-5)+'" y="'+Y(q[1])+'" width="10" height="'+(370-Y(q[1]))+'"/>'});
  const sg=Math.sqrt(v);g+=seg(X(m),30,X(m),370,"fit thin")+seg(X(m-sg),30,X(m-sg),370,"mean")+seg(X(m+sg),30,X(m+sg),370,"mean");
  const tail=P.filter(q=>q[0]>m+2*sg).reduce((t,q)=>t+q[1]*q[2],0);
  return {g,m:big(f2(m),"Media")+tbl([["Parámetros",par],["Varianza",f2(v)],["Desviación estándar",f2(sg)],["Probabilidad de superar media + 2 desviaciones",pc(tail)]])}}};
LAB.bayes={a:[2,5],t:"Teorema de Bayes: qué significa un resultado positivo",s:{pv:0.02,se:0.95,sp:0.95},
 q:"Quinientos casos, cada uno un cuadrado. Naranja fuerte: tiene la condición y la prueba lo detecta. Naranja tenue: la tiene y la prueba falla. Azul fuerte: no la tiene y la prueba da falsa alarma. Gris: sano y negativo.",
 c:[["pv","Prevalencia (qué tan común es la condición)",0.002,0.5,0.002],["se","Sensibilidad de la prueba",0.5,1,0.01],["sp","Especificidad de la prueba",0.5,1,0.01]],
 p:["Con prevalencia de 2 % y una prueba 95 % sensible y 95 % específica, menos de un tercio de los positivos son verdaderos. Cuenta los cuadrados azules frente a los naranjas fuertes.","Sube la especificidad a 0,99. La probabilidad tras un positivo mejora mucho más que si subes la sensibilidad.","Sube la prevalencia a 30 %. Con la misma prueba, un positivo ahora es casi seguro."],
 k:"La probabilidad de tener la condición dado un positivo no es la sensibilidad. Depende de qué tan rara es la condición: P(condición | positivo) = sensibilidad × prevalencia / P(positivo). Vale igual para una alarma de fraude o de falla de equipo: si el evento es raro, la mayoría de alarmas son falsas.",
 draw(s){const N=500,tp=Math.round(N*s.pv*s.se),fn=Math.round(N*s.pv)-tp,fp=Math.round(N*(1-s.pv)*(1-s.sp));let g="";
  for(let i=0;i<N;i++){const c=i<tp?"tp":i<tp+fn?"fn":i<tp+fn+fp?"fp":"tn";g+='<rect class="ic '+c+'" x="'+(40+(i%25)*19.4)+'" y="'+(30+Math.floor(i/25)*18.4)+'" width="17" height="16" rx="3"/>'}
  g+=txt(40,412,"Naranja fuerte: verdadero positivo · naranja tenue: no detectado · azul: falsa alarma");
  const a=s.pv*s.se,b=(1-s.pv)*(1-s.sp),ppv=a/(a+b),npv=(1-s.pv)*s.sp/((1-s.pv)*s.sp+s.pv*(1-s.se));
  return {g,m:big(pc(ppv),"Probabilidad de tener la condición si la prueba da positivo",ppv<0.5?"bad":"ok")+tbl([["Probabilidad de estar sano si da negativo",pc(npv)],["Positivos verdaderos en 500 casos",tp],["Falsas alarmas en 500 casos",fp],["Casos no detectados",fn]])}}};
LAB.cor={a:[2,3],t:"Correlación: qué mide y qué no",s:{f:"lin",r:0.7,n:60},
 q:"Una nube de puntos y su coeficiente de correlación muestral. En el modo lineal eliges la correlación real con la que se generan los datos.",
 c:[["f","Forma de la relación","sel",[["lin","Lineal"],["par","Parábola (y depende por completo de x)"],["out","Sin relación, con un punto extremo"]]],["r","Correlación real (modo lineal)",-0.95,0.95,0.05],["n","Número de puntos",8,300,1]],
 p:["En modo lineal con correlación real 0,70, baja el número de puntos a 8 y luego súbelo a 300. Con pocos datos, la correlación muestral puede alejarse bastante de la real.","Cambia a parábola. La correlación es baja y su cuadrado casi nulo, aunque y depende casi por completo de x: la correlación solo ve relaciones lineales.","Cambia a 'sin relación, con un punto extremo'. Un solo punto fabrica una correlación apreciable entre dos variables que no tienen nada que ver. Con menos puntos, el efecto es todavía mayor."],
 k:"El coeficiente de Pearson mide qué tan bien una recta resume la relación, nada más. Correlación cero no es independencia, una correlación alta puede venir de un solo punto, y ninguna correlación dice qué causa qué.",
 draw(s){const {X,Y,g:g0}=axes(-4,4,-4,4,{nx:4,ny:4,xl:"x",yl:"y"});let g=g0;const D=[];
  for(let i=0;i<s.n;i++){const a=PZ[i],b=PZ[400+i];D.push(s.f==="lin"?[a,s.r*a+Math.sqrt(1-s.r*s.r)*b]:s.f==="par"?[a,a*a-1+0.25*b]:[0.4*a,0.4*b])}
  if(s.f==="out")D.push([3.6,3.6]);const r=corr(D.map(p=>p[0]),D.map(p=>p[1])),[b0,b1]=ols(D);
  g+=D.map((p,i)=>dot(X(p[0]),Y(Math.max(-4.2,Math.min(4.2,p[1]))),s.f==="out"&&i===D.length-1?"outl":"",4)).join("")+pth([[X(-4),Y(b0-4*b1)],[X(4),Y(b0+4*b1)]],"kk");
  return {g,m:big(f2(r),"Correlación muestral")+tbl([["R² (cuadrado de la correlación)",f2(r*r)],["Correlación real con que se simuló",s.f==="lin"?f2(s.r):"no aplica"],["Puntos",D.length]])}}};
LAB.mk={a:[2,10],t:"Cadena de Markov: estados de un equipo",s:{p:0.08,q:0.25,m:0.1,r:0.5},
 q:"Un equipo que cada turno está en uno de tres estados: operativo (azul), degradado (naranja) o en falla (rojo). Las curvas muestran la probabilidad de cada estado turno a turno, partiendo de un equipo operativo.",
 c:[["p","Probabilidad de pasar de operativo a degradado",0.01,0.4,0.01],["q","Probabilidad de pasar de degradado a falla",0.02,0.6,0.01],["m","Probabilidad de recuperarlo con mantenimiento preventivo",0,0.4,0.01],["r","Probabilidad de reparar una falla en un turno",0.05,1,0.05]],
 p:["Mira cómo las tres curvas se aplanan en pocos turnos: la cadena olvida el estado inicial y llega a una distribución estacionaria.","Sube el mantenimiento preventivo de 0 a 0,40. La disponibilidad a largo plazo sube sin tocar la tasa de falla del equipo.","Baja la probabilidad de reparación a 0,10. El equipo pasa mucho más tiempo en falla aunque falle con la misma frecuencia."],
 k:"En una cadena de Markov el futuro depende solo del estado actual. Tras suficientes pasos, la proporción de tiempo en cada estado se estabiliza y depende solo de las probabilidades de transición. Esa distribución estacionaria es la disponibilidad de largo plazo.",
 draw(s){const m=Math.min(s.m,1-s.q),P=[[1-s.p,s.p,0],[m,1-s.q-m,s.q],[s.r,0,1-s.r]],st=v=>[0,1,2].map(j=>v[0]*P[0][j]+v[1]*P[1][j]+v[2]*P[2][j]),{X,Y,g:g0}=axes(0,40,0,1,{nx:8,ny:4,xl:"Turno",yl:"Probabilidad"});let g=g0,v=[1,0,0];const L_=[[],[],[]];
  for(let t=0;t<=40;t++){v.forEach((u,j)=>L_[j].push([X(t),Y(u)]));v=st(v)}for(let t=0;t<3000;t++)v=st(v);
  g+=pth(L_[0],"k1")+pth(L_[1],"k2")+pth(L_[2],"kr");
  return {g,m:big(pc(v[0]),"Tiempo operativo a largo plazo",v[0]>0.8?"ok":v[0]<0.6?"bad":"")+tbl([["Tiempo degradado",pc(v[1])],["Tiempo en falla",pc(v[2]),"bad"],["Turnos promedio entre fallas",v[2]*s.r>1e-9?f2(1/(v[2]*s.r)):"sin fallas"]])}}};
LAB.mc={a:[2,10],t:"Simulación Monte Carlo",s:{v:2},
 q:"Puntos lanzados al azar dentro de un cuadrado. Los que caen dentro del cuarto de círculo son naranjas. La fracción de puntos naranjas, multiplicada por 4, estima el número π.",
 c:[["v","Cantidad de puntos (log₁₀)",1,4.5,0.1]],
 p:["Con 10 puntos la estimación es mala. Sube a 100, a 1 000 y a 10 000 y mira cómo se acerca a 3,14.","Compara el error real con el error típico esperado: se mueven juntos.","Para reducir el error a la décima parte necesitas cien veces más puntos. Compruébalo entre 100 y 10 000."],
 k:"Monte Carlo reemplaza un cálculo difícil por un promedio de simulaciones. El error baja como 1/√n, sin importar cuántas dimensiones tenga el problema. Por eso se usa para valorar riesgos, opciones o colas, donde no hay fórmula.",
 draw(s){const n=Math.round(Math.pow(10,s.v)),r=rng(9),{X,Y,g:g0}=axes(0,1,0,1,{nx:4,ny:4});let g=g0,inn=0;const step=Math.max(1,Math.floor(n/1500));
  for(let i=0;i<n;i++){const x=r(),y=r(),ok=x*x+y*y<=1;if(ok)inn++;if(i%step===0)g+=dot(X(x),Y(y),ok?"cB":"",n>300?2.2:4)}
  const ar=[];for(let i=0;i<=60;i++){const a=i/60*Math.PI/2;ar.push([X(Math.cos(a)),Y(Math.sin(a))])}g+=pth(ar,"kk");const e=4*inn/n,se=4*Math.sqrt(Math.PI/4*(1-Math.PI/4)/n);
